    line-height: 1.4;
  }

  /* Campo de ajustes razonables */
  #planAjustesRazonables {
    border: 1px solid #fcd34d;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.5;
    color: #334155;
    background: #ffffff;
    box-sizing: border-box;
  }
  #planAjustesRazonables:focus {
    outline: none;
    border-color: #f59e0b;
    box-shadow: 0 0 0 3px rgba(245, 158, 11, .18);
  }

  /* ============================================================
     FASE 3 — Botones de navegación inferior
     ============================================================ */
  .nem-step-nav-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding-top: 16px;
    margin-top: 22px;
    border-top: 1px solid #e2e8f0;
  }

  .nem-btn-accion {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    font-size: 12.5px;
    font-weight: 700;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    color: #334155;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .nem-btn-accion:hover { background: #f1f5f9; border-color: #94a3b8; }

  /* Primario: color plano, sin degradado ni sombra */
  .nem-btn-accion.nem-btn-primario {
    background: #0284c7;
    border-color: #0284c7;
    color: #ffffff;
    box-shadow: none;
  }
  .nem-btn-accion.nem-btn-primario:hover {
    background: #0369a1;
    border-color: #0369a1;
  }

  .nem-btn-accion:focus-visible,
  .nem-btn-accion.nem-btn-primario:focus-visible {
    outline: 2px solid #0284c7;
    outline-offset: 2px;
  }

  .nem-btn-accion:disabled,
  .nem-btn-accion[disabled] {
    background: #f1f5f9;
    border-color: #e2e8f0;
    color: #94a3b8;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ============================================================
     FASE 4 — Pestañas de sesiones didácticas
     ============================================================ */
  .nem-sesiones-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0 0 14px;
  }

  .nem-tab-sesion {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    color: #334155;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .nem-tab-sesion:hover { background: #f1f5f9; border-color: #94a3b8; }

  .nem-tab-sesion.activa {
    background: #0284c7;
    border-color: #0284c7;
    color: #ffffff;
  }

  .nem-tab-sesion.aprobada { border-color: #86efac; color: #15803d; background: #f0fdf4; }
  .nem-tab-sesion.borrador { border-style: dashed; color: #64748b; }

  .nem-tab-sesion.activa.aprobada,
  .nem-tab-sesion.activa.borrador {
    background: #0284c7;
    border-color: #0284c7;
    border-style: solid;
    color: #ffffff;
  }

  .nem-tab-sesion:focus-visible {
    outline: 2px solid #0284c7;
    outline-offset: 2px;
  }

  /* ============================================================
     FASE 4 — Barra de iDevices modulares
     ============================================================ */
  .idevice-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 10px;
    margin: 0 0 12px;
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    border-radius: 10px;
  }

  .idevice-bar > span {
    font-size: 10.5px !important;
    font-weight: 800 !important;
    color: #64748b !important;
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-right: 2px;
  }

  .idevice-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    color: #334155;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .idevice-btn:hover { background: #eff6ff; border-color: #93c5fd; }
  .idevice-btn:active { background: #dbeafe; }
  .idevice-btn:focus-visible { outline: 2px solid #0284c7; outline-offset: 2px; }

  /* Variantes semánticas (requieren la clase en el marcado) */
  .idevice-btn--lectura  { border-color: #a5b4fc; color: #4338ca; }
  .idevice-btn--lectura:hover  { background: #eef2ff; border-color: #818cf8; }

  .idevice-btn--pregunta { border-color: #fcd34d; color: #b45309; }
  .idevice-btn--pregunta:hover { background: #fffbeb; border-color: #f59e0b; }

  .idevice-btn--reto     { border-color: #86efac; color: #15803d; }
  .idevice-btn--reto:hover     { background: #f0fdf4; border-color: #4ade80; }

  /* ============================================================
     FASE 4 — Botón azul del encabezado de sesión
     ============================================================ */
  .nem-btn-accion--azul {
    background: #ffffff;
    border-color: #3b82f6 !important;
    color: #1d4ed8 !important;
  }
  .nem-btn-accion--azul:hover {
    background: #eff6ff !important;
    border-color: #2563eb !important;
  }

  /* ============================================================
     FASE 7 · MÓDULOS 2, 3 y 4 — BIBLIOTECA, CECSE, PREVIEW, IFRAME,
     LÍNEA DEL TIEMPO Y MODAL DE AYUDA PEDAGÓGICA
     DeepSeek · Selectores del contrato: #modalAyudaNEM,
     #vistaBibliotecaDocente, #buscarRecursoBiblioteca,
     #gridLibrosOficialesSEP, .card-recurso, .badge-cecse,
     #modalPreviewAlumno, .bloque-iframe-container, #timelineProyectoNEM.
     ============================================================ */

  /* ---------- 1 · Modal pedagógico NEM ---------- */
  #modalAyudaNEM {
    position: fixed;
    inset: 0;
    z-index: 99980;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(15, 23, 42, 0.45);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s ease;
  }
  #modalAyudaNEM.visible,
  #modalAyudaNEM.abierto { opacity: 1; pointer-events: auto; }

  #modalAyudaNEM .ayuda-nem-panel {
    width: min(660px, 96vw);
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 24px 60px rgba(15, 23, 42, 0.32);
    transform: translateY(10px) scale(.99);
    transition: transform .18s cubic-bezier(.2, .8, .2, 1);
  }
  #modalAyudaNEM.visible .ayuda-nem-panel,
  #modalAyudaNEM.abierto .ayuda-nem-panel { transform: none; }

  .ayuda-nem-cabecera {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px 18px;
    background: linear-gradient(135deg, #1e40af 0%, #2563eb 58%, #0ea5e9 100%);
    color: #ffffff;
    flex: 0 0 auto;
  }
  .ayuda-nem-icono {
    width: 40px;
    height: 40px;
    min-width: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.34);
    font-size: 20px;
    line-height: 1;
  }
  #modalAyudaTitulo {
    margin: 0;
    font-size: 15.5px;
    font-weight: 800;
    line-height: 1.3;
    color: #ffffff;
  }
  .ayuda-nem-ceja {
    margin: 2px 0 0;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.84);
  }
  .ayuda-nem-cerrar {
    margin-left: auto;
    width: 32px;
    height: 32px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.34);
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.14);
    color: #ffffff;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .ayuda-nem-cerrar:hover { background: rgba(255, 255, 255, 0.26); }
  .ayuda-nem-cerrar:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }

  .ayuda-nem-cuerpo {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 18px 4px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .ayuda-nem-etiqueta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0 0 7px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: #475569;
  }

  /* Bloque 1 · fondo azul muy suave */
  .ayuda-nem-bloque--proposito {
    padding: 12px 14px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 12px;
  }
  /* Bloque 2 · instrucciones */
  .ayuda-nem-bloque--como { padding: 0 2px; }
  /* Bloque 3 · ejemplo contextual en cursiva destacada */
  .ayuda-nem-bloque--ejemplo {
    padding: 12px 14px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
  }

  #modalAyudaProposito,
  #modalAyudaComoLlenar {
    margin: 0;
    font-size: 13px;
    line-height: 1.6;
    color: #334155;
  }
  #modalAyudaComoLlenar ol,
  #modalAyudaComoLlenar ul { margin: 6px 0 0; padding-left: 20px; }
  #modalAyudaComoLlenar li { margin: 0 0 5px; }
  #modalAyudaEjemplo {
    margin: 0;
    font-family: Georgia, 'Palatino Linotype', serif;
    font-size: 13.5px;
    font-style: italic;
    line-height: 1.6;
    color: #0f172a;
  }

  .ayuda-nem-pie {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 12px 18px 15px;
    border-top: 1px solid var(--app-border);
    background: #ffffff;
    flex: 0 0 auto;
  }
  .ayuda-nem-entendido {
    padding: 9px 18px;
    border: 0;
    border-radius: 8px;
    background: #2563eb;
    color: #ffffff;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s ease;
  }
  .ayuda-nem-entendido:hover { background: #1d4ed8; }
  .ayuda-nem-entendido:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }

  /* ---------- 2 · Biblioteca de recursos ---------- */
  #vistaBibliotecaDocente { display: block; }

  .biblio-filtros {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 0 0 16px;
    padding: 10px 12px;
    background: #f8fafc;
    border: 1px solid var(--app-border);
    border-radius: 14px;
  }
  .biblio-buscador {
    position: relative;
    flex: 1 1 240px;
    min-width: 170px;
  }
  .biblio-buscador .biblio-lupa {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    line-height: 1;
    color: #94a3b8;
    pointer-events: none;
  }
  #buscarRecursoBiblioteca {
    width: 100%;
    height: 38px;
    padding: 0 14px 0 34px;
    border: 1px solid var(--app-border);
    border-radius: 999px;
    background: #ffffff;
    font-family: inherit;
    font-size: 12.8px;
    color: var(--app-text);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #buscarRecursoBiblioteca:focus {
    outline: none;
    border-color: #93c5fd;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  .biblio-filtro,
  #filtroAsignaturaRecurso,
  #filtroGradoRecurso,
  #filtroTrimestreRecurso {
    height: 38px;
    padding: 0 14px;
    border: 1px solid var(--app-border);
    border-radius: 999px;
    background: #ffffff;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    color: #334155;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .biblio-filtro:hover,
  #filtroAsignaturaRecurso:hover,
  #filtroGradoRecurso:hover,
  #filtroTrimestreRecurso:hover { border-color: #93c5fd; background: #f8fbff; }
  .biblio-filtro:focus,
  #filtroAsignaturaRecurso:focus,
  #filtroGradoRecurso:focus,
  #filtroTrimestreRecurso:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  .biblio-subir {
    height: 38px;
    padding: 0 16px;
    border: 0;
    border-radius: 999px;
    background: #2563eb;
    color: #ffffff;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.28);
    transition: background .15s ease, transform .12s ease, box-shadow .15s ease;
  }
  .biblio-subir:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(37, 99, 235, 0.34);
  }
  .biblio-subir:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }

  /* Libros SEP oficiales */
  #gridLibrosOficialesSEP {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    margin: 0 0 18px;
  }
  #gridLibrosOficialesSEP .libro-sep {
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 10px;
    background: #ffffff;
    border: 1px solid var(--app-border);
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    text-align: center;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  #gridLibrosOficialesSEP .libro-sep:hover {
    transform: translateY(-2px);
    border-color: #bfdbfe;
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  }
  #gridLibrosOficialesSEP .libro-sep img {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    border-radius: 8px;
    background: #e2e8f0;
  }
  #gridLibrosOficialesSEP .libro-sep__grado {
    align-self: center;
    padding: 2px 8px;
    border-radius: 999px;
    background: #eff6ff;
    color: #1d4ed8;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  #gridLibrosOficialesSEP .libro-sep__btn {
    padding: 6px 8px;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    background: #f8fbff;
    color: #1d4ed8;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  #gridLibrosOficialesSEP .libro-sep__btn:hover { background: #eff6ff; border-color: #93c5fd; }

  /* Repositorio colectivo */
  .biblio-grid,
  .repositorio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(236px, 1fr));
    gap: 14px;
  }
  .card-recurso {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px;
    background: #ffffff;
    border: 1px solid var(--app-border);
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card-recurso:hover {
    transform: translateY(-2px);
    border-color: #bfdbfe;
    box-shadow: 0 10px 22px rgba(15, 23, 42, 0.09);
  }
  .card-recurso__tipo {
    align-self: flex-start;
    padding: 3px 9px;
    border-radius: 999px;
    background: #e0f2fe;
    color: #0369a1;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .03em;
  }
  .card-recurso__tipo--pdf { background: #fee2e2; color: #b91c1c; }
  .card-recurso__tipo--presentacion { background: #ffedd5; color: #c2410c; }
  .card-recurso__tipo--enlace { background: #dbeafe; color: #1d4ed8; }
  .card-recurso__tipo--video { background: #ede9fe; color: #6d28d9; }
  .card-recurso__titulo {
    margin: 0;
    font-size: 13.5px;
    font-weight: 700;
    line-height: 1.35;
    color: #0f172a;
  }
  .card-recurso__meta {
    font-size: 11.5px;
    line-height: 1.45;
    color: #64748b;
  }
  .card-recurso__acciones {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: auto;
    padding-top: 4px;
  }
  .biblio-vacio {
    grid-column: 1 / -1;
    padding: 36px 20px;
    text-align: center;
    border: 1px dashed #cbd5e1;
    border-radius: 14px;
    background: #f8fafc;
    font-size: 13px;
    line-height: 1.55;
    color: #64748b;
  }

  /* ---------- 3 · Tecnología CECSE ---------- */
  .badge-cecse {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 11px;
    border: 1px solid #bae6fd;
    border-radius: 999px;
    background: #e0f2fe;
    color: #0284c7;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .panel-cecse {
    padding: 14px 16px;
    background: #ffffff;
    border: 1px solid var(--app-border);
    border-left: 4px solid #0284c7;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    margin: 0 0 14px;
  }
  .cecse-horas {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 10px 0 14px;
  }
  .cecse-horas__item {
    flex: 1 1 150px;
    padding: 10px 12px;
    border: 1px solid #e0f2fe;
    border-radius: 10px;
    background: #f0f9ff;
  }
  .cecse-horas__n {
    display: block;
    font-size: 18px;
    font-weight: 800;
    line-height: 1.1;
    color: #0284c7;
  }
  .cecse-horas__l {
    display: block;
    margin-top: 2px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: #0369a1;
  }
  .cecse-software-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px;
  }
  .cecse-software {
    padding: 12px;
    border: 1px solid var(--app-border);
    border-radius: 12px;
    background: #ffffff;
  }
  .cecse-software__grado {
    display: block;
    margin: 0 0 6px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: #64748b;
  }
  .cecse-software__badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 8px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1d4ed8;
    font-size: 11.5px;
    font-weight: 700;
  }
  .cecse-software__badge--excel { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
  .cecse-software__badge--powerpoint { background: #fff7ed; border-color: #fed7aa; color: #c2410c; }

  /* ---------- 4 · Vista previa del alumno ---------- */
  #modalPreviewAlumno {
    position: fixed;
    inset: 0;
    z-index: 99980;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(15, 23, 42, 0.6);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s ease;
  }
  #modalPreviewAlumno.visible,
  #modalPreviewAlumno.abierto { opacity: 1; pointer-events: auto; }

  #modalPreviewAlumno .preview-panel {
    width: min(940px, 96vw);
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 26px 64px rgba(15, 23, 42, 0.34);
    transform: translateY(10px) scale(.99);
    transition: transform .18s cubic-bezier(.2, .8, .2, 1);
  }
  #modalPreviewAlumno.visible .preview-panel,
  #modalPreviewAlumno.abierto .preview-panel { transform: none; }

  .preview-cabecera {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 18px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #ffffff;
    flex: 0 0 auto;
  }
  .preview-cabecera h3 {
    margin: 0;
    font-size: 14.5px;
    font-weight: 800;
    color: #ffffff;
  }
  .preview-cerrar {
    margin-left: auto;
    width: 30px;
    height: 30px;
    padding: 0;
