  /* Barra contextual del horario — ST90 §2 (N3 centrado) y §7 (cinta transparente) */
  .horario-toolbar-shell {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 4px 10px;
    background: transparent;
    border: 0;
    padding: 0;
    margin: 0 auto 14px;
    width: 100%;
  }
  .horario-toolbar-shell > .horario-toolbar-bloque,
  .horario-toolbar-shell > .nav-semana-box {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .horario-toolbar-shell > .horario-sep-v {
    width: 1px;
    align-self: stretch;
    background: #e2e8f0;
    margin: 4px 6px;
  }

  /* Iconos de ayuda y asistente en el stepper: compactos y en una fila */
  .nem-stepper-header { flex-wrap: nowrap; }
  .nem-step-tab { white-space: nowrap; overflow: hidden; }
  .nem-step-tab .step-txt { overflow: hidden; text-overflow: ellipsis; }
  .nem-ayuda-paso { display: inline-block; vertical-align: middle; line-height: 1; flex: 0 0 auto; }

  /* ============================================================
     FASE 3 — Catálogo SEP a dos columnas
     ============================================================ */

    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 16px;
    align-items: start;
  }

  .nem-catalogo-dos-col > div > .nem-catalogo-col-titulo {

    align-items: center;
    height: 24px;

    margin: 0 0 4px;

  /* Chips de BAPyC detectadas */
  #wrapChipsBAPyCGrupo {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
  }
  #wrapChipsBAPyCGrupo > span,
  .nem-chip-bapyc {
    display: inline-block;
    background: #ffffff;
    border: 1px solid #fcd34d;
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 10.5px;
    font-weight: 600;
    color: #92400e;
    line-height: 1.4;
  }

  /* Campo de ajustes razonables */
  #planAjustesRazonables {
    border: 1px solid #fcd34d;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.5;
    color: #334155;
    background: #ffffff;
    box-sizing: border-box;
  }
  #planAjustesRazonables:focus {
    outline: none;
    border-color: #f59e0b;
    box-shadow: 0 0 0 3px rgba(245, 158, 11, .18);
  }

  /* ============================================================
     FASE 3 — Botones de navegación inferior
     ============================================================ */
  .nem-step-nav-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding-top: 16px;
    margin-top: 22px;
    border-top: 1px solid #e2e8f0;
  }

  .nem-btn-accion {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    font-size: 12.5px;
    font-weight: 700;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    color: #334155;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .nem-btn-accion:hover { background: #f1f5f9; border-color: #94a3b8; }

  /* Primario: color plano, sin degradado ni sombra */
  .nem-btn-accion.nem-btn-primario {
    background: #0284c7;
    border-color: #0284c7;
    color: #ffffff;
    box-shadow: none;
  }
  .nem-btn-accion.nem-btn-primario:hover {
    background: #0369a1;
    border-color: #0369a1;
  }

  .nem-btn-accion:focus-visible,
  .nem-btn-accion.nem-btn-primario:focus-visible {
    outline: 2px solid #0284c7;
    outline-offset: 2px;
  }

  .nem-btn-accion:disabled,
  .nem-btn-accion[disabled] {
    background: #f1f5f9;
    border-color: #e2e8f0;
    color: #94a3b8;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ============================================================
     FASE 4 — Pestañas de sesiones didácticas
     ============================================================ */
  .nem-sesiones-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0 0 14px;
  }

  .nem-tab-sesion {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    color: #334155;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .nem-tab-sesion:hover { background: #f1f5f9; border-color: #94a3b8; }

  .nem-tab-sesion.activa {
    background: #0284c7;
    border-color: #0284c7;
    color: #ffffff;
  }

  .nem-tab-sesion.aprobada { border-color: #86efac; color: #15803d; background: #f0fdf4; }
  .nem-tab-sesion.borrador { border-style: dashed; color: #64748b; }

  .nem-tab-sesion.activa.aprobada,
  .nem-tab-sesion.activa.borrador {
    background: #0284c7;
    border-color: #0284c7;
    border-style: solid;
    color: #ffffff;
  }

  .nem-tab-sesion:focus-visible {
    outline: 2px solid #0284c7;
    outline-offset: 2px;
  }

  /* ============================================================
     FASE 4 — Barra de iDevices modulares
     ============================================================ */
  .idevice-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 10px;
    margin: 0 0 12px;
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    border-radius: 10px;
  }

  .idevice-bar > span {
    font-size: 10.5px !important;
    font-weight: 800 !important;
    color: #64748b !important;
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-right: 2px;
  }

  .idevice-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    color: #334155;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .idevice-btn:hover { background: #eff6ff; border-color: #93c5fd; }
  .idevice-btn:active { background: #dbeafe; }
  .idevice-btn:focus-visible { outline: 2px solid #0284c7; outline-offset: 2px; }

  /* Variantes semánticas (requieren la clase en el marcado) */
  .idevice-btn--lectura  { border-color: #a5b4fc; color: #4338ca; }
  .idevice-btn--lectura:hover  { background: #eef2ff; border-color: #818cf8; }

  .idevice-btn--pregunta { border-color: #fcd34d; color: #b45309; }
  .idevice-btn--pregunta:hover { background: #fffbeb; border-color: #f59e0b; }

  .idevice-btn--reto     { border-color: #86efac; color: #15803d; }
  .idevice-btn--reto:hover     { background: #f0fdf4; border-color: #4ade80; }

  /* ============================================================
     FASE 4 — Botón azul del encabezado de sesión
     ============================================================ */
  .nem-btn-accion--azul {
    background: #ffffff;
    border-color: #3b82f6 !important;
    color: #1d4ed8 !important;
  }
  .nem-btn-accion--azul:hover {
    background: #eff6ff !important;
    border-color: #2563eb !important;
  }

  /* ============================================================
     FASE 7 · MÓDULOS 2, 3 y 4 — BIBLIOTECA, CECSE, PREVIEW, IFRAME,
     LÍNEA DEL TIEMPO Y MODAL DE AYUDA PEDAGÓGICA
     DeepSeek · Selectores del contrato: #modalAyudaNEM,
     #vistaBibliotecaDocente, #buscarRecursoBiblioteca,
     #gridLibrosOficialesSEP, .card-recurso, .badge-cecse,
     #modalPreviewAlumno, .bloque-iframe-container, #timelineProyectoNEM.
     ============================================================ */

  /* ---------- 1 · Modal pedagógico NEM ---------- */
  #modalAyudaNEM {
    position: fixed;
    inset: 0;
    z-index: 99980;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(15, 23, 42, 0.45);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s ease;
  }
  #modalAyudaNEM.visible,
  #modalAyudaNEM.abierto { opacity: 1; pointer-events: auto; }

  #modalAyudaNEM .ayuda-nem-panel {
    width: min(660px, 96vw);
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 24px 60px rgba(15, 23, 42, 0.32);
    transform: translateY(10px) scale(.99);
    transition: transform .18s cubic-bezier(.2, .8, .2, 1);
  }
  #modalAyudaNEM.visible .ayuda-nem-panel,
  #modalAyudaNEM.abierto .ayuda-nem-panel { transform: none; }

  .ayuda-nem-cabecera {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px 18px;
    background: linear-gradient(135deg, #1e40af 0%, #2563eb 58%, #0ea5e9 100%);
    color: #ffffff;
    flex: 0 0 auto;
  }
  .ayuda-nem-icono {
    width: 40px;
    height: 40px;
    min-width: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.34);
    font-size: 20px;
    line-height: 1;
  }
  #modalAyudaTitulo {
    margin: 0;
    font-size: 15.5px;
    font-weight: 800;
    line-height: 1.3;
    color: #ffffff;
  }
  .ayuda-nem-ceja {
    margin: 2px 0 0;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.84);
  }
  .ayuda-nem-cerrar {
    margin-left: auto;
    width: 32px;
    height: 32px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.34);
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.14);
    color: #ffffff;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .ayuda-nem-cerrar:hover { background: rgba(255, 255, 255, 0.26); }
  .ayuda-nem-cerrar:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }

  .ayuda-nem-cuerpo {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 18px 4px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .ayuda-nem-etiqueta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0 0 7px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: #475569;
  }

  /* Bloque 1 · fondo azul muy suave */
  .ayuda-nem-bloque--proposito {
    padding: 12px 14px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 12px;
  }
  /* Bloque 2 · instrucciones */
  .ayuda-nem-bloque--como { padding: 0 2px; }
  /* Bloque 3 · ejemplo contextual en cursiva destacada */
  .ayuda-nem-bloque--ejemplo {
    padding: 12px 14px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
  }

  #modalAyudaProposito,
  #modalAyudaComoLlenar {
    margin: 0;
    font-size: 13px;
    line-height: 1.6;
    color: #334155;
  }
  #modalAyudaComoLlenar ol,
  #modalAyudaComoLlenar ul { margin: 6px 0 0; padding-left: 20px; }
  #modalAyudaComoLlenar li { margin: 0 0 5px; }
  #modalAyudaEjemplo {
    margin: 0;
    font-family: Georgia, 'Palatino Linotype', serif;
    font-size: 13.5px;
    font-style: italic;
    line-height: 1.6;
    color: #0f172a;
  }

  .ayuda-nem-pie {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 12px 18px 15px;
    border-top: 1px solid var(--app-border);
    background: #ffffff;
    flex: 0 0 auto;
  }
  .ayuda-nem-entendido {
    padding: 9px 18px;
    border: 0;
    border-radius: 8px;
    background: #2563eb;
    color: #ffffff;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s ease;
  }
  .ayuda-nem-entendido:hover { background: #1d4ed8; }
  .ayuda-nem-entendido:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }

  /* ---------- 2 · Biblioteca de recursos ---------- */
  #vistaBibliotecaDocente { display: block; }

  .biblio-filtros {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 0 0 16px;
    padding: 10px 12px;
    background: #f8fafc;
    border: 1px solid var(--app-border);
    border-radius: 14px;
  }
  .biblio-buscador {
    position: relative;
    flex: 1 1 240px;
    min-width: 170px;
  }
  .biblio-buscador .biblio-lupa {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    line-height: 1;
    color: #94a3b8;
    pointer-events: none;
  }
  #buscarRecursoBiblioteca {
    width: 100%;
    height: 38px;
    padding: 0 14px 0 34px;
    border: 1px solid var(--app-border);
    border-radius: 999px;
    background: #ffffff;
    font-family: inherit;
    font-size: 12.8px;
    color: var(--app-text);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #buscarRecursoBiblioteca:focus {
    outline: none;
    border-color: #93c5fd;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  .biblio-filtro,
  #filtroAsignaturaRecurso,
  #filtroGradoRecurso,
  #filtroTrimestreRecurso {
    height: 38px;
    padding: 0 14px;
    border: 1px solid var(--app-border);
    border-radius: 999px;
    background: #ffffff;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    color: #334155;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .biblio-filtro:hover,
  #filtroAsignaturaRecurso:hover,
  #filtroGradoRecurso:hover,
  #filtroTrimestreRecurso:hover { border-color: #93c5fd; background: #f8fbff; }
  .biblio-filtro:focus,
  #filtroAsignaturaRecurso:focus,
  #filtroGradoRecurso:focus,
  #filtroTrimestreRecurso:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  .biblio-subir {
    height: 38px;
    padding: 0 16px;
    border: 0;
    border-radius: 999px;
    background: #2563eb;
    color: #ffffff;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.28);
    transition: background .15s ease, transform .12s ease, box-shadow .15s ease;
  }
  .biblio-subir:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(37, 99, 235, 0.34);
  }
  .biblio-subir:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }

  /* Libros SEP oficiales */
  #gridLibrosOficialesSEP {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    margin: 0 0 18px;
  }
  #gridLibrosOficialesSEP .libro-sep {
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 10px;
    background: #ffffff;
    border: 1px solid var(--app-border);
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    text-align: center;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  #gridLibrosOficialesSEP .libro-sep:hover {
    transform: translateY(-2px);
    border-color: #bfdbfe;
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  }
  #gridLibrosOficialesSEP .libro-sep img {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    border-radius: 8px;
    background: #e2e8f0;
  }
  #gridLibrosOficialesSEP .libro-sep__grado {
    align-self: center;
    padding: 2px 8px;
    border-radius: 999px;
    background: #eff6ff;
    color: #1d4ed8;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  #gridLibrosOficialesSEP .libro-sep__btn {
    padding: 6px 8px;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    background: #f8fbff;
    color: #1d4ed8;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  #gridLibrosOficialesSEP .libro-sep__btn:hover { background: #eff6ff; border-color: #93c5fd; }

  /* Repositorio colectivo */
  .biblio-grid,
  .repositorio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(236px, 1fr));
    gap: 14px;
  }
  .card-recurso {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px;
    background: #ffffff;
    border: 1px solid var(--app-border);
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card-recurso:hover {
    transform: translateY(-2px);
    border-color: #bfdbfe;
    box-shadow: 0 10px 22px rgba(15, 23, 42, 0.09);
  }
  .card-recurso__tipo {
    align-self: flex-start;
    padding: 3px 9px;
    border-radius: 999px;
    background: #e0f2fe;
    color: #0369a1;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .03em;
  }
  .card-recurso__tipo--pdf { background: #fee2e2; color: #b91c1c; }
  .card-recurso__tipo--presentacion { background: #ffedd5; color: #c2410c; }
  .card-recurso__tipo--enlace { background: #dbeafe; color: #1d4ed8; }
  .card-recurso__tipo--video { background: #ede9fe; color: #6d28d9; }
  .card-recurso__titulo {
    margin: 0;
    font-size: 13.5px;
    font-weight: 700;
    line-height: 1.35;
    color: #0f172a;
  }
  .card-recurso__meta {
    font-size: 11.5px;
    line-height: 1.45;
    color: #64748b;
  }
  .card-recurso__acciones {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: auto;
    padding-top: 4px;
  }
  .biblio-vacio {
    grid-column: 1 / -1;
    padding: 36px 20px;
    text-align: center;
    border: 1px dashed #cbd5e1;
    border-radius: 14px;
    background: #f8fafc;
    font-size: 13px;
    line-height: 1.55;
    color: #64748b;
  }

  /* ---------- 3 · Tecnología CECSE ---------- */
  .badge-cecse {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 11px;
    border: 1px solid #bae6fd;
    border-radius: 999px;
    background: #e0f2fe;
    color: #0284c7;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .panel-cecse {
    padding: 14px 16px;
    background: #ffffff;
    border: 1px solid var(--app-border);
    border-left: 4px solid #0284c7;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    margin: 0 0 14px;
  }
  .cecse-horas {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 10px 0 14px;
  }
  .cecse-horas__item {
    flex: 1 1 150px;
    padding: 10px 12px;
    border: 1px solid #e0f2fe;
    border-radius: 10px;
    background: #f0f9ff;
  }
  .cecse-horas__n {
    display: block;
    font-size: 18px;
    font-weight: 800;
    line-height: 1.1;
    color: #0284c7;
  }
  .cecse-horas__l {
    display: block;
    margin-top: 2px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: #0369a1;
  }
  .cecse-software-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px;
  }
  .cecse-software {
    padding: 12px;
    border: 1px solid var(--app-border);
    border-radius: 12px;
    background: #ffffff;
  }
  .cecse-software__grado {
    display: block;
    margin: 0 0 6px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: #64748b;
  }
  .cecse-software__badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 8px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1d4ed8;
    font-size: 11.5px;
    font-weight: 700;
  }
  .cecse-software__badge--excel { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
  .cecse-software__badge--powerpoint { background: #fff7ed; border-color: #fed7aa; color: #c2410c; }

  /* ---------- 4 · Vista previa del alumno ---------- */
  #modalPreviewAlumno {
    position: fixed;
    inset: 0;
    z-index: 99980;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(15, 23, 42, 0.6);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s ease;
  }
  #modalPreviewAlumno.visible,
  #modalPreviewAlumno.abierto { opacity: 1; pointer-events: auto; }

  #modalPreviewAlumno .preview-panel {
    width: min(940px, 96vw);
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 26px 64px rgba(15, 23, 42, 0.34);
    transform: translateY(10px) scale(.99);
    transition: transform .18s cubic-bezier(.2, .8, .2, 1);
  }
  #modalPreviewAlumno.visible .preview-panel,
  #modalPreviewAlumno.abierto .preview-panel { transform: none; }

  .preview-cabecera {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 18px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #ffffff;
    flex: 0 0 auto;
  }
  .preview-cabecera h3 {
    margin: 0;
    font-size: 14.5px;
    font-weight: 800;
    color: #ffffff;
  }
  .preview-cerrar {
    margin-left: auto;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .preview-cerrar:hover { background: rgba(255, 255, 255, 0.24); }
  .preview-cerrar:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }

  .preview-marco {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    margin: 16px;
    border: 1px solid var(--app-border);
    border-radius: 14px;
    overflow: hidden;
    background: #ffffff;
  }
  .preview-barra {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: #eef2f7;
    border-bottom: 1px solid #dbe3ec;
    flex: 0 0 auto;
  }
  .preview-punto {
    width: 9px;
    height: 9px;
    min-width: 9px;
    border-radius: 50%;
    background: #f87171;
  }
  .preview-punto:nth-child(2) { background: #fbbf24; }
  .preview-punto:nth-child(3) { background: #34d399; }
  .preview-url {
    flex: 1 1 auto;
    height: 24px;
    margin-left: 8px;
    padding: 0 10px;
    display: flex;
    align-items: center;
    border: 1px solid #dbe3ec;
    border-radius: 999px;
    background: #ffffff;
    font-size: 11px;
    color: #64748b;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .preview-lienzo {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    padding: 22px;
    background: #ffffff;
    font-size: 14px;
    line-height: 1.6;
    color: var(--app-text);
  }
  .preview-acciones {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 0 16px 16px;
    flex: 0 0 auto;
  }

  /* ---------- 5 · Iframe embebido con carga y fallback ---------- */
  .bloque-iframe-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    margin: 12px 0;
    border: 1px solid var(--app-border);
    border-radius: 14px;
    overflow: hidden;
    background: #0f172a;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  }
  .bloque-iframe-container > iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .iframe-cargando {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #0f172a;
    color: #cbd5e1;
    font-size: 12px;
    font-weight: 600;
    transition: opacity .25s ease;
  }
  .bloque-iframe-container.cargado .iframe-cargando { opacity: 0; pointer-events: none; }
  .iframe-spinner {
    width: 26px;
    height: 26px;
    border: 3px solid rgba(255, 255, 255, 0.18);
    border-top-color: #38bdf8;
    border-radius: 50%;
    animation: iframeSpin .9s linear infinite;
  }
  @keyframes iframeSpin { to { transform: rotate(360deg); } }
  .iframe-fallback {
    position: absolute;
    inset: auto 0 0 0;
    z-index: 2;
    display: none;
    padding: 10px 14px;
    background: rgba(220, 38, 38, 0.92);
    color: #ffffff;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
  }
  .bloque-iframe-container.error .iframe-fallback { display: block; }
  .bloque-iframe-container.error .iframe-cargando { opacity: 0; pointer-events: none; }
  .bloque-iframe-container .iframe-abrir {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 3;
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.74);
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    text-decoration: none;
    opacity: 0;
    transition: opacity .15s ease, background .15s ease;
  }
  .bloque-iframe-container:hover .iframe-abrir,
  .bloque-iframe-container:focus-within .iframe-abrir { opacity: 1; }
  .bloque-iframe-container .iframe-abrir:hover { background: rgba(37, 99, 235, 0.92); }
  .bloque-iframe-container .iframe-abrir:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 2px;
    opacity: 1;
  }
  @supports not (aspect-ratio: 1 / 1) {
    .bloque-iframe-container { height: 0; padding-top: 56.25%; }
  }

  /* ---------- 6 · Línea del tiempo del proyecto NEM ---------- */
  #timelineProyectoNEM {
    display: flex;
    align-items: flex-start;
    gap: 0;
    width: 100%;
    overflow-x: auto;
    padding: 8px 2px 16px;
    margin: 0 0 8px;
  }
  .timeline-paso {
    position: relative;
    flex: 1 1 0;
    min-width: 118px;
    padding: 0 4px;
    text-align: center;
  }
  .timeline-paso::before {
    content: '';
    position: absolute;
    top: 14px;
    left: calc(-50% + 16px);
    right: calc(50% + 16px);
    height: 2px;
    background: #e2e8f0;
  }
  .timeline-paso:first-child::before { display: none; }
  .timeline-paso__punto {
    position: relative;
    width: 30px;
    height: 30px;
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #e2e8f0;
    border-radius: 999px;
    background: #f1f5f9;
    color: #94a3b8;
    font-size: 12px;
    font-weight: 800;
    line-height: 1;
  }
  .timeline-paso__titulo {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    line-height: 1.3;
    color: #64748b;
  }
  .timeline-paso__sub {
    display: block;
    margin-top: 2px;
    font-size: 10px;
    font-weight: 600;
    color: #94a3b8;
  }

  /* Estado: completado */
  .timeline-paso.completado .timeline-paso__punto {
    background: #dcfce7;
    border-color: #86efac;
    color: #15803d;
  }
  .timeline-paso.completado .timeline-paso__titulo { color: #15803d; }
  .timeline-paso.completado::before { background: #86efac; }

  /* Estado: activo (pulso) */
  .timeline-paso.activo .timeline-paso__punto {
    background: #2563eb;
    border-color: #2563eb;
    color: #ffffff;
    animation: timelinePulso 2.2s ease-in-out infinite;
  }
  .timeline-paso.activo .timeline-paso__titulo { color: #1d4ed8; font-weight: 800; }
  @keyframes timelinePulso {
    0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.45); }
    50%      { box-shadow: 0 0 0 7px rgba(37, 99, 235, 0); }
  }

  /* Estado: pendiente */
  .timeline-paso.pendiente .timeline-paso__punto {
    background: #f1f5f9;
    border-color: #e2e8f0;
    color: #94a3b8;
  }
  .timeline-paso.pendiente .timeline-paso__titulo { color: #94a3b8; }

  @media (prefers-reduced-motion: reduce) {
    .timeline-paso.activo .timeline-paso__punto { animation: none; }
    .iframe-spinner { animation: none; }
  }

  @media (max-width: 640px) {
    .bloque-iframe-container { aspect-ratio: 4 / 3; border-radius: 10px; }
    .biblio-grid,
    .repositorio-grid { grid-template-columns: 1fr; }
    .preview-marco { margin: 10px; }
    .preview-lienzo { padding: 14px; }
    #timelineProyectoNEM .timeline-paso { min-width: 104px; }
  }
  /* ============================================================
     DESATURACIÓN VISUAL UI/UX — ETAPA 1 & 2  (DeepSeek)
     Banner editorial sin cajitas · rejilla 2×2 · micro-iconos limpios ·
     Stepper con check y barra de progreso · tarjetas de contenidos.
     Reglas: sin declaraciones forzadas, sin cambios de ID, solo presentación.
     ============================================================ */

  /* ---------- 1 · Banner de clase: cinta editorial plana ---------- */
  .nem-banner {
    background: #f8fafc;
    border: 1px solid #eef2f7;
    border-radius: 10px;
    box-shadow: none;
    padding: 10px 16px;
  }
  .nem-banner .nem-banner-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0;
    border: 0;
    background: transparent;
    border-radius: 0;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .12em;
    color: #0e7490;
  }
  .nem-banner .nem-banner-tag::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #0ea5e9;
    flex: 0 0 auto;
  }
  .nem-banner .nem-banner-title {
    color: #0f172a;
    font-size: 17px;
    letter-spacing: -.01em;
  }
  .nem-banner .nem-banner-meta {
    gap: 0;
    justify-content: flex-start;
    overflow: visible;
  }
  .nem-banner .nem-banner-meta span {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    font-size: 12.5px;
    font-weight: 600;
    color: #475569;
  }
  .nem-banner .nem-banner-meta span + span::before {
    content: '•';
    margin: 0 10px;
    color: #cbd5e1;
    font-weight: 700;
  }
  .nem-banner .nem-banner-meta strong {
    color: #0f172a;
    font-weight: 700;
  }
  .nem-banner .nem-banner-btn {
    border-width: 1px;
    box-shadow: none;
    background: transparent;
    padding: 6px 12px;
    font-size: 12px;
  }
  .nem-banner .nem-banner-btn:hover {
    background: #0284c7;
    color: #ffffff;
  }

  /* ---------- 2 · Etapa 1: rejilla respirable 2×2 ---------- */
  .nem-fila-una {
    display: grid;
    grid-template-columns: minmax(220px, 2.2fr) minmax(160px, 1.35fr) minmax(160px, 1.35fr) 128px;
    gap: 12px;
    align-items: end;
    margin-bottom: 20px;
  }
  .nem-fila-una > .nem-campo-titulo,
  .nem-fila-una > .nem-campo-formativo,
  .nem-fila-una > .nem-campo-metodologia,
  .nem-fila-una > .nem-campo-sesiones {
    grid-column: span 1;
    min-width: 0;
  }

  @media (max-width: 980px) {
    .nem-fila-una { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .nem-fila-una > .nem-campo-titulo,
    .nem-fila-una > .nem-campo-formativo,
    .nem-fila-una > .nem-campo-metodologia,
    .nem-fila-una > .nem-campo-sesiones { grid-column: span 1; }
  }
  @media (max-width: 620px) {
    .nem-fila-una { grid-template-columns: 1fr; }
    .nem-fila-una > .nem-campo-titulo,
    .nem-fila-una > .nem-campo-sesiones,
    .nem-fila-una > .nem-campo-formativo,
    .nem-fila-una > .nem-campo-metodologia { grid-column: span 1; }
  }

  /* La acción de IA se alinea a la derecha del label, sin empujar el campo */
  .nem-campo-inline > label {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .nem-campo-inline > label .btn-ia-sugerir-titulo { margin-left: auto; }

  /* ---------- 3 · Micro-iconos: fuera el ruido ---------- */
  /* La bocina solo vive dentro del modal de ayuda y del drawer */
  label .btn-voz-nem { display: none; }
  #modalAyudaNEM .btn-voz-nem,
  #drawerAsistenteIA .btn-voz-nem { display: inline-flex; }

  /* Nada de ❓ ni ✨ dentro de las pestañas del Stepper */
  .nem-step-tab .nem-ayuda-paso { display: none; }

  /* ---------- 4 · Stepper: check y barra de progreso ---------- */
  .nem-stepper-header {
    position: relative;
    overflow: hidden;
    padding-bottom: 9px;
  }
  .nem-stepper-header::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 25%;
    border-radius: 0 3px 3px 0;
    background: linear-gradient(90deg, #2563eb 0%, #10b981 100%);
    transition: width .35s ease;
  }
  .nem-stepper-header:has(#tabPasoPlan2.activo)::after { width: 50%; }
  .nem-stepper-header:has(#tabPasoPlan3.activo)::after { width: 75%; }
  .nem-stepper-header:has(#tabPasoPlan4.activo)::after { width: 100%; }

  .nem-step-tab {
    border: 1px solid transparent;
    transition: background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .nem-step-tab.completado .step-num {
    background: #10b981;
    color: #ffffff;
    font-size: 0;
  }
  .nem-step-tab.completado .step-num::after {
    content: '✓';
    font-size: 13px;
    font-weight: 800;
    line-height: 1;
  }
  .nem-step-tab.completado {
    box-shadow: inset 0 -2px 0 #10b981;
  }
  .nem-step-tab.completado .step-txt { color: #047857; }

  /* ---------- 5 · Etapa 2: rejilla y tarjetas de contenidos ---------- */
  .grid-contenidos-nem {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(238px, 1fr));
    gap: 12px;
    margin: 10px 0 16px;
  }
  .card-contenido-nem {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card-contenido-nem:hover {
    transform: translateY(-2px);
    border-color: #cbd5e1;
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.10);
  }
  .card-contenido-nem.seleccionado {
    padding: 13px;
    border: 2px solid #2563eb;
    background: #eff6ff;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.16);
  }
  .card-contenido-nem__titulo {
    margin: 0;
    font-size: 13.5px;
    font-weight: 700;
    line-height: 1.35;
    color: #0f172a;
  }
  .card-contenido-nem__texto {
    font-size: 12.5px;
    line-height: 1.45;
    color: #475569;
  }
  .card-contenido-nem__meta {
    font-size: 11px;
    font-weight: 600;
    color: #64748b;
  }

  /* ---------- 6 · Paleta oficial por Campo Formativo ---------- */
  .badge-campo {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    align-self: flex-start;
    padding: 2px 9px;
    border: 1px solid transparent;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .03em;
    text-transform: uppercase;
  }
  .badge-campo--lenguajes {
    color: #1e40af;
    background: #eff6ff;
    border-color: #bfdbfe;
  }
  .badge-campo--cientifico {
    color: #6d28d9;
    background: #f5f3ff;
    border-color: #ddd6fe;
  }
  .badge-campo--etica {
    color: #c2410c;
    background: #fff7ed;
    border-color: #fed7aa;
  }
  .badge-campo--comunitario {
    color: #047857;
    background: #ecfdf5;
    border-color: #a7f3d0;
  }

  /* Acento de la tarjeta según el campo */
  .card-contenido-nem--lenguajes { border-left: 4px solid #1e40af; }
  .card-contenido-nem--cientifico { border-left: 4px solid #6d28d9; }
  .card-contenido-nem--etica { border-left: 4px solid #c2410c; }
  .card-contenido-nem--comunitario { border-left: 4px solid #047857; }

  /* ---------- 7 · Filas de PDA legibles (contraste AAA) ---------- */

  .pda-item {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin: 0 0 6px;
    padding: 8px 10px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: #f8fafc;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .pda-item:hover {
    background: #f1f5f9;
    border-color: #cbd5e1;
  }
  .pda-item input[type="checkbox"] {
    width: 16px;
    height: 16px;
    min-width: 16px;
    margin: 2px 0 0;
    accent-color: #2563eb;
    cursor: pointer;
  }
  .pda-item__texto {
    font-size: 13.5px;
    line-height: 1.45;
    color: #1e293b;
  }
  .pda-item:has(input:checked) {
    background: #eff6ff;
    border-color: #bfdbfe;
  }
  .pda-item:has(input:checked) .pda-item__texto {
    color: #0f172a;
    font-weight: 600;
  }

  @media (prefers-reduced-motion: reduce) {
    .nem-step-tab,
    .card-contenido-nem,
    .pda-item,
    .nem-stepper-header::after { transition: none; }
    .card-contenido-nem:hover { transform: none; }
  }
  /* ============================================================
     OLA 1 · ETAPA 4 — LISTA DE COTEJO / RÚBRICA EDITABLE
     Contrato: #cajaRubricaCotejoNEM, .nem-tabla-cotejo-edit,
     .input-criterio-cotejo-nem, .btn-quitar-criterio-nem
     ============================================================ */
  #cajaRubricaCotejoNEM {
    margin: 14px 0 4px;
    padding: 12px 14px 10px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
  }
  .nem-rubrica-cab {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 0 10px;
    margin: 0 0 8px;
    border-bottom: 1px solid #eef2f7;
  }
  .nem-rubrica-titulo {
    margin: 0;
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: .01em;
    color: #0f172a;
  }
  .nem-rubrica-contador {
    display: inline-flex;
    align-items: center;
    padding: 2px 9px;
    border: 1px solid #bae6fd;
    border-radius: 999px;
    background: #f0f9ff;
    color: #0369a1;
    font-size: 10.5px;
    font-weight: 800;
    white-space: nowrap;
  }
  .nem-rubrica-acciones {
    display: flex;
    gap: 6px;
    margin-left: auto;
    flex-wrap: wrap;
  }
  .nem-rubrica-btn {
    padding: 5px 11px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: #ffffff;
    color: #334155;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
  }
  .nem-rubrica-btn:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
    color: #0f172a;
  }
  .nem-rubrica-btn:focus-visible {
    outline: 2px solid #0284c7;
    outline-offset: 2px;
  }
  .nem-rubrica-btn--ia {
    border-color: #ddd6fe;
    background: #f5f3ff;
    color: #6d28d9;
  }
  .nem-rubrica-btn--ia:hover {
    background: #ede9fe;
    border-color: #c4b5fd;
    color: #5b21b6;
  }

  /* ---- Tabla editable ---- */
  .nem-tabla-cotejo-edit {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 12.5px;
  }
  .nem-tabla-cotejo-edit thead th {
    padding: 6px 8px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: #64748b;
    text-align: left;
    white-space: nowrap;
  }
  .nem-tabla-cotejo-edit thead th.col-indicador {
    width: 76px;
    text-align: center;
  }
  .nem-tabla-cotejo-edit thead th.col-quitar { width: 34px; }
  .nem-tabla-cotejo-edit tbody td {
    padding: 4px 8px;
    border-bottom: 1px solid #f1f5f9;
    vertical-align: middle;
  }
  .nem-tabla-cotejo-edit tbody tr:last-child td { border-bottom: 0; }
  .nem-tabla-cotejo-edit tbody tr:hover td { background: #fbfcfe; }
  .nem-tabla-cotejo-edit td.col-indicador { text-align: center; }

  /* Input del criterio: sin borde hasta el foco */
  .input-criterio-cotejo-nem {
    width: 100%;
    min-width: 0;
    padding: 6px 8px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    font-family: inherit;
    font-size: 12.5px;
    line-height: 1.4;
    color: #1e293b;
    transition: border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
  }
  .input-criterio-cotejo-nem:hover {
    background: #f8fafc;
    border-color: #e2e8f0;
  }
  .input-criterio-cotejo-nem:focus {
    outline: none;
    border-color: #0284c7;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.14);
  }
  .input-criterio-cotejo-nem::placeholder { color: #94a3b8; }

  /* Indicadores Sí / En proceso / No todavía */
  .nem-cotejo-radio {
    width: 15px;
    height: 15px;

  /* ============================================================
     OLA 6.1 · build-581 — «📊 Encuesta / Diagnóstico» dentro del
     menú lateral y lienzo de autor en cero bloques
     ------------------------------------------------------------
     · La píldora del iDevice encuesta es la única de la familia
       «Evaluación y seguimiento» que se distingue con un icono de
       barras estadísticas. Las barras se dibujan en CSS: Bootstrap
       Icons no viaja en el paquete de Apps Script y el emoji 📊 no
       se puede pintar por partes.
     · Ganchos admitidos (basta uno de los tres; los tres pintan igual):
         .idevice-pill-add.pill-encuesta
         .idevice-pill-add[data-tipo="encuesta"]
         .idevice-pill-add[onclick*="encuesta"]
       Con el marcado actual de AyudaJS (data-tipo y onclick) funciona sin tocar
       una sola línea de JavaScript.
     · Con el emoji 📊 la píldora gana un medallón verde alrededor del
       propio icono; si Cursor lo sustituye por
       <i class="icono-barras"><i></i><i></i><i></i></i>, gana las
       barras vectoriales con ecualizador en :hover. Nunca las dos a
       la vez: el medallón se desactiva en cuanto existe .icono-barras.
     ============================================================ */

  /* ---------- 1 · Píldora destacada (familia Evaluación) ---------- */
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]) {
    position: relative;
    padding: 6px 10px 6px 15px;
    border: 1px solid #86efac;
    border-radius: 8px;
    background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 78%);
    box-shadow: inset 3px 0 0 0 #16a34a;
    color: #14532d;
    font-weight: 700;
    overflow: hidden;
    transition: background 160ms ease, border-color 160ms ease,
                box-shadow 160ms ease, color 160ms ease, transform 160ms ease;
  }

  /* Velo verde que barre la píldora en :hover (decorativo, no captura clics) */
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"])::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, rgba(22, 163, 74, 0) 0%, rgba(22, 163, 74, .10) 100%);
    opacity: 0;
    transition: opacity 160ms ease;
    pointer-events: none;
  }

  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover {
    background: #ffffff;
    border-color: #16a34a;
    box-shadow: inset 4px 0 0 0 #16a34a, 0 6px 16px rgba(22, 163, 74, .18);
    color: #15803d;
    transform: translateX(3px);
  }
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover::after {
    opacity: 1;
  }
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):active {
    transform: translateX(3px) translateY(1px);
    box-shadow: inset 4px 0 0 0 #16a34a, 0 2px 6px rgba(22, 163, 74, .20);
  }
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):focus-visible {
    outline: 2px solid #16a34a;
    outline-offset: 2px;
  }

  /* La pastilla «Añadir» acompaña la interacción: verde suave en reposo,
     verde pleno cuando la píldora está bajo el puntero. */
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]) .btn-mas {
    background: #dcfce7;
    color: #15803d;
    transition: background 160ms ease, color 160ms ease;
  }
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover .btn-mas {
    background: #15803d;
    color: #ffffff;
  }

  /* ---------- 2 · Icono de barras estadísticas (CSS puro) ---------- */
  /* Etiqueta preparada para el icono vectorial */
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):has(.icono-barras) > span:first-child {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .icono-barras {
    display: inline-flex;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    padding: 3px;
    box-sizing: border-box;
    border-radius: 6px;
    background: linear-gradient(135deg, #22c55e 0%, #0d9488 100%);
    box-shadow: 0 1px 2px rgba(13, 148, 136, .35);
    transition: transform 160ms ease, box-shadow 160ms ease;
  }
  .icono-barras > i {
    display: block;
    width: 3px;
    border-radius: 1.5px;
    background: #ffffff;
    transform-origin: bottom;
  }
  .icono-barras > i:nth-child(1) { height: 5px; }
  .icono-barras > i:nth-child(2) { height: 8px; }
  .icono-barras > i:nth-child(3) { height: 12px; }

  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover .icono-barras {
    transform: scale(1.06);
    box-shadow: 0 3px 8px rgba(13, 148, 136, .40);
  }
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover .icono-barras > i {
    animation: st90-barras-ecualizador 720ms ease-in-out infinite;
  }
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover .icono-barras > i:nth-child(2) {
    animation-delay: 110ms;
  }
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover .icono-barras > i:nth-child(3) {
    animation-delay: 220ms;
  }

  @keyframes st90-barras-ecualizador {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(.55); }
  }

  /* Respaldo sin tocar el marcado: el propio 📊 se convierte en medallón.
     Se desactiva en cuanto la etiqueta trae .icono-barras (evita duplicar). */
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):not(:has(.icono-barras)) > span:first-child::first-letter {
    float: left;
    margin: 0 7px 0 0;
    padding: 2px 3px 3px;
    border-radius: 6px;
    background: linear-gradient(135deg, #22c55e 0%, #0d9488 100%);
    box-shadow: 0 1px 2px rgba(13, 148, 136, .35);
    font-size: 13px;
    line-height: 1;
  }
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):not(:has(.icono-barras)):hover > span:first-child::first-letter {
    box-shadow: 0 3px 8px rgba(13, 148, 136, .40);
  }

  @media (prefers-reduced-motion: reduce) {
    .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover {
      transform: none;
    }
    .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover .icono-barras {
      transform: none;
    }
    .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover .icono-barras > i {
      animation: none;
    }
    .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"])::after {
      transition: none;
    }
  }

  /* ============================================================
     OLA 7 · build-583 — Flujo didáctico (Guion ➔ Asistente IA ➔ Constructor),
     ayuda y audio por momento, vista previa del alumno y buzón de
     evidencias
     ------------------------------------------------------------
     El marcado ya vive en AdminPlaneacion.html / Clase.html:
       .flujo-didactico-stepper > .flujo-paso-guion
                                 > .flujo-conector-ia
                                 > .flujo-paso-constructor
       .momento-caja-header > .btn-ayuda-momento + .btn-audio-momento
       .btn-vista-previa-alumno  (barra de acciones de la sesión)
       .idevice-buzon-actividad  (aún sin emitir; contrato en la entrega)
     Este bloque no reescribe .momento-caja ni .grid-momentos-nem:
     esas reglas viven en ComunCSS y aquí solo se acomodan sus botones.
     ============================================================ */

  /* ---------- 1 · Stepper del flujo didáctico ---------- */
  .flujo-didactico-stepper {
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin: 6px 0 20px;
  }

  .flujo-paso-guion,
  .flujo-paso-constructor {
    position: relative;
    padding: 18px 18px 20px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, .04);
    min-width: 0;
  }
  .flujo-paso-guion {
    border-left: 5px solid #2563eb;
  }
  .flujo-paso-constructor {
    border-left: 5px solid #0d9488;
  }

  /* Etiqueta de paso pegada al borde superior de cada tarjeta */
  .flujo-paso-guion::before,
  .flujo-paso-constructor::before {
    content: 'PASO 1';
    position: absolute;
    top: -11px;
    left: 14px;
    padding: 2px 10px;
    border-radius: 999px;
    background: #2563eb;
    color: #ffffff;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .08em;
    line-height: 1.6;
    box-shadow: 0 1px 3px rgba(37, 99, 235, .30);
  }
  .flujo-paso-constructor::before {
    content: 'PASO 2';
    background: #0d9488;
    box-shadow: 0 1px 3px rgba(13, 148, 136, .30);
  }

  .flujo-paso-titulo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 12px;
    font-size: 14px;
    font-weight: 800;
    line-height: 1.25;
    color: #1e40af;
  }
  .flujo-paso-titulo::before {
    content: '';
    width: 4px;
    height: 16px;
    border-radius: 999px;
    background: #2563eb;
    flex: 0 0 auto;
  }

  /* ---------- 2 · Cabecera de cada momento con ayuda y audio ---------- */
  .momento-caja-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-start;
    gap: 6px 8px;
  }
  /* El titulo ocupa su renglon: la pastilla y los dos botones nunca se
     separan ni quedan huerfanos en tarjetas estrechas. */
  .momento-caja-header h3 {
    flex: 1 1 100%;
    min-width: 0;
    margin: 0;
    font-size: 13.5px;
    line-height: 1.2;
  }
  .momento-caja-header .nem-meta-pill {
    margin-right: auto;
    padding: 2px 9px;
    border: 1px solid #e2e8f0;
    border-radius: 999px;
    background: #ffffff;
    color: #475569;
    font-size: 10.5px;
    font-weight: 700;
    white-space: nowrap;
  }

  .btn-ayuda-momento,
  .btn-audio-momento {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    background: #f1f5f9;
    color: #475569;
    font-family: inherit;
    font-size: 12px;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    transition: background 150ms ease, border-color 150ms ease,
                color 150ms ease, transform 120ms ease, box-shadow 150ms ease;
  }
  .btn-ayuda-momento:hover {
    background: #e2e8f0;
    border-color: #94a3b8;
    color: #0f172a;
  }
  .btn-ayuda-momento:active {
    transform: scale(.94);
  }

  .btn-audio-momento {
    background: #eff6ff;
    border-color: #bfdbfe;
    color: #1d4ed8;
  }
  .btn-audio-momento:hover {
    background: #dbeafe;
    border-color: #93c5fd;
    box-shadow: 0 2px 6px rgba(29, 78, 216, .16);
  }
  .btn-audio-momento:active {
    transform: scale(.94);
  }
  /* Mientras la voz está hablando (Cursor añade .activo) */
  .btn-audio-momento.activo {
    background: #1d4ed8;
    border-color: #1d4ed8;
    color: #ffffff;
    animation: st90-pulso-audio 1200ms ease-in-out infinite;
  }
  @keyframes st90-pulso-audio {
    0%, 100% { box-shadow: 0 0 0 0 rgba(29, 78, 216, .35); }
    50%      { box-shadow: 0 0 0 4px rgba(29, 78, 216, 0); }
  }

  .btn-ayuda-momento:focus-visible,
  .btn-audio-momento:focus-visible {
    outline: 2px solid #2563eb;
    outline-offset: 2px;
  }

  /* ---------- 3 · Conector Asistente IA IA (paso intermedio) ---------- */
  .flujo-conector-ia {
    position: relative;
    margin: 4px 0;
    padding: 20px 14px 14px;
    background: linear-gradient(180deg, #f0fdfa 0%, #ffffff 78%);
    border: 1px dashed #5eead4;
    border-radius: 12px;
  }
  /* Cinta que anuncia la transición (decorativa; el texto literal puede

  .flujo-conector-ia::before {
    content: 'PASO 2 · ESTRUCTURACIÓN DE LA CLASE';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);

    border: 1px solid #99f6e4;
    border-radius: 999px;
    background: #ffffff;
    color: #0f766e;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .07em;

    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 1px 3px rgba(13, 148, 136, .14);
  }
  /* Texto opcional si el conector se documenta desde el marcado */
  .flujo-conector-texto {
    margin: 0 0 10px;
    font-size: 12.5px;
    font-weight: 700;
    color: #0f766e;
    text-align: center;
  }

  /* La tarjeta de Asistente IA ya trae su marco: dentro del conector se aplana */
  .flujo-conector-ia .asistente-ia-card {
    margin: 0;
    background: #ffffff;
    border-color: #ccfbf1;
    box-shadow: none;

  /* ---------- 4 · Paso 2: constructor eXeLearning ---------- */
  .flujo-paso-constructor > .nem-seccion-exelearning {

    border: 0;

  .flujo-paso-constructor .nem-seccion-exelearning__titulo::before {

  .flujo-paso-constructor .nem-seccion-exelearning__cab {

    padding-bottom: 10px;

  /* Puntos de la sesión como pastilla, no como texto suelto */
  .flujo-paso-constructor #lblPuntosTotalesSesion {

    padding: 2px 10px;

    color: #0f766e;
    font-size: 10.5px;
    font-weight: 800;

  .btn-vista-previa-alumno {

    align-items: center;

    font-weight: 700;
    line-height: 1.2;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    transition: background 150ms ease, border-color 150ms ease,
                color 150ms ease, box-shadow 150ms ease, transform 120ms ease;
  }
  .tab-sesion:hover {
    background: #f1f5f9;
    color: #0f766e;
  }
  .tab-sesion:active {
    transform: translateY(1px);
  }
  .tab-sesion.activo,
  .tab-sesion[aria-selected="true"] {
    background: linear-gradient(180deg, #f0fdfa 0%, #ffffff 100%);
    border-color: #99f6e4;
    color: #0f766e;
    font-weight: 800;
    box-shadow: inset 0 -3px 0 0 #0d9488, 0 2px 6px rgba(13, 148, 136, .12);
  }
  .tab-sesion:focus-visible {
    outline: 2px solid #0d9488;
    outline-offset: 2px;
  }

  /* El atributo hidden manda aunque el panel gane el estado activo */
  .panel-paso-sesion[hidden] {
    display: none !important;
  }
  .panel-paso-sesion.activo {
    display: block;
  }

  /* Pie de navegación guiada entre pasos */
  .pie-nav-sesion {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 10px;
    margin: 16px 0 2px;
    padding-top: 12px;
    border-top: 1px dashed #e2e8f0;
  }
  .btn-nav-sesion-sig,
  .btn-nav-sesion-ant {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 800;
    line-height: 1.15;
    cursor: pointer;
    transition: background 150ms ease, border-color 150ms ease,
                box-shadow 150ms ease, transform 120ms ease;
  }
  .btn-nav-sesion-sig {
    border: 1px solid #0d9488;
    background: linear-gradient(135deg, #0d9488 0%, #0284c7 100%);
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(13, 148, 136, .28);
  }
  .btn-nav-sesion-sig:hover {
    box-shadow: 0 6px 16px rgba(13, 148, 136, .34);
    transform: translateY(-1px);
  }
  .btn-nav-sesion-ant {
    border: 1px solid #cbd5e1;
    background: #f1f5f9;
    color: #475569;
  }
  .btn-nav-sesion-ant:hover {
    background: #e2e8f0;
    border-color: #94a3b8;
    color: #334155;
  }
  .btn-nav-sesion-sig:active,
  .btn-nav-sesion-ant:active {
    transform: translateY(1px);
  }
  .btn-nav-sesion-sig:focus-visible,
  .btn-nav-sesion-ant:focus-visible {
    outline: 2px solid #0d9488;
    outline-offset: 2px;
  }

  /* ---------- 2 · Modal de vista previa (cero transparencia) ---------- */
  #modalPreviewAlumno {
    background: rgba(15, 23, 42, .75);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    z-index: 99999;
  }
  #modalPreviewAlumno .preview-panel {
    width: min(1080px, 95vw);
    height: 90vh;
    max-height: 90vh;
    background: #ffffff !important;
    border: 1px solid #cbd5e1;
    border-radius: 16px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .25);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Barra de navegador simulada */
  .preview-mockup-browser,
  .preview-barra {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
    padding: 10px 14px;
    background: #f1f5f9;
    border-bottom: 1px solid #e2e8f0;
  }
  .preview-dot,
  .preview-punto {
    width: 12px;
    height: 12px;
    min-width: 12px;
    border-radius: 50%;
    background: #ef4444;
    box-shadow: inset 0 0 0 1px rgba(15, 23, 42, .08);
  }
  .preview-dot:nth-child(2),
  .preview-punto:nth-child(2) { background: #f59e0b; }
  .preview-dot:nth-child(3),
  .preview-punto:nth-child(3) { background: #22c55e; }

  .preview-url {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    margin: 0 8px;
    padding: 5px 12px 5px 30px;
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    background: #ffffff;
    color: #64748b;
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1.3;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Candadito verde dibujado en CSS (cuerpo + arco) */
  .preview-url::before {
    content: '';
    position: absolute;
    left: 12px;
    top: 50%;
    width: 8px;
    height: 6px;
    margin-top: -1px;
    border-radius: 1.5px;
    background: #16a34a;
  }
  .preview-url::after {
    content: '';
    position: absolute;
    left: 14px;
    top: 50%;
    width: 4px;
    height: 5px;
    margin-top: -6px;
    border: 1.5px solid #16a34a;
    border-bottom: 0;
    border-radius: 4px 4px 0 0;
    box-sizing: border-box;
  }

  .preview-cerrar {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 1px solid #cbd5e1;
    border-radius: 50%;
    background: #ffffff;
    color: #334155;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
  }
  .preview-cerrar:hover {
    background: #fee2e2;
    border-color: #fecaca;
    color: #b91c1c;
  }
  .preview-cerrar:focus-visible {
    outline: 2px solid #b91c1c;
    outline-offset: 2px;
  }

  .preview-cuerpo-web {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    background: #f8fafc;
  }

  /* Compatibilidad con el marcado anterior del modal */
  .preview-cabecera {
    background: #f1f5f9;
    color: #1e293b;
    border-bottom: 1px solid #e2e8f0;
  }
  .preview-cabecera h3 { color: #1e293b; }
  .preview-cabecera .preview-cerrar { margin-left: auto; }
  .preview-marco {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    margin: 0;
    border: 0;
    border-radius: 0;
    overflow: hidden;
  }

  /* ---------- 3 · Aula moderna del alumno ---------- */
  .aula-alumno-preview {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 18px;
    background: #f8fafc;
    font-family: inherit;
  }

  /* Hero institucional */
  .aula-hero {
    position: relative;
    overflow: hidden;
    padding: 22px 22px 20px;
    border-radius: 14px;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 48%, #2563eb 100%);
    color: #ffffff;
    box-shadow: 0 12px 26px rgba(15, 23, 42, .22);
  }
  .aula-hero::after {
    content: '';
    position: absolute;
    top: -70px;
    right: -60px;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, .22) 0%, rgba(255, 255, 255, 0) 70%);
    pointer-events: none;
  }
  .aula-hero__top {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .aula-hero__escudo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    flex: 0 0 auto;
    border: 1px solid rgba(255, 255, 255, .38);
    border-radius: 12px;
    background: rgba(255, 255, 255, .16);
    font-size: 22px;
    line-height: 1;
  }
  .aula-hero__titulo {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -.01em;
    line-height: 1.2;
  }
  .aula-hero__meta {
    margin: 8px 0 0;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255, 255, 255, .86);
  }
  .aula-hero__chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .aula-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border: 1px solid rgba(255, 255, 255, .34);
    border-radius: 999px;
    background: rgba(255, 255, 255, .14);
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  /* Barra de audio DUA con ecualizador */
  .aula-audio-dua {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border: 1px solid #bfdbfe;
    border-radius: 12px;
    background: #eff6ff;
  }
  .aula-audio-dua__btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    flex: 0 0 auto;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: #2563eb;
    color: #ffffff;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    transition: background 150ms ease, transform 120ms ease;
  }
  .aula-audio-dua__btn:hover {
    background: #1d4ed8;
    transform: scale(1.04);
  }
  .aula-audio-dua__btn:focus-visible {
    outline: 2px solid #1d4ed8;
    outline-offset: 2px;
  }
  .aula-ecualizador {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    flex: 1 1 auto;
    height: 22px;
    min-width: 0;
    background: linear-gradient(#dbeafe, #dbeafe) center / 100% 4px no-repeat;
  }
  .aula-ecualizador > span {
    display: block;
    width: 4px;
    border-radius: 2px;
    background: linear-gradient(180deg, #93c5fd 0%, #2563eb 100%);
    transform-origin: bottom;
    animation: aula-onda 900ms ease-in-out infinite;
  }
  .aula-ecualizador > span:nth-child(1) { height: 30%; }
  .aula-ecualizador > span:nth-child(2) { height: 55%; animation-delay: 80ms; }
  .aula-ecualizador > span:nth-child(3) { height: 80%; animation-delay: 160ms; }
  .aula-ecualizador > span:nth-child(4) { height: 45%; animation-delay: 240ms; }
  .aula-ecualizador > span:nth-child(5) { height: 65%; animation-delay: 320ms; }
  @keyframes aula-onda {
    0%, 100% { transform: scaleY(.55); }
    50%      { transform: scaleY(1); }
  }
  .aula-audio-dua__estado {
    flex: 0 0 auto;
    font-size: 11px;
    font-weight: 800;
    color: #1d4ed8;
    white-space: nowrap;
  }

  /* Sub-tabs de momentos del alumno */
  .aula-subtabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 5px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    background: #ffffff;
  }
  .aula-subtab {
    flex: 1 1 0;
    min-width: 0;
    padding: 8px 10px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: #475569;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.2;
    cursor: pointer;
    transition: background 150ms ease, color 150ms ease, box-shadow 150ms ease;
  }
  .aula-subtab:hover {
    background: #f1f5f9;
    color: #0f766e;
  }
  .aula-subtab.activo {
    background: #0d9488;
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(13, 148, 136, .28);
  }
  .aula-subtab:focus-visible {
    outline: 2px solid #0d9488;
    outline-offset: 2px;
  }

  .aula-panel {
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .aula-panel.activo {
    display: flex;
  }

  /* Tarjetas de contenido */
  .aula-card {
    padding: 16px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    background: #ffffff;
    box-shadow: 0 4px 12px rgba(15, 23, 42, .05);
  }
  .aula-card__titulo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 8px;
    font-size: 14px;
    font-weight: 800;
    color: #1e293b;
  }
  .aula-card__texto {
    margin: 0;
    font-size: 13px;
    line-height: 1.55;
    color: #334155;
  }

  /* Quiz interactivo */
  .aula-quiz {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
  }
  .aula-quiz__opcion {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    background: #ffffff;
    color: #334155;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
  }
  .aula-quiz__opcion:hover {
    border-color: #93c5fd;
    background: #eff6ff;
  }
  .aula-quiz__opcion.elegida {
    border-color: #2563eb;
    background: #eff6ff;
    box-shadow: 0 0 0 2px rgba(37, 99, 235, .14);
  }
  .aula-quiz__opcion.correcta {
    border-color: #16a34a;
    background: #f0fdf4;
    color: #166534;
  }
  .aula-quiz__opcion.incorrecta {
    border-color: #fca5a5;
    background: #fef2f2;
    color: #b91c1c;
  }
  .aula-quiz__opcion:focus-visible {
    outline: 2px solid #2563eb;
    outline-offset: 2px;
  }
  .aula-quiz__letra {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: #e2e8f0;
    color: #475569;
    font-size: 11px;
    font-weight: 800;
  }
  .aula-quiz__opcion.elegida .aula-quiz__letra {
    background: #2563eb;
    color: #ffffff;
  }
  .aula-quiz__retro {
    margin: 8px 0 0;
    font-size: 12px;
    font-weight: 700;
    color: #0f766e;
  }

  /* El buzón de evidencias se integra sin margen extra */
  .aula-alumno-preview .idevice-buzon-actividad {
    margin: 0;
  }

  @media (max-width: 760px) {
    .stepper-tabs-sesion {
      gap: 4px;
      padding: 4px;
    }
    .tab-sesion {
      padding: 8px 9px;
      font-size: 11.5px;
    }
    #modalPreviewAlumno .preview-panel {
      width: 96vw;
      height: 92vh;
      max-height: 92vh;
    }
    .aula-alumno-preview {
      padding: 12px;
    }
    .aula-hero__titulo {
      font-size: 17px;
    }
    .pie-nav-sesion {
      justify-content: stretch;
    }
    .btn-nav-sesion-sig,
    .btn-nav-sesion-ant {
      flex: 1 1 auto;
      justify-content: center;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .tab-sesion,
    .btn-nav-sesion-sig,
    .btn-nav-sesion-ant,
    .preview-cerrar,
    .aula-audio-dua__btn,
    .aula-subtab,
    .aula-quiz__opcion {
      transition: none;
    }
    .aula-ecualizador > span {
      animation: none;
      transform: none;
    }
    .btn-nav-sesion-sig:hover,
    .tab-sesion:active,
    .btn-nav-sesion-sig:active,
    .btn-nav-sesion-ant:active {
      transform: none;
    }
  }

  /* ============================================================
     OLA 9 · build-585 — Vista previa elegante del alumno
     (porte del bloque aprobado en muestra_vista_previa_alumno.html)
     ------------------------------------------------------------
     · El bloque se acota a .browser-frame, que vive tanto dentro de
       #vistaPreviaIntegrada (pestaña 4) como de #modalPreviewAlumno:
       así el diseño aprobado no se filtra al resto de la aplicación.
     · Se eliminan los resets globales (html/body/*) y se reescriben
       acotados al marco; los keyframes se renombran (st90Aula*) para
       no chocar con animaciones existentes.
     · Se añaden las adaptaciones al proyecto: tipografías del sistema,
       pestaña 4 y modal (barra oscura con membrete, sin doble marco).
     ============================================================ */

  .browser-frame {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --teal: #0d9488;
      --teal-light: #f0fdfa;
      --surface: #ffffff;
      --background: #f8fafc;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --success: #16a34a;
      --success-light: #dcfce7;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.07), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 20px 30px -10px rgba(15, 23, 42, 0.12);
    }

  .browser-frame,
  .browser-frame * {
    box-sizing: border-box;
  }
  .browser-frame * {
    margin: 0;
    padding: 0;
  }

  .browser-frame {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

  .browser-frame {
      max-width: 1040px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(226, 232, 240, 0.8);
      overflow: hidden;
      animation: st90AulaFadeIn 0.4s ease-out;
    }

  @keyframes st90AulaFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

  .browser-frame .browser-topbar {
      background: #0f172a;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
    }

  .browser-frame .browser-dots {
      display: flex;
      gap: 7px;
      align-items: center;
    }

  .browser-frame .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

  .browser-frame .dot-red { background: #ef4444; }

  .browser-frame .dot-yellow { background: #f59e0b; }

  .browser-frame .dot-green { background: #10b981; }

  .browser-frame .browser-address {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

  .browser-frame .browser-address span {
      color: #38bdf8;
      font-weight: 600;
    }

  .browser-frame .school-badge {
      font-size: 11.5px;
      color: #cbd5e1;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

  .browser-frame .class-hero {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 40%, #0f172a 100%);
      color: #ffffff;
      padding: 36px 36px 30px;
      position: relative;
      overflow: hidden;
    }

  .browser-frame .class-hero::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

  .browser-frame .hero-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

  .browser-frame .meta-tag {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

  .browser-frame .meta-tag.live {
      background: rgba(16, 185, 129, 0.25);
      border-color: rgba(16, 185, 129, 0.4);
      color: #a7f3d0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

  .browser-frame .live-pulse {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: st90AulaPulse 1.6s infinite;
    }

  @keyframes st90AulaPulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

  .browser-frame .class-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
      max-width: 820px;
    }

  .browser-frame .class-subtitle {
      font-size: 14.5px;
      color: #e0f2fe;
      max-width: 780px;
      margin-bottom: 18px;
      opacity: 0.95;
    }

  .browser-frame .session-progress-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(15, 23, 42, 0.3);
      padding: 10px 18px;

  .browser-frame .waveform-bars {

  .browser-frame .wave-bar {

  .browser-frame .reading-passage {

  .browser-frame .dropzone-box {
      border: 2px dashed #93c5fd;

  .browser-frame .dropzone-icon {
      font-size: 36px;

  .browser-frame .dropzone-title {

  .browser-frame .dropzone-subtitle {

  .browser-frame .btn-browse {

  .browser-frame .classroom-footer {

  .browser-frame .class-title { font-size: 20px; }

  /* ---------- Adaptación al proyecto: tipografías del sistema ---------- */
  /* La muestra usa Plus Jakarta Sans / Space Grotesk; el paquete de Apps
     Script no carga Google Fonts, así que se fija una pila equivalente. */
  .browser-frame {
    font-family: 'Plus Jakarta Sans', 'Segoe UI', Roboto, Arial, sans-serif;
  }
  .browser-frame .class-title {
    font-family: 'Space Grotesk', 'Segoe UI', Roboto, Arial, sans-serif;
  }

  /* ---------- Adaptación a la pestaña 4 (#vistaPreviaIntegrada) ---------- */
  #vistaPreviaIntegrada {
    margin-bottom: 16px;
  }
  #vistaPreviaIntegrada:empty {
    display: none;
  }
  #vistaPreviaIntegrada .browser-frame {
    margin-bottom: 0;
  }

  /* ---------- Adaptación al modal (#modalPreviewAlumno) ---------- */
  /* La barra del modal hereda el look de .browser-topbar: fondo oscuro,
     dirección translúcida y cierre circular. Así no se duplica el marco:
     el panel blanco hace de ventana y el frame solo aporta el contenido. */
  #modalPreviewAlumno .preview-mockup-browser {
    background: #0f172a;
    border-bottom: 1px solid #1e293b;
    padding: 12px 20px;
    gap: 10px;
  }
  #modalPreviewAlumno .preview-mockup-browser .preview-url {
    order: 1;
    background: rgba(255, 255, 255, .08);
    border-color: rgba(255, 255, 255, .06);
    color: #94a3b8;
  }
  #modalPreviewAlumno .preview-mockup-browser .preview-cerrar {
    order: 3;
    background: rgba(255, 255, 255, .12);
    border-color: rgba(255, 255, 255, .28);
    color: #ffffff;
  }
  #modalPreviewAlumno .preview-mockup-browser .preview-cerrar:hover {
    background: #ef4444;
    border-color: #ef4444;
    color: #ffffff;
  }
  /* Membrete institucional como en la muestra aprobada */
  #modalPreviewAlumno .preview-mockup-browser::after {
    content: 'SECUNDARIA TÉCNICA 90';
    order: 2;
    margin-left: 10px;
    color: #cbd5e1;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .5px;
    white-space: nowrap;
  }
  #modalPreviewAlumno .browser-frame {
    max-width: none;
    margin: 0;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    animation: none;
  }
  #modalPreviewAlumno .browser-frame > .browser-topbar {
    display: none;
  }

  /* ---------- DUA: foco visible en los controles del aula ---------- */
  .browser-frame .moment-tab:focus-visible,
  .browser-frame .btn-play-dua:focus-visible,
  .browser-frame .btn-browse:focus-visible,
  .browser-frame .quiz-option:focus-visible,
  .browser-frame .btn-check-answer:focus-visible,
  .browser-frame .btn-footer-nav:focus-visible {
    outline: 2px solid #0284c7;
    outline-offset: 2px;
  }

  @media (max-width: 760px) {
    #modalPreviewAlumno .preview-mockup-browser::after {
      display: none;
    }
    #modalPreviewAlumno .preview-mockup-browser {
      padding: 10px 12px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .browser-frame,
    .browser-frame .moment-panel {
      animation: none;
    }
    .browser-frame .live-pulse,
    .browser-frame .wave-bar {
      animation: none;
    }
    .browser-frame .moment-tab:hover,
    .browser-frame .btn-footer-next:hover {
      transform: none;
    }
  }

  /* El emoji de nube de la muestra es blanco; se tiñe de azul para
     coincidir con el icono de nube institucional de la partitura. */
  .browser-frame .dropzone-icon {
    filter: saturate(0) brightness(.7) sepia(1) hue-rotate(180deg) saturate(6);
  }

  /* ============================================================
     OLA 10 · CONTENIDOS DE APRENDIZAJE NEM
     Ejemplo modelado · Ejercicio autónomo · Lista de cotejo · Rúbrica SEP
     ============================================================ */

  /* ---------- 1 · Tarjeta de ejemplo modelado ---------- */
  .contenido-bloque-ejemplo {
    position: relative;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-left: 4px solid #f59e0b;
    border-radius: 10px;
    padding: 14px 16px;
    margin: 14px 0;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .05);
  }
  .contenido-bloque-ejemplo--azul { border-left-color: #0284c7; }

  .ejemplo-encabezado {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 0 0 8px;
  }
  .ejemplo-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #fffbeb;
    border: 1px solid #fde68a;
    color: #92400e;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .03em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 999px;
    line-height: 1.4;
  }
  .contenido-bloque-ejemplo--azul .ejemplo-badge {
    background: #eff6ff;
    border-color: #bfdbfe;
    color: #1d4ed8;
  }
  .ejemplo-titulo { font-size: 13px; font-weight: 700; color: #0f172a; }
  .ejemplo-intro {
    margin: 0 0 10px;
    font-size: 12.5px;
    line-height: 1.6;
    color: #475569;
  }

  .ejemplo-pasos { list-style: none; counter-reset: paso; margin: 0; padding: 0; }
  .ejemplo-paso-item {
    position: relative;
    counter-increment: paso;
    padding: 0 0 0 34px;
    margin: 0 0 9px;
    font-size: 12.5px;
    line-height: 1.55;
    color: #334155;
  }
  .ejemplo-paso-item:last-child { margin-bottom: 0; }
  .ejemplo-paso-item::before {
    content: counter(paso);
    position: absolute;
    left: 0;
    top: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #f59e0b;
    color: #ffffff;
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .contenido-bloque-ejemplo--azul .ejemplo-paso-item::before { background: #0284c7; }
  .ejemplo-paso-item strong { color: #0f172a; }

  /* ---------- 2 · Bloque de ejercicio autónomo ---------- */
  .contenido-bloque-ejercicio {
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 14px 16px;
    margin: 14px 0;
  }
  .ejercicio-encabezado {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 6px;
  }
  .ejercicio-icono {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: #e0f2fe;
    font-size: 13px;
    flex: 0 0 auto;
  }
  .ejercicio-titulo { font-size: 13px; font-weight: 700; color: #0f172a; }
  .ejercicio-consigna {
    margin: 0 0 10px;
    font-size: 12.5px;
    line-height: 1.6;
    color: #475569;
  }
  .ejercicio-borrador {
    min-height: 84px;

    color: #334155;

  /* ---------- 3 · Lista de cotejo del alumno ---------- */
  .contenido-lista-cotejo {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 14px 16px;
    margin: 14px 0;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .05);
  }
  .cotejo-encabezado {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 0 0 12px;
  }
  .cotejo-titulo {
    font-size: 13px;
    font-weight: 700;
    color: #0f172a;
    margin-right: auto;
  }
  .cotejo-progreso-wrap {
    flex: 1 1 140px;
    min-width: 100px;
    height: 8px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
  }
  .cotejo-progreso-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #22c55e, #16a34a);
    border-radius: 999px;
    transition: width .25s ease;
  }
  .cotejo-progreso-porcentaje {
    min-width: 34px;
    text-align: right;
    font-size: 11.5px;
    font-weight: 800;
    color: #15803d;
  }
  .cotejo-items { list-style: none; margin: 0; padding: 0; }
  .cotejo-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 6px;
    border-radius: 8px;
    transition: background .12s ease;
  }
  .cotejo-item + .cotejo-item { border-top: 1px solid #eef2f7; }
  .cotejo-item:hover { background: #f8fafc; }
  .cotejo-check {
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    margin: 1px 0 0;
    accent-color: #16a34a;
    cursor: pointer;
  }
  .cotejo-check:focus-visible {
    outline: 2px solid #0284c7;
    outline-offset: 2px;
  }
  .cotejo-texto {
    font-size: 12.5px;
    line-height: 1.5;
    color: #334155;
  }
  .cotejo-item.completado .cotejo-texto {
    text-decoration: line-through;
    opacity: .7;
  }

  /* ---------- 4 · Matriz de rúbrica analítica SEP ---------- */
  .contenido-rubrica-sep {
    margin: 16px 0;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    overflow: hidden;
    background: #ffffff;
  }
  .contenido-rubrica-sep .rubrica-scroll { overflow-x: auto; }

  .rubrica-tabla {
    width: 100%;
    min-width: 720px;
    border-collapse: collapse;
    font-size: 13px;
  }
  .rubrica-tabla thead th {
    background: #0f172a;
