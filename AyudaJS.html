  try {
    var u = new URL(t);
    if (u.protocol !== 'https:') return '';
    if (u.username || u.password) return '';
    return u.href;
  } catch (e) {
    return '';
  }
}

  var h5p = hostEs_(h, 'h5p.com') || hostEs_(h, 'h5p.org');
  var canva = hostEs_(h, 'canva.com');
  var slides = h === 'docs.google.com' && u.pathname.indexOf('/presentation/') >= 0;
  if (!(genial || h5p || canva || slides)) return '';
  return u.href;
}

function elegirVozFemeninaEspanol_() {
  if (typeof window === 'undefined' || !window.speechSynthesis) return null;
  var voces = window.speechSynthesis.getVoices() || [];
  if (!voces.length) return null;

  var mejorVoz = null;
  var mejorPuntaje = -999;

  for (var i = 0; i < voces.length; i++) {
    var v = voces[i];
    var lang = String(v.lang || '').toLowerCase().replace('_', '-');
    if (lang.indexOf('es') !== 0) continue;

    var nombre = String(v.name || '') + ' ' + String(v.voiceURI || '');
    var nLow = nombre.toLowerCase();
    var pts = 0;

    // Prioridad geográfica (México / Latinoamérica / Español general)
    if (lang === 'es-mx') pts += 40;
    else if (lang === 'es-us' || lang === 'es-419' || lang === 'es-co' || lang === 'es-ar' || lang === 'es-cl') pts += 28;
    else if (lang.indexOf('es') === 0) pts += 18;

    // Nombres de voces femeninas en Windows, Edge, Chrome, macOS, iOS y Android (Sabina, Dalia, Paulina, Helena, etc.)
    if (/\b(sabina|dalia|paulina|helena|laura|monica|mónica|paola|francisca|paloma|elvira|larissa|camila|lupe|penelope|penélope|mia|mía|sofia|sofía|lucia|lucía|jimena|carmen|isabela|marisol|femenin|female|mujer|woman)\b/i.test(nLow)) {
      pts += 100;
    }
    if (/natural|neural|online/i.test(nLow)) {
      pts += 25;
    }
    if (/google\s+espa/i.test(nLow) && !/male|hombre|masculin/i.test(nLow)) {
      pts += 45;
    }

    // Penalizar voces masculinas conocidas (Raúl, Jorge, Álvaro, Pablo, Diego, Carlos, etc.)
    if (/\b(raul|raúl|jorge|alvaro|álvaro|pablo|diego|carlos|miguel|andres|andrés|alonso|enrique|tomas|tomás|juan|male|hombre|masculin)\b/i.test(nLow)) {
      pts -= 150;
    }

    if (pts > mejorPuntaje) {
      mejorPuntaje = pts;
      mejorVoz = v;
    }
  }
  return mejorVoz;
}
window.elegirVozFemeninaEspanol_ = elegirVozFemeninaEspanol_;

if (typeof window !== 'undefined' && window.speechSynthesis) {
  try {
    window.speechSynthesis.getVoices();
    if (typeof window.speechSynthesis.onvoiceschanged !== 'undefined') {
      window.speechSynthesis.addEventListener('voiceschanged', function () {
        try { window.speechSynthesis.getVoices(); } catch (e) {}
      });
    }
  } catch (e) {}
}

function narrarTextoNEM_(texto, btnIndicador, alTerminar) {
  if (typeof window === 'undefined' || !window.speechSynthesis) {
    avisar_('Tu navegador no soporta síntesis de voz.', 'info');
    return;
  }
  var yaEstabaReproduciendoEste = (btnReproduciendoActivo_ && btnReproduciendoActivo_ === btnIndicador);
  detenerVozNEM_();
  if (yaEstabaReproduciendoEste) return;

  var textoLimpio = String(texto || '')
    .replace(/[*#_`~>•]/g, ' ')
    .replace(/https?:\/\/\S+/g, 'enlace')
    .replace(/\s+/g, ' ')
    .trim();

  if (!textoLimpio) return;

  var utter = new SpeechSynthesisUtterance(textoLimpio);
  utter.lang = 'es-MX';
  utter.rate = 1.0;
  utter.pitch = 1.08;

  var vozEs = elegirVozFemeninaEspanol_();
  if (vozEs) {
    utter.voice = vozEs;
    if (vozEs.lang) utter.lang = vozEs.lang;
  }

  if (btnIndicador) {
    marcarBtnVozReproduciendo_(btnIndicador);
    btnReproduciendoActivo_ = btnIndicador;
  }

  utter.onend = function () {
    if (btnIndicador) restaurarBtnVoz_(btnIndicador);
    if (btnReproduciendoActivo_ === btnIndicador) btnReproduciendoActivo_ = null;
    if (typeof alTerminar === 'function') alTerminar();
  };
  utter.onerror = function () {
    if (btnIndicador) restaurarBtnVoz_(btnIndicador);
    if (btnReproduciendoActivo_ === btnIndicador) btnReproduciendoActivo_ = null;
  };

  window.speechSynthesis.speak(utter);
}

function conmutarDictadoPorVozIA_() {
  var SpeechRec = (typeof window !== 'undefined') ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;
  if (!SpeechRec) {
    avisar_('El dictado por voz requiere Google Chrome, Edge o un navegador compatible con Web Speech API.', 'info');
    return;
  }
  var btn = nodo_('btnMicrofonoIA');
  var campo = nodo_('txtMensajeAsistente');
  if (!campo) return;

  if (escuchandoVoz_ && reconocimientoVoz_) {
    try { reconocimientoVoz_.stop(); } catch (e) {}
    escuchandoVoz_ = false;
    if (btn) {
      btn.classList.remove('escuchando');
      btn.textContent = '🎙️';
      btn.title = 'Dictar por voz';
    }
    return;
  }

  try {
    reconocimientoVoz_ = new SpeechRec();
    reconocimientoVoz_.lang = 'es-MX';
    reconocimientoVoz_.continuous = false;
    reconocimientoVoz_.interimResults = true;

    reconocimientoVoz_.onstart = function () {
      escuchandoVoz_ = true;
      if (btn) {
        btn.classList.add('escuchando');
        btn.textContent = '🔴';
        btn.title = 'Escuchando... haz clic para detener';
      }
    };

    reconocimientoVoz_.onresult = function (ev) {
      var transcript = '';
      for (var i = ev.resultIndex; i < ev.results.length; ++i) {
        transcript += ev.results[i][0].transcript;
      }
      campo.value = transcript;
    };

    reconocimientoVoz_.onerror = function () {
      escuchandoVoz_ = false;
      if (btn) {
        btn.classList.remove('escuchando');
        btn.textContent = '🎙️';
        btn.title = 'Dictar por voz';
      }
    };

    reconocimientoVoz_.onend = function () {
      escuchandoVoz_ = false;
      if (btn) {
        btn.classList.remove('escuchando');
        btn.textContent = '🎙️';
        btn.title = 'Dictar por voz';
      }
      if (campo && campo.value.trim()) {
        campo.focus();
      }
    };

    reconocimientoVoz_.start();
  } catch (err) {
    escuchandoVoz_ = false;
    if (btn) {
      btn.classList.remove('escuchando');
      btn.textContent = '🎙️';
    }
    avisar_('No se pudo activar el micrófono: ' + err.message, 'error');
  }
}

function calcularTrimestreSEP_Local(fechaStr) {
  var s = String(fechaStr || '').trim();
  var mes = 0;
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
    mes = parseInt(s.substring(5, 7), 10);
  } else if (s) {
    var d = new Date(s.indexOf('T') === -1 ? (s + 'T12:00:00') : s);
    if (!isNaN(d.getTime())) mes = d.getMonth() + 1;
  }
  if (!mes) {
    var hoy = new Date();
    mes = hoy.getMonth() + 1;
  }
  // Calendario Oficial SEP:
  // Trimestre 1: Agosto (8) a Noviembre (11)
  // Trimestre 2: Diciembre (12) a Marzo (3)
  // Trimestre 3: Abril (4) a Julio (7)
  if (mes >= 8 && mes <= 11) {
    return { num: 1, texto: 'Trimestre 1 (Ago - Nov)' };
  } else if (mes === 12 || (mes >= 1 && mes <= 3)) {
    return { num: 2, texto: 'Trimestre 2 (Dic - Mar)' };
  } else {
    return { num: 3, texto: 'Trimestre 3 (Abr - Jul)' };
  }
}

function obtenerMetadatosClaseActiva_() {
  function v(id) {
    var el = nodo_(id);
    return el ? String(el.value || '').trim() : '';
  }

  var asig = v('planAsignatura');
  var grado = v('planGrado') || '1';
  var grupo = v('planGrupo') || 'A';
  var campo = v('planCampoFormativo') || 'Ética, Naturaleza y Sociedades';
  var metodo = v('planMetodologia') || '';
  var titulo = v('planTitulo') || '';
  var contenido = v('planContenidoSintetico') || v('selContenidoSinteticoNEM');
  var pda = v('planPDA');
  var problema = v('planProblema');

  // Detectar fecha desde formulario o banner superior
  var fecha = v('planFechaInicio');
  if (!fecha) {
    var feEl = nodo_('txtEncabezadoFecha');
    if (feEl && feEl.textContent && /\d{4}-\d{2}-\d{2}/.test(feEl.textContent)) {
      fecha = feEl.textContent.trim();
    }
  }

  // Detectar o calcular Periodo y Trimestre según Calendario SEP
  var periodo = v('planPeriodo');
  if (!periodo) {
    var perEl = nodo_('txtEncabezadoPeriodo');
    if (perEl && perEl.textContent && /trimestre/i.test(perEl.textContent)) {
      periodo = perEl.textContent.trim();
    }
  }

  var triInfo = calcularTrimestreSEP_Local(fecha);
  var numTrimestre = triInfo.num;
  if (!periodo) {
    periodo = triInfo.texto;
  } else {
    var matchTri = periodo.match(/([123])/);
    if (matchTri) numTrimestre = parseInt(matchTri[1], 10);
  }

  // Si planAsignatura está vacío o no es específico, inspeccionar el banner oficial
  if (!asig || asig.length < 2) {
    var enc = nodo_('txtEncabezadoMateriaGrupo') || nodo_('txtClaseSeleccionada');
    var txtEnc = enc ? enc.textContent.trim() : '';
    if (txtEnc) {
      var partes = txtEnc.split(/[-·•]/);
      if (partes.length > 0 && partes[0].trim()) {
        asig = partes[0].trim();
      }
      var matchG = txtEnc.match(/([123])\s*[°oº]?\s*([A-Fa-f])/);
      if (matchG) {
        if (!v('planGrado')) grado = matchG[1];
        if (!v('planGrupo')) grupo = matchG[2].toUpperCase();
      }
    }
  }

  // Inferir del título si la asignatura aún no está fija
  if ((!asig || asig.length < 2) && titulo) {
    var partesTit = titulo.split(/[-·•(]/);
    if (partesTit.length > 0 && partesTit[0].trim()) {
      asig = partesTit[0].trim();
    }
  }

  return {
    asignatura: asig || 'General',
    grado: grado,
    grupo: grupo,
    campoFormativo: campo,
    metodologia: metodo,
    titulo: titulo,
    fecha: fecha,
    periodo: periodo,
    trimestre: numTrimestre,
    contenido: contenido,
    pda: pda,
    problema: problema,
    paso: pasoPlanVisible_(),
    pasoNombre: CONTEXTO_POR_PASO_[pasoPlanVisible_()] || 'Metadatos y ejes'
  };
}

}

function extraerSugerenciasTitulos_(txt) {
  if (!txt || typeof txt !== 'string') return [];
  var resultados = [];
  var vistos = {};
  var reComillas = /["«“]([^"»”\n]{8,90})["»”]/g;
  var m;
  while ((m = reComillas.exec(txt)) !== null) {
    var cand = String(m[1] || '').trim();
    if (cand.length >= 8 && !vistos[cand.toLowerCase()] && !/^(error|undefined|null|http|class|id|trimestre|sesiones|tecnologia)$/i.test(cand)) {
      vistos[cand.toLowerCase()] = true;
      resultados.push(cand);
    }
  }
  return resultados.slice(0, 4);
}

function aplicarTituloAlPlan(nuevoTitulo) {

function extraerSugerenciasPDA_(txt) {
  if (!txt || typeof txt !== 'string') return [];
  var resultados = [];
  var vistos = {};
  function sumar(cand) {
    var limpio = String(cand || '').replace(/\s+/g, ' ').replace(/^["«“]|["»”]$/g, '').trim();
    if (limpio.length < 12 || limpio.length > 320) return;
    var clave = limpio.toLowerCase();
    if (vistos[clave]) return;
    vistos[clave] = true;
    resultados.push(limpio);
  }
  var rePda = /(?:^|\n)\s*PDA\s*:\s*(.{12,320})/gi;
  var m;
  while ((m = rePda.exec(txt)) !== null) sumar(m[1]);
  if (!resultados.length) {
    String(txt).split('\n').forEach(function (linea) {
      var l = String(linea || '').replace(/^[\s•\-\*\d.)]+/, '').trim();
      if (/aprendizaje|compren|analiza|reconoce|elabora|identifica|propone|aplica|usa /i.test(l)) sumar(l);
    });
  }
  return resultados.slice(0, 4);
}

function insertarPdaAlPlan(texto) {
  var inp = nodo_('planPDA');

    avisar_('No se encontró el campo de PDA.', 'error');

  var limpio = String(texto || '').replace(/^[\s•\-\*]+/, '').trim();
  if (!limpio) return;
  var lineas = String(inp.value || '').split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
  var ya = lineas.some(function (l) { return l.indexOf(limpio) >= 0; });
  if (!ya) lineas.push('• ' + limpio);
  inp.value = lineas.join('\n');
  if (Array.isArray(window.pdasSeleccionadosNEM_) && window.pdasSeleccionadosNEM_.indexOf(limpio) < 0) {
    window.pdasSeleccionadosNEM_.push(limpio);

  if (typeof window._pintarSelectorPDANEM_ === 'function') {
    try { window._pintarSelectorPDANEM_((nodo_('buscarPDANEM') || {}).value || ''); } catch (e) {}
  }
  inp.dispatchEvent(new Event('input', { bubbles: true }));
  inp.dispatchEvent(new Event('change', { bubbles: true }));

  if (typeof window.guardarBorradorPlanNEM_ === 'function') window.guardarBorradorPlanNEM_();

      caja.appendChild(p);

  if (typeof gsRun !== 'function') {

    return Promise.resolve([]);

  if (caja) {
    vaciarNodo_(caja);

    caja.appendChild(carga);
  }
  return gsRun('listarRecursosBiblioteca', tk, filtros || leerFiltrosBiblioteca_()).then(function (r) {

    if (r && r.ok === false) {

        vaciarNodo_(caja);
        var err = document.createElement('p');
        err.textContent = String(r.mensaje || 'No pude cargar la biblioteca.');
        caja.appendChild(err);
      }
      return [];
    }
    var filas = filasRecursos_(r);
    pintarRecursosBiblioteca_(filas);
    return filas;
  }, function () {
    if (seq !== seqBiblioteca_) return [];
    if (caja) {
      vaciarNodo_(caja);
      var fallo = document.createElement('p');
      fallo.textContent = 'No pude cargar la biblioteca.';
      caja.appendChild(fallo);
    }
    return [];
  });

function enviarRecursoBiblioteca_() {
  var form = nodo_('formSubirRecursoBiblioteca');
  if (!form) return;
  var datos = {
    titulo: valorFormRecurso_(form, 'titulo'),
    tipo: valorFormRecurso_(form, 'tipo'),
    asignatura: valorFormRecurso_(form, 'asignatura'),
    grado: valorFormRecurso_(form, 'grado'),
    trimestre: valorFormRecurso_(form, 'trimestre'),
    url: valorFormRecurso_(form, 'url')
  };
  if (!datos.titulo || !datos.tipo || !datos.asignatura || !datos.grado || !datos.trimestre) {
    avisar_('Completa título, tipo, asignatura, grado y trimestre.', 'error');
    return;
  }
  if (datos.grado !== '1' && datos.grado !== '2' && datos.grado !== '3') {
    avisar_('El grado debe ser 1, 2 o 3.', 'error');
    return;
  }
  if (datos.trimestre !== '1' && datos.trimestre !== '2' && datos.trimestre !== '3') {
    avisar_('El trimestre debe ser 1, 2 o 3.', 'error');
    return;
  }
  var href = urlHttps_(datos.url);
  if (!href) {
    avisar_('La URL del recurso debe empezar con https://.', 'error');
    return;
  }
  datos.url = href;
  var tk = tokenLms_();
  if (!tk) {
    avisar_('Inicia sesión para compartir un recurso.', 'error');
    return;
  }
  if (typeof gsRun !== 'function') {
    avisar_('google.script.run no está disponible.', 'error');
    return;
  }
  gsRun('subirRecursoBiblioteca', tk, datos).then(function (r) {
    if (r && r.ok === false) {
      avisar_(String(r.mensaje || 'No se pudo guardar el recurso.'), 'error');
      return;
    }
    avisar_((r && r.mensaje) || 'Recurso compartido.', 'ok');
    form.reset();
    cerrarModalSubirRecurso_();
    cargarBibliotecaRecursos_(leerFiltrosBiblioteca_());
  }, function () {
    avisar_('No se pudo guardar el recurso.', 'error');
  });
}

  var i;
  for (i = 0; i < lineas.length; i++) {
    if (lineas[i].indexOf(MARCA_IFRAME_PREFIJO_) !== 0) continue;
    var titulo = lineas[i].slice(MARCA_IFRAME_PREFIJO_.length).trim();
    var j = i + 1;
    while (j < lineas.length && !String(lineas[j]).trim()) j++;
    var url = (j < lineas.length) ? urlIframePermitida_(lineas[j]) : '';
    if (url) out.push({ titulo: titulo || 'Contenido externo', url: url });
  }
  return out;
}

function pintarTarjetaIframe_(bloque) {
  var cont = nodo_('contenedorIDevicesDinamicos');
  if (!cont || !bloque) return null;
  var div = document.createElement('div');
  div.className = 'idevice-card idevice-container';
  div.setAttribute('data-tipo', 'iframe');
  div.setAttribute('data-url', bloque.url);
  var header = document.createElement('div');
  header.className = 'idevice-header';
  var tag = document.createElement('span');
  tag.className = 'idevice-tag';
  tag.textContent = 'Contenido externo';
  var quitar = document.createElement('button');
  quitar.type = 'button';
  quitar.className = 'idevice-btn';
  quitar.textContent = 'Quitar';
  quitar.setAttribute('aria-label', 'Quitar contenido externo');
  quitar.addEventListener('click', function () { quitarBloqueIframe_(bloque.url); });
  header.appendChild(tag);
  header.appendChild(quitar);
  var body = document.createElement('div');
  body.className = 'idevice-body';
  var titulo = document.createElement('input');
  titulo.type = 'text';
  titulo.className = 'idevice-campo-titulo';
  titulo.setAttribute('data-campo', 'titulo');
  titulo.value = bloque.titulo || '';
  titulo.setAttribute('aria-label', 'Título del bloque externo');
  titulo.readOnly = true;
  var marco = document.createElement('div');
  marco.className = 'bloque-iframe-container';
  var frame = document.createElement('iframe');
  frame.src = bloque.url;
  frame.title = bloque.titulo || 'Contenido externo';
  frame.loading = 'lazy';
  frame.setAttribute('referrerpolicy', 'no-referrer');
  frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-forms');
  marco.appendChild(frame);
  body.appendChild(titulo);
  body.appendChild(marco);
  div.appendChild(header);
  div.appendChild(body);
  cont.appendChild(div);
  return div;
}

function rehidratarBloquesIframeDesdeGuion_() {
  var cont = nodo_('contenedorIDevicesDinamicos');
  if (!cont) return;
  cont.querySelectorAll('[data-tipo="iframe"]').forEach(function (n) { n.remove(); });
  leerIframesDelGuion_().forEach(function (bloque) {
    pintarTarjetaIframe_(bloque);
  });
}

function anexarIframeAlGuion_(titulo, url) {
  var campo = nodo_('sesGuionEstudiante');
  if (!campo) return false;
  var limpio = String(titulo || 'Contenido externo').replace(/\s+/g, ' ').trim() || 'Contenido externo';
  var pieza = '\n\n' + MARCA_IFRAME_PREFIJO_ + limpio + '\n' + url;
  campo.value = String(campo.value || '').replace(/\s+$/, '') + pieza;
  if (typeof marcarIDevicesTocados_ === 'function') marcarIDevicesTocados_();
  return true;
}

function quitarBloqueIframe_(url) {
  var campo = nodo_('sesGuionEstudiante');
  if (!campo) return;
  var lineas = String(campo.value || '').split('\n');
  var out = [];
  var i;
  for (i = 0; i < lineas.length; i++) {
    if (lineas[i].indexOf(MARCA_IFRAME_PREFIJO_) === 0) {
      var j = i + 1;
      while (j < lineas.length && !String(lineas[j]).trim()) j++;
      if (j < lineas.length && String(lineas[j]).trim() === url) {
        i = j;
        continue;
      }
    }
    out.push(lineas[i]);
  }
  campo.value = out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  if (typeof marcarIDevicesTocados_ === 'function') marcarIDevicesTocados_();
  rehidratarBloquesIframeDesdeGuion_();
}

function insertarBloqueIframe_(urlIframe, titulo) {
  if (!urlIframe) {
    pedirUrlIframe_().then(function (datos) {
      if (!datos || !datos.url) return;
      insertarBloqueIframe_(datos.url, datos.titulo);
    });
    return;
  }
  var limpia = urlIframePermitida_(urlIframe);
  if (!limpia) {
    avisar_('Solo se aceptan enlaces https de Genially, H5P, Canva o Google Slides.', 'error');
    return;
  }
  var ya = leerIframesDelGuion_().some(function (b) { return b.url === limpia; });
  if (ya) {
    avisar_('Ese enlace ya está en la sesión.', 'info');
    return;
  }
  if (!nodo_('contenedorIDevicesDinamicos') || !nodo_('sesGuionEstudiante')) {
    avisar_('Abre una sesión del proyecto para insertar el bloque.', 'error');
    return;
  }
  anexarIframeAlGuion_(titulo, limpia);
  rehidratarBloquesIframeDesdeGuion_();
  avisar_('Bloque externo insertado en la sesión.', 'ok');
}

function pedirUrlIframe_() {
  if (typeof modal !== 'function') {
    avisar_('No pude abrir el formulario del enlace.', 'error');
    return Promise.resolve(null);
  }
  return modal({
    titulo: 'Bloque externo',
    html: '<p>Pega un enlace https de Genially, H5P, Canva o Google Slides.</p>' +
      '<label>Título<input id="st90-iframe-titulo" type="text"></label>' +
      '<label>URL<input id="st90-iframe-url" type="url"></label>',
    botones: [
      { texto: 'Cancelar', valor: null, clase: 'btn-secundario' },
      { texto: 'Insertar', valor: 'ok' }
    ],
    capturar: function (fondo, val) {
      if (val === null) return null;
      var t = fondo.querySelector('#st90-iframe-titulo');
      var u = fondo.querySelector('#st90-iframe-url');
      return {
        titulo: t ? t.value : '',
        url: u ? u.value : ''
      };
    }
  });
}

function clicLmsSt90_(e) {
  // 1. Clic en botón de voz individual de campo (🔊)
  var vozCampo = e.target && e.target.closest ? e.target.closest('.btn-voz-nem') : null;
  if (vozCampo) {
    e.preventDefault();
    if (e.stopPropagation) e.stopPropagation();
    var claveVoz = vozCampo.getAttribute('data-voz-campo');
    var datosVoz = entradaAyuda_(claveVoz);
    if (!datosVoz) {
      avisar_('No hay orientación grabada para este campo.', 'info');
      return;
    }
    var textoNarrar = 'Orientación para ' + (datosVoz.titulo || 'este campo') + '. ' +
      'Propósito formativo: ' + (datosVoz.proposito || '') + '. ' +
      'Cómo llenarlo en el aula: ' + (datosVoz.comoLlenar || '') + '. ' +
      (datosVoz.ejemplo ? ('Ejemplo viable: ' + datosVoz.ejemplo) : '');
    narrarTextoNEM_(textoNarrar, vozCampo);
    return;
  }

  // 2. Clic en botón de narración dentro del modal de ayuda pedagógica
  var btnNarrarModal = e.target && e.target.closest ? e.target.closest('#btnNarrarModalAyuda') : null;
  if (btnNarrarModal) {
    e.preventDefault();
    var titM = (nodo_('modalAyudaTitulo') || {}).textContent || '';
    var proM = (nodo_('modalAyudaProposito') || {}).textContent || '';
    var comM = (nodo_('modalAyudaComoLlenar') || {}).textContent || '';
    var ejeM = (nodo_('modalAyudaEjemplo') || {}).textContent || '';
    var guionModal = 'Ayuda pedagógica NEM: ' + titM + '. ' +
      (proM ? ('Propósito formativo: ' + proM + '. ') : '') +
      (comM ? ('Cómo llenarlo: ' + comM + '. ') : '') +
      (ejeM ? ('Ejemplo viable: ' + ejeM) : '');
    narrarTextoNEM_(guionModal, btnNarrarModal);
    return;
  }

  // 3. Clic en botón de narrar burbuja de respuesta del Asistente IA
  var btnVozIa = e.target && e.target.closest ? e.target.closest('.btn-voz-ia-msg') : null;
  if (btnVozIa) {
    e.preventDefault();
    var contBurbuja = btnVozIa.closest('.msg-ia');
    if (contBurbuja) {
      var clon = contBurbuja.cloneNode(true);
      var btnInside = clon.querySelector('.btn-voz-ia-msg');
      if (btnInside && btnInside.parentNode) btnInside.parentNode.removeChild(btnInside);
      narrarTextoNEM_(clon.textContent, btnVozIa);
    }
    return;
  }

  // 4. Clic en botón de micrófono (dictado por voz en el asistente IA)
  if (e.target && (e.target.id === 'btnMicrofonoIA' || (e.target.closest && e.target.closest('#btnMicrofonoIA')))) {
    e.preventDefault();
    conmutarDictadoPorVozIA_();
    return;
  }

  // 5. Clic en chip interactivo para aplicar título sugerido por la IA
  var btnAplicarTit = e.target && e.target.closest ? e.target.closest('[data-aplicar-titulo]') : null;
  if (btnAplicarTit) {
    e.preventDefault();
    var tVal = btnAplicarTit.getAttribute('data-aplicar-titulo');
    aplicarTituloAlPlan(tVal);
    return;
  }

  var btnInsertarPda = e.target && e.target.closest ? e.target.closest('[data-insertar-pda]') : null;
  if (btnInsertarPda) {
    e.preventDefault();
    insertarPdaAlPlan(btnInsertarPda.getAttribute('data-insertar-pda'));
    return;
  }

  var btnSugPda = e.target && e.target.closest ? e.target.closest('#btnSugerirPdaIA') : null;
  if (btnSugPda) {
    e.preventDefault();
    solicitarPdaAdaptadoIA_();
    return;
  }

  // 6. Clic en botón "✨ Sugerir con IA" en la cabecera del campo Título
  var btnSugTit = e.target && e.target.closest ? e.target.closest('#btnSugerirTituloIA, [data-accion="sugerir-titulo-ia"], .btn-ia-sugerir-titulo') : null;
  if (btnSugTit) {
    e.preventDefault();
    conmutarDrawerAsistente_(true);
    var metaTit = obtenerMetadatosClaseActiva_();
    var prmTit = 'Sugiere 3 títulos atractivos, motivadores y con enfoque pedagógico NEM para un proyecto de ' +
      metaTit.asignatura + ' ' + metaTit.grado + '° (Trimestre ' + metaTit.trimestre + '). ' +
      'Por favor escribe cada propuesta entre comillas "..." con mayúsculas iniciales para poder aplicarla directamente al formulario.';
    enviarMensajeAsistente_(prmTit);
    return;
  }

  var ayuda = e.target && e.target.closest ? e.target.closest('.btn-ayuda-nem') : null;
  if (ayuda) {
    e.preventDefault();
    if (e.stopPropagation) e.stopPropagation();
    ultimoDisparadorAyuda_ = ayuda;
    var clave = ayuda.getAttribute('data-ayuda-campo');
    var datos = entradaAyuda_(clave);
    if (!datos) {
      avisar_('No hay ayuda para este campo.', 'info');
      return;
    }
    abrirAyudaPedagogica(datos);
    return;
  }
  if (e.target && e.target.closest && e.target.closest('[data-cerrar-ayuda-nem]')) {
    e.preventDefault();
    cerrarAyudaPedagogica_();
    return;
  }
  if (e.target && (e.target.id === 'btnAsistenteFlotanteIA' || (e.target.closest && e.target.closest('#btnAsistenteFlotanteIA')))) {
    e.preventDefault();
    conmutarDrawerAsistente_();

  }
  if (e.target && (e.target.id === 'btnCerrarDrawerIA' || (e.target.closest && e.target.closest('[data-cerrar-drawer-ia]')) || e.target.id === 'iaDrawerVelo')) {
    e.preventDefault();
    conmutarDrawerAsistente_(false);
    return;
  }
  if (e.target && (e.target.id === 'btnEnviarAsistenteIA' || (e.target.closest && e.target.closest('#btnEnviarAsistenteIA')))) {
    e.preventDefault();
    enviarMensajeAsistente_();
    return;
  }
  var sug = e.target && e.target.closest ? e.target.closest('[data-sugerencia-ia]') : null;
  if (sug) {
    e.preventDefault();
    enviarMensajeAsistente_(sug.getAttribute('data-sugerencia-ia'));
    return;
  }
  var subir = e.target && e.target.closest ? e.target.closest('[data-accion="abrir-subir-recurso"]') : null;
  if (subir) {
    e.preventDefault();
    abrirModalSubirRecurso_();
    return;
  }
  if (e.target && e.target.closest && e.target.closest('[data-cerrar-subir]')) {
    e.preventDefault();
    cerrarModalSubirRecurso_();
    return;
  }
  if (e.target && e.target.id === 'btnPreviewAlumno') {
    e.preventDefault();
    abrirVistaPreviaAlumno_();
    return;
  }
  if (e.target && e.target.closest && e.target.closest('[data-cerrar-preview]')) {
    e.preventDefault();
    cerrarVistaPreviaAlumno_();
  }
}

function generarCriteriosDesdePDANIA() {
  var pdas = _lineasFuenteCotejo_('planPDA');

    return;
  }
  var criterios = [];
  if (pdas[0]) criterios.push('Identifica y aplica el PDA: ' + pdas[0].slice(0, 140));
  if (pdas[1]) criterios.push('Desarrolla el proceso: ' + pdas[1].slice(0, 140));

  if (propositos[0]) criterios.push('Aporta al producto del proyecto: ' + propositos[0].slice(0, 140));
  criterios.push('Colabora con respeto e inclusión, usando los ajustes razonables del grupo (DUA).');
  window.criteriosCotejoPlanNEM_ = criterios.filter(Boolean).slice(0, 5);
  while (window.criteriosCotejoPlanNEM_.length < 3) {
    window.criteriosCotejoPlanNEM_.push('Entrega la evidencia de la sesión con orden, reflexión y lenguaje claro.');

function cargarResumenEncuestaiDevice_(selectEl) {
  if (!selectEl) return;
  var card = selectEl.closest('.idevice-bloque') || selectEl.closest('.idevice-card');
  if (!card) return;
  var id = selectEl.value;
  var items = window._catalogoEncuestasIDevice_ || [];
  var item = null;
  for (var i = 0; i < items.length; i++) {
    if (String(items[i].id || items[i].hojaId || '') === String(id)) { item = items[i]; break; }
  }
  var resumen = card.querySelector('.txt-resumen-encuesta');
  if (resumen && item && item.resumen && !resumen.value) resumen.value = item.resumen;
  var titulo = card.querySelector('[data-campo="titulo"], .idevice-campo-titulo');
  if (titulo && item && !titulo.value) titulo.value = item.nombre || item.titulo || '';
}

function serializarEncuestaIDevice_(card) {
  var modo = (card.querySelector('.sel-modo-encuesta-idevice') || {}).value || 'datos_previos';
  return JSON.stringify({
    modo: modo,
    idEncuesta: (card.querySelector('.sel-catalogo-encuesta-id') || {}).value || '',
    resumen: (card.querySelector('.txt-resumen-encuesta') || {}).value || '',
    incluirGraficas: !!((card.querySelector('.chk-incluir-graficas') || {}).checked),
    ponderacion: Number((card.querySelector('.inp-ponderacion-encuesta') || {}).value || 10),
    registro: (card.querySelector('.sel-registro-modo') || {}).value || 'matricula'
  });
}

function leerTodosLosiDevicesDeSesion_() {
  var cont = document.getElementById('contenedorIDevicesDinamicos');
  if (!cont) return [];
  var salida = [];
  cont.querySelectorAll('.idevice-card, .idevice-bloque').forEach(function (card) {
    if (salida.indexOf(card) >= 0) return;
    var tipo = card.getAttribute('data-tipo') || '';
    var titulo = ((card.querySelector('[data-campo="titulo"], .idevice-campo-titulo') || {}).value || '');
    if (tipo === 'encuesta') {
      var datos = {};
      try { datos = JSON.parse(serializarEncuestaIDevice_(card)); } catch (e) { datos = {}; }
      datos.tipo = 'encuesta';
      datos.titulo = titulo;
      salida.push(datos);
      return;
    }
    salida.push({
      tipo: tipo,
      titulo: titulo,
      cuerpo: ((card.querySelector('[data-campo="cuerpo"], .idevice-campo-cuerpo') || {}).value || '')
    });
  });
  return salida;
}

function conmutarModoConstructor(modo) {
  var quiz = modo === 'quiz';
  var btnE = document.getElementById('btnModoEncuesta');
  var btnQ = document.getElementById('btnModoQuiz');
  if (btnE) { btnE.classList.toggle('activo', !quiz); btnE.setAttribute('aria-selected', quiz ? 'false' : 'true'); }
  if (btnQ) { btnQ.classList.toggle('activo', quiz); btnQ.setAttribute('aria-selected', quiz ? 'true' : 'false'); }
  var barra = document.getElementById('barraConfigQuizGlobal');
  if (barra) barra.classList.toggle('d-none', !quiz);
  document.querySelectorAll('.caja-ajustes-quiz').forEach(function (caja) {
    caja.classList.toggle('d-none', !quiz);
  });
  if (typeof FORM !== 'undefined' && FORM) {
    FORM.config = FORM.config || {};
    FORM.config.tipoFormulario = quiz ? 'quiz' : 'encuesta';
  }
  if (quiz) recalcularPuntosTotalesQuiz();
}

function recalcularPuntosTotalesQuiz() {
  var total = 0;
  document.querySelectorAll('.quiz-puntos-input').forEach(function (inp) {
    if (inp.closest('.d-none')) return;
    total += Number(inp.value) || 0;
  });
  var lbl = document.getElementById('lblPuntosTotalesQuiz');
  if (lbl) lbl.textContent = String(total);
  if (typeof FORM !== 'undefined' && FORM && FORM.config) FORM.config.puntosTotales = String(total);
  return total;
}

function sincronizarAjustesQuiz_(indice, campo, valor) {
  if (typeof FORM === 'undefined' || !FORM || !FORM.preguntas || !FORM.preguntas[indice]) return;
  var extra = FORM.preguntas[indice].extra || (FORM.preguntas[indice].extra = {});
  extra.esQuiz = true;
  if (campo === 'puntos') extra.puntos = Number(valor) || 0;
  if (campo === 'respuestaCorrecta') extra.respuestaCorrecta = valor;
  if (campo === 'retroalimentacion') extra.retroalimentacion = valor;
  recalcularPuntosTotalesQuiz();
}

function barajarFisherYates_(lista) {
  var arr = (lista || []).slice();
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i];
    arr[i] = arr[j];
    arr[j] = tmp;
  }
  return arr;
}

function iniciarTemporizadorQuiz_(minutos) {
  var barra = document.getElementById('barraTemporizadorQuiz');
  var mins = Number(minutos) || 0;
  if (!barra || mins <= 0) return;
  var clave = 'st90_quiz_fin_' + ((FORM && FORM.config && FORM.config.titulo) || 'form');
  var fin = Number(sessionStorage.getItem(clave) || 0);
  if (!fin || fin < Date.now()) {
    fin = Date.now() + mins * 60000;
    sessionStorage.setItem(clave, String(fin));
  }
  function pintar() {
    var resta = Math.max(0, fin - Date.now());
    var seg = Math.ceil(resta / 1000);
    var mm = String(Math.floor(seg / 60)).padStart(2, '0');
    var ss = String(seg % 60).padStart(2, '0');
    var etiqueta = barra.querySelector('.tiempo-restante');
    if (etiqueta) etiqueta.textContent = mm + ':' + ss;
    barra.classList.toggle('alerta', seg <= 120 && seg > 30);
    barra.classList.toggle('critico', seg <= 30);
    barra.setAttribute('data-estado', seg <= 30 ? 'critico' : (seg <= 120 ? 'alerta' : 'ok'));
    if (resta <= 0) {
      clearInterval(barra._reloj);
      sessionStorage.removeItem(clave);
      var form = document.getElementById('formDinamico');
      if (form && typeof enviar === 'function') enviar({ preventDefault: function () {} });
    }
  }
  pintar();
  clearInterval(barra._reloj);
  barra._reloj = setInterval(pintar, 1000);
}

function abrirVistaPreviaPDFPlaneacionNEM(idPlanOModo) {
  if (idPlanOModo === 'formulario') {
    var pForm = _leerPlaneacionDesdeFormularioActual_();
    _mostrarModalPlanoDidacticoNL_(pForm, (typeof sesionesActualesNEM !== 'undefined' ? sesionesActualesNEM : []));
    return;
  }
  var idPlan = String(idPlanOModo || (typeof planActualNEM !== 'undefined' && planActualNEM && (planActualNEM.Id || planActualNEM.id)) || '').trim();
  var enMem = (typeof listaPlanNEM !== 'undefined' && Array.isArray(listaPlanNEM))
    ? listaPlanNEM.find(function (x) { return String(x.Id || x.id || '').trim() === idPlan; })
    : null;
  if (!enMem && typeof planActualNEM !== 'undefined' && planActualNEM && String(planActualNEM.Id || planActualNEM.id || '').trim() === idPlan) {
    enMem = planActualNEM;
  }
  var tk = (typeof getTokenPlan_ === 'function') ? getTokenPlan_() : ((typeof tokenClase !== 'undefined' && tokenClase) ? tokenClase : ((typeof window !== 'undefined' && (window.tokenClase || window.token)) || ''));
  if (!idPlan) {
    _mostrarModalPlanoDidacticoNL_(_leerPlaneacionDesdeFormularioActual_(), []);
    return;
  }
  if (typeof toast === 'function') toast('Preparando Plano Didáctico Oficial en formato PDF…', 'info');
  if (typeof gsRun === 'function') {
    gsRun('obtenerPlaneacionCompletaNEM', tk, idPlan).then(function (res) {
      var pObj = (res && res.planeacion) || enMem;
      var sesArr = (res && res.sesiones) || [];
      if (!pObj) {
        if (typeof toast === 'function') toast('No se encontró la planeación solicitada.', 'error');
        return;
      }
      _mostrarModalPlanoDidacticoNL_(pObj, sesArr);
    }).catch(function () {
      if (enMem) {
        _mostrarModalPlanoDidacticoNL_(enMem, (typeof sesionesActualesNEM !== 'undefined' ? sesionesActualesNEM : []));
      } else if (typeof toast === 'function') {
        toast('No se pudo cargar la planeación para PDF.', 'error');
      }
    });
  } else if (enMem) {
    _mostrarModalPlanoDidacticoNL_(enMem, []);
  }
}
