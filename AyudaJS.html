  try {
    var u = new URL(t);
    if (u.protocol !== 'https:') return '';
    if (u.username || u.password) return '';
    return u.href;
  } catch (e) {
    return '';
  }
}

  var h5p = hostEs_(h, 'h5p.com') || hostEs_(h, 'h5p.org');
  var canva = hostEs_(h, 'canva.com');
  var slides = h === 'docs.google.com' && u.pathname.indexOf('/presentation/') >= 0;
  if (!(genial || h5p || canva || slides)) return '';
  return u.href;
}

function elegirVozFemeninaEspanol_() {
  if (typeof window === 'undefined' || !window.speechSynthesis) return null;
  var voces = window.speechSynthesis.getVoices() || [];
  if (!voces.length) return null;

  var mejorVoz = null;
  var mejorPuntaje = -999;

  for (var i = 0; i < voces.length; i++) {
    var v = voces[i];
    var lang = String(v.lang || '').toLowerCase().replace('_', '-');
    if (lang.indexOf('es') !== 0) continue;

    var nombre = String(v.name || '') + ' ' + String(v.voiceURI || '');
    var nLow = nombre.toLowerCase();
    var pts = 0;

    // Prioridad geográfica (México / Latinoamérica / Español general)
    if (lang === 'es-mx') pts += 40;
    else if (lang === 'es-us' || lang === 'es-419' || lang === 'es-co' || lang === 'es-ar' || lang === 'es-cl') pts += 28;
    else if (lang.indexOf('es') === 0) pts += 18;

    // Nombres de voces femeninas en Windows, Edge, Chrome, macOS, iOS y Android (Sabina, Dalia, Paulina, Helena, etc.)
    if (/\b(sabina|dalia|paulina|helena|laura|monica|mónica|paola|francisca|paloma|elvira|larissa|camila|lupe|penelope|penélope|mia|mía|sofia|sofía|lucia|lucía|jimena|carmen|isabela|marisol|femenin|female|mujer|woman)\b/i.test(nLow)) {
      pts += 100;
    }
    if (/natural|neural|online/i.test(nLow)) {
      pts += 25;
    }
    if (/google\s+espa/i.test(nLow) && !/male|hombre|masculin/i.test(nLow)) {
      pts += 45;
    }

    // Penalizar voces masculinas conocidas (Raúl, Jorge, Álvaro, Pablo, Diego, Carlos, etc.)
    if (/\b(raul|raúl|jorge|alvaro|álvaro|pablo|diego|carlos|miguel|andres|andrés|alonso|enrique|tomas|tomás|juan|male|hombre|masculin)\b/i.test(nLow)) {
      pts -= 150;
    }

    if (pts > mejorPuntaje) {
      mejorPuntaje = pts;
      mejorVoz = v;
    }
  }
  return mejorVoz;
}
window.elegirVozFemeninaEspanol_ = elegirVozFemeninaEspanol_;

if (typeof window !== 'undefined' && window.speechSynthesis) {
  try {
    window.speechSynthesis.getVoices();
    if (typeof window.speechSynthesis.onvoiceschanged !== 'undefined') {
      window.speechSynthesis.addEventListener('voiceschanged', function () {
        try { window.speechSynthesis.getVoices(); } catch (e) {}
      });
    }
  } catch (e) {}
}

function narrarTextoNEM_(texto, btnIndicador, alTerminar) {
  if (typeof window === 'undefined' || !window.speechSynthesis) {
    avisar_('Tu navegador no soporta síntesis de voz.', 'info');
    return;
  }
  var yaEstabaReproduciendoEste = (btnReproduciendoActivo_ && btnReproduciendoActivo_ === btnIndicador);
  detenerVozNEM_();
  if (yaEstabaReproduciendoEste) return;

  var textoLimpio = String(texto || '')
    .replace(/[*#_`~>•]/g, ' ')
    .replace(/https?:\/\/\S+/g, 'enlace')
    .replace(/\s+/g, ' ')
    .trim();

  if (!textoLimpio) return;

  var utter = new SpeechSynthesisUtterance(textoLimpio);
  utter.lang = 'es-MX';
  utter.rate = 1.0;
  utter.pitch = 1.08;

  var vozEs = elegirVozFemeninaEspanol_();
  if (vozEs) {
    utter.voice = vozEs;
    if (vozEs.lang) utter.lang = vozEs.lang;
  }

  if (btnIndicador) {
    marcarBtnVozReproduciendo_(btnIndicador);
    btnReproduciendoActivo_ = btnIndicador;
  }

  utter.onend = function () {
    if (btnIndicador) restaurarBtnVoz_(btnIndicador);
    if (btnReproduciendoActivo_ === btnIndicador) btnReproduciendoActivo_ = null;
    if (typeof alTerminar === 'function') alTerminar();
  };
  utter.onerror = function () {
    if (btnIndicador) restaurarBtnVoz_(btnIndicador);
    if (btnReproduciendoActivo_ === btnIndicador) btnReproduciendoActivo_ = null;
  };

  window.speechSynthesis.speak(utter);
}

function conmutarDictadoPorVozIA_() {
  var SpeechRec = (typeof window !== 'undefined') ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;
  if (!SpeechRec) {
    avisar_('El dictado por voz requiere Google Chrome, Edge o un navegador compatible con Web Speech API.', 'info');
    return;
  }
  var btn = nodo_('btnMicrofonoIA');
  var campo = nodo_('txtMensajeAsistente');
  if (!campo) return;

  if (escuchandoVoz_ && reconocimientoVoz_) {
    try { reconocimientoVoz_.stop(); } catch (e) {}
    escuchandoVoz_ = false;
    if (btn) {
      btn.classList.remove('escuchando');
      btn.textContent = '🎙️';
      btn.title = 'Dictar por voz';
    }
    return;
  }

  try {
    reconocimientoVoz_ = new SpeechRec();
    reconocimientoVoz_.lang = 'es-MX';
    reconocimientoVoz_.continuous = false;
    reconocimientoVoz_.interimResults = true;

    reconocimientoVoz_.onstart = function () {
      escuchandoVoz_ = true;
      if (btn) {
        btn.classList.add('escuchando');
        btn.textContent = '🔴';
        btn.title = 'Escuchando... haz clic para detener';
      }
    };

    reconocimientoVoz_.onresult = function (ev) {
      var transcript = '';
      for (var i = ev.resultIndex; i < ev.results.length; ++i) {
        transcript += ev.results[i][0].transcript;
      }
      campo.value = transcript;
    };

    reconocimientoVoz_.onerror = function () {
      escuchandoVoz_ = false;
      if (btn) {
        btn.classList.remove('escuchando');
        btn.textContent = '🎙️';
        btn.title = 'Dictar por voz';
      }
    };

    reconocimientoVoz_.onend = function () {
      escuchandoVoz_ = false;
      if (btn) {
        btn.classList.remove('escuchando');
        btn.textContent = '🎙️';
        btn.title = 'Dictar por voz';
      }
      if (campo && campo.value.trim()) {
        campo.focus();
      }
    };

    reconocimientoVoz_.start();
  } catch (err) {
    escuchandoVoz_ = false;
    if (btn) {
      btn.classList.remove('escuchando');
      btn.textContent = '🎙️';
    }
    avisar_('No se pudo activar el micrófono: ' + err.message, 'error');
  }
}

function calcularTrimestreSEP_Local(fechaStr) {
  var s = String(fechaStr || '').trim();
  var mes = 0;
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
    mes = parseInt(s.substring(5, 7), 10);
  } else if (s) {
    var d = new Date(s.indexOf('T') === -1 ? (s + 'T12:00:00') : s);
    if (!isNaN(d.getTime())) mes = d.getMonth() + 1;
  }
  if (!mes) {
    var hoy = new Date();
    mes = hoy.getMonth() + 1;
  }
  // Calendario Oficial SEP:
  // Trimestre 1: Agosto (8) a Noviembre (11)
  // Trimestre 2: Diciembre (12) a Marzo (3)
  // Trimestre 3: Abril (4) a Julio (7)
  if (mes >= 8 && mes <= 11) {
    return { num: 1, texto: 'Trimestre 1 (Ago - Nov)' };
  } else if (mes === 12 || (mes >= 1 && mes <= 3)) {
    return { num: 2, texto: 'Trimestre 2 (Dic - Mar)' };
  } else {
    return { num: 3, texto: 'Trimestre 3 (Abr - Jul)' };
  }
}

function obtenerMetadatosClaseActiva_() {
  function v(id) {
    var el = nodo_(id);
    return el ? String(el.value || '').trim() : '';
  }

  var asig = v('planAsignatura');
  var grado = v('planGrado') || '1';
  var grupo = v('planGrupo') || 'A';
  var campo = v('planCampoFormativo') || 'Ética, Naturaleza y Sociedades';
  var metodo = v('planMetodologia') || '';
  var titulo = v('planTitulo') || '';
  var contenido = v('planContenidoSintetico') || v('selContenidoSinteticoNEM');
  var pda = v('planPDA');
  var problema = v('planProblema');

  // Detectar fecha desde formulario o banner superior
  var fecha = v('planFechaInicio');
  if (!fecha) {
    var feEl = nodo_('txtEncabezadoFecha');
    if (feEl && feEl.textContent && /\d{4}-\d{2}-\d{2}/.test(feEl.textContent)) {
      fecha = feEl.textContent.trim();
    }
  }

  // Detectar o calcular Periodo y Trimestre según Calendario SEP
  var periodo = v('planPeriodo');
  if (!periodo) {
    var perEl = nodo_('txtEncabezadoPeriodo');
    if (perEl && perEl.textContent && /trimestre/i.test(perEl.textContent)) {
      periodo = perEl.textContent.trim();
    }
  }

  var triInfo = calcularTrimestreSEP_Local(fecha);
  var numTrimestre = triInfo.num;
  if (!periodo) {
    periodo = triInfo.texto;
  } else {
    var matchTri = periodo.match(/([123])/);
    if (matchTri) numTrimestre = parseInt(matchTri[1], 10);
  }

  // Si planAsignatura está vacío o no es específico, inspeccionar el banner oficial
  if (!asig || asig.length < 2) {
    var enc = nodo_('txtEncabezadoMateriaGrupo') || nodo_('txtClaseSeleccionada');
    var txtEnc = enc ? enc.textContent.trim() : '';
    if (txtEnc) {
      var partes = txtEnc.split(/[-·•]/);
      if (partes.length > 0 && partes[0].trim()) {
        asig = partes[0].trim();
      }
      var matchG = txtEnc.match(/([123])\s*[°oº]?\s*([A-Fa-f])/);
      if (matchG) {
        if (!v('planGrado')) grado = matchG[1];
        if (!v('planGrupo')) grupo = matchG[2].toUpperCase();
      }
    }
  }

  // Inferir del título si la asignatura aún no está fija
  if ((!asig || asig.length < 2) && titulo) {
    var partesTit = titulo.split(/[-·•(]/);
    if (partesTit.length > 0 && partesTit[0].trim()) {
      asig = partesTit[0].trim();
    }
  }

  return {
    asignatura: asig || 'General',
    grado: grado,
    grupo: grupo,
    campoFormativo: campo,
    metodologia: metodo,
    titulo: titulo,
    fecha: fecha,
    periodo: periodo,
    trimestre: numTrimestre,
    contenido: contenido,
    pda: pda,
    problema: problema,
    paso: pasoPlanVisible_(),
    pasoNombre: CONTEXTO_POR_PASO_[pasoPlanVisible_()] || 'Metadatos y ejes'
  };
}

}

function extraerSugerenciasTitulos_(txt) {
  if (!txt || typeof txt !== 'string') return [];
  var resultados = [];
  var vistos = {};
  var reComillas = /["«“]([^"»”\n]{8,90})["»”]/g;
  var m;
  while ((m = reComillas.exec(txt)) !== null) {
    var cand = String(m[1] || '').trim();
    if (cand.length >= 8 && !vistos[cand.toLowerCase()] && !/^(error|undefined|null|http|class|id|trimestre|sesiones|tecnologia)$/i.test(cand)) {
      vistos[cand.toLowerCase()] = true;
      resultados.push(cand);
    }
  }
  return resultados.slice(0, 4);
}

function aplicarTituloAlPlan(nuevoTitulo) {

function extraerSugerenciasPDA_(txt) {
  if (!txt || typeof txt !== 'string') return [];
  var resultados = [];
  var vistos = {};
  function sumar(cand) {
    var limpio = String(cand || '').replace(/\s+/g, ' ').replace(/^["«“]|["»”]$/g, '').trim();
    if (limpio.length < 12 || limpio.length > 320) return;
    var clave = limpio.toLowerCase();
    if (vistos[clave]) return;
    vistos[clave] = true;
    resultados.push(limpio);
  }
  var rePda = /(?:^|\n)\s*PDA\s*:\s*(.{12,320})/gi;
  var m;
  while ((m = rePda.exec(txt)) !== null) sumar(m[1]);
  if (!resultados.length) {
    String(txt).split('\n').forEach(function (linea) {
      var l = String(linea || '').replace(/^[\s•\-\*\d.)]+/, '').trim();
      if (/aprendizaje|compren|analiza|reconoce|elabora|identifica|propone|aplica|usa /i.test(l)) sumar(l);
    });
  }
  return resultados.slice(0, 4);
}

function insertarPdaAlPlan(texto) {
  var inp = nodo_('planPDA');

    avisar_('No se encontró el campo de PDA.', 'error');

  var limpio = String(texto || '').replace(/^[\s•\-\*]+/, '').trim();
  if (!limpio) return;
  var lineas = String(inp.value || '').split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
  var ya = lineas.some(function (l) { return l.indexOf(limpio) >= 0; });
  if (!ya) lineas.push('• ' + limpio);
  inp.value = lineas.join('\n');
  if (Array.isArray(window.pdasSeleccionadosNEM_) && window.pdasSeleccionadosNEM_.indexOf(limpio) < 0) {
    window.pdasSeleccionadosNEM_.push(limpio);

  if (typeof window._pintarSelectorPDANEM_ === 'function') {
    try { window._pintarSelectorPDANEM_((nodo_('buscarPDANEM') || {}).value || ''); } catch (e) {}
  }
  inp.dispatchEvent(new Event('input', { bubbles: true }));
  inp.dispatchEvent(new Event('change', { bubbles: true }));
  if (typeof window.evaluarProgresoStepperPlan_ === 'function') window.evaluarProgresoStepperPlan_();
  if (typeof window.guardarBorradorPlanNEM_ === 'function') window.guardarBorradorPlanNEM_();

  var texto = String(textoForzado != null ? textoForzado : ((campo && campo.value) || '')).trim();
  if (!texto || enviandoAsistente_) return;
  var tk = tokenLms_();
  if (!tk) {
    avisar_('Inicia sesión para consultar al asistente.', 'error');
    return;
  }
  if (typeof gsRun !== 'function') {
    avisar_('google.script.run no está disponible.', 'error');
    return;
  }

  // Recopilar metadatos de la clase activa con trimestre y fecha oficial SEP
  var meta = obtenerMetadatosClaseActiva_();
  var payloadContexto = JSON.stringify({
    asignatura: meta.asignatura,
    grado: meta.grado,
    grupo: meta.grupo,
    campoFormativo: meta.campoFormativo,
    metodologia: meta.metodologia,
    tituloProyecto: meta.titulo,
    fecha: meta.fecha,
    periodo: meta.periodo,
    trimestre: meta.trimestre,
    contenidoSintetico: meta.contenido,
    pda: meta.pda,
    problema: meta.problema,
    pasoActual: meta.paso,
    pasoNombre: meta.pasoNombre,
    seccionVisible: contextoSeccionActiva
  });

  asegurarDrawerAsistente_();
  pintarBurbuja_('msg-docente', texto);
  if (campo) campo.value = '';
  enviandoAsistente_ = true;
  var btn = nodo_('btnEnviarAsistenteIA');
  if (btn) btn.disabled = true;
  var espera = pintarBurbuja_('msg-ia', '⏳ Analizando los planes SEP para ' + meta.asignatura + ' ' + meta.grado + '° (T' + meta.trimestre + ')…');
  gsRun('consultarAsistenteIAPaso', tk, payloadContexto, texto).then(function (r) {
    if (espera && espera.parentNode) espera.parentNode.removeChild(espera);
    if (r && r.ok === false) {
      pintarBurbuja_('msg-ia', String(r.mensaje || r.error || 'El asistente no pudo responder.'));
      return;
    }
    var resp = textoRespuestaIA_(r);
    pintarBurbuja_('msg-ia', resp || 'El asistente no devolvió texto.');
  }, function () {
    if (espera && espera.parentNode) espera.parentNode.removeChild(espera);
    pintarBurbuja_('msg-ia', 'No pude consultar al asistente. Revisa la conexión e inténtalo de nuevo.');
  }).then(function () {
    enviandoAsistente_ = false;
    if (btn) btn.disabled = false;
  });
}

function cargarBibliotecaRecursos_(filtros) {
  asegurarBiblioteca_();
  var caja = nodo_('contenedorRecursosBiblioteca');
  var seq = ++seqBiblioteca_;
  var tk = tokenLms_();
  if (!tk) {
    if (caja) {
      vaciarNodo_(caja);
      var p = document.createElement('p');
      p.textContent = 'Inicia sesión para ver la biblioteca.';
      caja.appendChild(p);
    }
    return Promise.resolve([]);
  }
  if (typeof gsRun !== 'function') {
    avisar_('google.script.run no está disponible.', 'error');
    return Promise.resolve([]);
  }
  if (caja) {
    vaciarNodo_(caja);
    var carga = document.createElement('p');
    carga.textContent = 'Cargando recursos…';
    caja.appendChild(carga);
  }
  return gsRun('listarRecursosBiblioteca', tk, filtros || leerFiltrosBiblioteca_()).then(function (r) {
    if (seq !== seqBiblioteca_) return [];
    if (r && r.ok === false) {
      if (caja) {
        vaciarNodo_(caja);
        var err = document.createElement('p');
        err.textContent = String(r.mensaje || 'No pude cargar la biblioteca.');
        caja.appendChild(err);
      }
      return [];
    }
    var filas = filasRecursos_(r);
    pintarRecursosBiblioteca_(filas);
    return filas;
  }, function () {
    if (seq !== seqBiblioteca_) return [];
    if (caja) {
      vaciarNodo_(caja);
      var fallo = document.createElement('p');
      fallo.textContent = 'No pude cargar la biblioteca.';
      caja.appendChild(fallo);
    }
    return [];
  });
}

function programarCargaBiblioteca_() {

  ]);

function enviarRecursoBiblioteca_() {
  var form = nodo_('formSubirRecursoBiblioteca');
  if (!form) return;
  var datos = {
    titulo: valorFormRecurso_(form, 'titulo'),
    tipo: valorFormRecurso_(form, 'tipo'),
    asignatura: valorFormRecurso_(form, 'asignatura'),
    grado: valorFormRecurso_(form, 'grado'),
    trimestre: valorFormRecurso_(form, 'trimestre'),
    url: valorFormRecurso_(form, 'url')
  };
  if (!datos.titulo || !datos.tipo || !datos.asignatura || !datos.grado || !datos.trimestre) {
    avisar_('Completa título, tipo, asignatura, grado y trimestre.', 'error');
    return;
  }
  if (datos.grado !== '1' && datos.grado !== '2' && datos.grado !== '3') {
    avisar_('El grado debe ser 1, 2 o 3.', 'error');
    return;
  }
  if (datos.trimestre !== '1' && datos.trimestre !== '2' && datos.trimestre !== '3') {
    avisar_('El trimestre debe ser 1, 2 o 3.', 'error');
    return;
  }
  var href = urlHttps_(datos.url);
  if (!href) {
    avisar_('La URL del recurso debe empezar con https://.', 'error');
    return;
  }
  datos.url = href;
  var tk = tokenLms_();
  if (!tk) {
    avisar_('Inicia sesión para compartir un recurso.', 'error');
    return;
  }
  if (typeof gsRun !== 'function') {
    avisar_('google.script.run no está disponible.', 'error');
    return;
  }
  gsRun('subirRecursoBiblioteca', tk, datos).then(function (r) {
    if (r && r.ok === false) {
      avisar_(String(r.mensaje || 'No se pudo guardar el recurso.'), 'error');
      return;
    }
    avisar_((r && r.mensaje) || 'Recurso compartido.', 'ok');
    form.reset();
    cerrarModalSubirRecurso_();
    cargarBibliotecaRecursos_(leerFiltrosBiblioteca_());
  }, function () {
    avisar_('No se pudo guardar el recurso.', 'error');
  });
}

function calcularPuntosTotalesSesion_() {
  var cont = document.getElementById('contenedorIDevicesDinamicos');
  var puntosQuiz = 0;
  var puntosActividad = 0;
  var pondQuiz = 1;
  var pondActividad = 1;
  var hayPondQuiz = false;
  var hayPondAct = false;
  if (cont) {
    cont.querySelectorAll('.idevice-card').forEach(function (card) {
      if (card.style.display === 'none') return;
      var tipo = card.getAttribute('data-tipo') || '';
      if (tipo === 'quiz_evaluativo' || tipo === 'pregunta') {
        card.querySelectorAll('.inp-puntos-quiz, .quiz-puntos-input').forEach(function (inp) {
          puntosQuiz += Number(inp.value) || 0;
        });
        var pq = card.querySelector('.inp-ponderacion-quiz');
        if (pq && !hayPondQuiz) { pondQuiz = Number(pq.value) || 1; hayPondQuiz = true; }
      }
      if (tipo === 'reto' || tipo === 'reto_ciencias' || tipo === 'fichero' || tipo === 'encuesta') {
        card.querySelectorAll('.inp-puntos-actividad').forEach(function (inp) {
          puntosActividad += Number(inp.value) || 0;
        });
        var pa = card.querySelector('.inp-ponderacion-actividad');
        if (pa && !hayPondAct) { pondActividad = Number(pa.value) || 1; hayPondAct = true; }
      }
      if (tipo === 'encuesta') {
        var modo = (card.querySelector('.sel-modo-encuesta-idevice') || {}).value;
        if (modo === 'actividad_activa') {
          var pondEnc = Number((card.querySelector('.inp-ponderacion-encuesta') || {}).value || 0);
          if (!puntosActividad && pondEnc) puntosActividad = pondEnc;
          if (!hayPondAct && pondEnc) { pondActividad = 1; }
        }
      }
    });
  }
  var total = (puntosQuiz * pondQuiz) + (puntosActividad * pondActividad);
  var resumen = {
    puntosQuiz: puntosQuiz,
    ponderacionQuiz: pondQuiz,
    puntosActividad: puntosActividad,
    ponderacionActividad: pondActividad,
    total: total
  };
  window._puntosSesion_ = resumen;
  var lbl = document.getElementById('lblPuntosTotalesSesion');
  if (lbl) lbl.textContent = 'Puntos de la sesión: ' + total;
  return resumen;
}

function toggleAudioDuaPreview_(btn) {
  var marco = marcoPreview_(btn);

    avisar_('Este navegador no tiene síntesis de voz.', 'info');
    return;
  }
  var status = marco.querySelector('.player-status');

    marco._audioPreview_ = false;
    if (btn) btn.textContent = '▶';
    if (status) status.textContent = 'Audio en pausa · Pulsa para reanudar';
    window.speechSynthesis.cancel();
    return;
  }
  var paso = marco.querySelector('.moment-panel.active .reading-passage') || marco.querySelector('.reading-passage');
  var texto = paso ? String(paso.textContent || '').replace(/\s+/g, ' ').trim() : '';
  if (!texto) {
    avisar_('Escribe este momento para escucharlo en voz alta.', 'info');
    return;
  }
  window.speechSynthesis.cancel();
  marco._audioPreview_ = true;
  if (btn) btn.textContent = '⏸';
  if (status) status.textContent = 'Reproduciendo narración en voz alta con sintetizador DUA...';
  var utter = new SpeechSynthesisUtterance(texto);
  utter.lang = 'es-MX';
  var voz = (typeof elegirVozFemeninaEspanol_ === 'function') ? elegirVozFemeninaEspanol_() : null;
  if (voz) {

    marco._audioPreview_ = false;
    if (btn) btn.textContent = '▶';
    if (status) status.textContent = 'Lectura finalizada · Pulsa para repetir';
  };

var TIPOS_CONTENIDO_NEM_ = {
  contenido_teoria: 1,

  contenido_ejercicio: 2,
  contenido_autoevaluacion: 3,
  contenido_lista_cotejo: 3,

function textoPlanoContenido_(v) {
  if (v == null) return '';
  if (typeof v === 'string') return v.trim();
  if (typeof v === 'number') return String(v);
  return '';
}

function listaTextosContenido_(v) {
  if (!v) return [];
  if (typeof v === 'string') {
    return v.split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean);
  }
  if (!Array.isArray(v)) return [];
  return v.map(function (item) {
    if (typeof item === 'string') return item.trim();
    if (!item) return '';
    return textoPlanoContenido_(item.texto || item.criterio || item.paso || item.nombre || item.descripcion || item.consigna);
  }).filter(Boolean);
}

function tipoContenidoNEM_(tipo) {
  var t = String(tipo || '').trim().toLowerCase().replace(/\s+/g, '_');
  if (!t) return '';
  if (t.indexOf('contenido_') === 0) return t;
  var alias = {
    teoria: 'contenido_teoria',
    texto: 'contenido_teoria',
    ejemplo: 'contenido_ejemplo',
    modelado: 'contenido_ejemplo',
    ejercicio: 'contenido_ejercicio',
    practica: 'contenido_ejercicio',
    autoevaluacion: 'contenido_autoevaluacion',
    lista_cotejo: 'contenido_lista_cotejo',
    cotejo: 'contenido_lista_cotejo',
    rubrica: 'contenido_rubrica',
    evidencia: 'contenido_evidencia',
    producto: 'contenido_evidencia'
  };
  return alias[t] || ('contenido_' + t);
}

function indiceSesionNEM_() {
  if (typeof sesionActivaIdx === 'undefined' || sesionActivaIdx == null) return 0;
  var n = parseInt(sesionActivaIdx, 10);
  return isNaN(n) ? 0 : n;
}

function leerClaseInteractivaCruda_() {
  if (typeof sesionesActualesNEM === 'undefined' || !sesionesActualesNEM) return null;
  var s = sesionesActualesNEM[indiceSesionNEM_()];
  return (s && s.claseInteractiva) ? s.claseInteractiva : null;
}

function normalizarClaseInteractiva_(raw) {
  var ci = raw || {};
  if (ci.claseInteractiva && typeof ci.claseInteractiva === 'object') ci = ci.claseInteractiva;
  var nodos = Array.isArray(ci.nodos) ? ci.nodos : (Array.isArray(ci.momentos) ? ci.momentos : []);
  var textos = {
    apertura: textoPlanoContenido_(ci.apertura || ci.Apertura || ci.aperturaTexto || ci.AperturaTexto),
    desarrollo: textoPlanoContenido_(ci.desarrollo || ci.Desarrollo || ci.desarrolloTexto || ci.DesarrolloTexto),
    actividad: textoPlanoContenido_(ci.actividad || ci.Actividad || ci.actividadTexto || ci.ActividadTexto),
    cierre: textoPlanoContenido_(ci.cierre || ci.Cierre || ci.cierreTexto || ci.CierreTexto)
  };
  var claves = ['apertura', 'desarrollo', 'actividad', 'cierre'];
  nodos.forEach(function (nodo, i) {
    if (!nodo || typeof nodo !== 'object') return;
    var mom = parseInt(nodo.momento || nodo.paso || (i + 1), 10) || (i + 1);
    var clave = claves[mom - 1] || '';
    var t = textoPlanoContenido_(nodo.texto || nodo.guion || nodo.cuerpo);
    if (clave && t && !textos[clave]) textos[clave] = t;
    claves.forEach(function (k) {
      var alt = textoPlanoContenido_(nodo[k] || nodo[k + 'Texto']);
      if (alt && !textos[k]) textos[k] = alt;
    });
  });
  var bloques = [];
  function empujar(lista, momentoPadre) {
    (lista || []).forEach(function (b) {
      if (!b || typeof b !== 'object') return;
      var tipo = tipoContenidoNEM_(b.tipo || b.clave);
      if (!tipo) return;
      var mom = parseInt(b.momento || b.paso || momentoPadre || TIPOS_CONTENIDO_NEM_[tipo] || 2, 10);
      if (isNaN(mom) || mom < 1 || mom > 4) mom = TIPOS_CONTENIDO_NEM_[tipo] || 2;
      bloques.push({
        tipo: tipo,
        momento: mom,
        titulo: textoPlanoContenido_(b.titulo || b.nombre),
        cuerpo: textoPlanoContenido_(b.cuerpo || b.texto || b.teoria || b.explicacion),
        consigna: textoPlanoContenido_(b.consigna || b.instruccion || b.practica),
        pasos: listaTextosContenido_(b.pasos || b.modelado),
        criterios: b.criterios || b.items || b.lista || [],
        pregunta: textoPlanoContenido_(b.pregunta),
        opciones: Array.isArray(b.opciones) ? b.opciones : [],
        retroError: textoPlanoContenido_(b.retroError || b.retroalimentacion || (b.retro && (b.retro.fallo || b.retro)))
      });
    });
  }
  empujar(ci.bloques || ci.contenidos, 0);
  nodos.forEach(function (nodo, i) {
    if (!nodo || typeof nodo !== 'object') return;
    empujar(nodo.bloques || nodo.contenidos, parseInt(nodo.momento || nodo.paso || (i + 1), 10));
  });
  return { textos: textos, bloques: bloques };
}

function nivelesRubricaPreview_(item) {
  var vacio = ['', '', '', ''];
  if (!item) return { nombre: 'Criterio', niveles: vacio.slice() };
  if (typeof item === 'string') return { nombre: item, niveles: vacio.slice() };
  var niveles = item.niveles || item.descriptores || item.columnas;
  if (!Array.isArray(niveles)) {
    niveles = [

      item.satisfactorio || item.nivel3 || '',

  while (niveles.length < 4) niveles.push('');
  return {
    nombre: textoPlanoContenido_(item.nombre || item.criterio || item.texto) || 'Criterio',
    niveles: niveles.slice(0, 4).map(function (n) {

}

function generarClaseInteractivaCompletaIA(btn) {
  if (!btn || !btn.tagName) btn = document.querySelector('[data-accion="generar-clase-interactiva"]');
  var payload = recolectarPayloadClaseInteractiva_();
  var hayPlan = payload.etapa1.titulo || payload.etapa2.contenidoSintetico || payload.etapa2.pda || payload.etapa4.proposito;
  if (!hayPlan) {
    avisar_('Completa el título, el contenido o el PDA de la planeación antes de generar la clase.', 'error');
    return;
  }
  var txt = btn ? btn.textContent : '';
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Generando clase interactiva...';
  }
  function restaurar() {
    if (btn) {
      btn.disabled = false;
      btn.textContent = txt;
    }
  }
  var tk = (typeof getTokenPlan_ === 'function') ? getTokenPlan_() : (typeof tokenClase !== 'undefined' ? tokenClase : (typeof token !== 'undefined' ? token : ''));
  if (typeof gsRun !== 'function') {
    restaurar();
    avisar_('No hay conexión con el servidor para generar la clase.', 'error');
    return;
  }
  return gsRun('generarClaseInteractivaCompletaNEM', tk, payload).then(function (res) {
    restaurar();
    if (!res || res.ok === false) {
      avisar_((res && (res.error || res.mensaje)) || 'No se pudo generar la clase interactiva.', 'error');
      return;
    }
    var crudo = res.claseInteractiva || null;
    if (!crudo && (res.nodos || res.bloques || res.contenidos || res.apertura || res.AperturaTexto)) crudo = res;
    if (!crudo) {
      avisar_('El servidor no devolvió la clase interactiva.', 'error');
      return;
    }
    if (typeof sesionesActualesNEM !== 'undefined' && sesionesActualesNEM) {
      var idx = payload.sesion.indice;
      if (!sesionesActualesNEM[idx]) sesionesActualesNEM[idx] = { numero: idx + 1 };
      sesionesActualesNEM[idx].claseInteractiva = (res && res.claseInteractiva) ? res.claseInteractiva : crudo;
    }
    aplicarTextosClaseInteractiva_(normalizarClaseInteractiva_(crudo));
    var normClase = normalizarClaseInteractiva_(crudo);
    volcarBloquesIAEnLienzo_(normClase);
    if (typeof irAPasoSesion_ === 'function') irAPasoSesion_(3);
    if (typeof pintarVistaPreviaIntegrada_ === 'function') pintarVistaPreviaIntegrada_();
    avisar_('Clase interactiva lista en el constructor. Revisa las tarjetas del paso 3.', 'ok');
  }).catch(function (err) {
    restaurar();
    avisar_('Error al generar la clase: ' + ((err && err.message) || String(err)), 'error');
  });
}

function guionSinMarcaIDevices_(texto) {
  var base = String(texto || '');
  var ini = base.indexOf(MARCA_IDEVICES_INI_AYUDA_);
  var fin = base.indexOf(MARCA_IDEVICES_FIN_AYUDA_);
  if (ini >= 0 && fin > ini) {
    base = base.slice(0, ini) + base.slice(fin + MARCA_IDEVICES_FIN_AYUDA_.length);
  }
  return base;
}

function leerIframesDelGuion_() {
  var campo = nodo_('sesGuionEstudiante');
  var base = guionSinMarcaIDevices_(campo ? campo.value : '');
  var lineas = base.split('\n');
  var out = [];
  var i;
  for (i = 0; i < lineas.length; i++) {
    if (lineas[i].indexOf(MARCA_IFRAME_PREFIJO_) !== 0) continue;
    var titulo = lineas[i].slice(MARCA_IFRAME_PREFIJO_.length).trim();
    var j = i + 1;
    while (j < lineas.length && !String(lineas[j]).trim()) j++;
    var url = (j < lineas.length) ? urlIframePermitida_(lineas[j]) : '';
    if (url) out.push({ titulo: titulo || 'Contenido externo', url: url });
  }
  return out;
}

function anexarIframeAlGuion_(titulo, url) {
  var campo = nodo_('sesGuionEstudiante');
  if (!campo) return false;
  var limpio = String(titulo || 'Contenido externo').replace(/\s+/g, ' ').trim() || 'Contenido externo';
  var pieza = '\n\n' + MARCA_IFRAME_PREFIJO_ + limpio + '\n' + url;
  campo.value = String(campo.value || '').replace(/\s+$/, '') + pieza;
  if (typeof marcarIDevicesTocados_ === 'function') marcarIDevicesTocados_();
  return true;
}

function quitarBloqueIframe_(url) {
  var campo = nodo_('sesGuionEstudiante');
  if (!campo) return;
  var lineas = String(campo.value || '').split('\n');
  var out = [];
  var i;
  for (i = 0; i < lineas.length; i++) {
    if (lineas[i].indexOf(MARCA_IFRAME_PREFIJO_) === 0) {
      var j = i + 1;
      while (j < lineas.length && !String(lineas[j]).trim()) j++;
      if (j < lineas.length && String(lineas[j]).trim() === url) {
        i = j;
        continue;
      }
    }
    out.push(lineas[i]);
  }
  campo.value = out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  if (typeof marcarIDevicesTocados_ === 'function') marcarIDevicesTocados_();
  rehidratarBloquesIframeDesdeGuion_();
}

function insertarBloqueIframe_(urlIframe, titulo) {
  if (!urlIframe) {
    pedirUrlIframe_().then(function (datos) {
      if (!datos || !datos.url) return;
      insertarBloqueIframe_(datos.url, datos.titulo);
    });
    return;
  }
  var limpia = urlIframePermitida_(urlIframe);
  if (!limpia) {
    avisar_('Solo se aceptan enlaces https de Genially, H5P, Canva o Google Slides.', 'error');
    return;
  }
  var ya = leerIframesDelGuion_().some(function (b) { return b.url === limpia; });
  if (ya) {
    avisar_('Ese enlace ya está en la sesión.', 'info');
    return;
  }
  if (!nodo_('contenedorIDevicesDinamicos') || !nodo_('sesGuionEstudiante')) {
    avisar_('Abre una sesión del proyecto para insertar el bloque.', 'error');
    return;
  }
  anexarIframeAlGuion_(titulo, limpia);
  rehidratarBloquesIframeDesdeGuion_();
  avisar_('Bloque externo insertado en la sesión.', 'ok');
}

function pedirUrlIframe_() {
  if (typeof modal !== 'function') {
    avisar_('No pude abrir el formulario del enlace.', 'error');
    return Promise.resolve(null);
  }
  return modal({
    titulo: 'Bloque externo',
    html: '<p>Pega un enlace https de Genially, H5P, Canva o Google Slides.</p>' +
      '<label>Título<input id="st90-iframe-titulo" type="text"></label>' +
      '<label>URL<input id="st90-iframe-url" type="url"></label>',
    botones: [
      { texto: 'Cancelar', valor: null, clase: 'btn-secundario' },
      { texto: 'Insertar', valor: 'ok' }
    ],
    capturar: function (fondo, val) {
      if (val === null) return null;
      var t = fondo.querySelector('#st90-iframe-titulo');
      var u = fondo.querySelector('#st90-iframe-url');
      return {

    }
  });
}

function guardarConfigMembreteNEM() {
  var payload = {
    logoIzq: ((document.getElementById('cfgLogoIzq') || {}).value || '').trim(),
    logoDer: ((document.getElementById('cfgLogoDer') || {}).value || '').trim(),
    linea1: ((document.getElementById('cfgEncL1') || {}).value || '').trim() || MEMBRETE_NEM_DEFECTO_.linea1,
    linea2: ((document.getElementById('cfgEncL2') || {}).value || '').trim() || MEMBRETE_NEM_DEFECTO_.linea2,
    linea3: ((document.getElementById('cfgEncL3') || {}).value || '').trim() || MEMBRETE_NEM_DEFECTO_.linea3
  };
  window.configMembreteNEM_ = payload;
  try {
    localStorage.setItem('st90_cfg_membrete_nem', JSON.stringify(payload));
  } catch (eLoc) {}
  cerrarConfigMembreteNEM();
  var contPdf = document.getElementById('contenedorDocOficialNLPdf');
  if (contPdf && window._ultimoPlanPdfNL_) {
    contPdf.innerHTML = _generarHtmlDocumentoPlanoDidacticoNL_(window._ultimoPlanPdfNL_.p, window._ultimoPlanPdfNL_.s);
  }
  if (typeof gsRun !== 'function') {
    _avisarPlanNEM_('Membrete actualizado en esta sesión.', 'ok');
    return;
  }
  _avisarPlanNEM_('Guardando membrete institucional…', 'info');
  gsRun('guardarMembreteInstitucionalNEM', _tokenPlanNEM_(), payload).then(function (res) {
    if (res && res.ok === false) {
      _avisarPlanNEM_(res.error || 'No se pudo guardar el membrete.', 'error');
      return;
    }
    _avisarPlanNEM_('Membrete institucional guardado y aplicado al PDF oficial.', 'ok');
  }).catch(function () {
    _avisarPlanNEM_('Membrete aplicado para tus documentos PDF.', 'ok');
  });
}

function insertarAjusteDUARapido(textoChip) {
  var area = document.getElementById('planAjustesRazonables');
  if (!area) return;
  var linea = String(textoChip || '').trim();
  if (!linea) return;
  var actuales = String(area.value || '').split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
  if (actuales.indexOf(linea) >= 0) {
    _avisarPlanNEM_('Ese ajuste razonable ya está incluido.', 'warning');
    return;
  }
  var base = String(area.value || '').replace(/\s+$/, '');
  area.value = base ? (base + '\n' + linea) : linea;
  area.dispatchEvent(new Event('input', { bubbles: true }));
  area.dispatchEvent(new Event('change', { bubbles: true }));
}

function agregarCriterioVacioCotejo() {
  if (!Array.isArray(window.criteriosCotejoPlanNEM_)) window.criteriosCotejoPlanNEM_ = [];
  if (window.criteriosCotejoPlanNEM_.length >= 5) {
    _avisarPlanNEM_('La lista admite como máximo 5 criterios.', 'warning');
    return;
  }
  window.criteriosCotejoPlanNEM_.push('');
  _marcarCotejoPersonalizado_();
  generarRubricaDesdeCriterios_();
  pintarTablaCriteriosCotejoDOM_();
}

function quitarCriterioCotejo(idx) {
  var lista = window.criteriosCotejoPlanNEM_ || [];
  if (lista.length <= 3 && lista.length > 0 && lista.every(function (t) { return String(t || '').trim(); })) {
    _avisarPlanNEM_('La lista de cotejo conserva entre 3 y 5 criterios.', 'warning');
    return;
  }
  lista.splice(idx, 1);
  window.criteriosCotejoPlanNEM_ = lista;
  _marcarCotejoPersonalizado_();
  generarRubricaDesdeCriterios_();
  pintarTablaCriteriosCotejoDOM_();
}

function _lineasFuenteCotejo_(id) {

  return String(txt).split('\n').map(function (l) {
    return l.replace(/^[•\-\*]\s*/, '').replace(/^\[\d+°?\s*Grado\]\s*/i, '').trim();
  }).filter(Boolean);

function generarCriteriosDesdePDANIA() {
  var pdas = _lineasFuenteCotejo_('planPDA');
  var contenidos = _lineasFuenteCotejo_('planContenidoSintetico');
  var propositos = _lineasFuenteCotejo_('planProposito');
  if (!pdas.length && !contenidos.length && !propositos.length) {
    _avisarPlanNEM_('Escribe el PDA, el contenido o el propósito antes de generar la lista.', 'error');
    return;
  }
  var criterios = [];
  if (pdas[0]) criterios.push('Identifica y aplica el PDA: ' + pdas[0].slice(0, 140));
  if (pdas[1]) criterios.push('Desarrolla el proceso: ' + pdas[1].slice(0, 140));
  if (contenidos[0]) criterios.push('Relaciona el contenido «' + contenidos[0].slice(0, 120) + '» con una situación de su comunidad.');
  if (propositos[0]) criterios.push('Aporta al producto del proyecto: ' + propositos[0].slice(0, 140));
  criterios.push('Colabora con respeto e inclusión, usando los ajustes razonables del grupo (DUA).');
  window.criteriosCotejoPlanNEM_ = criterios.filter(Boolean).slice(0, 5);
  while (window.criteriosCotejoPlanNEM_.length < 3) {
    window.criteriosCotejoPlanNEM_.push('Entrega la evidencia de la sesión con orden, reflexión y lenguaje claro.');
  }
  _marcarCotejoPersonalizado_();
  generarRubricaDesdeCriterios_();
  pintarTablaCriteriosCotejoDOM_();
  _avisarPlanNEM_('Lista de cotejo y rúbrica analítica listas para el PDF oficial.', 'ok');
}

    arr[i] = arr[j];

    sessionStorage.setItem(clave, String(fin));
  }
  function pintar() {
    var resta = Math.max(0, fin - Date.now());
    var seg = Math.ceil(resta / 1000);
    var mm = String(Math.floor(seg / 60)).padStart(2, '0');
    var ss = String(seg % 60).padStart(2, '0');
    var etiqueta = barra.querySelector('.tiempo-restante');
    if (etiqueta) etiqueta.textContent = mm + ':' + ss;
    barra.classList.toggle('alerta', seg <= 120 && seg > 30);
    barra.classList.toggle('critico', seg <= 30);

    if (resta <= 0) {

      sessionStorage.removeItem(clave);
      var form = document.getElementById('formDinamico');
      if (form && typeof enviar === 'function') enviar({ preventDefault: function () {} });
    }
  }
  pintar();
  clearInterval(barra._reloj);
  barra._reloj = setInterval(pintar, 1000);
}

  var visibles = 0;
  tarjetas.forEach(function (card) {

      (card.getAttribute('data-nombre') || '') + ' ' +
      (card.getAttribute('data-sub') || '') + ' ' +
      (card.getAttribute('data-tipo') || '')
    );
    var coincide = !consulta || blob.indexOf(consulta) >= 0;
    card.style.display = coincide ? '' : 'none';
    if (coincide) visibles += 1;
  });
  document.querySelectorAll('.cat-accordion .cat-group').forEach(function (grupo) {
    var header = grupo.querySelector('.cat-header');
    var cardsGrupo = grupo.querySelectorAll('.modulo-card-lateral');
    var visiblesGrupo = 0;
    cardsGrupo.forEach(function (c) { if (c.style.display !== 'none') visiblesGrupo += 1; });
    if (consulta) {
      grupo.classList.toggle('abierto', visiblesGrupo > 0);
      if (header) header.style.display = visiblesGrupo > 0 ? '' : 'none';
    } else if (header) header.style.display = '';
  });
  if (limpiar) limpiar.style.display = consulta ? '' : 'none';
  var sinResultados = caja ? caja.querySelector('.sin-resultados-catalogo') : null;
  if (!sinResultados && caja) {
    sinResultados = document.createElement('p');
    sinResultados.className = 'sin-resultados-catalogo';
    sinResultados.setAttribute('role', 'status');
    sinResultados.textContent = 'No se encontraron componentes';
    sinResultados.style.display = 'none';
    var acc = caja.querySelector('.cat-accordion');
    if (acc && acc.parentNode) acc.parentNode.insertBefore(sinResultados, acc.nextSibling);
  }
  if (sinResultados) sinResultados.style.display = consulta && visibles === 0 ? '' : 'none';
}

    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(texto);

    window.speechSynthesis.speak(u);

}

function insertarPasoSecuenciaIA_(pasoNum) {

  var esTecno = /tecnolog/i.test(ctx.asignatura);

  var pagMomento = (window.paginasSesionActiva_ && window.paginasSesionActiva_[pasoNum - 1]) || null;
  var pid = pagMomento ? pagMomento.id : idPaginaActivaExe_();
  var card = null;

  if (pasoNum === 1) {
    var apTexto = ctx.sesApertura || ('Iniciamos reflexionando sobre ' + ctx.titulo + '. ' + (ctx.pda ? ('Propósito: ' + ctx.pda) : 'Activa tus saberes previos escuchando el audio guiado.'));
    card = insertarBloqueExe_('texto_dua', {
      titulo: '1. Saberes Previos y Lectura Guiada DUA',
      cuerpo: apTexto
    }, pid);
  } else if (pasoNum === 2) {
    if (esIngles) {
      card = insertarBloqueExe_('listening', {
        titulo: '2. Audio Listening and Comprehension',
        cuerpo: ctx.sesDesarrollo || 'Listen carefully to the audio and answer the questions.'
      }, pid);
    } else if (esTecno) {
      card = insertarBloqueExe_('sim_ofimatica', {
        titulo: '2. Práctica de Hoja de Cálculo Interactiva',
        cuerpo: ctx.sesDesarrollo || 'Captura los datos y comprueba el cálculo automático con las fórmulas =SUMA y =PROMEDIO.'
      }, pid);
    } else {
      card = insertarBloqueExe_('objetivos', {
        titulo: '2. Desarrollo y Conceptos Clave',
        cuerpo: ctx.sesDesarrollo || ('Objetivos de la sesión:\n• Comprender ' + (ctx.pda || ctx.titulo) + '.\n• Analizar ejemplos aplicados a nuestro contexto comunitario.')
      }, pid);
    }
  } else if (pasoNum === 3) {
    var actTexto = ctx.sesActividad || ('Realiza la siguiente actividad práctica situada en equipo o individual:\n' + (ctx.proposito || 'Elabora el producto o evidencia requerida para consolidar el aprendizaje.'));
    card = insertarBloqueExe_('fichero', {
      titulo: '3. Actividad Práctica Situada',
      cuerpo: actTexto
    }, pid);
  } else if (pasoNum === 4) {
    var cieTexto = ctx.sesCierre || 'Responde este reactivo formativo de metacognición para valorar lo aprendido en la sesión.';
    card = insertarBloqueExe_('quiz_evaluativo', {
      titulo: '4. Evaluación Formativa y Cierre',
      cuerpo: cieTexto
    }, pid);
  }

  aplicarFiltroPaginaExe_();
  actualizarContadorIDevicesExe_();
  renderArbolSesion_();
  if (typeof window.marcarIDevicesTocados_ === 'function') window.marcarIDevicesTocados_();
  if (typeof window.volcarIDevicesEnGuion_ === 'function') window.volcarIDevicesEnGuion_();
  if (card && card.scrollIntoView) {
    setTimeout(function () {
      try { card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
    }, 100);
  }

function agregarNodoSesion_() {
  asegurarPaginasExe_();
  var lista = window.paginasSesionActiva_;
  var id = lista.reduce(function (m, p) { return Math.max(m, Number(p.id) || 0); }, 0) + 1;
  lista.push({ id: id, titulo: (lista.length + 1) + '. Nueva Página', nivel: 0, idevices: [] });
  window._nodoSesionActivo_ = lista.length - 1;
  renderArbolSesion_();
  aplicarFiltroPaginaExe_();
}

function eliminarNodoSesion_() {
  asegurarPaginasExe_();
  var lista = window.paginasSesionActiva_;
  if (lista.length <= 1) {
    if (typeof toast === 'function') toast('Debe existir al menos una página en la sesión.', 'error');
    return;
  }
  var idx = window._nodoSesionActivo_ || 0;
  var id = String(lista[idx].id);
  var cont = document.getElementById('contenedorIDevicesDinamicos');
  if (cont) {
    cont.querySelectorAll('.idevice-card').forEach(function (card) {
      if (String(card.getAttribute('data-pagina-id')) === id) card.remove();
    });
  }
  lista.splice(idx, 1);
  window._nodoSesionActivo_ = Math.max(0, idx - 1);
  renderArbolSesion_();
  aplicarFiltroPaginaExe_();
}

function moverNodoSesion_(delta) {
  asegurarPaginasExe_();
  var lista = window.paginasSesionActiva_;
  var idx = window._nodoSesionActivo_ || 0;
  var destino = idx + delta;
  if (destino < 0 || destino >= lista.length) return;
  var tmp = lista[idx];
  lista[idx] = lista[destino];
  lista[destino] = tmp;
  window._nodoSesionActivo_ = destino;
  renderArbolSesion_();
}

function cambiarNivelNodoSesion_(delta) {
  asegurarPaginasExe_();
  var pag = window.paginasSesionActiva_[window._nodoSesionActivo_ || 0];
  if (!pag) return;
  pag.nivel = Math.max(0, Math.min(2, (pag.nivel || 0) + delta));
  renderArbolSesion_();
}

function seleccionarNodoSesion_(idx) {

function normalizarUrlImagenMedia_(url) {
  var s = String(url || '').trim();
  if (!s) return '';
  if (/^data:image\//i.test(s) || /^blob:/i.test(s)) return s;
  var mDrive = s.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/) || s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (mDrive && mDrive[1]) {
    return 'https://lh3.googleusercontent.com/d/' + mDrive[1];
  }
  return s;
}

  if (!card) return;
  var pLocal = card.querySelector('.panel-origen-local');
  var pUrl = card.querySelector('.panel-origen-url');
  var pYt = card.querySelector('.panel-origen-yt');
  var pDrive = card.querySelector('.panel-origen-drive');

  if (origen === 'local') {
    if (pLocal) pLocal.style.display = '';
    if (pUrl) pUrl.style.display = 'none';
    if (pYt) pYt.style.display = 'none';
    if (pDrive) pDrive.style.display = 'none';
  } else if (origen === 'url') {
    if (pLocal) pLocal.style.display = 'none';
    if (pUrl) pUrl.style.display = '';
    var inpImg = card.querySelector('.inp-img-url');
    if (inpImg) {
      inpImg.placeholder = 'Pega el enlace directo de la imagen (https://...imagen.png o .jpg)';
      if (inpImg.focus) inpImg.focus();
    }
  } else if (origen === 'drive') {
    if (pLocal) pLocal.style.display = 'none';

      pDrive.style.display = '';
      var inpFich = card.querySelector('.inp-fichero-url');

  }

function refsRangoExe_(desde, hasta) {
  var cols = ['A', 'B', 'C', 'D'];
  var a = /^([A-D])(\d+)$/.exec(String(desde || '').toUpperCase());
  var b = /^([A-D])(\d+)$/.exec(String(hasta || '').toUpperCase());
  if (!a || !b) return [];
  var c1 = cols.indexOf(a[1]);
  var c2 = cols.indexOf(b[1]);
  var r1 = parseInt(a[2], 10);
  var r2 = parseInt(b[2], 10);
  var refs = [];
  for (var c = Math.min(c1, c2); c <= Math.max(c1, c2); c++) {
    for (var r = Math.min(r1, r2); r <= Math.max(r1, r2); r++) refs.push(cols[c] + r);
  }
  return refs;
}

function numeroCeldaExe_(mapa, ref, pila) {
  if (pila[ref]) return 0;
  pila[ref] = true;
  var raw = mapa[ref];
  if (raw == null) return 0;
  var s = String(raw).trim().replace(',', '.');
  if (s.charAt(0) === '=') return evaluarFormulaExe_(s.slice(1), mapa, pila);
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function evaluarFormulaExe_(expr, mapa, pila) {
  var texto = String(expr || '').replace(/\s+/g, '').toUpperCase();
  var rango = /^(SUMA|PROMEDIO)\(([A-D]\d+):([A-D]\d+)\)$/.exec(texto);
  if (rango) {
    var refs = refsRangoExe_(rango[2], rango[3]);
    var nums = refs.map(function (ref) { return numeroCeldaExe_(mapa, ref, pila); });
    var suma = nums.reduce(function (a, b) { return a + b; }, 0);
    return rango[1] === 'PROMEDIO' ? (nums.length ? suma / nums.length : 0) : suma;
  }
  if (!/^[A-D0-9+\-.]+$/.test(texto)) return 0;
  var partes = texto.split(/([+\-])/);
  var total = 0;
  var signo = 1;
  partes.forEach(function (parte) {
    if (parte === '+') signo = 1;
    else if (parte === '-') signo = -1;
    else if (parte) {
      var val = /^[A-D]\d+$/.test(parte) ? numeroCeldaExe_(mapa, parte, pila) : parseFloat(parte);
      if (!isNaN(val)) total += signo * val;
    }
  });
  return total;
}

function recalcularHojaExe_(input) {
  var tabla = input && input.closest ? input.closest('.hoja-ofimatica') : null;
  if (!tabla) return;
  var mapa = {};
  tabla.querySelectorAll('.celda-hoja').forEach(function (celda) {
    mapa[celda.getAttribute('data-ref')] = celda.value || '';
  });
  tabla.querySelectorAll('.celda-hoja').forEach(function (celda) {
    var salida = celda.parentNode ? celda.parentNode.querySelector('.celda-resultado') : null;
    var valor = String(celda.value || '').trim();
    if (!salida) return;
    if (valor.charAt(0) === '=') {
      var n = evaluarFormulaExe_(valor.slice(1), mapa, {});
      salida.textContent = Math.round(n * 100) / 100;
    } else salida.textContent = '';
  });
}

function modificarTablaEditor(btn, accion) {
  var wrap = btn && btn.closest ? btn.closest('.editor-enriquecido-wrap') : null;
  var editor = wrap ? wrap.querySelector('.campo-editor-rich') : null;
  if (!editor) return;
  var sel = window.getSelection();
  var nodo = sel && sel.anchorNode ? (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentNode) : null;
  var td = nodo ? nodo.closest('td, th') : null;
  if (!td) {
    var tablas = editor.querySelectorAll('table');
    if (!tablas.length) {
      alert('Por favor coloca el cursor dentro de la tabla que deseas modificar.');
      return;
    }
    var ultimaTabla = tablas[tablas.length - 1];
    var celdas = ultimaTabla.querySelectorAll('td, th');
    td = celdas.length ? celdas[celdas.length - 1] : null;
  }
  if (!td) return;
  var tr = td.closest('tr');
  var tabla = td.closest('table');
  if (!tr || !tabla) return;

  if (accion === 'agregarFila') {
    var nuevaFila = document.createElement('tr');
    var numCols = tr.children.length;
    for (var i = 0; i < numCols; i++) {
      var nuevaCelda = document.createElement('td');
      nuevaCelda.style.padding = '8px 12px';
      nuevaCelda.style.border = '1px solid #cbd5e1';
      nuevaCelda.innerHTML = '<br>';
      nuevaFila.appendChild(nuevaCelda);
    }
    tr.parentNode.insertBefore(nuevaFila, tr.nextSibling);
  } else if (accion === 'eliminarFila') {
    if (tabla.querySelectorAll('tr').length <= 1) {
      tabla.remove();
    } else {
      tr.remove();
    }
  } else if (accion === 'agregarColumna') {
    var colIdx = Array.prototype.indexOf.call(tr.children, td);
    tabla.querySelectorAll('tr').forEach(function (fila) {
      var esHead = fila.parentNode.tagName === 'THEAD' || fila.children[0].tagName === 'TH';
      var nuevaCelda = document.createElement(esHead ? 'th' : 'td');
      nuevaCelda.style.padding = '8px 12px';
      nuevaCelda.style.border = '1px solid #cbd5e1';
      if (esHead) {
        nuevaCelda.style.background = '#f1f5f9';
        nuevaCelda.style.fontWeight = '700';
        nuevaCelda.textContent = 'Columna';
      } else {
        nuevaCelda.innerHTML = '<br>';
      }
      var ref = fila.children[colIdx];
      if (ref && ref.nextSibling) fila.insertBefore(nuevaCelda, ref.nextSibling);
      else fila.appendChild(nuevaCelda);
    });
  } else if (accion === 'eliminarColumna') {
    var colIdx = Array.prototype.indexOf.call(tr.children, td);
    tabla.querySelectorAll('tr').forEach(function (fila) {
      if (fila.children[colIdx]) fila.children[colIdx].remove();
    });
    if (!tabla.querySelector('td, th')) tabla.remove();
  } else if (accion === 'filaArriba') {
    var filaNueva = tr.cloneNode(false);
    var nCols = tr.children.length;
    for (var k = 0; k < nCols; k++) {
      var celdaNueva = document.createElement(tr.children[k].tagName.toLowerCase() === 'th' ? 'th' : 'td');
      celdaNueva.style.padding = '8px 12px';
      celdaNueva.style.border = '1px solid #cbd5e1';
      celdaNueva.innerHTML = '<br>';
      filaNueva.appendChild(celdaNueva);
    }
    tr.parentNode.insertBefore(filaNueva, tr);
  } else if (accion === 'colIzquierda') {
    var idxIzq = Array.prototype.indexOf.call(tr.children, td);
    tabla.querySelectorAll('tr').forEach(function (fila) {
      var esHead = fila.parentNode.tagName === 'THEAD' || (fila.children[0] && fila.children[0].tagName === 'TH');
      var celda = document.createElement(esHead ? 'th' : 'td');
      celda.style.padding = '8px 12px';
      celda.style.border = '1px solid #cbd5e1';
      celda.innerHTML = esHead ? 'Columna' : '<br>';
      var ref = fila.children[idxIzq];
      if (ref) fila.insertBefore(celda, ref);
      else fila.appendChild(celda);
    });
  } else if (accion === 'borde') {
    var bordes = ['1px solid #cbd5e1', '2px solid #0f766e', '2px dashed #0d9488', 'none'];
    var bordeActual = td.style.border || '';
    var siguiente = bordes[0];
    for (var b = 0; b < bordes.length; b++) {
      if (bordes[b] === bordeActual) siguiente = bordes[(b + 1) % bordes.length];
    }
    td.style.border = siguiente;
    tabla.style.borderCollapse = 'collapse';
  } else if (accion === 'eliminarTabla') {
    tabla.remove();
  }
  if (typeof marcarIDevicesTocados_ === 'function') marcarIDevicesTocados_();
}

function colorearCeldaEditor(btn) {
  var wrap = btn && btn.closest ? btn.closest('.editor-enriquecido-wrap') : null;
  var editor = wrap ? wrap.querySelector('.campo-editor-rich') : null;

function htmlTablaLibre_(filas, cols) {
  filas = Math.max(1, Math.min(12, parseInt(filas, 10) || 3));
  cols = Math.max(1, Math.min(8, parseInt(cols, 10) || 3));
  var cabeza = '';
  var c;
  for (c = 0; c < cols; c++) {
    cabeza += '<th style="padding:8px 12px;border:1px solid #cbd5e1;background:#f1f5f9;text-align:left;font-weight:700;">Columna ' + (c + 1) + '</th>';
  }
  var cuerpo = '';
  var r;
  var filasCuerpo = Math.max(1, filas - 1);
  for (r = 0; r < filasCuerpo; r++) {
    cuerpo += '<tr>';
    for (c = 0; c < cols; c++) cuerpo += '<td style="padding:8px 12px;border:1px solid #cbd5e1;"><br></td>';
    cuerpo += '</tr>';
  }
  return '<table class="editor-tabla-estilo" style="width:100%;border-collapse:collapse;margin:12px 0;border:1.5px solid #cbd5e1;">' +
    '<thead><tr>' + cabeza + '</tr></thead><tbody>' + cuerpo + '</tbody></table><p><br></p>';
}

    });

function rellenarTarjetaExe_(card, datos) {

      card.style.backgroundColor = datos.estilo.bg;
    }
    if (datos.estilo.color) {

      card.style.color = datos.estilo.color;
    }
    if (datos.estilo.align) {
      card.setAttribute('data-text-align', datos.estilo.align);
      card.style.textAlign = datos.estilo.align;
    }
  }
  var titulo = campoTarjetaExe_(card, 'titulo');
  var cuerpo = campoTarjetaExe_(card, 'cuerpo');
  if (titulo && datos.titulo) titulo.value = datos.titulo;
  if (cuerpo && datos.cuerpo) escribirCampoBloque_(cuerpo, datos.cuerpo);
  var extra = datos.extra || {};
  var tipo = card.getAttribute('data-tipo');
  if (tipo === 'listening') {
    var url = card.querySelector('.inp-audio-url');
    var tx = card.querySelector('.txt-transcripcion');
    var rx = card.querySelector('.txt-reactivo');

  } else if (tipo === 'flashcards') {
    var lista = card.querySelector('.lista-flashcards');
    if (lista) lista.innerHTML = '';
    (extra.pares || []).forEach(function (par) { agregarParFlashcard_(card, par); });
    if (!extra.pares || !extra.pares.length) agregarParFlashcard_(card, null);
  } else if (tipo === 'sim_ofimatica') {
    card.querySelectorAll('.celda-hoja').forEach(function (celda) {

      if (extra.celdas && extra.celdas[ref] != null) celda.value = extra.celdas[ref];

    var cuerpoTabla = card.querySelector('.tabla-notion tbody');

  } else if (tipo === 'galeria') {

    if (extra.imgUrl) {

function insertarBloqueExe_(tipo, datos, paginaId) {
  var t = String(tipo || '').toLowerCase();
  var base = ALIAS_IDEVICE_EXE_[t] || t;
  var antes = document.querySelectorAll('#contenedorIDevicesDinamicos .idevice-card').length;
  if (BASE_IDEVICE_EXE_[base] && typeof window._insertariDeviceOriginal_ === 'function') {
    window._insertariDeviceOriginal_(base);
  }
  var card = null;
  if (document.querySelectorAll('#contenedorIDevicesDinamicos .idevice-card').length > antes) {
    card = ultimaTarjetaExe_();
  } else if (META_TARJETA_EXE_[t]) {
    card = crearTarjetaCurricular_(t, datos);
  }
  if (!card) return null;
  card.setAttribute('data-pagina-id', String(paginaId != null ? paginaId : idPaginaActivaExe_()));
  if (t === 'encuesta' || base === 'encuesta') {
    card.classList.add('idevice-bloque');
    card.setAttribute('data-tipo', 'encuesta');
    if (typeof completarIDeviceEncuesta_ === 'function') completarIDeviceEncuesta_(card, datos || {});
  }
  if (datos) rellenarTarjetaExe_(card, datos);
  erradicarBarraModularExe_();
  if (typeof colocarModuloEnColumnaActiva_ === 'function') colocarModuloEnColumnaActiva_(card);
  repintarDivisoresExe_();
  return card;
}

function repintarDivisoresExe_() {
  var cont = document.getElementById('contenedorIDevicesDinamicos');
  if (!cont) return;
  cont.querySelectorAll('.divisor-insertar-bloque').forEach(function (d) { d.remove(); });
  var cards = [];
  cont.querySelectorAll('.idevice-card').forEach(function (c) {
    if (c.style.display === 'none') return;
    cards.push(c);
  });
  cards.forEach(function (card, i) {
    if (i >= cards.length - 1) return;
    var div = document.createElement('div');
    div.className = 'divisor-insertar-bloque';
    var boton = document.createElement('button');
    boton.type = 'button';
    boton.className = 'btn-tb';
    boton.textContent = '+';
    boton.setAttribute('aria-label', 'Insertar bloque aquí');
    boton.addEventListener('mousedown', function (ev) { ev.preventDefault(); });
    boton.addEventListener('click', function (ev) {
      ev.stopPropagation();
      abrirMenuDivisorExe_(div, i);
    });
    div.appendChild(boton);
    if (card.nextSibling) card.parentNode.insertBefore(div, card.nextSibling);
    else card.parentNode.appendChild(div);
  });
}

function abrirMenuDivisorExe_(divisor, idx) {
  var viejo = document.getElementById('menuDivisorExe');
  if (viejo) viejo.remove();
  var menu = document.createElement('div');
  menu.id = 'menuDivisorExe';
  menu.className = 'cat-items';
  [
    ['texto_dua', 'Lectura DUA'], ['callout', 'Recuadro'], ['timeline', 'Fases'],
    ['tabla_notion', 'Tabla'], ['toggle_notion', 'Desplegable'], ['flashcards', 'Flashcards'],
    ['video_local', 'Video local'], ['h5p_interactivo', 'H5P'], ['quiz_evaluativo', 'Quiz']
  ].forEach(function (it) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'idevice-pill-add';
    b.textContent = it[1];
    b.addEventListener('mousedown', function (ev) { ev.preventDefault(); });
    b.addEventListener('click', function () {
      insertarBloqueContextual_(idx, it[0]);
      var abierto = document.getElementById('menuDivisorExe');
      if (abierto) abierto.remove();
    });
    menu.appendChild(b);
  });
  divisor.appendChild(menu);
}

function insertarBloqueContextual_(idx, tipo) {
  asegurarPaginasExe_();
  var card = insertarBloqueExe_(tipo, null, idPaginaActivaExe_());
  if (!card) return null;
  var cont = document.getElementById('contenedorIDevicesDinamicos');
  var activos = [];
  if (cont) {
    cont.querySelectorAll('.idevice-card').forEach(function (c) {
      if (c !== card && c.style.display !== 'none') activos.push(c);
    });
  }
  var ancla = activos[idx];
  if (ancla && cont) {
    var siguiente = ancla.nextElementSibling;
    while (siguiente && !siguiente.classList.contains('idevice-card')) siguiente = siguiente.nextElementSibling;
    if (siguiente) cont.insertBefore(card, siguiente);
    else cont.appendChild(card);
  }
  var pag = window.paginasSesionActiva_[window._nodoSesionActivo_ || 0];
  if (pag) {
    if (!Array.isArray(pag.idevices)) pag.idevices = [];
    var nuevoBloque = leerTarjetaExe_(card);
    var sinNuevo = pag.idevices.filter(function (b) { return !b || b.id !== card.id; });
    if (!sinNuevo.length && activos.length) sinNuevo = activos.map(leerTarjetaExe_);
    pag.idevices = sinNuevo;
    pag.idevices.splice(idx + 1, 0, nuevoBloque);
  }
  repintarDivisoresExe_();
  actualizarContadorIDevicesExe_();
  return card;
}

function capturarEstadoExe_() {
  asegurarPaginasExe_();
  if (window.tinymce && typeof window.tinymce.triggerSave === 'function') {
    try { window.tinymce.triggerSave(); } catch (e) {}
  }
  var paginas = window.paginasSesionActiva_.map(function (p) {
    return { id: p.id, titulo: p.titulo, nivel: p.nivel || 0, idevices: [] };
  });
  var porId = {};
  paginas.forEach(function (p) { porId[String(p.id)] = p; });
  var cont = document.getElementById('contenedorIDevicesDinamicos');
  if (cont) {
    var filas = cont.querySelectorAll('.divi-row');
    if (filas.length > 0) {
      filas.forEach(function (fila) {
        var layout = fila.getAttribute('data-distribucion') || 'col-1';
        var cols = fila.querySelectorAll('.divi-column');
        var colArrays = [];
        var filaPaginaId = fila.getAttribute('data-pagina-id');
        var hayContenido = false;
        cols.forEach(function (col) {
          var bloquesCol = [];
          col.querySelectorAll('.idevice-card').forEach(function (card) {
            var b = leerTarjetaExe_(card);
            bloquesCol.push(b);
            hayContenido = true;
            if (!filaPaginaId && b.paginaId) filaPaginaId = b.paginaId;
          });
          colArrays.push(bloquesCol);
        });
        if (hayContenido) {
          var destPid = filaPaginaId != null ? String(filaPaginaId) : String(idPaginaActivaExe_());
          var dest = porId[destPid] || paginas[0];
          if (dest) {
            var estiloFila = {};
            var bgF = fila.getAttribute('data-bg-color') || '';
            var colF = fila.getAttribute('data-text-color') || '';
            var alF = fila.getAttribute('data-text-align') || '';
            if (bgF) estiloFila.bg = bgF;
            if (colF) estiloFila.color = colF;
            if (alF) estiloFila.align = alF;
            dest.idevices.push({
              tipo: 'fila',
              layout: layout,
              columnas: colArrays,
              paginaId: destPid,
              estilo: estiloFila
            });
          }
        }
      });
      // Tarjetas sueltas que no estén dentro de ninguna .divi-row
      cont.querySelectorAll(':scope > .idevice-card, :scope > .divi-section > .idevice-card').forEach(function (card) {
        var bloque = leerTarjetaExe_(card);
        var dest = porId[String(bloque.paginaId)] || paginas[0];
        if (dest) dest.idevices.push(bloque);
      });
    } else {
      cont.querySelectorAll('.idevice-card').forEach(function (card) {
        var bloque = leerTarjetaExe_(card);
        var dest = porId[String(bloque.paginaId)] || paginas[0];
        if (dest) dest.idevices.push(bloque);
      });
    }
  }
  var estado = {
    paginas: paginas,
    nodoActivo: window._nodoSesionActivo_ || 0,
    colorFondo: window._colorFondoSesionActiva_ || '#ffffff'
  };
  paginas.forEach(function (p, i) {
    if (window.paginasSesionActiva_[i]) window.paginasSesionActiva_[i].idevices = p.idevices;
  });
  window._extraExelearning_ = estado;
  return estado;
}

function deserializarIDevicesSesion_(data) {
  if (!data || !data.paginas || !data.paginas.length) return;
  if (data.colorFondo) {
    cambiarColorFondoLienzo_(data.colorFondo);
  } else {
    cambiarColorFondoLienzo_('#ffffff');
  }
  var momentos = ['sesApertura', 'sesDesarrollo', 'sesActividad', 'sesCierre'].map(function (id) {
    var el = document.getElementById(id);
    return { el: el, valor: el ? el.value : null };
  });
  window.paginasSesionActiva_ = data.paginas.map(function (p, i) {
    return {
      id: p.id != null ? p.id : i,
      titulo: p.titulo || ('Página ' + (i + 1)),
      nivel: Math.max(0, Math.min(2, Number(p.nivel) || 0)),
      idevices: []
    };
  });
  window._nodoSesionActivo_ = Math.max(0, Math.min(window.paginasSesionActiva_.length - 1, Number(data.nodoActivo) || 0));

  var cont = document.getElementById('contenedorIDevicesDinamicos');
  if (cont) {
    cont.innerHTML = '';
  }
  window._st90RestaurandoExe_ = true;
  window._st90RestaurandoEnc_ = true;
  if (typeof asegurarSeccionDivi_ === 'function') asegurarSeccionDivi_();

  data.paginas.forEach(function (p, i) {
    var paginaId = window.paginasSesionActiva_[i] ? window.paginasSesionActiva_[i].id : i;
    (p.idevices || []).forEach(function (item) {
      if (!item) return;
      if (item.tipo === 'fila') {
        var fila = (typeof insertarFilaDivi_ === 'function') ? insertarFilaDivi_(item.layout || 'col-1', null) : null;
        if (fila) {
          fila.setAttribute('data-pagina-id', String(paginaId));
          if (item.estilo) {
            if (item.estilo.bg) {
              fila.setAttribute('data-bg-color', item.estilo.bg);
              fila.style.backgroundColor = item.estilo.bg;
            }
            if (item.estilo.color) {
              fila.setAttribute('data-text-color', item.estilo.color);
              fila.style.color = item.estilo.color;
            }
            if (item.estilo.align) {
              fila.setAttribute('data-text-align', item.estilo.align);
              fila.style.textAlign = item.estilo.align;
            }
          }
          var cols = fila.querySelectorAll('.divi-column');
          (item.columnas || []).forEach(function (bloquesCol, cIdx) {
            var col = cols[cIdx];
            if (!col) return;
            (bloquesCol || []).forEach(function (b) {
              if (!b) return;
              window._columnaObjetivoActiva_ = col;
              var card = insertarBloqueExe_(b.tipo, b, paginaId);
              if (card && typeof colocarModuloEnColumnaActiva_ === 'function') {
                colocarModuloEnColumnaActiva_(card);
              }
            });
          });
        }
      } else {
        insertarBloqueExe_(item.tipo, item, paginaId);
      }
    });
  });
  window._st90RestaurandoEnc_ = false;
  window._st90RestaurandoExe_ = false;
  if (typeof adoptarTarjetasEnDivi_ === 'function') adoptarTarjetasEnDivi_();
  renderArbolSesion_();
  aplicarFiltroPaginaExe_();
  momentos.forEach(function (m) {
    if (m.el && m.valor != null && m.el.value !== m.valor) m.el.value = m.valor;
  });
}

function _escPdf_(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

  }
  if (!gradoRaw) {
    gradoRaw = (document.getElementById('planGrado') && document.getElementById('planGrado').value) ||
               (plan && (plan.Grado || plan.grado)) || '1';

function filtrarLibrosSEPPorAsignaturaYGrado_(ctx, mostrarTodosGrado) {
  var c = ctx || obtenerContextoPlanActivoLibrosSEP_();
  var gradoBuscado = c.grado || 1;
  var asigNorm = c.asignaturaNorm || '';
  var campoNorm = _normAsigLibroSEP_(c.campo);

  var delGrado = CATALOGO_LIBROS_SEP_POR_ASIGNATURA_FASE6_.filter(function (lib) {
    return lib.grado === gradoBuscado;
  });

  if (mostrarTodosGrado) return delGrado;

  // 1) Coincidencia exacta por asignatura + grado
  if (asigNorm) {
    var porAsignatura = delGrado.filter(function (lib) {
      return (lib.asignaturas || []).some(function (kw) {
        var kwNorm = _normAsigLibroSEP_(kw);
        return asigNorm.indexOf(kwNorm) !== -1 || kwNorm.indexOf(asigNorm) !== -1;
      });
    });
    if (porAsignatura.length > 0) return porAsignatura;
  }

  // 2) Respaldo por Campo Formativo + grado si la asignatura no está especificada
  if (campoNorm) {
    var porCampo = delGrado.filter(function (lib) {
      return _normAsigLibroSEP_(lib.campo) === campoNorm;
    });
    if (porCampo.length > 0) return porCampo;
  }

  return delGrado;
}

function _indiceCapituloSugeridoParaPlan_(libro, ctx) {

  var textoPlan = _normAsigLibroSEP_((ctx && ctx.titulo ? ctx.titulo : '') + ' ' + (ctx && ctx.pda ? ctx.pda : '')).toLowerCase();
  if (!textoPlan) return 0;
  var mejorIdx = 0;
  var mejorPuntos = 0;
  libro.capitulos.forEach(function (cap, i) {
    var pts = 0;
    (cap.keywords || []).forEach(function (kw) {
      if (textoPlan.indexOf(_normAsigLibroSEP_(kw).toLowerCase()) !== -1) pts += 2;
    });
    if (pts > mejorPuntos) {
      mejorPuntos = pts;
      mejorIdx = i;
    }
  });
  return mejorIdx;
}
