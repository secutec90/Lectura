        document.getElementById('login').classList.add('oculto');
        document.getElementById('panel').classList.remove('oculto');
        if (r.rol === 'alumno') {
          document.getElementById('vistaAlu').classList.remove('oculto');
          document.getElementById('vistaMae').classList.add('oculto');
          const cinta = document.getElementById('cintaClase');
          if (cinta) cinta.classList.add('oculto');
          document.querySelectorAll('#tabsMae button').forEach(function (b) { b.classList.add('oculto'); });
          fechaAluCal = fechaLocalClase();
          selAluSlot = null;
          modoVistaAlu = 'dia';
          reproduciendoAlu = false;
          pendingFocoAlu_ = '';
          cargarContextoAlu();
        } else {
          document.getElementById('vistaAlu').classList.add('oculto');
          document.getElementById('vistaMae').classList.remove('oculto');
          const tabAcc = document.getElementById('btnTabAccesos');
          if (tabAcc) tabAcc.classList.toggle('oculto', r.rol !== 'admin');
          const tabAlu = document.getElementById('btnTabAluAcc');
          if (tabAlu) tabAlu.classList.toggle('oculto', r.rol !== 'admin');
          const wrapMae = document.getElementById('cajaMaeAccWrap');
          if (wrapMae) wrapMae.classList.toggle('oculto', r.rol !== 'admin');
          iniciarCintaClase_();
          tabN1Clase('clases', document.getElementById('btnN1Clases'));
        }
      }).catch(function (e) {
        if (err) err.textContent = (e && e.message) || String(e);
      });
    }

    function salirClase() {
      detenerVoz();
      gsRun('cerrarSesionClase', tokenClase).catch(function () {});
      tokenClase = '';
      location.reload();
    }

    function fechaLocalClase() {
      const d = new Date();
      const m = ('0' + (d.getMonth() + 1)).slice(-2);
      const dia = ('0' + d.getDate()).slice(-2);
      return d.getFullYear() + '-' + m + '-' + dia;
    }

    function cargarContextoAlu() {
      gsRun('contextoClaseAlumno', tokenClase, fechaAluCal || fechaLocalClase()).then(function (r) {
        ctxAlu = r;
        const hoy = fechaLocalClase();
        const enCurso = slotEnCursoAlu_(r);
        if (!selAluSlot) {
          if ((fechaAluCal || hoy) === hoy) selAluSlot = enCurso;
        } else {
          selAluSlot = buscarSlotCalAlu_(r, selAluSlot.fecha, selAluSlot.idHorario) || null;
          if (!selAluSlot && (fechaAluCal || hoy) === hoy) selAluSlot = enCurso;
        }
        pintarAlu(r);
        pintarHorarioAlu_(r);
      }).catch(function (e) {
        toast((e && e.message) || String(e), 'error');
      });
    }

    function slotEnCursoAlu_(r) {
      const dias = (r && r.calendario) || [];
      for (let i = 0; i < dias.length; i++) {
        const filas = dias[i].horario || [];
        for (let j = 0; j < filas.length; j++) {
          if (filas[j].enCurso) return filas[j];
        }
      }
      return (r && r.clase) || null;
    }

    function buscarSlotCalAlu_(r, fecha, idHorario) {
      const fe = String(fecha || '').slice(0, 10);
      const id = String(idHorario == null ? '' : idHorario);
      const dias = (r && r.calendario) || [];
      for (let i = 0; i < dias.length; i++) {
        const filas = dias[i].horario || [];
        for (let j = 0; j < filas.length; j++) {
          const h = filas[j];
          const feH = String(h.fecha || '').slice(0, 10);
          const idH = String(h.idHorario == null ? '' : h.idHorario);
          if (idH === id && feH === fe) return h;
        }
      }
      return null;
    }

    function esHoyFechaAlu_() {
      return (fechaAluCal || fechaLocalClase()) === fechaLocalClase();
    }

    function minutosHmAlu_(hm) {
      const p = String(hm || '').split(':');
      const h = Number(p[0]);
      const m = Number(p[1] || 0);
      if (isNaN(h)) return 0;
      return (h * 60) + (isNaN(m) ? 0 : m);
    }

    function hayTextoAlu_(h) {
      if (!h) return false;
      if (h.publicado) return true;
      return !!(h.contenido && String(h.contenido.texto || '').trim());
    }

    function claseTerminadaAlu_(h, r) {
      if (!h || !h.fecha) return false;
      const hoy = fechaLocalClase();
      if (h.fecha < hoy) return true;
      if (h.fecha > hoy) return false;
      const ahora = minutosHmAlu_((r && r.hora) || '');
      return ahora >= minutosHmAlu_(h.horaFin);
    }

    function slotReproAlu_(h) {
      return !!(reproduciendoAlu && selAluSlot && h &&
        selAluSlot.idHorario === h.idHorario && selAluSlot.fecha === h.fecha);
    }

    function ordinalHoraAlu_(bloque) {
      const n = parseInt(String(bloque || '').replace(/\D/g, ''), 10);
      const nombres = ['', 'primera', 'segunda', 'tercera', 'cuarta', 'quinta', 'sexta', 'séptima', 'octava', 'novena', 'décima'];
      if (n >= 1 && n <= 10) return nombres[n] + ' hora';
      if (n) return n + 'ª hora';
      return 'hora';
    }

    function fechaLargaEsMx_(iso, capital) {
      const d = new Date(String(iso || '') + 'T12:00:00');
      if (isNaN(d.getTime())) return String(iso || '');
      const dias = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
      const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      let nom = dias[d.getDay()] || '';
      if (capital) nom = nom ? (nom.charAt(0).toUpperCase() + nom.slice(1)) : nom;
      let t = nom + ' ' + d.getDate() + ' de ' + meses[d.getMonth()];
      if (d.getFullYear() !== (new Date()).getFullYear()) t += ' de ' + d.getFullYear();
      return t;
    }

    function etqVelAlu_() {
      const base = (Math.abs(velVoz - 1) < 0.05) ? 'Velocidad: normal (1.0)' : ('Velocidad: ' + velVoz.toFixed(1));
      if (esClaseInglesAlu_()) return base + ' · Narrador: español o inglés, según el texto';
      return base;
    }

    function esAsignaturaInglesAlu_(nombre) {
      const n = String(nombre || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      return n.indexOf('ingles') >= 0 || n.indexOf('english') >= 0;
    }

    function esClaseInglesAlu_() {
      if (rolClase === 'alumno') {
        const cl = claseUsoAlu_();
        return esAsignaturaInglesAlu_(cl && cl.asignatura);
      }
      return esAsignaturaInglesAlu_(slotMaeSel && slotMaeSel.asignatura);
    }

    function idiomaVozClase_() {
      return esClaseInglesAlu_() ? 'en-US' : 'es-MX';
    }

    function elegirVozClase_(lang) {
      const voces = (window.speechSynthesis && window.speechSynthesis.getVoices()) || [];
      if (!voces.length) return null;
      let mejor = null;
      let ptsMejor = -1;
      voces.forEach(function (v) {
        const l = String(v.lang || '');
        const nom = String(v.name || '');
        let pts = 0;
        if (lang === 'en-US') {
          if (/^en-US/i.test(l)) pts += 40;
          else if (/en_US/i.test(l)) pts += 38;
          else if (/^en/i.test(l) && /US|America|United States/i.test(nom)) pts += 32;
          else if (/^en/i.test(l) && !/GB|UK|British|Australia|AU|India|IN/i.test(l + nom)) pts += 18;
          else if (/^en/i.test(l)) pts += 8;
          if (/Aria|Jenny|Guy|Zira|David|Google US English|Microsoft (Aria|Jenny|Guy|Zira|David)/i.test(nom)) pts += 8;
        } else {
          if (/^es-MX/i.test(l)) pts += 40;
          else if (/^es-419/i.test(l)) pts += 28;
          else if (/^es-US/i.test(l)) pts += 22;
          else if (/^es/i.test(l)) pts += 12;
          if (/Mexico|Sabina|Dalia|Google Español/i.test(nom)) pts += 6;
        }
        if (pts > ptsMejor) { ptsMejor = pts; mejor = v; }
      });
      return ptsMejor > 0 ? mejor : null;
    }

    function prepararVocesClase_() {
      if (!window.speechSynthesis) return;
      try { window.speechSynthesis.getVoices(); } catch (e) {}
    }

    function claveSlotAlu_(h) {
      if (!h) return '';
      return String(h.fecha || '').slice(0, 10) + '#' + String(h.idHorario == null ? '' : h.idHorario);
    }

    function enlazarClicksAlu_(raiz) {
      const caja = (typeof raiz === 'string') ? document.getElementById(raiz) : raiz;
      if (!caja) return;
      const nodos = caja.querySelectorAll('[data-alu-pick]');
      for (let i = 0; i < nodos.length; i++) {
        nodos[i].addEventListener('click', function () {
          elegirClaseAlu(this.getAttribute('data-alu-fecha'), this.getAttribute('data-alu-id'));
        });
      }
    }

    function etiquetasEstadoAlu_(h, r) {
      const out = [];
      if (!h) return out;
      if (slotReproAlu_(h)) out.push('Reproduciendo');
      if (h.enCurso) out.push('Ahora');
      else if (selAluSlot && claveSlotAlu_(selAluSlot) === claveSlotAlu_(h)) out.push('Seleccionada');
      if (hayTextoAlu_(h)) out.push('Contenido disponible');
      else out.push('Contenido no disponible');
      if (claseTerminadaAlu_(h, r) && !h.enCurso) out.push('Terminada');
      return out;
    }

    function fraseSlotAlu_(h, r) {
      if (!h) return '';
      let t = (h.asignatura || 'Clase') + '. ' + ordinalHoraAlu_(h.bloque) + '. De ' +
        (h.horaInicio || '') + ' a ' + (h.horaFin || '') + '.';
      if (h.maestro) t += ' Docente ' + h.maestro + '.';
      t += ' ' + etiquetasEstadoAlu_(h, r).join('. ') + '.';
      return t.replace(/\.\s*\./g, '.');
    }

    function jsOnclickAlu_(fecha, idHorario) {
      return 'elegirClaseAlu(' + JSON.stringify(String(fecha || '')) + ',' +
        JSON.stringify(String(idHorario || '')) + ')';
    }

    function claseUsoAlu_() {
      if (selAluSlot) return selAluSlot;
      if (esHoyFechaAlu_() && ctxAlu && ctxAlu.clase) return ctxAlu.clase;
      return null;
    }

    function contenidoUsoAlu_() {
      const cl = claseUsoAlu_();
      if (cl && cl.contenido) return cl.contenido;
      return null;
    }

    function pintarAlu(r) {
      const alu = (r && r.alumno) || {};
      const saludo = document.getElementById('txtSaludoAlu');
      const grupo = document.getElementById('txtGrupoAlu');
      const titFe = document.getElementById('titFechaAlu');
      const nota = document.getElementById('txtFechaNotaAlu');
      const vel = document.getElementById('txtVelClase');
      const fe = fechaAluCal || fechaLocalClase();
      const hoy = fechaLocalClase();
      if (saludo) saludo.textContent = 'Hola, ' + (alu.nombre || '');
      if (grupo) grupo.textContent = alu.grupo ? ('Grupo ' + alu.grupo) : '';
      if (titFe) {
        titFe.textContent = (modoVistaAlu === 'semana' && r && r.semanaInicio)
          ? ('Semana ' + formatearRangoDdMmAa_(r.semanaInicio, r.semanaFin))
          : fechaLargaEsMx_(fe, true);
      }
      if (nota) {
        if (modoVistaAlu === 'semana') {
          nota.textContent = (r && r.semanaInicio && r.semanaFin && hoy >= r.semanaInicio && hoy <= r.semanaFin)
            ? 'Esta es la semana actual.'
            : 'Estás viendo otra semana.';
        } else {
          nota.textContent = (fe === hoy) ? 'Hoy' : 'Estás viendo otro día';
        }
      }
      if (vel) vel.textContent = etqVelAlu_();
      const bDia = document.getElementById('btnVistaDiaAlu');
      const bSem = document.getElementById('btnVistaSemanaAlu');
      if (bDia) {
        bDia.classList.toggle('activo', modoVistaAlu === 'dia');
        bDia.setAttribute('aria-pressed', modoVistaAlu === 'dia' ? 'true' : 'false');
      }
      if (bSem) {
        bSem.classList.toggle('activo', modoVistaAlu === 'semana');
        bSem.setAttribute('aria-pressed', modoVistaAlu === 'semana' ? 'true' : 'false');
      }
      const ant = document.getElementById('btnAluAnt');
      const sigBtn = document.getElementById('btnAluSig');
      if (ant) ant.setAttribute('aria-label', modoVistaAlu === 'dia' ? 'Día anterior' : 'Semana anterior');
      if (sigBtn) sigBtn.setAttribute('aria-label', modoVistaAlu === 'dia' ? 'Día siguiente' : 'Semana siguiente');
      pintarHeroAlu_(r);
    }

    function pintarHeroAlu_(r) {
      const caja = document.getElementById('cajaHeroAlu');
      const play = document.getElementById('cajaPlayAlu');
      const vis = document.getElementById('textoClaseVis');
      if (!caja) return;
      const cl = claseUsoAlu_();
      const sig = r && r.siguiente;
      const hoy = fechaLocalClase();
      const viendoHoy = esHoyFechaAlu_();
      let html = '';
      if (cl) {
        html += '<h2 id="titHeroAlu">' + (cl.enCurso ? 'Clase actual' : 'Clase seleccionada') + '</h2>';
        html += '<div class="alu-hero-fila">';
        html += '<p class="alu-asig">' + escaparHtml(cl.asignatura || 'Clase') + '</p>';
        html += '<p>' + escaparHtml((cl.horaInicio || '') + '–' + (cl.horaFin || '') +
          (cl.maestro ? (' · ' + cl.maestro) : '')) + '</p>';
        etiquetasEstadoAlu_(cl, r).forEach(function (e) {
          html += '<span class="alu-etq">' + escaparHtml(e) + '</span>';
        });
        html += '</div>';
      } else if (viendoHoy) {
        html += '<h2 id="titHeroAlu">Clase actual</h2>';
        html += '<p>No tienes una clase en este momento.</p>';
        if (sig) {
          const sigRico = buscarSlotCalAlu_(r, sig.fecha || hoy, sig.idHorario) || sig;
          html += '<p>Próxima clase: ' + escaparHtml(sigRico.asignatura || '') + ' · ' +
            escaparHtml(sigRico.horaInicio || '') + '</p>';
          if (hayTextoAlu_(sigRico) && sigRico.idHorario) {
            html += '<p><button type="button" data-alu-pick="1" data-alu-fecha="' +
              escaparHtml(String(sigRico.fecha || hoy).slice(0, 10)) + '" data-alu-id="' +
              escaparHtml(String(sigRico.idHorario)) + '">Ver clase</button></p>';
          }
        }
      } else {
        html += '<h2 id="titHeroAlu">Clase</h2>';
        html += '<p>Elige una clase del horario de este día.</p>';
      }
      caja.innerHTML = html;
      enlazarClicksAlu_(caja);
      if (play) play.classList.toggle('oculto', !cl);
      const vel = document.getElementById('txtVelClase');
      if (vel) vel.classList.toggle('oculto', !cl);
      const btnPlay = document.getElementById('btnPlayClase');
      if (btnPlay) btnPlay.disabled = !(cl && hayTextoAlu_(cl));
      const cont = contenidoUsoAlu_();
      if (vis) vis.textContent = (cont && cont.texto) ? ((cont.titulo ? (cont.titulo + '\n\n') : '') + cont.texto) : '';
    }

    function textoClaseParaVoz_() {
      const cont = contenidoUsoAlu_();
      if (!cont || !String(cont.texto || '').trim()) return '';
      return ((cont.titulo ? (cont.titulo + '. ') : '') + cont.texto).trim();
    }

    function puntuarIdiomaTexto_(t) {
      const s = ' ' + String(t || '').toLowerCase().normalize('NFC') + ' ';
      let es = 0;
      let en = 0;
      if (/[áéíóúñü¿¡]/.test(s)) es += 8;
      const palEs = [' el ', ' la ', ' los ', ' las ', ' de ', ' que ', ' y ', ' en ', ' un ', ' una ', ' del ', ' con ', ' por ', ' para ', ' es ', ' se ', ' no ', ' su ', ' al ', ' lo ', ' como ', ' mas ', ' más ', ' pero ', ' sus ', ' le ', ' ha ', ' me ', ' si ', ' ya ', ' fue ', ' este ', ' hay ', ' esta ', ' entre ', ' cuando ', ' muy ', ' sin ', ' sobre ', ' tambien ', ' también ', ' hoy ', ' clase ', ' materiales ', ' docente ', ' nosotros ', ' ustedes ', ' también '];
      const palEn = [' the ', ' a ', ' an ', ' of ', ' to ', ' and ', ' in ', ' is ', ' you ', ' that ', ' it ', ' for ', ' on ', ' are ', ' with ', ' as ', ' this ', ' be ', ' at ', ' or ', ' from ', ' we ', ' they ', ' have ', ' has ', ' not ', ' but ', ' what ', ' when ', ' your ', ' can ', ' will ', ' today ', ' class ', ' hello ', ' there ', ' their ', ' these ', ' those ', ' because ', ' about '];
      palEs.forEach(function (w) { if (s.indexOf(w) >= 0) es += 2; });
      palEn.forEach(function (w) { if (s.indexOf(w) >= 0) en += 2; });
      if (/\b(ción|ciones|mente|ción|ción)\b/.test(s)) es += 4;
      if (/\b\w+ción\b/.test(s)) es += 3;
      if (/\b(ing|tion|ness|fully)\b/.test(s)) en += 2;
      if (en > es) return 'en-US';
      return 'es-MX';
    }

    function trozosIdiomaTexto_(texto) {
      const bruto = String(texto || '').replace(/\r/g, '').trim();
      if (!bruto) return [];
      const partes = bruto.replace(/([.!?…])\s+/g, '$1\n').split(/\n+/).map(function (p) {
        return p.trim();
      }).filter(Boolean);
      const out = [];
      partes.forEach(function (p) {
        const lang = puntuarIdiomaTexto_(p);
        if (out.length && out[out.length - 1].lang === lang) {
          out[out.length - 1].texto += ' ' + p;
        } else {
          out.push({ lang: lang, texto: p });
        }
      });
      return out;
    }

    function hablarTexto(texto) {
      detenerVoz();
      if (!window.speechSynthesis) {
        toast('Este navegador no puede leer en voz alta. Abre Chrome.', 'error');
        return;
      }
      if (esClaseInglesAlu_()) {
        colaVozAlu_ = trozosIdiomaTexto_(texto);
        if (!colaVozAlu_.length) colaVozAlu_ = [{ lang: 'en-US', texto: texto }];
      } else {
        colaVozAlu_ = [{ lang: 'es-MX', texto: texto }];
      }
      function arrancar() {
        hablarSiguienteTrozosAlu_();
      }
      const hayVoces = (window.speechSynthesis.getVoices() || []).length > 0;
      if (hayVoces) {
        arrancar();
        return;
      }
      let hecho = false;
      const go = function () {
        if (hecho) return;
        hecho = true;
        arrancar();
      };
      if (typeof window.speechSynthesis.onvoiceschanged !== 'undefined') {
        window.speechSynthesis.onvoiceschanged = function () {
          window.speechSynthesis.onvoiceschanged = null;
          go();
        };
      }
      window.setTimeout(go, 500);
    }

    function hablarSiguienteTrozosAlu_() {
      if (!colaVozAlu_.length) {
        reproduciendoAlu = false;
        if (ctxAlu) pintarHeroAlu_(ctxAlu);
        return;
      }
      const t = colaVozAlu_.shift();
      reproduciendoAlu = true;
      utterClase = new SpeechSynthesisUtterance(t.texto);
      utterClase.lang = t.lang;
      const voz = elegirVozClase_(t.lang);
      if (voz) utterClase.voice = voz;
      utterClase.rate = velVoz;
      utterClase.onend = function () { hablarSiguienteTrozosAlu_(); };
      utterClase.onerror = function () {
        colaVozAlu_ = [];
        reproduciendoAlu = false;
      };
      window.speechSynthesis.speak(utterClase);
      if (ctxAlu) pintarHeroAlu_(ctxAlu);
    }

    function hablarClase() {
      if (!ctxAlu) { cargarContextoAlu(); return; }
      const t = textoClaseParaVoz_();
      if (!t) {
        anunciar('Esta clase no tiene contenido publicado.');
        return;
      }
      anunciar('Reproduciendo la clase.');
      hablarTexto(t);
    }

    function pausarClase() {
      if (!window.speechSynthesis) return;
      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
        anunciar('Reproducción reanudada.');
      } else if (window.speechSynthesis.speaking) {
        window.speechSynthesis.pause();
        anunciar('Reproducción en pausa.');
      }
    }

    function repetirClase() { hablarClase(); }

    function cambiarVelocidadClase(d) {
      velVoz = Math.max(0.6, Math.min(1.4, Math.round((velVoz + d) * 10) / 10));
      const el = document.getElementById('txtVelClase');
      if (el) el.textContent = etqVelAlu_();
      anunciar(etqVelAlu_());
      if (window.speechSynthesis && window.speechSynthesis.speaking && !window.speechSynthesis.paused) hablarClase();
    }

    function detenerVoz() {
      colaVozAlu_ = [];
      if (utterClase) {
        utterClase.onend = null;
        utterClase.onerror = null;
      }
      try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
      utterClase = null;
    }

    function detenerClaseAlu() {
      detenerVoz();
      reproduciendoAlu = false;
      anunciar('Reproducción detenida.');
      if (ctxAlu) pintarHeroAlu_(ctxAlu);
    }

    function cambiarVistaAlu(modo) {
      modoVistaAlu = (modo === 'semana') ? 'semana' : 'dia';
      if (ctxAlu) {
        pintarAlu(ctxAlu);
        pintarHorarioAlu_(ctxAlu);
      }
    }

    function moverFechaAlu(delta) {
      const fe = fechaAluCal || fechaLocalClase();
      const d = new Date(fe + 'T12:00:00');
      if (isNaN(d.getTime())) return;
      d.setDate(d.getDate() + (Number(delta) * (modoVistaAlu === 'semana' ? 7 : 1)));
      fechaAluCal = fechaLocalDesde_(d);
      selAluSlot = null;
      pendingFocoAlu_ = 'fecha';
      cargarContextoAlu();
    }

    function moverSemanaAlu(delta) {
      const fe = fechaAluCal || fechaLocalClase();
      const d = new Date(fe + 'T12:00:00');
      if (isNaN(d.getTime())) return;
      d.setDate(d.getDate() + (Number(delta) * 7));
      fechaAluCal = fechaLocalDesde_(d);
      selAluSlot = null;
      pendingFocoAlu_ = 'fecha';
      cargarContextoAlu();
    }

    function irHoyAlu() {
      fechaAluCal = fechaLocalClase();
      selAluSlot = null;
      pendingFocoAlu_ = 'fecha';
      cargarContextoAlu();
    }

    function pintarHorarioAlu_(r) {
      const lista = document.getElementById('horarioAluLista');
      const cal = document.getElementById('calAlu');
      const sr = document.getElementById('horarioAluSr');
      const tit = document.getElementById('titHorarioAlu');
      const esDia = modoVistaAlu === 'dia';
      const fe = fechaAluCal || fechaLocalClase();
      if (tit) {
        tit.textContent = esDia
          ? (esHoyFechaAlu_() ? 'Horario de hoy' : ('Horario del ' + fechaLargaEsMx_(fe, false)))
          : 'Horario de la semana';
      }
      if (lista) lista.classList.toggle('oculto', !esDia);
      if (cal) cal.classList.toggle('oculto', esDia);
      if (esDia) {
        pintarListaDiaAlu_(r);
        if (sr) sr.innerHTML = '';
      } else {
        pintarCalendarioAlu_(r);
        if (sr) sr.innerHTML = listaSrSemanaAlu_(r);
      }
      if (pendingFocoAlu_ === 'fecha') {
        anunciar((esDia ? fechaLargaEsMx_(fe, true) : (tit ? tit.textContent : 'Semana')) +
          (esHoyFechaAlu_() && esDia ? '. Hoy.' : '.'));
      }
      aplicarFocoAlu_();
    }

    function diaCalAlu_(r, fecha) {
      const dias = (r && r.calendario) || [];
      for (let i = 0; i < dias.length; i++) {
        if (dias[i].fecha === fecha) return dias[i];
      }
      return null;
    }

    function pintarListaDiaAlu_(r) {
      const caja = document.getElementById('horarioAluLista');
      if (!caja) return;
      const fe = fechaAluCal || fechaLocalClase();
      const dia = diaCalAlu_(r, fe);
      const filas = ((dia && dia.horario) || []).slice().sort(function (a, b) {
        return minutosHmAlu_(a.horaInicio) - minutosHmAlu_(b.horaInicio);
      });
      if (!filas.length) {
        caja.innerHTML = '<p class="hint">No hay clases este día.</p>';
        return;
      }
      const selClave = selAluSlot ? claveSlotAlu_(selAluSlot) : '';
      let html = '<ol class="alu-horario-lista">';
      filas.forEach(function (h) {
        const clave = claveSlotAlu_(h);
        const etqs = etiquetasEstadoAlu_(h, r);
        const cls = (h.enCurso ? ' ahora' : '') + (clave === selClave ? ' sel' : '') +
          (slotReproAlu_(h) ? ' repro' : '') + (claseTerminadaAlu_(h, r) ? ' terminada' : '');
        const sel = clave === selClave;
        const fe = String(h.fecha || '').slice(0, 10);
        const idH = String(h.idHorario == null ? '' : h.idHorario);
        html += '<li><button type="button" class="alu-clase' + cls + '" data-alu-pick="1" data-alu-clave="' +
          escaparHtml(clave) + '" data-alu-fecha="' + escaparHtml(fe) + '" data-alu-id="' + escaparHtml(idH) + '"' +
          ' aria-pressed="' + (sel ? 'true' : 'false') + '"' +
          (sel ? ' aria-current="true"' : '') +
          ' aria-label="' + escaparHtml(fraseSlotAlu_(h, r) + (sel ? ' Seleccionada.' : ' Botón seleccionar.')) + '">';
        html += '<span class="alu-fila1">';
        html += '<span class="alu-hora">' + escaparHtml(h.horaInicio || '') + '</span>';
        html += '<span class="alu-datos">';
        html += '<span class="alu-asig-mini">' + escaparHtml(h.asignatura || 'Clase') + '</span>';
        html += '<span class="alu-meta">' + escaparHtml((h.maestro ? (h.maestro + ' · ') : '') +
          (h.horaInicio || '') + '–' + (h.horaFin || '')) + '</span>';
        html += '</span>';
        html += '<span class="alu-accion">' + (sel ? 'Seleccionada' : 'Seleccionar') + '</span>';
        html += '</span>';
        if (etqs.length) html += '<span class="alu-etq">' + escaparHtml(etqs.join(' · ')) + '</span>';
        html += '</button></li>';
      });
      html += '</ol>';
      caja.innerHTML = html;
      enlazarClicksAlu_(caja);
    }

    function listaSrSemanaAlu_(r) {
      const dias = (r && r.calendario) || [];
      if (!dias.length) return '<p>No hay horario publicado para tu grupo en esta semana.</p>';
      let html = '<h3>Horario de la semana en lista</h3>';
      dias.forEach(function (d) {
        html += '<h4>' + escaparHtml(fechaLargaEsMx_(d.fecha, true)) + (d.hoy ? '. Hoy.' : '.') + '</h4>';
        const filas = (d.horario || []).slice().sort(function (a, b) {
          return minutosHmAlu_(a.horaInicio) - minutosHmAlu_(b.horaInicio);
        });
        if (!filas.length) {
          html += '<p>No hay clases.</p>';
          return;
        }
        html += '<ol>';
        filas.forEach(function (h) {
          html += '<li>' + escaparHtml(fraseSlotAlu_(h, r)) + '</li>';
        });
        html += '</ol>';
      });
      return html;
    }

    function aplicarFocoAlu_() {
      const dest = pendingFocoAlu_;
      pendingFocoAlu_ = '';
      if (!dest) return;
      let el = null;
      if (dest === 'fecha') el = document.getElementById('titFechaAlu');
      else if (dest.indexOf('slot:') === 0) {
        const clave = dest.slice(5);
        const nodos = document.querySelectorAll('button[data-alu-clave]');
        for (let i = 0; i < nodos.length; i++) {
          if (nodos[i].getAttribute('data-alu-clave') === clave) { el = nodos[i]; break; }
        }
      }
      if (el && typeof el.focus === 'function') el.focus();
    }

    function pintarCalendarioAlu_(r) {
      const caja = document.getElementById('calAlu');
      if (!caja) return;
      const dias = (r && r.calendario) || [];
      const bloques = (r && r.bloques) || [];
      const mapa = {};
      dias.forEach(function (d) {
        (d.horario || []).forEach(function (h) {
          mapa[claveCeldaCal_(d.fecha, h.idHorario)] = h;
          mapa[d.fecha + '#' + String(h.horaInicio || '') + '|' + String(h.horaFin || '')] = h;
        });
      });
      caja._mapa = mapa;
      if (!dias.length || !bloques.length) {
        caja.innerHTML = '<p class="hint">No hay horario publicado para tu grupo en esta semana.</p>';
        return;
      }
      const selClave = selAluSlot ? claveCeldaCal_(selAluSlot.fecha, selAluSlot.idHorario) : '';
      let html = '<table class="cal-tabla"><thead><tr><th></th>';
      dias.forEach(function (d) {
        html += '<th class="' + (d.hoy ? 'hoy-col' : '') + '">' + escaparHtml(d.etqCorta) + ' ' +
          escaparHtml(d.etqNum) + (d.hoy ? ' · Hoy' : '') + '</th>';
      });
      html += '</tr></thead><tbody>';
      bloques.forEach(function (b) {
        html += '<tr><td class="hora">' + escaparHtml(b.horaInicio) + '</td>';
        dias.forEach(function (d) {
          const h = mapa[d.fecha + '#' + b.clave];
          if (!h) {
            html += '<td><div class="cal-vacia"></div></td>';
            return;
          }
          const hay = hayTextoAlu_(h);
          const clave = claveCeldaCal_(d.fecha, h.idHorario);
          const claveSlot = claveSlotAlu_(h);
          const etqs = etiquetasEstadoAlu_(h, r);
          const cls = (h.enCurso ? ' en-curso' : '') + (hay ? ' publicado' : '') +
            (clave === selClave ? ' sel' : '') + (slotReproAlu_(h) ? ' repro' : '');
          const extra = etqs.join(' · ');
          const aria = fraseSlotAlu_(h, r);
          const feCel = String(d.fecha || h.fecha || '').slice(0, 10);
          const idCel = String(h.idHorario == null ? '' : h.idHorario);
          html += '<td><button type="button" class="cal-celda' + cls + '" data-alu-pick="1" data-alu-clave="' +
            escaparHtml(claveSlot) + '" data-alu-fecha="' + escaparHtml(feCel) + '" data-alu-id="' +
            escaparHtml(idCel) + '" aria-label="' + escaparHtml(aria) + '">' +
            '<strong>' + escaparHtml(h.asignatura || 'Clase') + '</strong>' +
            '<span>' + escaparHtml((h.maestro || '') + (h.maestro && h.bloque ? ' · ' : '') +
              ordinalHoraAlu_(h.bloque)) + '</span>' +
            (extra ? ('<span>' + escaparHtml(extra) + '</span>') : '') + '</button></td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      caja.innerHTML = html;
      enlazarClicksAlu_(caja);
    }

    function elegirClaseAlu(fecha, idHorario) {
      const h = buscarSlotCalAlu_(ctxAlu, fecha, idHorario);
      if (!h) {
        toast('No se encontró esa clase en el horario.', 'error');
        return;
      }
      selAluSlot = h;
      pendingFocoAlu_ = 'slot:' + claveSlotAlu_(h);
      if (ctxAlu) {
        pintarAlu(ctxAlu);
        pintarHorarioAlu_(ctxAlu);
      }
      anunciar((h.asignatura || 'Clase') + '. ' + ordinalHoraAlu_(h.bloque) +
        (claseTerminadaAlu_(h, ctxAlu) ? '. Clase terminada.' : '.') + ' ' +
        (hayTextoAlu_(h) ? 'Pulsa Escuchar clase.' : 'Contenido no disponible.'));
    }

    function tabMae(id, btn) {
      tabN1Clase(id, btn);
    }

    var tabN1ClaseActual = '';
    var subN2ClaseActual = '';
    var fechaClaseEtiquetaManual = false;

    function hayCuerpoClase_() {
      return ['tabClases', 'tabAluAcc', 'tabAccesos'].some(function (id) {
        const el = document.getElementById(id);
        return el && !el.classList.contains('oculto');
      });
    }

    function ocultarSubribbonClase_() {
      const cinta = document.getElementById('cintaClase');
      if (cinta) cinta.classList.add('oculto');
      if (typeof ribbonSetNivel2 === 'function') ribbonSetNivel2(false);
    }

    function mostrarN2Clase_(idN1) {
      const cinta = document.getElementById('cintaClase');
      if (cinta) cinta.classList.add('oculto');
      if (typeof ribbonSetNivel2 === 'function') ribbonSetNivel2(false);
    }

    function iniciarCintaClase_() {
      tabN1ClaseActual = '';
      subN2ClaseActual = '';
      fechaClaseEtiquetaManual = false;
      document.querySelectorAll('#tabsMae button').forEach(function (b) {
        b.classList.remove('activa', 'activo');
      });
      const cinta = document.getElementById('cintaClase');
      if (cinta) cinta.classList.add('oculto');
      ['tabClases', 'tabAluAcc', 'tabAccesos'].forEach(function (id) {
        const el = document.getElementById(id);
        if (el) el.classList.add('oculto');
      });
      if (typeof ribbonSetNivel2 === 'function') ribbonSetNivel2(false);
    }

    function tabN1Clase(id, btn) {
      if (id === tabN1ClaseActual) {
        if (typeof ribbonN2Abierto !== 'undefined' && !ribbonN2Abierto) {
          if (typeof ribbonSetNivel2 === 'function') ribbonSetNivel2(true);
          const cinta = document.getElementById('cintaClase');
          if (cinta && cinta.children.length) cinta.classList.remove('oculto');
          return;
        }
        ocultarSubribbonClase_();
        return;
      }
      tabN1ClaseActual = id;
      subN2ClaseActual = '';
      document.querySelectorAll('#tabsMae button').forEach(function (b) {
        b.classList.remove('activa', 'activo');
      });
      if (btn) btn.classList.add('activa');
      const cinta = document.getElementById('cintaClase');
      if (cinta) cinta.classList.add('oculto');
      if (typeof ribbonSetNivel2 === 'function') ribbonSetNivel2(false);

      const tC = document.getElementById('tabClases');
      const tA = document.getElementById('tabAluAcc');
      const tM = document.getElementById('tabAccesos');

      if (id === 'clases') {
        if (tA) tA.classList.add('oculto');
        if (tM) tM.classList.add('oculto');
        if (tC) tC.classList.remove('oculto');
        const n3c = document.getElementById('n3Clases');
        if (n3c) n3c.classList.remove('oculto');
        const fe = document.getElementById('fechaMaeClase');
        if (fe && !fe.value) fe.value = fechaLocalClase();
        toggleHorarioMae(true);
        cargarHorarioMae();
        return;
      }

      if (id === 'aluAcc') {
        if (tC) tC.classList.add('oculto');
        if (tM) tM.classList.add('oculto');
        if (tA) tA.classList.remove('oculto');
        const n3a = document.getElementById('n3AluAcc');
        if (n3a) n3a.classList.remove('oculto');
        cargarAlumnosPass();
        return;
      }

      if (id === 'accesos') {
        if (tC) tC.classList.add('oculto');
        if (tA) tA.classList.add('oculto');
        if (tM) tM.classList.remove('oculto');
        const n3m = document.getElementById('n3MaeAcc');
        if (n3m) n3m.classList.remove('oculto');
        cargarMaestrosAcc();
        return;
      }
    }

    function tabN2Clase(id, btn) {
      if (subN2ClaseActual === id) {
        subN2ClaseActual = '';
        if (btn) btn.classList.remove('activo', 'activa');
        ['n3Clases', 'n3AluAcc', 'n3MaeAcc'].forEach(function (xid) {
          const el = document.getElementById(xid);
          if (el) el.classList.add('oculto');
        });
        return;
      }
      subN2ClaseActual = id;
      ['btnN2Horario', 'btnN2AluLista', 'btnN2MaeLista'].forEach(function (xid) {
        const b = document.getElementById(xid);
        if (b) b.classList.remove('activo', 'activa');
      });
      if (btn) btn.classList.add('activo');
      const n3c = document.getElementById('n3Clases');
      const n3a = document.getElementById('n3AluAcc');
      const n3m = document.getElementById('n3MaeAcc');
      const tC = document.getElementById('tabClases');
      const tA = document.getElementById('tabAluAcc');
      const tM = document.getElementById('tabAccesos');
      if (n3c) n3c.classList.toggle('oculto', id !== 'horario');
      if (n3a) n3a.classList.toggle('oculto', id !== 'aluLista');
      if (n3m) n3m.classList.toggle('oculto', id !== 'maeLista');
      if (tC) tC.classList.toggle('oculto', id !== 'horario');
      if (tA) tA.classList.toggle('oculto', id !== 'aluLista');
      if (tM) tM.classList.toggle('oculto', id !== 'maeLista');
      if (id === 'horario') {
        const fe = document.getElementById('fechaMaeClase');
        if (fe && !fe.value) fe.value = fechaLocalClase();
        toggleHorarioMae(true);
        cargarHorarioMae();
      } else if (id === 'aluLista') {
        cargarAlumnosPass();
      } else       if (id === 'maeLista' && rolClase === 'admin') {
        cargarMaestrosAcc();
      }
      if (typeof ribbonColapsarTrasN2 === 'function') ribbonColapsarTrasN2();
    }

    function textoOpcionClase_(id) {
      const sel = document.getElementById(id);
      if (!sel || sel.selectedIndex < 0) return '';
      return ((sel.options[sel.selectedIndex] || {}).text || '').trim();
    }

    function recortarEtq_(t, n) {
      const s = String(t || '').trim();
      if (!s) return '';
      return s.length > n ? (s.slice(0, n) + '…') : s;
    }

    function pintarEtqFiltroClase_() {
      function setBtn(idBtn, activo, etq) {
        const b = document.getElementById(idBtn);
        if (!b) return;
        b.classList.toggle('activo', !!activo);
        const lab = b.querySelector('.ribbon-label');
        if (lab && etq) lab.textContent = etq;
      }
      const fe = valorSel_('fechaMaeClase');
      setBtn('btnClaseFecha', fechaClaseEtiquetaManual, fechaClaseEtiquetaManual ? fmtFechaCortaClase_(fe) : 'Fecha');
      const g = valorSel_('selGrupoClase');
      setBtn('btnClaseGrupo', !!g, g ? recortarEtq_(textoOpcionClase_('selGrupoClase'), 8) : 'Grupo');
      const a = valorSel_('selAluClase');
      setBtn('btnClaseAlumno', !!a, a ? recortarEtq_(textoOpcionClase_('selAluClase'), 10) : 'Alumno');
      const as = valorSel_('selAsigClase');
      setBtn('btnClaseAsig', !!as, as ? recortarEtq_(textoOpcionClase_('selAsigClase'), 10) : 'Asignatura');
    }

    function pintarEtqFiltroPass_() {
      function setBtn(idBtn, activo, etq) {
        const b = document.getElementById(idBtn);
        if (!b) return;
        b.classList.toggle('activo', !!activo);
        const lab = b.querySelector('.ribbon-label');
        if (lab && etq) lab.textContent = etq;
      }
      const g = valorSel_('filtroGradoPass');
      setBtn('btnPassGrado', !!g, g ? textoOpcionClase_('filtroGradoPass') : 'Grado');
      const gp = valorSel_('filtroGrupoPass');
      setBtn('btnPassGrupo', !!gp, gp ? recortarEtq_(textoOpcionClase_('filtroGrupoPass'), 8) : 'Grupo');
      const bus = ((document.getElementById('buscAluPass') || {}).value || '').trim();
      setBtn('btnPassBuscar', !!bus, bus ? recortarEtq_(bus, 10) : 'Buscar');
      const busM = ((document.getElementById('buscMaeClase') || {}).value || '').trim();
      setBtn('btnMaeBuscar', !!busM, busM ? recortarEtq_(busM, 10) : 'Buscar');
    }

    function fmtFechaCortaClase_(iso) {
      const p = String(iso || '').split('-');
      if (p.length !== 3) return 'Fecha';
      return p[2] + '/' + p[1];
    }

    function abrirModalFiltroClase(cual) {
      if (cual === 'fecha') {
        const actual = valorSel_('fechaMaeClase') || fechaLocalClase();
        modal({
          titulo: 'Fecha',
          html: '<div class="form-modal-usu"><div class="campo" style="margin:0;"><label for="modalClaseFecha">Día</label>' +
            '<input type="date" id="modalClaseFecha" value="' + escaparHtml(actual) + '"></div></div>',
          botones: [
            { texto: 'Cancelar', valor: null, clase: 'btn-secundario' },
            { texto: 'Aplicar', valor: 'ok' }
          ],
          capturar: function (fondo, val) {
            if (val === null) return null;
            return ((fondo.querySelector('#modalClaseFecha') || {}).value || '');
          }
        }).then(function (v) {
          if (v === null || typeof v === 'undefined') return;
          const inp = document.getElementById('fechaMaeClase');
          if (inp) inp.value = v;
          fechaClaseEtiquetaManual = true;
          cargarHorarioMae();
        });
        return;
      }
      const mapa = {
        grupo: { id: 'selGrupoClase', titulo: 'Grupo', after: cambiarGrupoClase },
        alumno: { id: 'selAluClase', titulo: 'Alumno', after: cambiarAlumnoClase },
        asig: { id: 'selAsigClase', titulo: 'Asignatura', after: function () { cargarHorarioMae(); } }
      };
      const cfg = mapa[cual];
      if (!cfg) return;
      const sel = document.getElementById(cfg.id);
      if (!sel) return;
      let opts = '';
      Array.from(sel.options).forEach(function (o) {
        opts += '<option value="' + escaparHtml(o.value) + '"' + (o.value === sel.value ? ' selected' : '') + '>' + escaparHtml(o.text) + '</option>';
      });
      modal({
        titulo: cfg.titulo,
        html: '<div class="form-modal-usu"><div class="campo" style="margin:0;"><label for="modalFiltroClaseSel">' + escaparHtml(cfg.titulo) + '</label>' +
          '<select id="modalFiltroClaseSel">' + opts + '</select></div></div>',
        botones: [
          { texto: 'Cancelar', valor: null, clase: 'btn-secundario' },
          { texto: 'Aplicar', valor: 'ok' }
        ],
        capturar: function (fondo, val) {
          if (val === null) return null;
          return ((fondo.querySelector('#modalFiltroClaseSel') || {}).value);
        }
      }).then(function (valor) {
        if (valor === null || typeof valor === 'undefined') return;
        sel.value = valor;
        if (typeof cfg.after === 'function') cfg.after();
        pintarEtqFiltroClase_();
      });
    }

    function toggleHorarioMae(forzarMostrar) {
      const wrap = document.getElementById('wrapCalendarioMae');
      const lbl = document.getElementById('lblToggleHorario');
      const ico = document.getElementById('icoToggleHorario');
      if (!wrap) return;
      let nuevoColapsado;
      if (typeof forzarMostrar === 'boolean') {
        nuevoColapsado = !forzarMostrar;
      } else {
        nuevoColapsado = !wrap.classList.contains('oculto');

    function formatearRangoDdMmAa_(ini, fin) {
      const meses3 = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
      function aDdMmAa(f) {
        if (!f) return '';
        const d = (f instanceof Date) ? f : new Date(String(f).indexOf('T') === -1 ? (String(f) + 'T12:00:00') : String(f));
        if (isNaN(d.getTime())) return String(f);
        const dd = ('0' + d.getDate()).slice(-2);
        const mes = meses3[d.getMonth()] || ('0' + (d.getMonth() + 1)).slice(-2);
        const aa = String(d.getFullYear()).slice(-2);
        return dd + '/' + mes + '/' + aa;
      }
      const fIni = aDdMmAa(ini);
      const fFin = aDdMmAa(fin || ini);
      return fIni + '-->' + fFin;
    }

      const fe = valorSel_('fechaMaeClase');

        llenarOpciones_(document.getElementById('selAluClase'), (r.alumnos || []).map(function (a) {

        }), aluClaseSel, '<option value="">Elige alumno…</option>');
        llenarOpciones_(document.getElementById('selAsigClase'), (r.asignaturas || []).map(function (n) {
          return { valor: n, etq: n };
        }), r.asignatura || '', '<option value="">Todas las del grupo</option>');
        pintarEtqFiltroClase_();
        actualizarHintMae_(r);
        pintarAlumnosAcceso_(r.alumnos || [], grupoUso);
        const nav = document.getElementById('navCalClase');

            return (d.horario || []).some(function (h) {
              return h.idHorario === slotMaeSel.idHorario && h.fecha === slotMaeSel.fecha;
            });
          }));

      if (modoCalMae === 'dia') {

      } else if (modoCalMae === 'mes') {
        d.setMonth(d.getMonth() + Number(delta));

    function pintarCalendarioMae_(r) {
      const caja = document.getElementById('listaSlotsMae');
      if (!caja) return;
      const esMesH = (modoCalMae === 'mes' && orientacionCalMae === 'h');
      caja.classList.toggle('scroll-mes-h', esMesH);
      if (!caja._wheelInit) {
        caja._wheelInit = true;
        caja.addEventListener('wheel', function (e) {
          if (!caja.classList.contains('scroll-mes-h')) return;
          if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
            caja.scrollLeft += e.deltaY;
            e.preventDefault();
          }
        }, { passive: false });
      }
      const dias = r.calendario || [];
      const bloques = r.bloques || [];
      const mapa = {};
      dias.forEach(function (d) {
        (d.horario || []).forEach(function (h) {
          mapa[claveCeldaCal_(d.fecha, h.idHorario)] = h;
          const kHora = String(h.horaInicio || '') + '|' + String(h.horaFin || '');
          mapa[d.fecha + '#' + kHora] = h;
        });
      });
      caja._mapa = mapa;
      if (!dias.length) {
        caja.innerHTML = '<p class="hint">No hay horario para este grupo.</p>';
        return;
      }
      if (!bloques.length) {
        caja.innerHTML = '<p class="hint">No hay clases en el horario' +
          (r.asignatura ? ' para esa asignatura' : '') + ' en esta semana.</p>';
        return;
      }
      const selClave = slotMaeSel ? claveCeldaCal_(slotMaeSel.fecha, slotMaeSel.idHorario) : '';

      // Orientación vertical: Días en filas, bloques en columnas
      if (orientacionCalMae === 'v') {
        let html = '<table class="cal-tabla modo-vertical"><thead><tr><th style="min-width:105px;">Día / Fecha</th>';
        bloques.forEach(function (b) {
          html += '<th>' + escaparHtml((b.bloque ? (b.bloque + 'ª · ') : '') + b.horaInicio) +
            '<small style="display:block;font-size:10px;font-weight:600;color:#64748b;">' + escaparHtml(b.horaInicio) + '–' + escaparHtml(b.horaFin) + '</small></th>';
        });
        html += '</tr></thead><tbody>';
        dias.forEach(function (d) {
          html += '<tr><td class="hora-dia' + (d.hoy ? ' hoy-col' : '') + '">' +
            '<strong>' + escaparHtml(d.etqCorta) + ' ' + escaparHtml(d.etqNum) + '</strong>' +
            '<small style="display:block;font-size:11px;font-weight:600;color:#64748b;margin-top:2px;">' + escaparHtml(formatearFechaCorta_(d.fecha)) + '</small>' +
            '</td>';
          bloques.forEach(function (b) {
            const h = mapa[d.fecha + '#' + b.clave];
            if (!h) {
              html += '<td><div class="cal-vacia"></div></td>';
              return;
            }
            const hay = h.contenido && String(h.contenido.texto || '').trim();
            const clave = claveCeldaCal_(d.fecha, h.idHorario);
            const cls = (h.enCurso ? ' en-curso' : '') + (hay ? ' con-texto publicado' : '') +
              (!h.propia ? ' ajena' : '') + (clave === selClave ? ' sel' : '');
            const extra = !h.propia ? 'Otro maestro' : (hay ? ((h.contenido && h.contenido.titulo) ? h.contenido.titulo : 'Con texto') : '');
            html += '<td><button type="button" class="cal-celda' + cls + '" onclick="abrirCeldaCal(\'' +
              escaparHtml(d.fecha) + '\',\'' + String(h.idHorario || '').replace(/'/g, '') + '\')">' +
              '<strong>' + escaparHtml(h.asignatura || 'Clase') + '</strong>' +
              '<span>' + escaparHtml((h.bloque ? (h.bloque + 'ª · ') : '') + (h.maestro || '')) + '</span>' +
              (extra ? ('<span>' + extra + '</span>') : '') + '</button></td>';
          });
          html += '</tr>';
        });
        html += '</tbody></table>';
        caja.innerHTML = html;
        return;
      }
      let html = '<table class="cal-tabla' + (modoCalMae === 'dia' ? ' modo-dia' : (modoCalMae === 'mes' ? ' modo-mes' : '')) + '"><thead><tr><th></th>';
      dias.forEach(function (d) {
        html += '<th class="' + (d.hoy ? 'hoy-col' : '') + '">' + escaparHtml(d.etqCorta) + ' ' +
          escaparHtml(d.etqNum) + '</th>';
      });
      html += '</tr></thead><tbody>';
      bloques.forEach(function (b) {
        html += '<tr><td class="hora">' + escaparHtml(b.horaInicio) + '</td>';
        dias.forEach(function (d) {
          const h = mapa[d.fecha + '#' + b.clave];
          if (!h) {
            html += '<td><div class="cal-vacia"></div></td>';
            return;
          }
          const hay = h.contenido && String(h.contenido.texto || '').trim();
          const clave = claveCeldaCal_(d.fecha, h.idHorario);
          const cls = (h.enCurso ? ' en-curso' : '') + (hay ? ' con-texto publicado' : '') +
            (!h.propia ? ' ajena' : '') + (clave === selClave ? ' sel' : '');
          const extra = !h.propia ? 'Otro maestro' : (hay ? ((h.contenido && h.contenido.titulo) ? h.contenido.titulo : 'Con texto') : '');
          html += '<td><button type="button" class="cal-celda' + cls + '" onclick="abrirCeldaCal(\'' +
            escaparHtml(d.fecha) + '\',\'' + String(h.idHorario || '').replace(/'/g, '') + '\')">' +
            '<strong>' + escaparHtml(h.asignatura || 'Clase') + '</strong>' +
            '<span>' + escaparHtml((h.bloque ? (h.bloque + 'ª · ') : '') + (h.maestro || '')) + '</span>' +
            (extra ? ('<span>' + extra + '</span>') : '') + '</button></td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      caja.innerHTML = html;
    }

    function coincideGrupoLocal_(alumno, grFiltro, gpFiltro) {
      const grA = String(alumno.grado || '').trim();
      const gpA = String(alumno.grupo || '').trim().toUpperCase();
      const etqA = String(alumno.grupoEtq || (grA + gpA)).trim().toUpperCase();
      const grF = String(grFiltro || '').trim();
      let gpF = String(gpFiltro || '').trim().toUpperCase();

      if (grF && grA !== grF) return false;
      if (!gpF) return true;

      if (gpF.indexOf('|') >= 0) {
        const partes = gpF.split('|');
        if (partes[0].trim() && grA !== partes[0].trim()) return false;
        gpF = partes[1].trim().toUpperCase();
      }

      let letraF = gpF;
      if (grF && letraF.indexOf(grF) === 0) {
        letraF = letraF.substring(grF.length).replace(/^[-_°\s]+/, '');
      }

      return (etqA === gpF) ||
             (gpA === gpF) ||
             (gpA === letraF) ||
             (etqA === (grA + letraF));
    }

    function filtrarTablaPassLocal() {
      const busc = ((document.getElementById('buscAluPass') || {}).value || '').trim().toLowerCase();
      const g = ((document.getElementById('filtroGradoPass') || {}).value || '').trim();
      const gp = ((document.getElementById('filtroGrupoPass') || {}).value || '').trim();

      const filtrados = (listaAlumnosPassCache || []).filter(function (a) {
        if (!coincideGrupoLocal_(a, g, gp)) return false;
        if (busc) {
          const nom = String(a.nombre || '').toLowerCase();
          const mat = String(a.matricula || '').toLowerCase();
          const usu = String(a.usuario || '').toLowerCase();
          if (nom.indexOf(busc) < 0 && mat.indexOf(busc) < 0 && usu.indexOf(busc) < 0) {
            return false;
          }
        }
        return true;
      });

      renderTablaPassAlu_(filtrados);
      pintarEtqFiltroPass_();
    }

    function renderTablaPassAlu_(filas) {
      const txtConteo = document.getElementById('txtAluPassConteo');
      if (txtConteo) {
        txtConteo.textContent = 'Alumnos encontrados: ' + filas.length;
      }
      const caja = document.getElementById('cajaTablaAluPass');
      if (!caja) return;
      if (!filas.length) {
        caja.innerHTML = '<p class="hint" style="text-align:center;">No hay alumnos que coincidan con los filtros o la búsqueda.</p>';
        return;
      }
      let html = '<table class="tabla-acc"><thead><tr>' +
        '<th style="width:30px;">#</th>' +
        '<th>Alumno</th>' +
        '<th>Grupo</th>' +
        '<th>Usuario</th>' +
        '<th>Contraseña</th>' +
        '<th style="text-align:right;">Acciones</th>' +
        '</tr></thead><tbody>';

      html += filas.map(function (a, idx) {
        const mat = String(a.matricula || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const usu = String(a.usuario || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const cla = String(a.clave || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const claveHtml = a.clave
          ? ('<span class="dato-acc badge-pass">' + escaparHtml(a.clave) + '</span>')
          : '<span style="color:#94a3b8;font-size:12px;">Sin contraseña</span>';

        return '<tr>' +
          '<td style="color:#94a3b8;font-size:12px;">' + (idx + 1) + '</td>' +
          '<td><strong>' + escaparHtml(a.nombre) + '</strong><br><small style="color:#64748b;">Mat: ' + escaparHtml(a.matricula) + '</small></td>' +
          '<td><span class="badge">' + escaparHtml((a.grado ? (a.grado + '° ') : '') + (a.grupo || '')) + '</span></td>' +
          '<td><span class="dato-acc" style="color:var(--st90-azul);">' + escaparHtml(a.usuario || '—') + '</span></td>' +
          '<td>' + claveHtml + '</td>' +
          '<td style="text-align:right;white-space:nowrap;">' +
            '<div style="display:inline-flex;gap:4px;">' +
              '<button type="button" class="btn-secundario" onclick="generarClaveUnicaAlu(\'' + mat + '\')" title="Generar contraseña aleatoria individual">🎲 Aleatoria</button>' +
              '<button type="button" class="btn-secundario" onclick="ponerClaveAlu(\'' + mat + '\',\'' + usu + '\',\'' + cla + '\')" title="Editar usuario y contraseña">✏️ Editar</button>' +
              (a.clave ? ('<button type="button" class="btn-secundario" onclick="copiarCredencialAlu(\'' + usu + '\',\'' + cla + '\')" title="Copiar usuario y contraseña">📋</button>') : '') +
            '</div>' +
          '</td>' +
        '</tr>';
      }).join('');

      html += '</tbody></table>';
      caja.innerHTML = html;
    }

    function generarClaveUnicaAlu(matricula) {
      toast('Generando contraseña aleatoria…', 'info');
      gsRun('generarClavesAlumnosClase', tokenClase, '', '', 'alumno', matricula).then(function (r) {
        toast((r && r.mensaje) || 'Contraseña generada.', 'ok');
        cargarAlumnosPass(true);
      }).catch(function (e) {
        toast((e && e.message) || String(e), 'error');
      });
    }

    function generarClavesMasivasAlu(modo) {
      const g = (document.getElementById('filtroGradoPass') || {}).value || '';
      const gp = (document.getElementById('filtroGrupoPass') || {}).value || '';

      let pregunta = '';
      if (modo === 'todos') {
        pregunta = '¿Deseas generar contraseñas aleatorias para <strong>TODOS los grupos</strong>?<br><br><small style="color:#b91c1c;">Esta acción creará o renovará la contraseña de acceso de todos los alumnos activos.</small>';
      } else {
        const etq = (g ? (g + '° ') : '') + (gp || '');
        if (!etq) {
          toast('Por favor selecciona primero un grado o grupo en los filtros superiores.', 'error');
          return;
        }
        pregunta = '¿Deseas generar contraseñas aleatorias para los alumnos de <strong>' + escaparHtml(etq) + '</strong>?';
      }

      modal({
        titulo: 'Generar contraseñas aleatorias',
        html: '<p style="margin:0 0 12px;font-size:14px;line-height:1.45;">' + pregunta + '</p>',
        botones: [
          { texto: 'Cancelar', valor: null, clase: 'btn-secundario' },
          { texto: 'Sí, generar', valor: 'ok' }
        ],
        capturar: function (fondo, val) { return val; }
      }).then(function (confirmo) {
        if (!confirmo) return;
        toast('Generando contraseñas aleatorias, por favor espera…', 'info');
        gsRun('generarClavesAlumnosClase', tokenClase, g, gp, modo, '').then(function (r) {
          toast((r && r.mensaje) || 'Contraseñas generadas correctamente.', 'ok');
          cargarAlumnosPass(true);
        }).catch(function (e) {
          toast((e && e.message) || String(e), 'error');
        });
      });
    }

    function copiarCredencialAlu(usuario, clave) {
      const texto = 'Usuario: ' + usuario + '\nContraseña: ' + clave;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(function () {
          toast('Credenciales copiadas al portapapeles.', 'ok');
        }).catch(function () {
          copiarFallback_(texto);
        });
      } else {
        copiarFallback_(texto);
      }
    }

    function copiarFallback_(texto) {
      try {
        const ta = document.createElement('textarea');
        ta.value = texto;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        toast('Credenciales copiadas al portapapeles.', 'ok');
      } catch (e) {
        toast('Credenciales: ' + texto, 'info');
      }
    }

    function ponerClaveAlu(mat, usuario, clave) {
      modal({
        titulo: 'Cambiar acceso del alumno',
        html: '<label for="usuClaveAlu">Usuario</label><input id="usuClaveAlu" type="text" value="' + escaparHtml(usuario || '') + '" autocomplete="off">' +
          '<label for="passClaveAlu">Contraseña (mín. 6)</label><input id="passClaveAlu" type="text" value="' + escaparHtml(clave || '') + '" autocomplete="off">',
        botones: [
          { texto: 'Cancelar', valor: null, clase: 'btn-secundario' },
          { texto: 'Guardar', valor: 'ok' }
        ],
        capturar: function (fondo, val) {
          if (val === null) return null;
          return {
            usuario: (fondo.querySelector('#usuClaveAlu') || {}).value || '',
            clave: (fondo.querySelector('#passClaveAlu') || {}).value || ''
          };
        }
      }).then(function (datos) {
        if (!datos) return;
        gsRun('asignarClaveAlumnoClase', tokenClase, mat, datos.usuario, datos.clave).then(function (r) {
          toast((r && r.mensaje) || 'Listo.', 'ok');
          cargarHorarioMae();
          if (document.getElementById('tabAluAcc') && !document.getElementById('tabAluAcc').classList.contains('oculto')) {
            cargarAlumnosPass(true);
          }
        }).catch(function (e) {
          toast((e && e.message) || String(e), 'error');
        });
      });
    }

    document.getElementById('claveClase').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') entrarClase();
    });
    document.getElementById('usuarioClase').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') document.getElementById('claveClase').focus();
    });
      window.addEventListener('click', function (ev) {
      /* asi-dd-panel-global-closer */
      if (!ev.target.closest('.asi-dd')) {
        document.querySelectorAll('.asi-dd-panel').forEach(function (p) { p.classList.add('oculto'); });
      }
    });
    prepararVocesClase_();
    if (window.speechSynthesis && typeof window.speechSynthesis.addEventListener === 'function') {
      window.speechSynthesis.addEventListener('voiceschanged', prepararVocesClase_);
    }
</script>
</body>
</html>
