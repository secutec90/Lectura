    /* ESTILOS PLANEACIÓN DIDÁCTICA NEM Y AULA HABLADA DUA */
    .nem-grid {

    }
    .nem-card {
      background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px;

      display: flex; flex-direction: column; justify-content: space-between;
    }
    .nem-card:hover {
      border-color: #93c5fd; box-shadow: 0 6px 16px rgba(15,23,42,0.08); transform: translateY(-2px);
    }
    .nem-card-header {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px;
    }
    .nem-card-title {
      font-size: 16px; font-weight: 800; color: var(--st90-azul); margin: 0; line-height: 1.35;
    }
    .badge-nem {
      font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
      padding: 3px 8px; border-radius: 9999px; display: inline-flex; align-items: center; white-space: nowrap;
    }

  /* ============================================================
     OLA 6.1 · build-581 — «📊 Encuesta / Diagnóstico» dentro del
     menú lateral y lienzo de autor en cero bloques
     ------------------------------------------------------------
     · La píldora del iDevice encuesta es la única de la familia
       «Evaluación y seguimiento» que se distingue con un icono de
       barras estadísticas. Las barras se dibujan en CSS: Bootstrap
       Icons no viaja en el paquete de Apps Script y el emoji 📊 no
       se puede pintar por partes.
     · Ganchos admitidos (basta uno de los tres; los tres pintan igual):
         .idevice-pill-add.pill-encuesta
         .idevice-pill-add[data-tipo="encuesta"]
         .idevice-pill-add[onclick*="encuesta"]
       Con el marcado actual de AyudaJS (data-tipo y onclick) funciona sin tocar
       una sola línea de JavaScript.
     · Con el emoji 📊 la píldora gana un medallón verde alrededor del
       propio icono; si Cursor lo sustituye por
       <i class="icono-barras"><i></i><i></i><i></i></i>, gana las
       barras vectoriales con ecualizador en :hover. Nunca las dos a
       la vez: el medallón se desactiva en cuanto existe .icono-barras.
     ============================================================ */

  /* ---------- 1 · Píldora destacada (familia Evaluación) ---------- */
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]) {
    position: relative;
    padding: 6px 10px 6px 15px;
    border: 1px solid #86efac;
    border-radius: 8px;
    background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 78%);
    box-shadow: inset 3px 0 0 0 #16a34a;
    color: #14532d;
    font-weight: 700;
    overflow: hidden;
    transition: background 160ms ease, border-color 160ms ease,
                box-shadow 160ms ease, color 160ms ease, transform 160ms ease;
  }

  /* Velo verde que barre la píldora en :hover (decorativo, no captura clics) */
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"])::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, rgba(22, 163, 74, 0) 0%, rgba(22, 163, 74, .10) 100%);
    opacity: 0;
    transition: opacity 160ms ease;
    pointer-events: none;
  }

  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover {
    background: #ffffff;
    border-color: #16a34a;
    box-shadow: inset 4px 0 0 0 #16a34a, 0 6px 16px rgba(22, 163, 74, .18);
    color: #15803d;
    transform: translateX(3px);
  }
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover::after {
    opacity: 1;
  }
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):active {
    transform: translateX(3px) translateY(1px);
    box-shadow: inset 4px 0 0 0 #16a34a, 0 2px 6px rgba(22, 163, 74, .20);
  }
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):focus-visible {
    outline: 2px solid #16a34a;
    outline-offset: 2px;
  }

  /* La pastilla «Añadir» acompaña la interacción: verde suave en reposo,
     verde pleno cuando la píldora está bajo el puntero. */
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]) .btn-mas {
    background: #dcfce7;
    color: #15803d;
    transition: background 160ms ease, color 160ms ease;
  }
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover .btn-mas {
    background: #15803d;
    color: #ffffff;
  }

  /* ---------- 2 · Icono de barras estadísticas (CSS puro) ---------- */
  /* Etiqueta preparada para el icono vectorial */
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):has(.icono-barras) > span:first-child {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .icono-barras {
    display: inline-flex;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    padding: 3px;
    box-sizing: border-box;
    border-radius: 6px;
    background: linear-gradient(135deg, #22c55e 0%, #0d9488 100%);
    box-shadow: 0 1px 2px rgba(13, 148, 136, .35);
    transition: transform 160ms ease, box-shadow 160ms ease;
  }
  .icono-barras > i {
    display: block;
    width: 3px;
    border-radius: 1.5px;
    background: #ffffff;
    transform-origin: bottom;
  }
  .icono-barras > i:nth-child(1) { height: 5px; }
  .icono-barras > i:nth-child(2) { height: 8px; }
  .icono-barras > i:nth-child(3) { height: 12px; }

  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover .icono-barras {
    transform: scale(1.06);
    box-shadow: 0 3px 8px rgba(13, 148, 136, .40);
  }
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover .icono-barras > i {
    animation: st90-barras-ecualizador 720ms ease-in-out infinite;
  }
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover .icono-barras > i:nth-child(2) {
    animation-delay: 110ms;
  }
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover .icono-barras > i:nth-child(3) {
    animation-delay: 220ms;
  }

  @keyframes st90-barras-ecualizador {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(.55); }
  }

  /* Respaldo sin tocar el marcado: el propio 📊 se convierte en medallón.
     Se desactiva en cuanto la etiqueta trae .icono-barras (evita duplicar). */
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):not(:has(.icono-barras)) > span:first-child::first-letter {
    float: left;
    margin: 0 7px 0 0;
    padding: 2px 3px 3px;
    border-radius: 6px;
    background: linear-gradient(135deg, #22c55e 0%, #0d9488 100%);
    box-shadow: 0 1px 2px rgba(13, 148, 136, .35);
    font-size: 13px;
    line-height: 1;
  }
  .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):not(:has(.icono-barras)):hover > span:first-child::first-letter {
    box-shadow: 0 3px 8px rgba(13, 148, 136, .40);
  }

  @media (prefers-reduced-motion: reduce) {
    .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover {
      transform: none;
    }
    .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover .icono-barras {
      transform: none;
    }
    .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"]):hover .icono-barras > i {
      animation: none;
    }
    .idevice-pill-add:is(.pill-encuesta, [data-tipo="encuesta"], [onclick*="encuesta"])::after {
      transition: none;
    }
  }

  /* ---------- 3 · Lienzo despejado: 0 bloques reales ---------- */
  /* Sin bloques, el contenedor no existe para el layout: así el hueco de
     16px de .canvas-container no se pinta como un espacio fantasma. */
  #contenedorIDevicesDinamicos:empty {

  .canvas-container > .pagina-banner {

  /* Contador de bloques: pastilla de estado discreta. Gris mientras la
     página está vacía; teal en cuanto la página tiene contenido. */
  .canvas-container > #contadorIdevices {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    align-self: flex-start;
    margin: 0;
    padding: 4px 12px 4px 10px;
    border: 1px solid #e2e8f0;
    border-radius: 999px;
    background: #ffffff;
    color: #64748b;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
  }
  .canvas-container > #contadorIdevices::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #cbd5e1;
    box-shadow: 0 0 0 3px rgba(148, 163, 184, .18);
    flex: 0 0 auto;
  }
  .canvas-container:has(#contenedorIDevicesDinamicos .idevice-card) > #contadorIdevices {
    border-color: #99f6e4;
    background: #f0fdfa;
    color: #0f766e;
  }
  .canvas-container:has(#contenedorIDevicesDinamicos .idevice-card) > #contadorIdevices::before {
    background: #0d9488;
    box-shadow: 0 0 0 3px rgba(13, 148, 136, .16);
  }


  /* ============================================================
     OLA 7 · build-583 — Flujo didáctico (Guion ➔ Asistente IA ➔ Constructor),
     ayuda y audio por momento, vista previa del alumno y buzón de
     evidencias
     ------------------------------------------------------------
     El marcado ya vive en AdminPlaneacion.html / Clase.html:
       .flujo-didactico-stepper > .flujo-paso-guion
                                 > .flujo-conector-ia
                                 > .flujo-paso-constructor
       .momento-caja-header > .btn-ayuda-momento + .btn-audio-momento
       .btn-vista-previa-alumno  (barra de acciones de la sesión)
       .idevice-buzon-actividad  (aún sin emitir; contrato en la entrega)
     Este bloque no reescribe .momento-caja ni .grid-momentos-nem:
     esas reglas viven en ComunCSS y aquí solo se acomodan sus botones.
     ============================================================ */

  /* ---------- 1 · Stepper del flujo didáctico ---------- */
  .flujo-didactico-stepper {
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin: 6px 0 20px;
  }

  .flujo-paso-guion,
  .flujo-paso-constructor {
    position: relative;
    padding: 18px 18px 20px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, .04);
    min-width: 0;
  }
  .flujo-paso-guion {
    border-left: 5px solid #2563eb;
  }
  .flujo-paso-constructor {
    border-left: 5px solid #0d9488;
  }

  /* Etiqueta de paso pegada al borde superior de cada tarjeta */
  .flujo-paso-guion::before,
  .flujo-paso-constructor::before {
    content: 'PASO 1';
    position: absolute;
    top: -11px;
    left: 14px;
    padding: 2px 10px;
    border-radius: 999px;
    background: #2563eb;
    color: #ffffff;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .08em;
    line-height: 1.6;
    box-shadow: 0 1px 3px rgba(37, 99, 235, .30);
  }
  .flujo-paso-constructor::before {
    content: 'PASO 2';
    background: #0d9488;
    box-shadow: 0 1px 3px rgba(13, 148, 136, .30);
  }

  .flujo-paso-titulo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 12px;
    font-size: 14px;
    font-weight: 800;
    line-height: 1.25;
    color: #1e40af;
  }
  .flujo-paso-titulo::before {
    content: '';
    width: 4px;
    height: 16px;
    border-radius: 999px;
    background: #2563eb;
    flex: 0 0 auto;
  }

  /* ---------- 2 · Cabecera de cada momento con ayuda y audio ---------- */
  .momento-caja-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-start;
    gap: 6px 8px;
  }
  /* El titulo ocupa su renglon: la pastilla y los dos botones nunca se
     separan ni quedan huerfanos en tarjetas estrechas. */
  .momento-caja-header h3 {
    flex: 1 1 100%;
    min-width: 0;
    margin: 0;
    font-size: 13.5px;
    line-height: 1.2;
  }
  .momento-caja-header .nem-meta-pill {
    margin-right: auto;
    padding: 2px 9px;
    border: 1px solid #e2e8f0;
    border-radius: 999px;
    background: #ffffff;
    color: #475569;
    font-size: 10.5px;
    font-weight: 700;
    white-space: nowrap;
  }

  .btn-ayuda-momento,
  .btn-audio-momento {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    background: #f1f5f9;
    color: #475569;
    font-family: inherit;
    font-size: 12px;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    transition: background 150ms ease, border-color 150ms ease,
                color 150ms ease, transform 120ms ease, box-shadow 150ms ease;
  }
  .btn-ayuda-momento:hover {
    background: #e2e8f0;
    border-color: #94a3b8;
    color: #0f172a;
  }
  .btn-ayuda-momento:active {
    transform: scale(.94);
  }

  .btn-audio-momento {
    background: #eff6ff;
    border-color: #bfdbfe;
    color: #1d4ed8;
  }
  .btn-audio-momento:hover {
    background: #dbeafe;
    border-color: #93c5fd;
    box-shadow: 0 2px 6px rgba(29, 78, 216, .16);
  }
  .btn-audio-momento:active {
    transform: scale(.94);
  }
  /* Mientras la voz está hablando (Cursor añade .activo) */
  .btn-audio-momento.activo {
    background: #1d4ed8;
    border-color: #1d4ed8;
    color: #ffffff;
    animation: st90-pulso-audio 1200ms ease-in-out infinite;
  }
  @keyframes st90-pulso-audio {
    0%, 100% { box-shadow: 0 0 0 0 rgba(29, 78, 216, .35); }
    50%      { box-shadow: 0 0 0 4px rgba(29, 78, 216, 0); }
  }

  .btn-ayuda-momento:focus-visible,
  .btn-audio-momento:focus-visible {
    outline: 2px solid #2563eb;
    outline-offset: 2px;
  }

  /* ---------- 3 · Conector Asistente IA IA (paso intermedio) ---------- */
  .flujo-conector-ia {
    position: relative;
    margin: 4px 0;
    padding: 20px 14px 14px;
    background: linear-gradient(180deg, #f0fdfa 0%, #ffffff 78%);
    border: 1px dashed #5eead4;
    border-radius: 12px;
  }
  /* Cinta que anuncia la transición (decorativa; el texto literal puede
     moverse a <p class="flujo-conector-texto"> si se prefiere en HTML) */
  .flujo-conector-ia::before {
    content: 'PASO 2 · ESTRUCTURACIÓN DE LA CLASE';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    max-width: calc(100% - 24px);
    padding: 2px 12px;
    border: 1px solid #99f6e4;
    border-radius: 999px;
    background: #ffffff;
    color: #0f766e;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .07em;
    line-height: 1.7;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 1px 3px rgba(13, 148, 136, .14);
  }
  /* Texto opcional si el conector se documenta desde el marcado */
  .flujo-conector-texto {
    margin: 0 0 10px;
    font-size: 12.5px;
    font-weight: 700;
    color: #0f766e;
    text-align: center;
  }

  /* La tarjeta de Asistente IA ya trae su marco: dentro del conector se aplana */
  .flujo-conector-ia .asistente-ia-card {
    margin: 0;
    background: #ffffff;
    border-color: #ccfbf1;
    box-shadow: none;
  }

  /* ---------- 4 · Paso 2: constructor eXeLearning ---------- */
  .flujo-paso-constructor > .nem-seccion-exelearning {
    margin: 0;
    padding: 0;
    background: transparent;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }
  .flujo-paso-constructor .nem-seccion-exelearning__titulo {
    color: #0f766e;
    font-size: 13.5px;
    letter-spacing: 0;
    text-transform: none;
  }
  .flujo-paso-constructor .nem-seccion-exelearning__titulo::before {
    background: #0d9488;
    height: 16px;
    width: 4px;
  }
  .flujo-paso-constructor .nem-seccion-exelearning__cab {
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid #e2e8f0;
  }
  /* Puntos de la sesión como pastilla, no como texto suelto */
  .flujo-paso-constructor #lblPuntosTotalesSesion {
    margin-left: auto;
    padding: 2px 10px;
    border: 1px solid #99f6e4;
    border-radius: 999px;
    background: #f0fdfa;
    color: #0f766e;
    font-size: 10.5px;
    font-weight: 800;
    white-space: nowrap;
  }

  /* ---------- 5 · Vista previa del alumno ---------- */
  .btn-vista-previa-alumno {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 15px;
    border: 1px solid #ddd6fe;
    border-radius: 999px;
    background: #f5f3ff;
    color: #6d28d9;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 800;
    line-height: 1.15;
    white-space: nowrap;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(109, 40, 217, .06);
    transition: background 150ms ease, border-color 150ms ease,
                box-shadow 150ms ease, transform 120ms ease;
  }
  .btn-vista-previa-alumno:hover {
    background: #ede9fe;
    border-color: #c4b5fd;
    box-shadow: 0 6px 16px #ede9fe;
    transform: translateY(-1px) scale(1.02);
  }
  .btn-vista-previa-alumno:active {
    transform: translateY(0) scale(.99);
  }
  .btn-vista-previa-alumno:focus-visible {
    outline: 2px solid #6d28d9;
    outline-offset: 2px;
  }
  /* Mientras el modal de vista previa está abierto */
  .btn-vista-previa-alumno.activo,
  .btn-vista-previa-alumno[aria-expanded="true"] {
    background: #6d28d9;
    border-color: #6d28d9;
    color: #ffffff;
  }

  /* ---------- 6 · Buzón de evidencias del alumno ---------- */
  .idevice-buzon-actividad {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin: 12px 0 0;
    padding: 16px 14px;
    border: 2px dashed #94a3b8;
    border-radius: 12px;
    background: #f8fafc;
    text-align: center;
    transition: border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
  }
  .idevice-buzon-actividad.arrastrando {
    border-color: #3b82f6;
    background: #eff6ff;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, .12);
  }
  .idevice-buzon-actividad .buzon-nube {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border: 1px solid #bfdbfe;
    border-radius: 50%;
    background: #eff6ff;
    color: #3b82f6;
    font-size: 22px;
    line-height: 1;
  }
  .idevice-buzon-actividad .buzon-titulo {
    margin: 0;
    font-size: 13px;
    font-weight: 800;
    color: #1e293b;
  }
  .idevice-buzon-actividad .buzon-ayuda {
    margin: 0;
    font-size: 11.5px;
    font-weight: 600;
    color: #64748b;
    line-height: 1.4;
  }
  .idevice-buzon-actividad .buzon-fila {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 2px;
  }
  .idevice-buzon-actividad .buzon-btn-archivo {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border: 1px solid #2563eb;
    border-radius: 8px;
    background: #2563eb;
    color: #ffffff;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.15;
    cursor: pointer;
    transition: background 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
  }
  .idevice-buzon-actividad .buzon-btn-archivo:hover {
    background: #1d4ed8;
    border-color: #1d4ed8;
    box-shadow: 0 4px 12px rgba(37, 99, 235, .22);
  }
  .idevice-buzon-actividad .buzon-btn-archivo:focus-visible {
    outline: 2px solid #1d4ed8;
    outline-offset: 2px;
  }
  .idevice-buzon-actividad .buzon-archivo-nombre {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    padding: 4px 10px;
    border: 1px solid #e2e8f0;
    border-radius: 999px;
    background: #ffffff;
    color: #334155;
    font-size: 11.5px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .idevice-buzon-actividad .buzon-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .03em;
    white-space: nowrap;
  }
  .idevice-buzon-actividad .buzon-badge.pendiente {
    border: 1px solid #fde68a;
    background: #fef3c7;
    color: #b45309;
  }
  .idevice-buzon-actividad .buzon-badge.entregado {
    border: 1px solid #bbf7d0;
    background: #dcfce7;
    color: #15803d;
  }
  .idevice-buzon-actividad .buzon-badge.revisado {
    border: 1px solid #bfdbfe;
    background: #dbeafe;
    color: #1e40af;
  }

  @media (max-width: 700px) {
    .flujo-paso-guion,
    .flujo-paso-constructor {
      padding: 16px 14px 16px;
    }
    .flujo-conector-ia {
      padding: 20px 10px 12px;
    }
    .flujo-conector-ia::before {
      font-size: 9.5px;
      letter-spacing: .04em;
    }
    .btn-vista-previa-alumno {
      width: 100%;
      justify-content: center;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn-ayuda-momento,
    .btn-audio-momento,
    .btn-vista-previa-alumno,
    .idevice-buzon-actividad,
    .idevice-buzon-actividad .buzon-btn-archivo {
      transition: none;
    }
    .btn-audio-momento.activo {
      animation: none;
    }
    .btn-vista-previa-alumno:hover,
    .btn-ayuda-momento:active,
    .btn-audio-momento:active {
      transform: none;
    }
  }


  /* ============================================================
     OLA 8 · build-584 — Tabs horizontales de sesión, modal de vista
     previa sin transparencias y aula moderna del alumno
     ------------------------------------------------------------
     Marcado que ya existe (Cursor):
       .stepper-tabs-sesion > button.tab-sesion[.activo]
       .flujo-didactico-stepper > .panel-paso-sesion[.activo]
       .pie-nav-sesion > .btn-nav-sesion-sig / .btn-nav-sesion-ant
       #modalPreviewAlumno > .preview-panel
         > .preview-mockup-browser (.preview-dot ×3, .preview-url, .preview-cerrar)
         > .preview-cuerpo-web
     Marcado pendiente (contrato en la entrega): .aula-alumno-preview
     ============================================================ */

  /* ---------- 1 · Barra de tabs del wizard de sesión ---------- */
  .stepper-tabs-sesion {
    display: flex;
    align-items: stretch;
    gap: 6px;
    margin: 4px 0 14px;
    padding: 5px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, .04);
    overflow-x: auto;
    scrollbar-width: thin;
  }

  .tab-sesion {
    flex: 1 1 0;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: #475569;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    line-height: 1.2;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    transition: background 150ms ease, border-color 150ms ease,
                color 150ms ease, box-shadow 150ms ease, transform 120ms ease;
  }
  .tab-sesion:hover {
    background: #f1f5f9;
    color: #0f766e;
  }
  .tab-sesion:active {
    transform: translateY(1px);
  }
  .tab-sesion.activo,
  .tab-sesion[aria-selected="true"] {
    background: linear-gradient(180deg, #f0fdfa 0%, #ffffff 100%);
    border-color: #99f6e4;
    color: #0f766e;
    font-weight: 800;
    box-shadow: inset 0 -3px 0 0 #0d9488, 0 2px 6px rgba(13, 148, 136, .12);
  }
  .tab-sesion:focus-visible {
    outline: 2px solid #0d9488;
    outline-offset: 2px;
  }

  /* El atributo hidden manda aunque el panel gane el estado activo */
  .panel-paso-sesion[hidden] {
    display: none !important;
  }
  .panel-paso-sesion.activo {
    display: block;
  }

  /* Pie de navegación guiada entre pasos */
  .pie-nav-sesion {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 10px;
    margin: 16px 0 2px;
    padding-top: 12px;
    border-top: 1px dashed #e2e8f0;
  }
  .btn-nav-sesion-sig,
  .btn-nav-sesion-ant {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 800;
    line-height: 1.15;
    cursor: pointer;
    transition: background 150ms ease, border-color 150ms ease,
                box-shadow 150ms ease, transform 120ms ease;
  }
  .btn-nav-sesion-sig {
    border: 1px solid #0d9488;
    background: linear-gradient(135deg, #0d9488 0%, #0284c7 100%);
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(13, 148, 136, .28);
  }
  .btn-nav-sesion-sig:hover {
    box-shadow: 0 6px 16px rgba(13, 148, 136, .34);
    transform: translateY(-1px);
  }
  .btn-nav-sesion-ant {
    border: 1px solid #cbd5e1;
    background: #f1f5f9;
    color: #475569;
  }
  .btn-nav-sesion-ant:hover {
    background: #e2e8f0;
    border-color: #94a3b8;
    color: #334155;
  }
  .btn-nav-sesion-sig:active,
  .btn-nav-sesion-ant:active {
    transform: translateY(1px);
  }
  .btn-nav-sesion-sig:focus-visible,
  .btn-nav-sesion-ant:focus-visible {
    outline: 2px solid #0d9488;
    outline-offset: 2px;
  }

  /* ---------- 2 · Modal de vista previa (cero transparencia) ---------- */
  #modalPreviewAlumno {
    background: rgba(15, 23, 42, .75);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    z-index: 99999;
  }
  #modalPreviewAlumno .preview-panel {
    width: min(1080px, 95vw);
    height: 90vh;
    max-height: 90vh;
    background: #ffffff !important;
    border: 1px solid #cbd5e1;
    border-radius: 16px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .25);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Barra de navegador simulada */
  .preview-mockup-browser,
  .preview-barra {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
    padding: 10px 14px;
    background: #f1f5f9;
    border-bottom: 1px solid #e2e8f0;
  }
  .preview-dot,
  .preview-punto {
    width: 12px;
    height: 12px;
    min-width: 12px;
    border-radius: 50%;
    background: #ef4444;
    box-shadow: inset 0 0 0 1px rgba(15, 23, 42, .08);
  }
  .preview-dot:nth-child(2),
  .preview-punto:nth-child(2) { background: #f59e0b; }
  .preview-dot:nth-child(3),
  .preview-punto:nth-child(3) { background: #22c55e; }

  .preview-url {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    margin: 0 8px;
    padding: 5px 12px 5px 30px;
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    background: #ffffff;
    color: #64748b;
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1.3;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Candadito verde dibujado en CSS (cuerpo + arco) */
  .preview-url::before {
    content: '';
    position: absolute;
    left: 12px;
    top: 50%;
    width: 8px;
    height: 6px;
    margin-top: -1px;
    border-radius: 1.5px;
    background: #16a34a;
  }
  .preview-url::after {
    content: '';
    position: absolute;
    left: 14px;
    top: 50%;
    width: 4px;
    height: 5px;
    margin-top: -6px;
    border: 1.5px solid #16a34a;
    border-bottom: 0;
    border-radius: 4px 4px 0 0;
    box-sizing: border-box;
  }

  .preview-cerrar {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 1px solid #cbd5e1;
    border-radius: 50%;
    background: #ffffff;
    color: #334155;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
  }
  .preview-cerrar:hover {
    background: #fee2e2;
    border-color: #fecaca;
    color: #b91c1c;
  }
  .preview-cerrar:focus-visible {
    outline: 2px solid #b91c1c;
    outline-offset: 2px;
  }

  .preview-cuerpo-web {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    background: #f8fafc;
  }

  /* Compatibilidad con el marcado anterior del modal */
  .preview-cabecera {
    background: #f1f5f9;
    color: #1e293b;
    border-bottom: 1px solid #e2e8f0;
  }
  .preview-cabecera h3 { color: #1e293b; }
  .preview-cabecera .preview-cerrar { margin-left: auto; }
  .preview-marco {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    margin: 0;
    border: 0;
    border-radius: 0;
    overflow: hidden;
  }

  /* ---------- 3 · Aula moderna del alumno ---------- */
  .aula-alumno-preview {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 18px;
    background: #f8fafc;
    font-family: inherit;
  }

  /* Hero institucional */
  .aula-hero {
    position: relative;
    overflow: hidden;
    padding: 22px 22px 20px;
    border-radius: 14px;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 48%, #2563eb 100%);
    color: #ffffff;
    box-shadow: 0 12px 26px rgba(15, 23, 42, .22);
  }
  .aula-hero::after {
    content: '';
    position: absolute;
    top: -70px;
    right: -60px;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, .22) 0%, rgba(255, 255, 255, 0) 70%);
    pointer-events: none;
  }
  .aula-hero__top {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .aula-hero__escudo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    flex: 0 0 auto;
    border: 1px solid rgba(255, 255, 255, .38);
    border-radius: 12px;
    background: rgba(255, 255, 255, .16);
    font-size: 22px;
    line-height: 1;
  }
  .aula-hero__titulo {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -.01em;
    line-height: 1.2;
  }
  .aula-hero__meta {
    margin: 8px 0 0;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255, 255, 255, .86);
  }
  .aula-hero__chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .aula-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border: 1px solid rgba(255, 255, 255, .34);
    border-radius: 999px;
    background: rgba(255, 255, 255, .14);
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  /* Barra de audio DUA con ecualizador */
  .aula-audio-dua {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border: 1px solid #bfdbfe;
    border-radius: 12px;
    background: #eff6ff;
  }
  .aula-audio-dua__btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    flex: 0 0 auto;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: #2563eb;
    color: #ffffff;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    transition: background 150ms ease, transform 120ms ease;
  }
  .aula-audio-dua__btn:hover {
    background: #1d4ed8;
    transform: scale(1.04);
  }
  .aula-audio-dua__btn:focus-visible {
    outline: 2px solid #1d4ed8;
    outline-offset: 2px;
  }
  .aula-ecualizador {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    flex: 1 1 auto;
    height: 22px;
    min-width: 0;
    background: linear-gradient(#dbeafe, #dbeafe) center / 100% 4px no-repeat;
  }
  .aula-ecualizador > span {
    display: block;
    width: 4px;
    border-radius: 2px;
    background: linear-gradient(180deg, #93c5fd 0%, #2563eb 100%);
    transform-origin: bottom;
    animation: aula-onda 900ms ease-in-out infinite;
  }
  .aula-ecualizador > span:nth-child(1) { height: 30%; }
  .aula-ecualizador > span:nth-child(2) { height: 55%; animation-delay: 80ms; }
  .aula-ecualizador > span:nth-child(3) { height: 80%; animation-delay: 160ms; }
  .aula-ecualizador > span:nth-child(4) { height: 45%; animation-delay: 240ms; }
  .aula-ecualizador > span:nth-child(5) { height: 65%; animation-delay: 320ms; }
  @keyframes aula-onda {
    0%, 100% { transform: scaleY(.55); }
    50%      { transform: scaleY(1); }
  }
  .aula-audio-dua__estado {
    flex: 0 0 auto;
    font-size: 11px;
    font-weight: 800;
    color: #1d4ed8;
    white-space: nowrap;
  }

  /* Sub-tabs de momentos del alumno */
  .aula-subtabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 5px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    background: #ffffff;
  }
  .aula-subtab {
    flex: 1 1 0;
    min-width: 0;
    padding: 8px 10px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: #475569;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.2;
    cursor: pointer;
    transition: background 150ms ease, color 150ms ease, box-shadow 150ms ease;
  }
  .aula-subtab:hover {
    background: #f1f5f9;
    color: #0f766e;
  }
  .aula-subtab.activo {
    background: #0d9488;
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(13, 148, 136, .28);
  }
  .aula-subtab:focus-visible {
    outline: 2px solid #0d9488;
    outline-offset: 2px;
  }

  .aula-panel {
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .aula-panel.activo {
    display: flex;
  }

  /* Tarjetas de contenido */
  .aula-card {
    padding: 16px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    background: #ffffff;
    box-shadow: 0 4px 12px rgba(15, 23, 42, .05);
  }
  .aula-card__titulo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 8px;
    font-size: 14px;
    font-weight: 800;
    color: #1e293b;
  }
  .aula-card__texto {
    margin: 0;
    font-size: 13px;
    line-height: 1.55;
    color: #334155;
  }

  /* Quiz interactivo */
  .aula-quiz {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
  }
  .aula-quiz__opcion {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    background: #ffffff;
    color: #334155;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
  }
  .aula-quiz__opcion:hover {
    border-color: #93c5fd;
    background: #eff6ff;
  }
  .aula-quiz__opcion.elegida {
    border-color: #2563eb;
    background: #eff6ff;
    box-shadow: 0 0 0 2px rgba(37, 99, 235, .14);
  }
  .aula-quiz__opcion.correcta {
    border-color: #16a34a;
    background: #f0fdf4;
    color: #166534;
  }
  .aula-quiz__opcion.incorrecta {
    border-color: #fca5a5;
    background: #fef2f2;
    color: #b91c1c;
  }
  .aula-quiz__opcion:focus-visible {
    outline: 2px solid #2563eb;
    outline-offset: 2px;
  }
  .aula-quiz__letra {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: #e2e8f0;
    color: #475569;
    font-size: 11px;
    font-weight: 800;
  }
  .aula-quiz__opcion.elegida .aula-quiz__letra {
    background: #2563eb;
    color: #ffffff;
  }
  .aula-quiz__retro {
    margin: 8px 0 0;
    font-size: 12px;
    font-weight: 700;
    color: #0f766e;
  }

  /* El buzón de evidencias se integra sin margen extra */
  .aula-alumno-preview .idevice-buzon-actividad {
    margin: 0;
  }

  @media (max-width: 760px) {
    .stepper-tabs-sesion {
      gap: 4px;
      padding: 4px;
    }
    .tab-sesion {
      padding: 8px 9px;
      font-size: 11.5px;
    }
    #modalPreviewAlumno .preview-panel {
      width: 96vw;
      height: 92vh;
      max-height: 92vh;
    }
    .aula-alumno-preview {
      padding: 12px;
    }
    .aula-hero__titulo {
      font-size: 17px;
    }
    .pie-nav-sesion {
      justify-content: stretch;
    }
    .btn-nav-sesion-sig,
    .btn-nav-sesion-ant {
      flex: 1 1 auto;
      justify-content: center;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .tab-sesion,
    .btn-nav-sesion-sig,
    .btn-nav-sesion-ant,
    .preview-cerrar,
    .aula-audio-dua__btn,
    .aula-subtab,
    .aula-quiz__opcion {
      transition: none;
    }
    .aula-ecualizador > span {
      animation: none;
      transform: none;
    }
    .btn-nav-sesion-sig:hover,
    .tab-sesion:active,
    .btn-nav-sesion-sig:active,
    .btn-nav-sesion-ant:active {
      transform: none;
    }
  }

  /* ============================================================
     OLA 9 · build-585 — Vista previa elegante del alumno
     (porte del bloque aprobado en muestra_vista_previa_alumno.html)
     ------------------------------------------------------------
     · El bloque se acota a .browser-frame, que vive tanto dentro de
       #vistaPreviaIntegrada (pestaña 4) como de #modalPreviewAlumno:
       así el diseño aprobado no se filtra al resto de la aplicación.
     · Se eliminan los resets globales (html/body/*) y se reescriben
       acotados al marco; los keyframes se renombran (st90Aula*) para
       no chocar con animaciones existentes.
     · Se añaden las adaptaciones al proyecto: tipografías del sistema,
       pestaña 4 y modal (barra oscura con membrete, sin doble marco).
     ============================================================ */

  .browser-frame {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --teal: #0d9488;
      --teal-light: #f0fdfa;
      --surface: #ffffff;
      --background: #f8fafc;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --success: #16a34a;
      --success-light: #dcfce7;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.07), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 20px 30px -10px rgba(15, 23, 42, 0.12);
    }

  .browser-frame,
  .browser-frame * {
    box-sizing: border-box;
  }
  .browser-frame * {
    margin: 0;
    padding: 0;
  }

  .browser-frame {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

  .browser-frame {
      max-width: 1040px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(226, 232, 240, 0.8);
      overflow: hidden;
      animation: st90AulaFadeIn 0.4s ease-out;
    }

  @keyframes st90AulaFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

  .browser-frame .browser-topbar {
      background: #0f172a;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
    }

  .browser-frame .browser-dots {
      display: flex;
      gap: 7px;
      align-items: center;
    }

  .browser-frame .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

  .browser-frame .dot-red { background: #ef4444; }

  .browser-frame .dot-yellow { background: #f59e0b; }

  .browser-frame .dot-green { background: #10b981; }

  .browser-frame .browser-address {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

  .browser-frame .browser-address span {
      color: #38bdf8;
      font-weight: 600;
    }

  .browser-frame .school-badge {
      font-size: 11.5px;
      color: #cbd5e1;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

  .browser-frame .class-hero {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 40%, #0f172a 100%);
      color: #ffffff;
      padding: 36px 36px 30px;
      position: relative;
      overflow: hidden;
    }

  .browser-frame .class-hero::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

  .browser-frame .hero-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

  .browser-frame .meta-tag {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

  .browser-frame .meta-tag.live {
      background: rgba(16, 185, 129, 0.25);
      border-color: rgba(16, 185, 129, 0.4);
      color: #a7f3d0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

  .browser-frame .live-pulse {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: st90AulaPulse 1.6s infinite;
    }

  @keyframes st90AulaPulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

  .browser-frame .class-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
      max-width: 820px;
    }

  .browser-frame .class-subtitle {
      font-size: 14.5px;
      color: #e0f2fe;
      max-width: 780px;
      margin-bottom: 18px;
      opacity: 0.95;
    }

  .browser-frame .session-progress-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(15, 23, 42, 0.3);
      padding: 10px 18px;
      border-radius: var(--radius-md);
      backdrop-filter: blur(6px);
      width: fit-content;
    }

  .browser-frame .session-progress-bar {
      width: 140px;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      overflow: hidden;
    }

  .browser-frame .session-progress-fill {
      width: 25%;
      height: 100%;
      background: #38bdf8;
      border-radius: 4px;
      transition: width 0.3s ease;
    }

  .browser-frame .session-progress-text {
      font-size: 12.5px;
      font-weight: 600;
      color: #f1f5f9;
    }

  .browser-frame .moments-nav-wrapper {
      background: #ffffff;
      padding: 18px 36px;
      border-bottom: 1px solid var(--border);
    }

  .browser-frame .moments-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

  .browser-frame .moment-tab {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: var(--radius-md);
      padding: 14px 16px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

  .browser-frame .moment-tab:hover {
      background: #ffffff;
      border-color: #cbd5e1;
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

  .browser-frame .moment-tab.active {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.12);
    }

  .browser-frame .moment-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 15%;
      width: 70%;
      height: 3px;
      background: var(--primary);
      border-radius: 3px 3px 0 0;
    }

  .browser-frame .tab-step {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

  .browser-frame .moment-tab.active .tab-step {
      color: var(--primary);
    }

  .browser-frame .tab-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

  .browser-frame .tab-time {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

  .browser-frame .classroom-body {
      padding: 36px;
      background: #f8fafc;
      min-height: 480px;
    }

  .browser-frame .moment-panel {
      display: none;
      animation: st90AulaFadeIn 0.3s ease-out;
    }

  .browser-frame .moment-panel.active {
      display: block;
    }

  .browser-frame .content-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 28px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }

  .browser-frame .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #f1f5f9;
      flex-wrap: wrap;
      gap: 12px;
    }

  .browser-frame .card-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

  .browser-frame .card-icon-bubble {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

  .browser-frame .card-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
    }

  .browser-frame .card-badge {
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: #f1f5f9;
      color: #475569;
    }

  .browser-frame .audio-dua-player {
      background: linear-gradient(135deg, #f0fdfa 0%, #e0f2fe 100%);
      border: 1px solid #bbf7d0;
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

  .browser-frame .player-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

  .browser-frame .btn-play-dua {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
      transition: all 0.2s ease;
    }

  .browser-frame .btn-play-dua:hover {
      background: var(--primary-dark);
      transform: scale(1.06);
    }

  .browser-frame .player-info h4 {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 2px;
    }

  .browser-frame .player-info p {
      font-size: 12px;
      color: #64748b;
    }

  .browser-frame .waveform-bars {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 24px;
    }

  .browser-frame .wave-bar {
      width: 3.5px;
      background: var(--primary);
      border-radius: 3px;
      animation: st90AulaWave 1.2s ease-in-out infinite alternate;
    }

  .browser-frame .wave-bar:nth-child(1) { height: 8px; animation-delay: 0.1s; }

  .browser-frame .wave-bar:nth-child(2) { height: 18px; animation-delay: 0.3s; }

  .browser-frame .wave-bar:nth-child(3) { height: 12px; animation-delay: 0.2s; }

  .browser-frame .wave-bar:nth-child(4) { height: 22px; animation-delay: 0.4s; }

  .browser-frame .wave-bar:nth-child(5) { height: 14px; animation-delay: 0.15s; }

  /* ---------- Adaptación al proyecto: tipografías del sistema ---------- */

  }
  .browser-frame .grid-col-1, .moment-panel .grid-col-1 { grid-template-columns: minmax(0, 1fr); }
  .browser-frame .grid-col-2, .moment-panel .grid-col-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .browser-frame .grid-col-70-30, .moment-panel .grid-col-70-30 { grid-template-columns: minmax(0, 7fr) minmax(0, 3fr); gap: 16px; }
  .browser-frame .grid-col-3, .moment-panel .grid-col-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

  .moment-panel .divi-column {

  /* La barra del modal hereda el look de .browser-topbar: fondo oscuro,
