  function evaluarInclusionGrupo_(grado, grupo) {
    const gr = String(grado || (document.getElementById('planGrado') || {}).value || '1').trim();
    const gp = String(grupo || (document.getElementById('planGrupo') || {}).value || 'A').trim().replace(/^\d+/, '').toUpperCase();
    const clave = gr + gp;
    const tieneBAPyC = (typeof GRUPOS_CON_BAPYC_ !== 'undefined' && GRUPOS_CON_BAPYC_.indexOf(clave) >= 0);
    const sec = document.getElementById('secInclusionBAPyC');
    const wrapChips = document.getElementById('wrapChipsBAPyCGrupo');
    const inpAjustes = document.getElementById('planAjustesRazonables');

    if (!sec) return;

    if (tieneBAPyC) {
      sec.classList.remove('oculto');
      if (wrapChips) {
        wrapChips.innerHTML = '<div class="nem-chip-bapyc" title="BAPyC: Barreras para el Aprendizaje, la Participación y la Convivencia (obstáculos del entorno escolar, didáctico o actitudinal que se atienden con ajustes razonables)" data-tip="BAPyC: Barreras para el Aprendizaje, la Participación y la Convivencia" style="cursor:help;"><span title="BAPyC: Barreras para el Aprendizaje, la Participación y la Convivencia">BAPyC</span> Grupo con barreras para el aprendizaje, la participación y la convivencia</div>';
      }
      if (inpAjustes && (!inpAjustes.value || !inpAjustes.value.trim())) {
        inpAjustes.value = '• Este grupo tiene alumnado que enfrenta barreras para el aprendizaje, la participación y la convivencia (BAPyC). Consulta el expediente de inclusión del grupo y describe aquí los ajustes razonables de acceso, formato y evaluación.';
      }
    } else {
      sec.classList.add('oculto');
      if (wrapChips) wrapChips.innerHTML = '';
    }
  }

  // Cargar catálogo CTE desde almacenamiento local si existe
  function obtenerCatalogoCTE_() {
    try {
      const local = localStorage.getItem('ST90_CATALOGO_CTE_CUSTOM');
      if (local) {
        const parsed = JSON.parse(local);
        if (Array.isArray(parsed) && parsed.length) return parsed;
      }
    } catch (e) {}
    return CATALOGO_PROGRAMA_ANALITICO_CTE_;
  }

  function guardarCatalogoCTE_(lista) {
    try {
      localStorage.setItem('ST90_CATALOGO_CTE_CUSTOM', JSON.stringify(lista));
    } catch (e) {}
  }

  function abrirModalGestionCTE_() {
    const catalogo = obtenerCatalogoCTE_();
    let filasHtml = '';
    catalogo.forEach(function (item, idx) {
      filasHtml += '<div style="background:#ffffff;border:1px solid #cbd5e1;border-radius:6px;padding:8px 10px;margin-bottom:8px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">' +
          '<span style="font-size:11px;font-weight:800;color:#1e40af;background:#dbeafe;padding:1px 6px;border-radius:4px;">' + escaparHtml(item.id || ('PA-0' + (idx + 1))) + '</span>' +
          '<button type="button" onclick="eliminarProblemaCTEModal_(' + idx + ')" style="background:none;border:none;color:#dc2626;cursor:pointer;font-size:12px;font-weight:700;" title="Eliminar problemática">🗑️ Eliminar</button>' +
        '</div>' +
        '<div style="margin-bottom:4px;">' +
          '<input type="text" id="cteTitulo_' + idx + '" value="' + escaparHtml(item.titulo || '') + '" placeholder="Título de la problemática..." style="width:100%;font-size:12px;font-weight:700;padding:4px 6px;border:1px solid #cbd5e1;border-radius:4px;box-sizing:border-box;">' +
        '</div>' +
        '<div>' +
          '<textarea id="cteBase_' + idx + '" rows="2" style="width:100%;font-size:11.5px;padding:4px 6px;border:1px solid #cbd5e1;border-radius:4px;box-sizing:border-box;resize:vertical;" placeholder="Descripción situacional contextualizada de la escuela...">' + escaparHtml(item.problemaBase || item.descripcion || '') + '</textarea>' +
        '</div>' +
      '</div>';
    });

    const modalBody = '<div style="font-size:12.5px;max-height:420px;overflow-y:auto;padding-right:4px;">' +
      '<p style="margin:0 0 10px;color:#475569;font-size:12px;">' +
        'Aquí puedes <strong>agregar, modificar o eliminar</strong> las problemáticas comunitarias del Programa Analítico acordadas en el Consejo Técnico Escolar (CTE):' +
      '</p>' +
      '<div id="listaItemsCTEModal">' + filasHtml + '</div>' +
    '</div>';

    modal({
      titulo: '⚙️ Catálogo del Programa Analítico (CTE)',
      html: modalBody,
      botones: [
        { texto: 'Cancelar', clase: 'btn-secundario', valor: false },
        { texto: '💾 Guardar Catálogo CTE', clase: 'btn-primario', valor: true }
      ],
      capturar: function (fondo, val) {
        if (!val) return null;
        const nuevos = [];
        const inputs = fondo.querySelectorAll('[id^="cteTitulo_"]');
        inputs.forEach(function (inp) {
          const idx = inp.id.replace('cteTitulo_', '');
          const tit = inp.value.trim();
          const baseEl = fondo.querySelector('#cteBase_' + idx);
          const base = baseEl ? baseEl.value.trim() : '';
          if (tit) {
            nuevos.push({
              id: 'PA-' + (nuevos.length < 9 ? '0' : '') + (nuevos.length + 1),
              categoria: 'Comunidad',
              titulo: tit,
              problemaBase: base
            });
          }
        });
        return { ok: true, catalogo: nuevos };
      }
    }).then(function (res) {
      if (!res || !res.ok || !Array.isArray(res.catalogo)) return;
      if (res.catalogo.length === 0) {
        toast('Debes mantener al menos una problemática en el catálogo.', 'error');
        return;
      }
      CATALOGO_PROGRAMA_ANALITICO_CTE_.length = 0;
      res.catalogo.forEach(function (c) { CATALOGO_PROGRAMA_ANALITICO_CTE_.push(c); });
      guardarCatalogoCTE_(res.catalogo);
      poblarSelectorProblemasCTE_();
      toast('Catálogo de problemáticas CTE actualizado con éxito.', 'ok');
    });

    // Alinear en una sola fila horizontal los 3 botones (➕ Agregar Nueva Problemática, Cancelar y Guardar)
    setTimeout(function () {
      const fondo = document.querySelector('.st90-modal-fondo.visible');
      if (!fondo) return;
      const acciones = fondo.querySelector('.acciones');
      if (!acciones) return;
      acciones.style.display = 'flex';
      acciones.style.justifyContent = 'space-between';
      acciones.style.alignItems = 'center';
      acciones.style.flexWrap = 'wrap';
      acciones.style.gap = '8px';

      let wrapDer = acciones.querySelector('.acciones-der-cte');
      if (!wrapDer) {
        wrapDer = document.createElement('div');
        wrapDer.className = 'acciones-der-cte';
        wrapDer.style = 'display:flex;gap:8px;align-items:center;';
        const btns = Array.from(acciones.querySelectorAll('button[data-i]'));
        btns.forEach(function (b) { wrapDer.appendChild(b); });
        acciones.appendChild(wrapDer);
      }

      if (!document.getElementById('btnModalCTEAgregar')) {
        const btnAgregar = document.createElement('button');
        btnAgregar.type = 'button';
        btnAgregar.id = 'btnModalCTEAgregar';
        btnAgregar.className = 'btn-secundario';
        btnAgregar.style = 'font-size:11.5px;padding:6px 12px;font-weight:700;color:#166534;background:#dcfce7;border:1px solid #86efac;cursor:pointer;border-radius:6px;display:inline-flex;align-items:center;gap:4px;';
        btnAgregar.innerHTML = '➕ Agregar Nueva Problemática';
        btnAgregar.onclick = function (e) {
          e.preventDefault();
          e.stopPropagation();
          agregarNuevoItemCTEModal_();
        };
        acciones.insertBefore(btnAgregar, wrapDer);
      }
    }, 20);
  }

  function eliminarProblemaCTEModal_(idx) {
    const el = document.getElementById('cteTitulo_' + idx);
    if (el) {
      const card = el.closest('div[style*="border:1px solid #cbd5e1"]');
      if (card) card.remove();
    }
  }

  function agregarNuevoItemCTEModal_() {
    const cont = document.getElementById('listaItemsCTEModal');
    if (!cont) return;
    const nuevoIdx = 'nuevo_' + Date.now();
    const div = document.createElement('div');
    div.style = 'background:#f0fdf4;border:1px solid #86efac;border-radius:6px;padding:8px 10px;margin-bottom:8px;';
    div.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">' +

      '<button type="button" onclick="this.closest(\'div[style*="border:1px solid #86efac"]\').remove()" style="background:none;border:none;color:#dc2626;cursor:pointer;font-size:12px;font-weight:700;">🗑️ Quitar</button>' +

    '</div>';
    cont.appendChild(div);
    const inp = div.querySelector('input');
    if (inp) inp.focus();
  }

  function poblarSelectorProblemasCTE_() {
    const sel = document.getElementById('selProblemaEscolar');
    if (!sel) return;
    sel.innerHTML = '<option value="">-- Cargar problemática priorizada por el CTE --</option>' +
      obtenerCatalogoCTE_().map(p =>
        `<option value="${escaparHtml(p.id)}">${escaparHtml(p.categoria)}: ${escaparHtml(p.titulo)}</option>`
      ).join('');
  }

  function alSeleccionarProblemaCTE() {
    const sel = document.getElementById('selProblemaEscolar');
    const val = (sel && sel.value) || '';
    if (!val) return;
    const item = CATALOGO_PROGRAMA_ANALITICO_CTE_.find(p => p.id === val);
    if (item && item.problemaBase) {
      const txt = document.getElementById('planProblema');
      if (txt) {
        txt.value = item.problemaBase;
        txt.focus();
      }
      toast('Problemática contextualizada del CTE cargada.', 'info');
    }
  }

  function actualizarCatalogoPDAParaClase_(asig, grado) {
    // Guard clause: Catálogo disponible
    if (!Array.isArray(CATALOGO_SEP_FASE6_) || CATALOGO_SEP_FASE6_.length === 0) {
      console.warn('Catálogo SEP Fase 6 no disponible.');
      return;
    }

    const asigLimpia = asig || (document.getElementById('planAsignatura') || {}).value || 'Español';
    const gradoLimpio = String(grado || (document.getElementById('planGrado') || {}).value || '1').trim();
    const norm = String(asigLimpia).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

    const encontrada = CATALOGO_SEP_FASE6_.find(e => {
      const discNorm = e.disciplina.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      if (norm.includes(discNorm) || discNorm.includes(norm)) return true;
      if (norm.includes('matematica') && e.disciplina === 'Matemáticas') return true;
      if ((norm.includes('espanol') || norm.includes('lengua')) && e.disciplina === 'Español') return true;
      if (norm.includes('ingles') && e.disciplina === 'Inglés') return true;
      if (norm.includes('arte') && e.disciplina === 'Artes') return true;
      if (norm.includes('geografia') && e.disciplina === 'Geografía') return true;
      if (norm.includes('historia') && e.disciplina === 'Historia') return true;
      if ((norm.includes('civica') || norm.includes('etica') || norm.includes('formacion')) && e.disciplina === 'Formación Cívica y Ética') return true;
      if (norm.includes('tecnologia') && e.disciplina === 'Tecnología') return true;
      if (norm.includes('educacion fisica') && e.disciplina === 'Educación Física') return true;
      if ((norm.includes('tutoria') || norm.includes('socioemocional')) && e.disciplina === 'Tutoría') return true;
      if ((norm.includes('biologia') || norm.includes('fisica') || norm.includes('quimica') || norm.includes('ciencia')) && e.disciplina === 'Ciencias') return true;
      return false;
    }) || CATALOGO_SEP_FASE6_[0];

    matrizCurricularActivaNEM_ = encontrada;

    // AUTONOMÍA DOCENTE NEM: Autoselección inicial recomendada sin bloqueo forzado
    const selCampo = document.getElementById('planCampoFormativo');
    if (selCampo) {
      selCampo.value = encontrada.campo;
      selCampo.disabled = false;
    }

    const selMet = document.getElementById('planMetodologia');
    if (selMet) {
      selMet.value = encontrada.metodologia;
      selMet.disabled = false;
    }

    // Actualización de la etiqueta visual del catálogo oficial
    const etq = document.getElementById('txtEtiquetaMatrizNEM');
    if (etq) {
      etq.textContent = `${encontrada.disciplina} · ${gradoLimpio}° de secundaria (${encontrada.campo})`;
    }

    // FILTRADO DINÁMICO: Poblar únicamente los Contenidos de la disciplina detectada
    const selCont = document.getElementById('selContenidoSinteticoNEM');
    if (selCont) {
      if (!Array.isArray(encontrada.contenidos) || encontrada.contenidos.length === 0) {
        selCont.innerHTML = '<option value="">-- Sin contenidos disponibles --</option>';
        return;
      }

      const opciones = encontrada.contenidos.map((c, idx) =>
        `<option value="${escaparHtml(c.contenido)}"${idx === 0 ? ' selected' : ''}>${idx + 1}. ${escaparHtml(c.contenido)}</option>`
      ).join('');

      selCont.innerHTML = `<option value="">-- Elige un contenido curricular oficial --</option>${opciones}`;

      const primerCont = encontrada.contenidos[0];
      const inpCont = document.getElementById('planContenidoSintetico');
      if (inpCont && (!inpCont.value || !inpCont.value.trim())) {
        inpCont.value = primerCont.contenido;
      }
      poblarSelectorPDASegunContenido_(primerCont.contenido);
    }
  }

  function matrizActivaEtapa2_() {
    try {
      if (typeof matrizCurricularActivaNEM_ !== 'undefined' && matrizCurricularActivaNEM_) return matrizCurricularActivaNEM_;
    } catch (e) {}
    return null;

  function trimestreCalculadoPlan_() {
    var fecha = (document.getElementById('planFechaInicio') || {}).value || '';
    if (typeof calcularTrimestreSEP_Local === 'function') {
      var info = calcularTrimestreSEP_Local(fecha);
      if (info && info.num) return info.num;
    }
    if (typeof determinarTrimestreSEP === 'function') {
      var coincidencia = String(determinarTrimestreSEP(fecha) || '').match(/(\d)/);
      if (coincidencia) return parseInt(coincidencia[1], 10);
    }
    return 1;
  }

  function trimestreActivoPlan_() {
    var sel = document.getElementById('selTrimestrePDA');
    if (sel && sel.value) return String(sel.value);
    return String(trimestreCalculadoPlan_());
  }

  function trimestreDeContenido_(idx, total, explicito) {
    var n = parseInt(explicito, 10);
    if (n === 1 || n === 2 || n === 3) return n;
    var corte = Math.ceil((total || 1) / 3);
    if (idx < corte) return 1;
    if (idx < corte * 2) return 2;
    return 3;
  }

  function mapaTrimestreContenidos_() {
    var mapa = {};
    var matriz = matrizActivaEtapa2_();
    if (!matriz || !Array.isArray(matriz.contenidos)) return mapa;
    var total = matriz.contenidos.length;
    matriz.contenidos.forEach(function (c, idx) {
      if (!c || !c.contenido) return;
      mapa[c.contenido] = trimestreDeContenido_(idx, total, c.trimestre);
    });
    return mapa;
  }

  function sufijoCampoNEM_(campo) {
    var n = String(campo || '').toLowerCase();
    if (n.indexOf('lenguaje') >= 0) return 'lenguajes';
    if (n.indexOf('saber') >= 0 || n.indexOf('cient') >= 0) return 'cientifico';
    if (n.indexOf('etic') >= 0 || n.indexOf('natur') >= 0 || n.indexOf('socied') >= 0) return 'etica';
    return 'comunitario';
  }

  function vaciarNodoEtapa2_(nodo) {
    if (!nodo) return;
    while (nodo.firstChild) nodo.removeChild(nodo.firstChild);

    el.addEventListener(tipo, fn);

  function contenidosConTrimestre_() {
    var matriz = matrizActivaEtapa2_();
    if (!matriz || !Array.isArray(matriz.contenidos)) return [];
    var total = matriz.contenidos.length;
    return matriz.contenidos.map(function (c, idx) {
      return {
        contenido: c.contenido,
        trimestre: trimestreDeContenido_(idx, total, c.trimestre),
        campo: matriz.campo || ''
      };
    }).filter(function (c) { return !!c.contenido; });
  }

  function pintarGridContenidosEtapa2_() {
    var grid = asegurarBuscadorContenidos_();
    if (!grid) return;
    var bus = document.getElementById('buscarContenidoSinteticoNEM');
    var q = String((bus && bus.value) || '').toLowerCase().trim();
    var tri = trimestreActivoPlan_();
    var items = contenidosConTrimestre_().filter(function (c) {
      if (q) return c.contenido.toLowerCase().indexOf(q) >= 0;
      return String(c.trimestre) === String(tri);
    });
    var elegido = (document.getElementById('selContenidoSinteticoNEM') || {}).value || contenidoFiltroPda_ || (document.getElementById('planContenidoSintetico') || {}).value || '';
    vaciarNodoEtapa2_(grid);
    if (!items.length) {
      var vacio = document.createElement('p');
      vacio.className = 'hint';
      vacio.textContent = q
        ? 'Ningún contenido coincide con la búsqueda. Puedes redactarlo libremente en el recuadro de abajo.'
        : 'No hay contenidos de este trimestre en la disciplina. Prueba otro trimestre o escribe el contenido a mano.';
      grid.appendChild(vacio);
      return;

  function elegirContenidoSinteticoEtapa2_(texto) {
    var sel = document.getElementById('selContenidoSinteticoNEM');
    contenidoFiltroPda_ = texto || '';
    if (sel) {
      var encontrado = false;
      var i;
      for (i = 0; i < sel.options.length; i++) {
        if (sel.options[i].value === texto) { encontrado = true; break; }
      }
      if (encontrado) sel.value = texto;
    }
    if (typeof alSeleccionarContenidoSinteticoNEM === 'function') alSeleccionarContenidoSinteticoNEM();
    else {
      var area = document.getElementById('planContenidoSintetico');
      if (area && texto) area.value = texto;
      if (typeof poblarSelectorPDASegunContenido_ === 'function') poblarSelectorPDASegunContenido_(texto);

    pintarGridContenidosEtapa2_();
    programarAutoguardadoPlanNEM_();

  function escribirPdaEtapa2_() {
    var inp = document.getElementById('planPDA');
    if (!inp || window._st90EscribiendoPda) return;
    window._st90EscribiendoPda = true;
    var oficiales = {};
    var todas = _pdasDisponiblesNEM_prev_ ? _pdasDisponiblesNEM_prev_() : [];
    todas.forEach(function (x) { if (x && x.texto) oficiales[x.texto] = true; });
    var elegidos = (window.pdasSeleccionadosNEM_ || []).filter(function (t) { return !!oficiales[t]; });
    var vistos = {};
    var custom = [];
    String(inp.value || '').split('\n').forEach(function (linea) {
      var limpio = String(linea).replace(/^[\s•\-\*\u2022]+/, '').replace(/^\[[^\]]*\]\s*/, '').trim();
      if (!limpio || oficiales[limpio] || vistos[limpio]) return;
      vistos[limpio] = true;
      custom.push('• ' + limpio);
    });
    elegidos.forEach(function (t) { vistos[t] = true; });
    inp.value = elegidos.map(function (t) { return '• ' + t; }).concat(custom).join('\n');
    window.pdasSeleccionadosNEM_ = elegidos.slice();
    window._st90EscribiendoPda = false;
    actualizarBadgesPda_(elegidos.length);
  }

  function alCambiarCasillaPdaEtapa2_(texto, marcado) {
    if (!Array.isArray(window.pdasSeleccionadosNEM_)) window.pdasSeleccionadosNEM_ = [];
    var i = window.pdasSeleccionadosNEM_.indexOf(texto);
    if (marcado && i < 0) window.pdasSeleccionadosNEM_.push(texto);
    if (!marcado && i >= 0) window.pdasSeleccionadosNEM_.splice(i, 1);
    escribirPdaEtapa2_();
    programarAutoguardadoPlanNEM_();
    evaluarProgresoStepperPlan_();
  }

  function instalarPintorPdaEtapa2_() {
    if (typeof _pdasDisponiblesNEM_ === 'function' && !_pdasDisponiblesNEM_prev_) {
      _pdasDisponiblesNEM_prev_ = _pdasDisponiblesNEM_;
    }
  }

  function alCambiarTrimestrePda_() {
    var mapa = mapaTrimestreContenidos_();
    if (contenidoFiltroPda_ && String(mapa[contenidoFiltroPda_]) !== trimestreActivoPlan_()) {
      contenidoFiltroPda_ = '';
    }
    pintarGridContenidosEtapa2_();
    if (typeof _pintarSelectorPDANEM_ === 'function') {
      _pintarSelectorPDANEM_((document.getElementById('buscarPDANEM') || {}).value || '');
    }
    programarAutoguardadoPlanNEM_();
  }

  function programarCatalogoEtapa2_() {
    clearTimeout(timerCatalogoEtapa2_);
    timerCatalogoEtapa2_ = setTimeout(function () {
      if (typeof actualizarCatalogoPDAParaClase_ === 'function') {
        actualizarCatalogoPDAParaClase_(
          (document.getElementById('planAsignatura') || {}).value,
          (document.getElementById('planGrado') || {}).value || '1'
        );
      }
    }, 180);
  }

  function leerBorradorPlanNEM_() {
    try {
      var raw = localStorage.getItem(LLAVE_BORRADOR_PLAN_NEM_);
      if (!raw) return null;
      var datos = JSON.parse(raw);
      if (!datos || typeof datos !== 'object' || !datos.campos) return null;
      return datos;
    } catch (e) { return null; }
  }

  function guardarBorradorPlanNEM_() {
    if (window._st90RestaurandoBorrador) return;
    if (!document.getElementById('planTitulo') && !document.getElementById('planPDA')) return;
    var datos = { ts: Date.now(), campos: {}, ejes: [] };
    CAMPOS_BORRADOR_PLAN_NEM_.forEach(function (id) {
      var el = document.getElementById(id);
      if (el) datos.campos[id] = el.value;
    });
    document.querySelectorAll('#wrapEjesPlan input[type="checkbox"]').forEach(function (cb) {
      if (cb.checked) datos.ejes.push(cb.value);
    });
    try { localStorage.setItem(LLAVE_BORRADOR_PLAN_NEM_, JSON.stringify(datos)); } catch (e) {}
  }

  function programarAutoguardadoPlanNEM_() {
    clearTimeout(timerBorradorPlanNEM_);
    timerBorradorPlanNEM_ = setTimeout(guardarBorradorPlanNEM_, 400);
  }

  function limpiarBorradorPlanNEM_() {
    try { localStorage.removeItem(LLAVE_BORRADOR_PLAN_NEM_); } catch (e) {}
  }

  function formularioPlanSinCaptura_() {
    var id = (document.getElementById('planId') || {}).value || '';
    if (String(id).trim()) return false;
    var vacios = ['planContenidoSintetico', 'planPDA', 'planProblema', 'planProposito'];
    var i;
    for (i = 0; i < vacios.length; i++) {
      var el = document.getElementById(vacios[i]);
      if (el && String(el.value || '').trim()) return false;
    }
    return true;
  }

  function restaurarBorradorPlanNEM_(datos) {
    if (!datos || !datos.campos) return;
    window._st90RestaurandoBorrador = true;
    Object.keys(datos.campos).forEach(function (id) {
      var el = document.getElementById(id);
      if (!el || datos.campos[id] == null || datos.campos[id] === '') return;
      el.value = datos.campos[id];
    });
    if (Array.isArray(datos.ejes)) {
      document.querySelectorAll('#wrapEjesPlan input[type="checkbox"]').forEach(function (cb) {
        cb.checked = datos.ejes.indexOf(cb.value) >= 0;
      });
    }
    window._st90RestaurandoBorrador = false;
    var querido = datos.campos.selContenidoSinteticoNEM || datos.campos.planContenidoSintetico || '';
    var sel = document.getElementById('selContenidoSinteticoNEM');
    if (sel && querido) {
      var i;
      for (i = 0; i < sel.options.length; i++) {
        if (sel.options[i].value === querido) {
          sel.value = querido;
          contenidoFiltroPda_ = querido;
          break;
        }
      }
    }
    if (typeof poblarSelectorPDASegunContenido_ === 'function') {
      poblarSelectorPDASegunContenido_(contenidoFiltroPda_ || querido);
    }
    pintarGridContenidosEtapa2_();
  }

  function etapaCompletaPlan_(n) {
    function lleno(id) {
      var el = document.getElementById(id);
      return !!(el && String(el.value || '').trim());
    }
    if (n === 1) return lleno('planTitulo') && lleno('planNumSesiones') && lleno('planCampoFormativo') && lleno('planMetodologia');
    if (n === 2) return lleno('planContenidoSintetico') && lleno('planPDA');
    if (n === 3) {
      var ok = lleno('planProblema');
      var sec = document.getElementById('secInclusionBAPyC');
      if (sec && !sec.classList.contains('oculto')) ok = ok && lleno('planAjustesRazonables');
      return ok;
    }
    if (n === 4) return lleno('planProposito');
    return false;
  }

  function evaluarProgresoStepperPlan_() {
    var listos = 0;
    var i;
    for (i = 1; i <= 4; i++) {
      var tab = document.getElementById('tabPasoPlan' + i);
      var completo = etapaCompletaPlan_(i);
      if (tab) tab.classList.toggle('completado', completo);
      if (completo) listos++;
    }
    var pct = listos * 25;
    var header = document.querySelector('.nem-stepper-header');
    if (header) header.setAttribute('data-progreso', String(pct));
    var avance = document.getElementById('avancePlanNEM');
    if (!avance && header) {
      avance = document.createElement('span');
      avance.id = 'avancePlanNEM';
      avance.className = 'nem-stepper-avance';
      avance.setAttribute('aria-live', 'polite');
      header.appendChild(avance);
    }
    if (avance) avance.textContent = pct + '%';
  }

  function campoObligatorioVacio_(id) {
    if (id === 'planAjustesRazonables') {
      var sec = document.getElementById('secInclusionBAPyC');
      if (!sec || sec.classList.contains('oculto')) return false;
    }
    var el = document.getElementById(id);
    if (!el) return false;
    var obligatorios = {
      planTitulo: 1, planNumSesiones: 1, planCampoFormativo: 1, planMetodologia: 1,
      planContenidoSintetico: 1, planPDA: 1, planProblema: 1, planAjustesRazonables: 1, planProposito: 1
    };
    if (!obligatorios[id]) return false;
    return !String(el.value || '').trim();
  }

  function asegurarControlesEtapa2_() {
    asegurarSelectorTrimestre_();
    asegurarBuscadorContenidos_();
    asegurarBadgeContadorPda_();
    asegurarBotonSugerirPda_();
    var items = contenidosConTrimestre_();
    asegurarDatalistContenidos_(items);
  }

  function iniciarSincronizacionEtapa2NEM_() {
    if (window._st90Etapa2Lista) return;
    if (!document.getElementById('etapaPlanNEM_2') && !document.getElementById('planPDA')) return;
    window._st90Etapa2Lista = true;

    var estabaVacio = formularioPlanSinCaptura_();
    var borrador = leerBorradorPlanNEM_();

    instalarPintorPdaEtapa2_();

    if (typeof actualizarCatalogoPDAParaClase_ === 'function' && !actualizarCatalogoPDAParaClase_._st90Etapa2) {
      var origCat = actualizarCatalogoPDAParaClase_;
      function catalogoConGrid(asig, grado) {
        contenidoFiltroPda_ = '';
        var r = origCat.apply(this, arguments);
        try {
          var selCat = document.getElementById('selContenidoSinteticoNEM');
          if (selCat && selCat.value) contenidoFiltroPda_ = selCat.value;
          asegurarControlesEtapa2_();
          pintarGridContenidosEtapa2_();
          if (typeof _pintarSelectorPDANEM_ === 'function') {
            _pintarSelectorPDANEM_((document.getElementById('buscarPDANEM') || {}).value || '');
          }
        } catch (e) {}
        return r;
      }
      catalogoConGrid._st90Etapa2 = true;
      window.actualizarCatalogoPDAParaClase_ = catalogoConGrid;
    }

    if (typeof alSeleccionarContenidoSinteticoNEM === 'function' && !alSeleccionarContenidoSinteticoNEM._st90Etapa2) {
      var origCont = alSeleccionarContenidoSinteticoNEM;
      function elegirContenido(ev) {
        var sel = document.getElementById('selContenidoSinteticoNEM');
        if (sel && sel.value) contenidoFiltroPda_ = sel.value;
        var r = origCont.apply(this, arguments);
        try { pintarGridContenidosEtapa2_(); } catch (e) {}
        return r;
      }
      elegirContenido._st90Etapa2 = true;
      window.alSeleccionarContenidoSinteticoNEM = elegirContenido;
    }

    if (typeof irAPasoPlanNEM === 'function' && !irAPasoPlanNEM._st90Borrador) {
      var origIr = irAPasoPlanNEM;
      function irConBorrador(paso) {
        var r = origIr.apply(this, arguments);
        try {
          guardarBorradorPlanNEM_();
          evaluarProgresoStepperPlan_();
        } catch (e) {}
        return r;
      }
      irConBorrador._st90Borrador = true;
      window.irAPasoPlanNEM = irConBorrador;
    }

    if (typeof gsRun === 'function' && !gsRun._st90Borrador) {
      var origGs = gsRun;
      function gsRunConBorrador(fn) {
        var promesa = origGs.apply(this, arguments);
        if (fn === 'crearOActualizarPlaneacionNEM' && promesa && promesa.then) {
          promesa.then(function (res) {
            if (res && res.ok) limpiarBorradorPlanNEM_();
          }, function () {});
        }
        return promesa;
      }
      gsRunConBorrador._st90Borrador = true;
      window.gsRun = gsRunConBorrador;
    }

    asegurarControlesEtapa2_();

    var asig = document.getElementById('planAsignatura');
    var grado = document.getElementById('planGrado');
    engancharUnaVez_(asig, 'input', programarCatalogoEtapa2_);
    engancharUnaVez_(asig, 'change', programarCatalogoEtapa2_);
    engancharUnaVez_(grado, 'change', programarCatalogoEtapa2_);

    var buscador = document.getElementById('buscarContenidoSinteticoNEM');
    engancharUnaVez_(buscador, 'input', pintarGridContenidosEtapa2_);

    var trimestre = document.getElementById('selTrimestrePDA');
    engancharUnaVez_(trimestre, 'change', function () {
      trimestre._st90Tocado = true;
      alCambiarTrimestrePda_();
    });

    var fecha = document.getElementById('planFechaInicio');
    engancharUnaVez_(fecha, 'change', function () {
      var selTri = document.getElementById('selTrimestrePDA');
      if (selTri && !selTri._st90Tocado) {
        selTri.value = String(trimestreCalculadoPlan_());
        alCambiarTrimestrePda_();
      }
    });

    CAMPOS_BORRADOR_PLAN_NEM_.forEach(function (id) {
      var el = document.getElementById(id);
      engancharUnaVez_(el, 'input', function () {
        programarAutoguardadoPlanNEM_();
        if (id === 'planContenidoSintetico') {
          var texto = String(el.value || '').trim();
          var coincide = contenidosConTrimestre_().some(function (c) { return c.contenido === texto; });
          if (coincide && contenidoFiltroPda_ !== texto) {
            contenidoFiltroPda_ = texto;
            var selC = document.getElementById('selContenidoSinteticoNEM');
            if (selC) selC.value = texto;
            if (typeof poblarSelectorPDASegunContenido_ === 'function') poblarSelectorPDASegunContenido_(texto);
          }
          pintarGridContenidosEtapa2_();
        }
        if (id === 'planPDA' && !window._st90EscribiendoPda) {
          var leidos = window._leerSeleccionPDANEM_ ? window._leerSeleccionPDANEM_() : [];
          var oficiales = {};
          var todas = _pdasDisponiblesNEM_prev_ ? _pdasDisponiblesNEM_prev_() : [];
          todas.forEach(function (x) { if (x && x.texto) oficiales[x.texto] = true; });
          window.pdasSeleccionadosNEM_ = leidos.filter(function (t) { return !!oficiales[t]; });
          if (typeof _pintarSelectorPDANEM_ === 'function') {
            _pintarSelectorPDANEM_((document.getElementById('buscarPDANEM') || {}).value || '', true);
          }
        }
      });
      engancharUnaVez_(el, 'change', programarAutoguardadoPlanNEM_);
      engancharUnaVez_(el, 'blur', function () {
        if (el && el.setAttribute) el.setAttribute('aria-invalid', campoObligatorioVacio_(id) ? 'true' : 'false');
        evaluarProgresoStepperPlan_();
        guardarBorradorPlanNEM_();
      });
    });

    document.querySelectorAll('#wrapEjesPlan input[type="checkbox"]').forEach(function (cb) {
      engancharUnaVez_(cb, 'change', function () {
        programarAutoguardadoPlanNEM_();
        evaluarProgresoStepperPlan_();
      });
    });

    if (typeof actualizarCatalogoPDAParaClase_ === 'function') {
      actualizarCatalogoPDAParaClase_(
        (asig && asig.value) || '',
        (grado && grado.value) || '1'
      );
    } else {
      pintarGridContenidosEtapa2_();
    }

    if (estabaVacio && borrador) restaurarBorradorPlanNEM_(borrador);
    evaluarProgresoStepperPlan_();

    window.guardarBorradorPlanNEM_ = guardarBorradorPlanNEM_;
    window.evaluarProgresoStepperPlan_ = evaluarProgresoStepperPlan_;
    window.iniciarSincronizacionEtapa2NEM_ = iniciarSincronizacionEtapa2NEM_;
  }

  window.iniciarSincronizacionEtapa2NEM_ = iniciarSincronizacionEtapa2NEM_;
  window.guardarBorradorPlanNEM_ = guardarBorradorPlanNEM_;
  window.evaluarProgresoStepperPlan_ = evaluarProgresoStepperPlan_;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciarSincronizacionEtapa2NEM_);
  } else {
    iniciarSincronizacionEtapa2NEM_();
  }
</script>
