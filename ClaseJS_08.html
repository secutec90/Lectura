    function toggleSidebarShell() {
      const sidebar = document.getElementById('appShellSidebar');
      if (!sidebar) return;
      sidebar.classList.toggle('colapsado');
      try {

    let etapaPlanActual_ = 1;

    function irAPasoPlanNEM(paso) {
      const p = Math.max(1, Math.min(4, parseInt(paso, 10) || 1));
      etapaPlanActual_ = p;

      for (let i = 1; i <= 4; i++) {
        const tab = document.getElementById('tabPasoPlan' + i);
        const pane = document.getElementById('etapaPlanNEM_' + i);
        if (tab) {
          tab.classList.toggle('activo', i === p);
          tab.classList.toggle('completado', i < p);
          tab.setAttribute('aria-selected', i === p ? 'true' : 'false');
        }
        if (pane) {
          pane.classList.toggle('oculto', i !== p);
        }
      }

      const stepHeader = document.querySelector('.nem-stepper-header');
      if (stepHeader) {
        try { stepHeader.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
      }
    }

    function insertarReferenciaLibroSesion_(idx) {
      const gradoSel = parseInt((document.getElementById('planGrado') && document.getElementById('planGrado').value) || '1', 10);
      const campoSel = (document.getElementById('planCampoFormativo') && document.getElementById('planCampoFormativo').value) || '';

        return l.grado === gradoSel || l.campo === campoSel || l.campo === 'Interdisciplinar';
      });
      const libro = filtrados[idx];
      if (!libro) return;

      const refTexto = '\n\n[Referencia SEP Fase 6]: ' + libro.titulo + ' (' + libro.paginasRelevantes + '). Proyectos recomendados: ' + libro.proyectosSugeridos.join('; ') + '.';
      const sesDesarrollo = document.getElementById('sesDesarrollo');
      if (sesDesarrollo) {
        sesDesarrollo.value = (sesDesarrollo.value ? sesDesarrollo.value.trim() : '') + refTexto;
        sesDesarrollo.focus();
      }
      toast('Referencia del libro SEP vinculada a la sesión.', 'ok');
    }

        }
      };
      const meta = catalogo[tipo];
      if (!meta) return;

      const idUnico = 'idevice_' + Date.now();
      const div = document.createElement('div');
      div.id = idUnico;
      div.className = 'idevice-card ' + meta.variante;

      const header = document.createElement('div');
      header.className = 'idevice-header';
      const tag = document.createElement('span');
      tag.className = 'idevice-tag';
      tag.textContent = meta.etiqueta;
      const btnQuitar = document.createElement('button');
      btnQuitar.type = 'button';
      btnQuitar.className = 'idevice-btn';
      btnQuitar.textContent = '🗑️ Quitar';
      btnQuitar.setAttribute('aria-label', 'Quitar ' + meta.etiqueta);
      btnQuitar.addEventListener('click', function () { eliminarIDeviceCard_(btnQuitar); });
      header.appendChild(tag);
      header.appendChild(btnQuitar);

      const body = document.createElement('div');
      body.className = 'idevice-body';
      const titulo = document.createElement('input');
      titulo.type = 'text';
      titulo.className = 'idevice-campo-titulo';
      titulo.placeholder = meta.phTitulo;
      titulo.setAttribute('aria-label', 'Título del bloque');
      const cuerpo = document.createElement('textarea');
      cuerpo.className = 'idevice-campo-cuerpo';
      cuerpo.rows = 2;
      cuerpo.placeholder = meta.phCuerpo;
      cuerpo.setAttribute('aria-label', 'Contenido del bloque');
      if (tipo === 'lectura') cuerpo.id = 'txtLectura_' + idUnico;
      body.appendChild(titulo);
      body.appendChild(cuerpo);

      if (tipo === 'lectura') {
        const bar = document.createElement('div');
        bar.className = 'idevice-audio-bar';
        const btnAudio = document.createElement('button');
        btnAudio.type = 'button';
        btnAudio.className = 'idevice-btn';
        btnAudio.textContent = '🔊 Escuchar con Web Speech';
        btnAudio.addEventListener('click', function () { probarAudioIDevice_(btnAudio); });
        bar.appendChild(btnAudio);
        body.appendChild(bar);
      }

      div.appendChild(header);
      div.appendChild(body);
      contenedor.appendChild(div);
      toast('Bloque ' + tipo.toUpperCase() + ' insertado en la sesión.', 'info');
    }

    function probarAudioIDevice_(btn) {
      let texto = '';
      if (btn && btn.closest) {
        const card = btn.closest('.idevice-card');
        const txtEl = card ? card.querySelector('textarea') : null;
        texto = txtEl ? txtEl.value.trim() : '';
      }
      if (!texto) texto = 'Por favor escribe un texto en el bloque de lectura para escucharlo.';
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(texto);
        u.lang = 'es-MX';
        u.rate = 1.0;
        window.speechSynthesis.speak(u);
      }
    }

      toast('Hallazgo del Censo de Movilidad vinculado al Problema Comunitario.', 'ok');

    function conmutarSubTabEncuestas(subTab) {
      const pAnalitica = document.getElementById('subPanelEncuestaAnalitica');
      const pEditor = document.getElementById('subPanelEncuestaEditor');
      const btnA = document.getElementById('btnSubTabAnalitica');
      const btnE = document.getElementById('btnSubTabEditor');

      if (subTab === 'analitica') {
        if (pAnalitica) pAnalitica.classList.remove('oculto');
        if (pEditor) pEditor.classList.add('oculto');
        if (btnA) btnA.classList.add('activo');
        if (btnE) btnE.classList.remove('activo');
      } else {
        if (pAnalitica) pAnalitica.classList.add('oculto');
        if (pEditor) pEditor.classList.remove('oculto');
        if (btnA) btnA.classList.remove('activo');
        if (btnE) btnE.classList.add('activo');
      }
    }

    let chartMovilidadInstance_ = null;

    function iniciarGraficasDiagnostico_() {
      const cMov = document.getElementById('chartMovilidadEscolar');
      const cRiesgo = document.getElementById('chartRiesgoDiagnostico');
      if (!cMov && !cRiesgo) return;

      if (typeof Chart !== 'undefined') {
        if (cMov) {
          if (chartMovilidadInstance_) chartMovilidadInstance_.destroy();
          const ctx = cMov.getContext('2d');
          chartMovilidadInstance_ = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: ['Transporte Público', 'Caminando', 'Bicicleta / Patín', 'Auto Particular'],
              datasets: [{
                label: '% Alumnos',
                data: [54.2, 28.5, 9.8, 7.5],
                backgroundColor: ['#2563eb', '#10b981', '#f59e0b', '#8b5cf6'],
                borderRadius: 6
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: { y: { beginAtZero: true, max: 60 } }
            }
          });
        }
        if (cRiesgo) {
          if (chartRiesgoInstance_) chartRiesgoInstance_.destroy();
          const ctxR = cRiesgo.getContext('2d');
          chartRiesgoInstance_ = new Chart(ctxR, {
            type: 'doughnut',
            data: {
              labels: ['Riesgo Vial / Cruces', 'Traslado > 40 min', 'Acceso Digital DUA', 'Sin Factores Críticos'],
              datasets: [{
                data: [42.5, 25.5, 18.0, 14.0],
                backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6', '#10b981']
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10.5 } } } }
            }
          });
        }
      } else {
        if (cMov) {
          const ctx = cMov.getContext('2d');
          ctx.clearRect(0, 0, cMov.width, cMov.height);
          ctx.fillStyle = '#2563eb';
          ctx.fillRect(10, 20, 140, 20);
          ctx.fillStyle = '#10b981';
          ctx.fillRect(10, 50, 80, 20);
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(10, 80, 30, 20);
          ctx.fillStyle = '#334155';
          ctx.font = '11px sans-serif';
          ctx.fillText('Transporte: 54.2%', 160, 35);
          ctx.fillText('Caminando: 28.5%', 100, 65);
          ctx.fillText('Bici: 9.8%', 50, 95);
        }
        if (cRiesgo) {
          const ctxR = cRiesgo.getContext('2d');
          ctxR.clearRect(0, 0, cRiesgo.width, cRiesgo.height);
          ctxR.fillStyle = '#ef4444';
          ctxR.fillRect(10, 20, 110, 20);
          ctxR.fillStyle = '#f59e0b';
          ctxR.fillRect(10, 50, 70, 20);
          ctxR.fillStyle = '#3b82f6';
          ctxR.fillRect(10, 80, 50, 20);
          ctxR.fillStyle = '#334155';
          ctxR.font = '11px sans-serif';
          ctxR.fillText('Riesgo Vial: 68.4%', 130, 35);
          ctxR.fillText('Traslado > 40m: 41.2%', 90, 65);
          ctxR.fillText('DUA Digital: 76.8%', 70, 95);
        }
      }
    }

    function inicializarLecturaModulo_() {

    function conmutarSubTabLectura_(subTab) {
      const pMed = document.getElementById('subPanelLecturaMedicion');
      const pRea = document.getElementById('subPanelLecturaReactivos');
      const bMed = document.getElementById('btnSubTabLecMedicion');
      const bRea = document.getElementById('btnSubTabLecReactivos');

      if (subTab === 'medicion') {
        if (pMed) pMed.classList.remove('oculto');
        if (pRea) pRea.classList.add('oculto');
        if (bMed) bMed.classList.add('activo');
        if (bRea) bRea.classList.remove('activo');
      } else {
        if (pMed) pMed.classList.add('oculto');
        if (pRea) pRea.classList.remove('oculto');
        if (bMed) bMed.classList.remove('activo');
        if (bRea) bRea.classList.add('activo');
      }
    }

    function cambiarLecturaDocenteLocal_(val) {
      const id = parseInt(val, 10) || 1;
      const l = CATALOGO_LECTURAS_DOCENTE_.find(function (item) { return item.id === id; }) || CATALOGO_LECTURAS_DOCENTE_[0];
      lecturaDocenteActiva_ = l;

      const tEl = document.getElementById('titLecturaPPM');
      const pEl = document.getElementById('parrafoLecturaPPM');
      const bEl = document.getElementById('badgeLecturaPalabras');
      if (tEl) tEl.textContent = l.titulo;
      if (pEl) pEl.textContent = l.texto;
      if (bEl) bEl.textContent = l.palabras + ' palabras';

      if (cronometroLecturaTimer_) {
        clearInterval(cronometroLecturaTimer_);
        cronometroLecturaTimer_ = null;
      }
      tiempoLecturaInicio_ = 0;
      tiempoLecturaTranscurrido_ = 0;
      const dispC = document.getElementById('dispCronometroLectura');
      const dispP = document.getElementById('dispPPM');
      if (dispC) dispC.textContent = '00:00';
      if (dispP) dispP.textContent = '-- PPM';

      renderizarReactivosLecturaLocal_(l);
    }

    function renderizarReactivosLecturaLocal_(l) {
      const c = document.getElementById('cajaReactivosLectura');
      if (!c) return;
      let html = '';
      const colores = ['#2563eb', '#10b981', '#f59e0b'];
      const bgBadges = ['#eff6ff', '#d1fae5', '#fef3c7'];
      const textBadges = ['#1d4ed8', '#065f46', '#92400e'];

      l.preguntas.forEach(function (p, idx) {
        const color = colores[idx % colores.length];
        const bg = bgBadges[idx % bgBadges.length];
        const fg = textBadges[idx % textBadges.length];
        html += '<div style="background:#ffffff;border:1px solid var(--app-border);border-radius:10px;padding:14px;border-left:4px solid ' + color + ';">' +
          '<div style="display:flex;justify-content:space-between;margin-bottom:6px;">' +
            '<span class="tipo-badge" style="background:' + bg + ';color:' + fg + ';">' + escaparHtml(p.nivel) + '</span>' +
            '<span style="font-size:11px;color:#64748b;">Reactivo ' + (idx + 1) + '</span>' +
          '</div>' +
          '<p style="font-size:13px;font-weight:700;margin:0 0 8px;">' + escaparHtml(p.texto) + '</p>' +
          '<div style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:#334155;">';
        p.opciones.forEach(function (opt) {
          const esCorrecta = opt === p.correcta;
          html += '<label style="display:flex;align-items:center;gap:6px;">' +
            '<input type="radio" name="rLocal_' + idx + '" ' + (esCorrecta ? 'checked' : '') + '> ' +
            escaparHtml(opt) + (esCorrecta ? ' <span style="color:#15803d;font-weight:700;">(Correcta)</span>' : '') +
          '</label>';
        });
        html += '</div></div>';
      });
      c.innerHTML = html;
