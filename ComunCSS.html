<style>
  :root {
    /* TOKENS OFICIALES DEL DESIGN SYSTEM MODULAR (SKILL.md) */
    --app-primary: #2563eb;
    --app-primary-dark: #1d4ed8;
    --app-primary-soft: #eff6ff;
    --app-primary-tint: #dbeafe;
    --app-border: #e2e8f0;
    --app-border-strong: #cbd5e1;
    --app-text: #334155;
    --app-muted: #64748b;
    --app-hover: #f1f5f9;
    --app-radius: 8px;
    --app-radius-lg: 12px;
    --app-shadow-card: 0 4px 15px rgba(0,0,0,0.05);
    --app-shadow-menu: 0 10px 25px rgba(15,23,42,0.08);

    --st90-azul: #1f6f9f;
    --st90-azul-osc: #185a80;
    --st90-naranja: #d35400;
    --st90-verde: #1e8449;
    --st90-rojo: #c0392b;
    --st90-gris: #7f8c8d;
    --st90-texto: #2c3e50;
    --st90-fondo: #f4f7fb;
    --st90-borde: #e4ecf3;
    --st90-sombra: 0 2px 8px rgba(0,0,0,0.05);
  }
  * { box-sizing: border-box; }
  html, body {
    max-width: 100%;
    overflow-x: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  html::-webkit-scrollbar, body::-webkit-scrollbar,
  *::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    background: var(--st90-fondo);
    color: var(--st90-texto);
    line-height: 1.55;
  }
  h1, h2, h3 { margin-top: 0; }
  h1 { font-size: 26px; }
  h2 { font-size: 20px; }
  button {
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    background: var(--st90-azul);
    color: #fff;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: background .15s;
  }
  button:hover:not(:disabled) { background: var(--st90-azul-osc); }
  button:disabled { background: #95a5a6; cursor: not-allowed; }
  .btn-secundario { background: var(--st90-gris); }
  a.btn-secundario {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    background: var(--st90-gris);
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-sizing: border-box;
  }
  a.btn-secundario:hover { background: #6c7a7b; color: #fff; }
  .btn-rojo { background: var(--st90-rojo); }
  .btn-verde { background: var(--st90-verde); }
  .btn-naranja { background: var(--st90-naranja); }
  input, select, textarea {
    padding: 8px;
    border: 1px solid #bdc3c7;
    border-radius: 4px;
    font-family: inherit;
    font-size: 14px;
  }
  label { font-weight: 700; }

  /* Toast (esquina inferior derecha para no tapar nunca el menú superior) */
  #st90-toast {
    position: fixed;
    top: 18px; right: 20px;
    left: auto; top: auto;
    transform: translateY(-80px);
    background: var(--st90-azul);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(15,23,42,0.22);
    z-index: 999999;
    font-weight: 600;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: transform .25s ease, opacity .25s ease;
    max-width: min(380px, 90vw);
  }
  #st90-toast.visible { transform: translateY(0); opacity: 1; }

  /* Barra de progreso discreta bajo el menú superior */
  .st90-barra-carga {
    position: relative;
    width: 100%;
    height: 3px;
    background: rgba(37, 99, 235, 0.12);
    border-radius: 999px;
    overflow: hidden;
    margin: -4px 0 6px 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 190;
  }
  .st90-barra-carga.activa,
  .st90-barra-carga.completada,
  .st90-barra-carga.error {
    opacity: 1;
  }
  .st90-barra-carga-fill {
    height: 100%;
    width: 38%;
    border-radius: 999px;
    background: linear-gradient(90deg, #2563eb 0%, #0d9488 50%, #2563eb 100%);
    background-size: 200% 100%;
    transform: translateX(-100%);
    transition: width .25s ease, background .25s ease, transform .25s ease;
  }
  .st90-barra-carga.activa .st90-barra-carga-fill {
    animation: st90BarraIndeterminada 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  .st90-barra-carga.completada .st90-barra-carga-fill {
    animation: none;
    width: 100%;
    transform: translateX(0);
    background: #10b981;
  }
  .st90-barra-carga.error .st90-barra-carga-fill {
    animation: none;
    width: 100%;
    transform: translateX(0);
    background: #dc2626;
  }
  @keyframes st90BarraIndeterminada {
    0% { transform: translateX(-110%); width: 32%; }
    50% { transform: translateX(85%); width: 48%; }
    100% { transform: translateX(260%); width: 32%; }
  }
  #st90-toast.error, #st90-toast.err { background: var(--st90-rojo); }
  #st90-toast.exito, #st90-toast.ok { background: var(--st90-verde); }
  #st90-toast.info { background: #0284c7; }

  /* Modal */
  .st90-modal-fondo {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 9998;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .st90-modal-fondo.visible { opacity: 1; pointer-events: auto; }
  .st90-modal {
    background: #fff; padding: 22px 26px; border-radius: 12px;
    max-width: 460px; width: 92%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  }
  .st90-modal h3 { margin: 0 0 10px; }
  .st90-modal .acciones { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .form-modal-usu .campo { margin: 0 0 12px; }
  .form-modal-usu label { display: block; font-size: 12px; font-weight: 700; color: #64748b; margin: 0 0 4px; }
  .form-modal-usu input, .form-modal-usu select {
    width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--st90-borde);
    border-radius: 8px; box-sizing: border-box; font-size: 14px;
  }
  .form-modal-usu p { margin: 0 0 12px; color: #64748b; font-size: 13px; line-height: 1.45; }
  .st90-modal-ayuda {
    max-width: 720px;
    max-height: 86vh;
    overflow: auto;
    text-align: left;
  }
  .btn-ayuda {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    width: 42px; height: 42px; min-width: 42px; padding: 0; margin: 0;
    border: 1px solid var(--st90-borde); background: #fff; color: var(--st90-azul);
    border-radius: 8px; cursor: pointer; vertical-align: middle;
    font-weight: 700; font-size: 14px; line-height: 1; flex-shrink: 0;
  }
  .btn-ayuda:hover:not(:disabled), .btn-ayuda:focus {
    background: #f8fafc; color: var(--st90-azul); border-color: var(--st90-borde); outline: none;
  }
  .btn-ayuda svg { display: block; pointer-events: none; }
  .btn-ayuda.ribbon-btn[data-tip]::after,
  .ribbon-btn[data-tip]::after,
  .ribbon-tab[data-tip]::after {
    display: none !important;
    content: none !important;
  }
  .titulo-con-ayuda {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: nowrap; width: 100%;
  }
  .titulo-con-ayuda .btn-ayuda {
    margin-left: auto !important;
  }
  .titulo-con-ayuda h2, .titulo-con-ayuda h3 { margin: 0; }
  .ayuda-cuerpo p { margin: 0 0 10px; font-size: 14px; line-height: 1.55; color: #334155; }
  .ayuda-cuerpo h4 {
    margin: 14px 0 6px; font-size: 12px; font-weight: 800;
    color: var(--st90-azul); text-transform: uppercase; letter-spacing: .35px;
  }
  .ayuda-cuerpo h4:first-child { margin-top: 0; }
  .ayuda-cuerpo dt { font-weight: 700; font-size: 13px; color: #0f172a; margin-top: 8px; }
  .ayuda-cuerpo dd { margin: 2px 0 0 0; font-size: 13px; color: #475569; line-height: 1.45; }
  .ayuda-cuerpo .formula {
    background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;
    padding: 8px 12px; font-size: 13px; margin: 8px 0; color: #0f172a;
  }
  @media print {
    .btn-ayuda { display: none !important; }
    .ribbon-main-nav, .login, .barra-sup-acciones, .cinta-filtros-res { display: none !important; }
  }

  /* Layout común */
  .st90-oculto { display: none !important; }
  .st90-fila { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .st90-chip {
    display: inline-block; font-size: 12px;
    background: #eaf4fb; color: var(--st90-azul);
    padding: 2px 8px; border-radius: 10px; margin-left: 6px;
  }
  .st90-chip.no { background: #fdecea; color: #922b21; }
  .st90-chip.ok { background: #e8f8ef; color: var(--st90-verde); }
  .st90-chip.warn { background: #fef9e7; color: #b9770e; }

  /* Semáforo PPM */
  .st90-semaforo {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 13px;
  }
  .st90-semaforo.bajo { background: #fdecea; color: #922b21; }
  .st90-semaforo.dentro { background: #e8f8ef; color: #145a32; }
  .st90-semaforo.alto { background: #fef9e7; color: #b9770e; }

  /* =========================================================
     DISEÑO EDITORIAL TIPO LIBRO (VISTA PREVIA / LECTURA)
     ========================================================= */
  .hoja-libro-wrapper {
    background: #f1f5f9;
    padding: 24px 16px;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.04);
    width: 100%;
    box-sizing: border-box;
  }
  .hoja-libro {
    background: #fefcf9;
    color: #241c15;
    max-width: 1066px;
    width: 100%;
    padding: 50px 62px 46px;
    border-radius: 6px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
    border: 1px solid #e8decb;
    box-sizing: border-box;
    font-family: 'Merriweather', Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
  }
  @media (max-width: 1100px) {
    .hoja-libro-wrapper { padding: 12px 6px; }
    .hoja-libro { padding: 28px 22px; }
  }
  .hoja-libro-encabezado {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #e8decb;
    padding-bottom: 8px;
    margin-bottom: 26px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #8c7b6c;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-weight: 700;
  }
  .hoja-libro-marca {
    display: flex; align-items: center; gap: 8px; min-width: 0;
  }
  .hoja-libro-logo {
    height: 36px; width: auto; max-width: 72px; object-fit: contain;
    flex: 0 0 auto;
  }
  .hoja-libro-escuela {
    font-size: 11px; font-weight: 800; letter-spacing: 1px;
    text-transform: uppercase; color: #8c7b6c; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .libro-meta-asignatura { flex: 0 0 auto; text-align: right; }
  .hoja-libro-titulo {
    font-size: 26px;
    line-height: 1.35;
    text-align: center;
    color: #1a1612;
    margin: 0 0 12px 0;
    font-weight: 700;
    letter-spacing: -0.2px;
    font-family: Georgia, serif;
  }
  .hoja-libro-separador {
    text-align: center;
    color: #bfa68a;
    font-size: 13px;
    letter-spacing: 6px;
    margin-bottom: 26px;
  }
  .hoja-libro-cuerpo {
    font-size: 18.5px;
    line-height: 1.9; /* Espaciado amplio y elegante */
    color: #241c15;
    text-align: justify;
    text-justify: inter-word;
    hyphens: auto;
  }
  .hoja-libro-cuerpo p {
    margin: 0 0 1.3em 0;
    text-indent: 2.2em; /* Sangría clásica de libro */
  }
  .hoja-libro-cuerpo p:first-of-type {
    text-indent: 0;
  }
  .hoja-libro-cuerpo p:first-of-type::first-letter {
    font-size: 2.3em;
    line-height: 0.85;
    float: left;
    margin: 0.04em 0.06em 0 0;
    color: var(--st90-azul);
    font-weight: 700;
    font-family: Georgia, serif;
  }
  .hoja-libro-pie {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    border-top: 1px solid #e8decb;
    padding-top: 10px;
    margin-top: 30px;
    font-size: 11px;
    letter-spacing: 1px;
    color: #8c7b6c;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-weight: 600;
  }
  @media (max-width: 640px) {
    .hoja-libro-encabezado { flex-wrap: wrap; gap: 6px; }
    .hoja-libro-escuela { white-space: normal; }
    .libro-meta-asignatura { text-align: left; }
  }

  .oculto { display: none !important; }

  /* Pasos del examen */
  .pasos-examen {
    display: flex; gap: 6px; margin: 0 0 16px; flex-wrap: wrap;
  }
  .pasos-examen span {
    flex: 1; min-width: 72px; text-align: center;
    font-size: 12px; font-weight: 700; color: #64748b;
    background: #fff; border: 1px solid var(--st90-borde);
    border-radius: 999px; padding: 6px 8px;
  }
  .pasos-examen span.hecho { color: var(--st90-azul); border-color: var(--st90-azul); background: #eaf4fb; }
  .pasos-examen span.actual { color: #fff; background: var(--st90-azul); border-color: var(--st90-azul); }

  /* Opciones de pregunta (alumno y vista previa) */
  .opcion {
    display: flex; align-items: flex-start; gap: 10px;
    margin: 12px 0; padding: 12px;
    border: 1px solid var(--st90-borde); border-radius: 8px;
    background: #fbfcfe; cursor: default;
  }
  .opcion.clic { cursor: pointer; transition: background .15s, border-color .15s; }
  .opcion.clic:hover { background: #eef6fc; }
  .opcion input[type="radio"] {
    width: 18px; height: 18px; min-width: 18px; margin: 3px 0 0 0; padding: 0;
    accent-color: var(--st90-azul);
  }
  .opcion.seleccionada { background: #e8f1f8; border-color: var(--st90-azul); }
  .opcion.correcta { background: #dcfce7; border-color: #22c55e; }

  /* =========================================================
     CINTA ESTILO ACADEMIA (ribbon + subribbon)
     ========================================================= */
  .ribbon-main-nav {
    display: grid !important;
    grid-template-columns: 1fr auto;
    align-items: center;
    column-gap: 8px;
    row-gap: 0;
    background: var(--st90-fondo) !important;
    border: 0 !important;
    box-shadow: none !important;
    width: 100%;
    position: sticky;
    top: 0;
    z-index: 200;
  }
  .ribbon-main-nav > .tabs,
  .ribbon-main-nav > .ribbon-tabs,
  .ribbon-main-nav > #menuTabsPanel {
    grid-column: 1;
    grid-row: 1;
    display: flex !important;
    flex-wrap: wrap;
    align-items: stretch;
    justify-content: center;
    gap: 0 !important;
    width: 100%;
    margin: 0 !important;
    min-height: 44px;
  }
  .ribbon-main-nav > .barra-sup-acciones {
    grid-column: 2;
    grid-row: 1;
    margin-left: 0 !important;
    align-self: center;
  }
  .ribbon-main-nav > .cinta-mat,
  .ribbon-main-nav > .asi-cinta,
  .ribbon-main-nav > .cinta-lec,
  .ribbon-main-nav > .cinta-clase,
  .ribbon-main-nav > .ribbon-content {
    grid-column: 1 / -1;
    grid-row: 2;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    flex-wrap: nowrap !important;
    width: 100% !important;
    max-width: 100%;
    margin: 0 auto !important;
    padding: 2px 0 6px;
    gap: 4px !important;
  }
  .ribbon-main-nav .asi-cinta-ctx,
  .ribbon-main-nav .asi-rep-fila,
  .ribbon-main-nav .kpi-mat-fila,
  .ribbon-main-nav .acciones-grupo,
  .ribbon-main-nav #menuUsuTabs,
  .ribbon-main-nav #menuAsiTabs,
  .ribbon-main-nav #menuLecTabs,
  .ribbon-main-nav #cintaLec .toolbar-controles {
    flex: 0 0 auto !important;
    margin-left: 0 !important;
    width: auto !important;
  }
  .ribbon-main-nav .cinta-n2,
  .ribbon-main-nav .cinta-n3 {
    display: flex !important;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    max-height: 160px;
    opacity: 1;
    overflow: visible !important;
    pointer-events: auto !important;
    transition: max-height .18s ease, opacity .16s ease, padding .16s ease, margin .16s ease;
  }
  .ribbon-main-nav .cinta-n2 button,
  .ribbon-main-nav .cinta-n2 .ribbon-btn,
  .ribbon-main-nav .cinta-n3 button,
  .ribbon-main-nav .cinta-n3 .ribbon-btn {
    pointer-events: auto !important;
  }
  .ribbon-main-nav .cinta-n2.oculto,
  .ribbon-main-nav .cinta-n3.oculto { display: none !important; max-height: 0 !important; opacity: 0; padding: 0 !important; margin: 0 !important; }
  .ribbon-main-nav .asi-cinta-ctx,
  .ribbon-main-nav .asi-rep-fila {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .ribbon-main-nav .asi-cinta-ctx .asi-acciones-fila {
    margin-left: 0 !important;
  }
  .ribbon-main-nav #cintaAsi .btn-ayuda,
  .ribbon-main-nav #cintaMat .btn-ayuda,
  .ribbon-main-nav #cintaLec .btn-ayuda,
  .ribbon-main-nav #cintaClase .btn-ayuda,
  .ribbon-main-nav .btn-ayuda.ribbon-btn {
    margin-left: 4px !important;
  }

  /* Subribbon colapsado: solo N1 + contenido. N3 de cabecera se queda si está visible. */
  body.subribbon-collapsed .ribbon-main-nav,
  body.ribbon-n2-cerrado .ribbon-main-nav,
  .ribbon-main-nav.subribbon-collapsed,
  .ribbon-main-nav.subribbon-hidden {
    row-gap: 0 !important;
    margin-bottom: 4px !important;
    padding-bottom: 0 !important;
  }
  body.subribbon-collapsed .ribbon-main-nav .cinta-n2,
  body.ribbon-n2-cerrado .ribbon-main-nav .cinta-n2,
  .ribbon-main-nav.subribbon-collapsed .cinta-n2,
  .ribbon-main-nav.subribbon-hidden .cinta-n2 {
    display: none !important;
  }
  body.subribbon-collapsed .ribbon-main-nav > .cinta-mat:not(.subribbon-container-hidden),
  body.subribbon-collapsed .ribbon-main-nav > .asi-cinta:not(.subribbon-container-hidden),
  body.subribbon-collapsed .ribbon-main-nav > .cinta-lec:not(.subribbon-container-hidden),
  body.ribbon-n2-cerrado .ribbon-main-nav > .cinta-mat:not(.subribbon-container-hidden),
  body.ribbon-n2-cerrado .ribbon-main-nav > .asi-cinta:not(.subribbon-container-hidden),
  body.ribbon-n2-cerrado .ribbon-main-nav > .cinta-lec:not(.subribbon-container-hidden) {
    padding-top: 0 !important;
    margin-top: 0 !important;
  }
  .ribbon-main-nav > .cinta-mat.subribbon-container-hidden,
  .ribbon-main-nav > .asi-cinta.subribbon-container-hidden,
  .ribbon-main-nav > .cinta-lec.subribbon-container-hidden,
  .ribbon-main-nav > .cinta-clase.subribbon-container-hidden,
  .ribbon-main-nav > .ribbon-content.subribbon-container-hidden,
  .subribbon-container.is-hidden {
    display: none !important;
    margin: 0 !important;
    padding: 0 !important;
    max-height: 0 !important;
    overflow: hidden !important;
    pointer-events: none !important;
    gap: 0 !important;
  }

  .ribbon-tab,
  .ribbon-main-nav .tabs > button.ribbon-tab {
    display: inline-flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 2px !important;
    min-width: 72px !important;
    width: auto !important;
    height: auto !important;
    padding: 6px 12px 4px !important;
    margin: 0 2px !important;
    background: transparent !important;
    color: #4b5563 !important;
    border: 1px solid transparent !important;
    border-radius: 10px !important;
    box-shadow: none !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    line-height: 1.15;
    cursor: pointer;
  }
  .ribbon-tab:hover:not(.activa),
  .ribbon-main-nav .tabs > button.ribbon-tab:hover:not(.activa) {
    background: #fff !important;
    color: var(--st90-azul) !important;
    border-color: #e2e8f0 !important;
  }
  .ribbon-tab.activa,
  .ribbon-main-nav .tabs > button.ribbon-tab.activa,

    background: #e2e8f0;
    color: #475569;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .nem-step-item.active .nem-step-num {
    background: var(--app-primary);
    color: #ffffff;
  }
  .nem-step-item.completed .nem-step-num {
    background: var(--st90-verde);
    color: #ffffff;
  }
  .nem-step-sep {
    flex: 1;
    height: 2px;
    background: var(--app-border);
    min-width: 16px;
  }
  .nem-step-content {
    background: #ffffff;
    border: 1px solid var(--app-border);
    border-radius: var(--app-radius-lg);
    padding: 18px 20px;
    box-shadow: var(--app-shadow-card);
    margin-bottom: 16px;
  }
  .nem-step-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--app-border);
  }

  /* =========================================================
     BLOQUES MODULARES iDEVICES (TIPO eXeLearning)
     ========================================================= */
  .idevice-container {
    margin: 16px 0;
    border-radius: var(--app-radius-lg);
    border: 1px solid var(--app-border);
    background: #ffffff;
    box-shadow: 0 3px 10px rgba(0,0,0,0.03);
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .idevice-container:hover {
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  }

  /* ============================================================
     FASE 6 · TARJETAS iDEVICE — DESACOPLAMIENTO CSS
     DeepSeek · Las clases .idevice-card* son ganchos de script
     (btn.closest('.idevice-card')) y, además, deben sostener la tarjeta
     por sí solas: el visor de clase (Clase.html) no carga
     AdminPlaneacionCSS, así que ahí no existe .idevice-btn.
     ============================================================ */

  /* --- 1 · Contenedor de bloque --- */
  .idevice-card {
    position: relative;
    display: block;
    margin: 12px 0;
    padding: 14px 16px;
    background: #ffffff;
    border: 1px solid var(--app-border);
    border-radius: var(--app-radius-lg);
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    overflow: hidden;
    break-inside: avoid;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .idevice-card:hover {
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
  }
  /* En Admin la tarjeta viaja con .idevice-container: ahí el relleno lo
     aportan .idevice-header y .idevice-body, no la tarjeta. */
  .idevice-card.idevice-container {
    margin: 16px 0;
    padding: 0;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.03);
  }

  /* --- 2 · Variantes temáticas --- */
  .idevice-card-audio {
    border-left: 5px solid var(--app-primary);
    background: linear-gradient(180deg, #f8fbff 0%, #ffffff 58%);
  }
  .idevice-card-pregunta {
    border-left: 5px solid #10b981;
    background: linear-gradient(180deg, #f7fdfa 0%, #ffffff 58%);
  }
  .idevice-card-reto {
    border-left: 5px solid #f59e0b;
    background: linear-gradient(180deg, #fffdf7 0%, #ffffff 58%);
  }

  .idevice-card.idevice-card-audio > .idevice-header    { background: #f0f7ff; color: var(--app-primary-dark); }
  .idevice-card.idevice-card-pregunta > .idevice-header { background: #ecfdf5; color: #065f46; }
  .idevice-card.idevice-card-reto > .idevice-header     { background: #fffbeb; color: #92400e; }

  .idevice-card.idevice-card-audio .idevice-tag    { background: #dbeafe; color: var(--app-primary-dark); }
  .idevice-card.idevice-card-pregunta .idevice-tag { background: #a7f3d0; color: #065f46; }
  .idevice-card.idevice-card-reto .idevice-tag     { background: #fde68a; color: #92400e; }

  /* La barra de audio estrena acento propio en la variante de voz */
  .idevice-card-audio .idevice-audio-bar {
    background: #f0f7ff;
    border-color: #bfdbfe;
  }

  /* --- 3 · Campos del formulario (contrato Fase 6) --- */
  .idevice-campo-titulo {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 6px;
    font-weight: 600;
    padding: 6px 8px;
    border: 1px solid var(--app-border);
    border-radius: 4px;
  }
  .idevice-campo-cuerpo {
    width: 100%;
    box-sizing: border-box;
    resize: vertical;
    padding: 8px;
    border: 1px solid var(--app-border);
    border-radius: 4px;
  }
  /* Refuerzo tipográfico y de foco (no altera el contrato anterior) */
  .idevice-campo-titulo,
  .idevice-campo-cuerpo {
    font-family: inherit;
    font-size: 13px;
    line-height: 1.45;
    color: var(--app-text);
    background: #ffffff;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .idevice-campo-titulo::placeholder,
  .idevice-campo-cuerpo::placeholder { color: #94a3b8; }
  .idevice-campo-titulo:focus,
  .idevice-campo-cuerpo:focus {
    outline: none;
    border-color: #93c5fd;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }

  /* AdminCSS aplica min-height:180px a todo textarea: el cuerpo del
     iDevice necesita dos renglones, no media pantalla. */
  .idevice-campo-cuerpo { min-height: 56px; }

  /* --- 4 · Botonera de respaldo para el visor de clase --- */
  .idevice-card:not(.idevice-container) .idevice-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    font-size: 11.5px;
    font-weight: 700;
    color: #334155;
    background: #ffffff;
    border: 1px solid var(--app-border);
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .idevice-card:not(.idevice-container) .idevice-btn:hover {
    background: #eff6ff;
    border-color: #93c5fd;
    color: var(--app-primary-dark);
  }
  .idevice-card:not(.idevice-container) .idevice-btn:focus-visible {
    outline: 2px solid #0284c7;
    outline-offset: 2px;
  }

  .idevice-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 700;
    border-bottom: 1px solid var(--app-border);
  }
  .idevice-lectura { border-left: 5px solid var(--app-primary); }
  .idevice-lectura .idevice-header { background: #f0f7ff; color: var(--app-primary-dark); }
  .idevice-pregunta { border-left: 5px solid #10b981; }
  .idevice-pregunta .idevice-header { background: #ecfdf5; color: #065f46; }
  .idevice-desafio { border-left: 5px solid #f59e0b; }
  .idevice-desafio .idevice-header { background: #fffbeb; color: #92400e; }
  .idevice-body {
    padding: 16px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--app-text);
  }
  .idevice-tag {
    font-size: 10.5px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .idevice-lectura .idevice-tag { background: #dbeafe; color: var(--app-primary-dark); }
  .idevice-pregunta .idevice-tag { background: #a7f3d0; color: #065f46; }
  .idevice-desafio .idevice-tag { background: #fde68a; color: #92400e; }
  
  .idevice-audio-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    padding: 8px 12px;
    background: #f8fafc;
    border-radius: var(--app-radius);
    border: 1px solid var(--app-border);
  }
  .idevice-opt-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border: 1px solid var(--app-border);
    border-radius: var(--app-radius);
    margin-bottom: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .idevice-opt-item:hover {
    background: var(--app-hover);
  }
  .idevice-opt-item.correcto {
    background: #dcfce7;
    border-color: #86efac;
    color: #14532d;
    font-weight: 600;
  }
  .idevice-feedback-box {
    margin-top: 10px;
    padding: 10px 14px;
    border-radius: var(--app-radius);
    font-size: 12.5px;
    display: none;
  }
  .idevice-feedback-box.visible { display: block; }
  .idevice-feedback-box.ok { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  .idevice-feedback-box.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }

  /* =========================================================
     CATÁLOGO DE LIBROS SEP FASE 6 & VISOR RÁPIDO
     ========================================================= */
  .sep-libros-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
    margin-top: 12px;
  }
  .sep-libro-card {
    background: #ffffff;
    border: 1px solid var(--app-border);
    border-radius: var(--app-radius-lg);
    padding: 14px 16px;
    box-shadow: var(--app-shadow-card);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.15s, border-color 0.15s;
  }
  .sep-libro-card:hover {
    border-color: var(--app-primary);
    transform: translateY(-2px);
  }
  .sep-libro-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }
  .sep-libro-icon {
    font-size: 26px;
    line-height: 1;
    background: var(--app-primary-soft);
    padding: 8px;
    border-radius: 8px;
  }
  .sep-libro-tit {
    font-size: 13.5px;
    font-weight: 700;
    color: #0f172a;
    margin: 0 0 2px;
  }
  .sep-libro-sub {
    font-size: 11.5px;
    color: var(--app-muted);
    font-weight: 600;
  }
  .sep-libro-proyectos {
    font-size: 11.5px;
    margin: 8px 0;
    padding: 6px 10px;
    background: #f8fafc;
    border-radius: 6px;
    border: 1px solid #e2e8f0;
  }
  .sep-libro-proyectos ul {
    margin: 4px 0 0;
    padding-left: 18px;
  }
  .sep-libro-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }

  /* =========================================================
     CONECTORES TIPO LEGO (TRABAJO SOCIAL & BIBLIOTECA)
     ========================================================= */
  .lego-conector-card {
    background: #ffffff;
    border: 2px dashed #cbd5e1;
    border-radius: var(--app-radius-lg);
    padding: 24px;
    text-align: center;
    margin: 16px 0;
    position: relative;
    background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
    background-size: 16px 16px;
  }
  .lego-studs {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .lego-stud {
    width: 24px;
    height: 10px;
    background: var(--app-primary);
    border-radius: 4px 4px 0 0;
    opacity: 0.8;
  }
  .lego-badge-conector {
    background: #fef3c7;
    color: #92400e;
    border: 1px solid #fde68a;
    font-size: 11px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 999px;
    display: inline-block;
    margin-bottom: 10px;
  }

  /* =========================================================
     MÓDULO DE ENCUESTAS & ANALÍTICA (TOKENS SKILL.md)
     ========================================================= */
  .filtro-fila {
    display: flex;
    flex-direction: column;
    padding: 4px 8px;
  }
  .filtro-fila label {
    font-size: 0.75rem;
    color: var(--app-muted);
    font-weight: 600;
    margin-bottom: 3px;
  }
  .dropdown-header {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #94a3b8;
    padding: 4px 8px;
  }
  .dropdown-item.active {
    background-color: var(--app-primary-soft) !important;
    color: var(--app-primary-dark) !important;
    font-weight: 600;
  }
  .chip-estado {
    font-size: 0.72rem;
    line-height: 1.3;
    color: var(--app-muted);
    padding: 0.15rem 0 0.4rem;
  }
  .pregunta-etiqueta {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.25;
    max-height: 2.5em;
  }
  .chip-dim {
    font-size: 0.78rem;
    line-height: 1.2;
    border-radius: 999px;
  }
  .filtro-ayuda {
    font-size: 0.7rem;
    line-height: 1.25;
    color: #94a3b8;
    padding: 0 0.6rem 0.35rem;
  }
  .menu-preguntas {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 0.5rem;
    padding: 0.25rem 0.6rem 0.6rem;
  }
  .pregunta {
    border: 1px solid var(--app-border);
    border-radius: var(--app-radius);
    padding: 12px;
    margin-bottom: 10px;
    background: #ffffff;
    transition: border-color 0.15s;
  }
  .pregunta:hover {
    border-color: #93c5fd;
  }
  .seccion-condicional {
    background-color: #f1f5f9;
    border-radius: 8px;
    border-left: 4px solid var(--app-primary);
    padding: 10px 14px;
    margin: 8px 0;
  }
  .sortable {
    cursor: pointer;
    user-select: none;
  }
  .sortable:hover {
    background-color: #dbeafe;
  }
  .kpi-cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .kpi-card {
    background: #ffffff;
    border: 1px solid var(--app-border);
    border-radius: var(--app-radius-lg);
    padding: 14px 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    text-align: center;
  }
  .kpi-number {
    font-size: 24px;
    font-weight: 800;
    color: var(--app-primary-dark);
    line-height: 1.1;
    margin: 4px 0;
  }
  .kpi-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--app-muted);
    letter-spacing: 0.5px;
  }


  /* =========================================================
     BLINDAJE DE MENÚS DESPLEGABLES (DROPDOWNS OVERFLOW FIX)
     ========================================================= */
  html,
  body {
    min-height: 100vh !important;
  }

  #panel,
  #tab-asi,
  #tab-asi.bloque,
  .bloque,
  #subAsiRep,
  #subAsiAlu,
  #subAsiMae,
  #subAsiPref,
  .barra-sup,

  #wrapTabCfg,

  /* =========================================================
     ESTILOS GLOBALES DE CUADRÍCULA DE HORARIO (TAMAÑO UNIFORME)

    width: 100% !important;
    height: 58px !important;
    min-height: 58px !important;
    max-height: 58px !important;

  /* ============================================================
     Asistente IA — Pasos 2 y 3 (casillas y bloques)
     ESTILO_UI_ST90 §4: sin tooltips, color semántico ST90
     ============================================================ */
  .st90-modal.ia-modal { max-width: 620px; width: 94%; }

  .ia-encabezado {
    font-size: 11.5px;
    font-weight: 700;
    color: #0e7490;
    text-transform: uppercase;
    letter-spacing: .05em;
    margin: 0 0 10px;
  }

  .ia-lista {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 52vh;
    overflow-y: auto;
    padding: 2px;
  }

  /* --- Casilla de selección (Paso 2 y cabeceras del Paso 3) --- */
  .ia-check {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 0;
    padding: 8px 10px;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .ia-check:hover { background: #eef2f7; border-color: #b6c2d2; }

  .ia-check-input {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    margin: 2px 0 0;
    accent-color: #0e7490;
    cursor: pointer;
  }
  .ia-check-input:focus-visible { outline: 2px solid #0284c7; outline-offset: 2px; }

  .ia-check-texto {
    font-size: 12.5px;
    line-height: 1.45;
    color: #334155;
  }
  .ia-check-input:checked + .ia-check-texto {
    color: #0f172a;
    font-weight: 600;
  }

  /* --- Bloques del Paso 3 --- */
  .ia-bloque {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-left: 4px solid #cbd5e1;
    border-radius: 10px;
    padding: 10px 12px;
    margin: 0 0 8px;
  }

  .ia-bloque--dua      { border-left-color: #f59e0b; }
  .ia-bloque--proposito { border-left-color: #0e7490; }
  .ia-bloque--producto  { border-left-color: #10b981; }

  .ia-bloque-cab {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 6px;
  }
  .ia-bloque-titulo {
    font-size: 12px;
    font-weight: 700;
    color: #0f172a;
    cursor: pointer;
  }
  .ia-bloque-texto {
    font-size: 12.5px;
    line-height: 1.55;
    color: #334155;
    margin: 0;
    white-space: pre-line;
  }

  /* --- Consejo y mensajes --- */
  .ia-consejo {
    margin: 10px 0 0;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 11.5px;
    line-height: 1.45;
    color: #78350f;
  }
  .ia-consejo b { color: #92400e; }

  .ia-vacio {
    font-size: 12.5px;
    color: #64748b;
    margin: 0;
