<script>
  /* Utilidades compartidas entre Admin e Interfaz */

  var IDENTIDAD_ST90 = { nombre: 'Secundaria Técnica 90', pie: 'Plan de Estudio NEM', logo: '' };

  function aplicarIdentidad(obj) {
    if (!obj) return IDENTIDAD_ST90;
    if (obj.nombre) IDENTIDAD_ST90.nombre = String(obj.nombre);
    if (obj.pie) IDENTIDAD_ST90.pie = String(obj.pie);
    if (obj.logo != null) IDENTIDAD_ST90.logo = String(obj.logo || '');
    return IDENTIDAD_ST90;
  }

  function escaparHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function normalizarNombrePref_(s) {
    return String(s || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function toast(mensaje, tipo) {
    let t = document.getElementById('st90-toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'st90-toast';
      document.body.appendChild(t);
    }
    t.className = (tipo || '');
    t.textContent = mensaje;
    // forzar reflow para reiniciar animación
    void t.offsetWidth;
    t.classList.add('visible');
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove('visible'); }, 3200);
  }

  function barraProgresoSt90(estado) {
    const el = document.getElementById('st90BarraCarga');
    if (!el) return;
    clearTimeout(el._timer);
    if (estado === 'cargando') {
      el.classList.remove('completada', 'error');
      el.classList.add('activa');
    } else if (estado === 'exito') {
      el.classList.remove('activa', 'error');
      el.classList.add('completada');
      el._timer = setTimeout(function () {
        el.classList.remove('completada', 'activa', 'error');
      }, 450);
    } else if (estado === 'error') {
      el.classList.remove('activa', 'completada');
      el.classList.add('error');
      el._timer = setTimeout(function () {
        el.classList.remove('completada', 'activa', 'error');
      }, 800);
    } else {
      el.classList.remove('activa', 'completada', 'error');
    }
  }

  function modal(opciones) {
    // opciones: {titulo, mensaje, html, botones: [{texto, clase, valor}], capturar}
    return new Promise(function (resolve) {
      const fondo = document.createElement('div');
      fondo.className = 'st90-modal-fondo visible';
      const listaBotones = opciones.botones || [{ texto: 'Aceptar', valor: true }];
      const botones = listaBotones
        .map(function (b, i) {
          return '<button data-i="' + i + '" class="' + (b.clase || '') + '">' + escaparHtml(b.texto) + '</button>';
        }).join('');
      const cuerpo = opciones.html != null
        ? '<div>' + opciones.html + '</div>'
        : '<p>' + escaparHtml(opciones.mensaje || '') + '</p>';
      fondo.innerHTML =
        '<div class="st90-modal' + (opciones.clase ? ' ' + opciones.clase : '') + '">' +
          '<h3>' + escaparHtml(opciones.titulo || '') + '</h3>' +
          cuerpo +
          '<div class="acciones">' + botones + '</div>' +
        '</div>';
      document.body.appendChild(fondo);
      const inp = fondo.querySelector('input, textarea, select');
      if (inp) {
        setTimeout(function () {
          inp.focus();
          if (inp.select) inp.select();
        }, 30);
      }
      fondo.addEventListener('click', function (ev) {
        if (ev.target === fondo && opciones.cerrarFondo) {
          fondo.remove();
          resolve(false);
          return;
        }
        const b = ev.target.closest('button[data-i]');
        if (!b) return;
        const def = listaBotones[Number(b.dataset.i)];
        let val = def.valor;
        if (typeof opciones.capturar === 'function') {
          val = opciones.capturar(fondo, val);
        }
        fondo.remove();
        resolve(val);
      });
      fondo.addEventListener('keydown', function (ev) {
        if (ev.key !== 'Enter') return;
        if (ev.target && String(ev.target.tagName) === 'TEXTAREA') return;
        ev.preventDefault();
        const aceptar = fondo.querySelector('.acciones button:last-child');
        if (aceptar) aceptar.click();
      });
    });
  }

  function confirmar(mensaje, titulo) {
    return modal({
      titulo: titulo || 'Confirmar',
      mensaje: mensaje,
      botones: [
        { texto: 'Cancelar', valor: false, clase: 'btn-secundario' },
        { texto: 'Aceptar', valor: true }
      ]
    });
  }

  function pedirNumero(opciones) {
    const min = opciones.min != null ? opciones.min : 0;
    const valor = opciones.valor != null ? opciones.valor : 0;
    return modal({
      titulo: opciones.titulo || 'Ingresar número',
      html: '<p>' + escaparHtml(opciones.mensaje || '') + '</p>' +
        '<input id="st90-pedir-num" type="number" min="' + min + '" value="' + escaparHtml(String(valor)) + '" style="width:100%;">',
      botones: [
        { texto: 'Cancelar', valor: null, clase: 'btn-secundario' },
        { texto: 'Aceptar', valor: 'ok' }
      ],
      capturar: function (fondo, val) {
        if (val === null) return null;
        const campo = fondo.querySelector('#st90-pedir-num');
        if (!campo) return null;
        const n = parseInt(campo.value, 10);
        return isNaN(n) ? NaN : n;
      }
    });
  }

  function pedirTexto(opciones) {
    const tipo = opciones.tipo === 'password' ? 'password' : 'text';
    return modal({
      titulo: opciones.titulo || 'Ingresar',
      html: '<p>' + escaparHtml(opciones.mensaje || '') + '</p>' +
        '<input id="st90-pedir-txt" type="' + tipo + '" value="" autocomplete="off" style="width:100%;">',
      botones: [
        { texto: 'Cancelar', valor: null, clase: 'btn-secundario' },
        { texto: 'Aceptar', valor: 'ok' }
      ],
      capturar: function (fondo, val) {
        if (val === null) return null;
        const campo = fondo.querySelector('#st90-pedir-txt');
        return campo ? campo.value : '';
      }
    });
  }

  /* Envuelve google.script.run con manejo uniforme */
  function gsRun(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(err); })
        [fn].apply(null, args);
    });
  }

  function enIframeSitio() {
    try { return window.self !== window.top; } catch (e) { return true; }
  }

  function urlBaseWebApp() {
    if (typeof URL_BASE_APP === 'string') {
      const limpia = URL_BASE_APP.replace(/^[\s"']+|[\s"']+$/g, '').replace(/\/+$/, '');
      if (limpia.indexOf('http') === 0) return limpia;
    }
    try {
      const href = window.parent && window.parent.location && window.parent.location.href;
      if (href && href.indexOf('/exec') >= 0) return href.split('?')[0];
    } catch (e) {}
    try {
      const aqui = window.location && window.location.href;
      if (aqui && aqui.indexOf('/exec') >= 0) return aqui.split('?')[0];
    } catch (e2) {}
    return '';
  }

  function urlWebApp(pagina) {
    const base = urlBaseWebApp();
    const q = pagina ? ('?pagina=' + encodeURIComponent(pagina)) : '';
    return base ? (base + q) : q;
  }

  function extraerActionYCampos_(url) {
    const texto = String(url || '');
    const q = texto.indexOf('?');
    const action = (q >= 0 ? texto.slice(0, q) : texto).replace(/\/+$/, '');
    const campos = [];
    if (q >= 0) {
      texto.slice(q + 1).split('&').forEach(function (pair) {
        if (!pair) return;
        const kv = pair.split('=');
        const nombre = decodeURIComponent((kv[0] || '').replace(/\+/g, ' '));
        if (!nombre) return;
        campos.push({
          name: nombre,
          value: decodeURIComponent((kv[1] || '').replace(/\+/g, ' '))
        });
      });
    }
    return { action: action, campos: campos };
  }

  function enviarFormularioPadre(url) {
    if (!url) return false;
    const parsed = extraerActionYCampos_(url);
    if (!parsed.action) return false;
    const form = document.createElement('form');
    form.method = 'GET';
    form.action = parsed.action;
    form.target = '_parent';
    form.setAttribute('target', '_parent');
    form.style.display = 'none';
    parsed.campos.forEach(function (c) {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = c.name;
      input.value = c.value;
      form.appendChild(input);
    });
    document.body.appendChild(form);
    form.submit();
    return true;
  }

  function navegarPaginaWebApp(pagina) {
    const base = urlBaseWebApp();
    if (!base) {
      toast('No se pudo abrir esa vista. Recarga la página.', 'error');
      return false;
    }
    const url = base.split('?')[0] + '?pagina=' + encodeURIComponent(pagina || 'alumno') + '&v=' + Date.now();
    return enviarFormularioPadre(url);
  }

  function irWebApp(url, opciones) {
    const opts = opciones || {};
    if (!url) return false;

    if (opts.nuevaPestana) {
      const w = window.open(url, '_blank');
      if (w) return true;
    }

    return enviarFormularioPadre(url);
  }

  function fmtTiempo(seg) {
    seg = Math.max(0, Math.floor(seg));
    const m = String(Math.floor(seg / 60)).padStart(2, '0');
    const s = String(seg % 60).padStart(2, '0');
    return m + ':' + s;
  }

  function etiquetaNivelPpm(nivel) {
    if (nivel === 'bajo') return 'Por debajo del rango';
    if (nivel === 'alto') return 'Por encima del rango';
    if (nivel === 'dentro') return 'Dentro del rango';
    return 'Sin dato';
  }

  function claseNivelPpm(nivel) {
    return nivel || 'dentro';
  }

  function descargarCSV(nombreArchivo, filas) {
    const csv = filas.map(function (f) {
      return f.map(function (c) {
        const s = String(c == null ? '' : c);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\n');
    const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nombreArchivo;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  /* =========================================================
     UTILIDADES DE FORMATO DE LECTURA TIPO LIBRO EDITORIAL
     ========================================================= */
  function escaparRegexComun(str) {
    return String(str || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function contarPalabrasCliente(texto) {
    const s = String(texto || '').trim();
    if (!s) return 0;
    return s.split(/\s+/).length;
  }

  function partirParrafosLibro(texto, titulo) {
    let t = String(texto || '').replace(/\r\n/g, '\n').trim();
    if (!t) return [];

    // Si el texto empieza con el título repetido, removerlo del cuerpo
    if (titulo) {
      const titLimpio = String(titulo).trim();
      const reTit = new RegExp('^' + escaparRegexComun(titLimpio) + '[^\\n.]*(?:[\\n.]*|(?=[A-ZÁÉÍÓÚ]))', 'i');
      const mTit = t.match(reTit);
      if (mTit && mTit[0].length < 140 && mTit[0].length < t.length * 0.45) {
        t = t.substring(mTit[0].length).replace(/^[\s:.-]+/, '').trim();
      }
    }

    // Si contiene tags HTML, respetarlos si están estructurados
    if (/<p[\s>]/i.test(t)) {
      const div = document.createElement('div');
      div.innerHTML = t;
      const ps = Array.from(div.querySelectorAll('p')).map(function (p) { return p.textContent.trim(); }).filter(Boolean);
      if (ps.length) return ps;
    }

    // 1. Dividir por saltos dobles o sencillos de línea
    let parrafos = t.split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean);
    if (parrafos.length === 1 && parrafos[0].indexOf('\n') >= 0) {
      parrafos = parrafos[0].split('\n').map(function (p) { return p.trim(); }).filter(Boolean);
    }

    // 2. Si algún párrafo es monolítico (> 80 palabras), dividirlo inteligentemente por oraciones
    const resultado = [];
    parrafos.forEach(function (p) {
      const palabras = p.split(/\s+/);
      if (palabras.length <= 80) {
        resultado.push(p);
        return;
      }
      const oraciones = p.match(/[^.!?]+[.!?]+(?:["»”']*)(?:\s+|$)|[^.!?]+$/g);
      if (!oraciones || oraciones.length < 3) {
        resultado.push(p);
        return;
      }
      let grupo = [];
      let conteoPalabras = 0;
      oraciones.forEach(function (or) {
        const orTrim = or.trim();
        const nOr = orTrim.split(/\s+/).length;
        grupo.push(orTrim);
        conteoPalabras += nOr;
        if (conteoPalabras >= 50 && grupo.length >= 2) {
          resultado.push(grupo.join(' '));
          grupo = [];
          conteoPalabras = 0;
        }
      });
      if (grupo.length) {
        if (resultado.length > 0 && conteoPalabras < 25) {
          resultado[resultado.length - 1] += ' ' + grupo.join(' ');
        } else {
          resultado.push(grupo.join(' '));
        }
      }
    });

    return resultado.length ? resultado : [t];
  }

  function renderizarHojaLibro(texto, tema, asignatura, grado, palabras) {
    const parrafos = partirParrafosLibro(texto, tema);
    const titTxt = tema ? String(tema).trim() : 'Lectura formativa';
    const asigTxt = asignatura ? String(asignatura).trim() : 'Comprensión Lectora';
    let gNum = String(grado || '').match(/[123]/);
    const gradoTxt = gNum ? (gNum[0] + '° de Secundaria') : 'Fase 6 · NEM';
    const totalPalabras = palabras || contarPalabrasCliente(texto);
    const iden = (typeof IDENTIDAD_ST90 === 'object' && IDENTIDAD_ST90) ? IDENTIDAD_ST90 : {};
    const nomEsc = String(iden.nombre || 'Secundaria Técnica 90').trim();
    const pieEsc = String(iden.pie || 'Plan de Estudio NEM').trim();
    const logoEsc = String(iden.logo || '').trim();

    let html = '<div class="hoja-libro-wrapper">';
    html += '<article class="hoja-libro">';
    
    html += '<header class="hoja-libro-encabezado">';
    html += '  <div class="hoja-libro-marca">';
    if (logoEsc) {
      html += '    <img class="hoja-libro-logo" src="' + logoEsc.replace(/"/g, '') + '" alt="">';
    }
    html += '    <span class="hoja-libro-escuela">' + escaparHtml(nomEsc) + '</span>';
    html += '  </div>';
    html += '  <span class="libro-meta-asignatura">' + escaparHtml(asigTxt) + ' · ' + escaparHtml(gradoTxt) + '</span>';
    html += '</header>';

    html += '<h1 class="hoja-libro-titulo">' + escaparHtml(titTxt) + '</h1>';
    html += '<div class="hoja-libro-separador">✦ ✦ ✦</div>';

    html += '<div class="hoja-libro-cuerpo">';
    parrafos.forEach(function (p) {
      html += '<p>' + escaparHtml(p) + '</p>';
    });
    html += '</div>';

    html += '<footer class="hoja-libro-pie">';
    html += '  <span>' + escaparHtml(pieEsc) + '</span>';
    html += '  <span>' + (totalPalabras ? (totalPalabras + ' palabras') : 'Lectura escolar') + '</span>';
    html += '</footer>';

    html += '</article>';
    html += '</div>';
    return html;
  }

    html: ''
      + '<p><strong>UDEI</strong> — unidad de educación inclusiva del plantel. Es el registro institucional donde se concentran los estudiantes que requieren apoyos o ajustes. En esta planeación solo se usa de forma agregada, por grupo: no muestra nombres, diagnósticos ni canalizaciones.</p>'
      + '<p><strong>DUA</strong> — Diseño Universal para el Aprendizaje. Enfoque que propone planear desde el inicio para la diversidad: múltiples formas de representar la información, de expresar lo aprendido y de motivarse. No es «adaptar para uno»: es diseñar para todos.</p>'
      + '<p><strong>BAPyC</strong> — Barreras para el Aprendizaje, la Participación y la Convivencia. No son déficits del alumno, sino obstáculos del contexto escolar, didáctico o familiar que limitan su aprendizaje y su participación. Los chips del grupo indican qué tipos de barrera están registrados.</p>'
      + '<p><strong>⚠️ BAPyC detectadas en grupo</strong> — aviso de que en este grupo hay estudiantes con barreras registradas en el padrón. Sirve para que la planeación contemple ajustes desde el diseño, no como reacción posterior.</p>'
      + '<p><strong>Ajustes razonables.</strong> Son las modificaciones concretas de acceso, materiales, tiempos o formas de evaluación que eliminan esas barreras. Deben ser específicos y aplicables en el aula; se escriben en el campo de ajustes y se retoman al esbozar las sesiones.</p>'
  };

  function _abrirAyudaNEM_(titulo, html) {
    if (typeof modal !== 'function') return;
    modal({
      titulo: titulo,
      html: '<div style="font-size:12.5px;line-height:1.55;color:#334155;max-height:65vh;overflow:auto;text-align:left;">' +
        '<style>#st90AyudaNEM ul{margin:6px 0 10px 18px;padding:0;}#st90AyudaNEM li{margin-bottom:5px;}</style>' +
        '<div id="st90AyudaNEM">' + html + '</div></div>',
      botones: [{ texto: 'Entendido', valor: true }]
    });
  }

  function abrirAyudaPasoPlan_(paso) {
    var d = AYUDA_PASOS_PLAN_NEM_[Number(paso)];
    if (!d) return;
    _abrirAyudaNEM_(d.titulo, d.html);
  }

  function abrirAyudaInclusion_() {
    _abrirAyudaNEM_(AYUDA_INCLUSION_.titulo, AYUDA_INCLUSION_.html);
  }


  /* ============================================================
     ASISTENTE DE IA POR SECCIÓN DEL ESBOZO NEM
     Analiza lo escrito en la sección, propone ajustes y conceptos,
     y permite aceptarlos con un botón. El docente decide.
     ============================================================ */

  var NOMBRES_PASO_NEM_ = { 1: 'Metadatos & Ejes', 2: 'Contenidos & PDA', 3: 'Diagnóstico & DUA', 4: 'Propósito & IA' };
  var DESTINO_SUGERENCIA_NEM_ = { 1: 'planTitulo', 2: 'planPDA', 3: 'planAjustesRazonables', 4: 'planProposito' };
  var ETIQUETA_AGREGAR_NEM_ = { 1: 'Usar como título', 2: 'Agregar a los PDA', 3: 'Agregar a los ajustes', 4: 'Agregar al propósito' };

  function _datosPlaneacionParaIA_() {
    function v(id) {
      var el = document.getElementById(id);
      return el ? String(el.value || '').trim() : '';
    }
    return {
      titulo: v('planTitulo'),
      campoFormativo: v('planCampoFormativo'),
      metodologia: v('planMetodologia'),
      grado: v('planGrado'),
      grupo: v('planGrupo'),
      sesiones: v('planSesiones'),
      temporalidad: v('planTemporalidad'),
      contenido: v('planContenidoSintetico'),
      pda: v('planPDA'),
      problema: v('planProblema'),
      diagnostico: v('planDiagnostico'),
      ajustes: v('planAjustesRazonables'),
      proposito: v('planProposito'),
      producto: v('planProductoFinal'),
      evaluacion: v('planEvaluacion')
    };
  }

  function _tokenPlaneacionIA_() {
    if (typeof getTokenPlan_ === 'function') {
      try { var t = getTokenPlan_(); if (t) return t; } catch (e) {}
    }
    if (typeof tokenClase !== 'undefined' && tokenClase) return tokenClase;
    if (typeof token !== 'undefined' && token) return token;
    return '';
  }

  function _cerrarModalNEM_() {
    var fondo = document.querySelector('.st90-modal-fondo');
    if (fondo) fondo.remove();
  }

  function abrirAsistentePasoNEM_(paso) {
    var n = Number(paso) || 1;
    var tk = _tokenPlaneacionIA_();
    if (!tk) { toast('Vuelve a iniciar sesión para usar el asistente.', 'err'); return; }

    var promesa = modal({
      titulo: '🤖 Asistente IA · ' + (NOMBRES_PASO_NEM_[n] || 'Planeación'),
      html: '<div id="iaPasoBox" style="font-size:12.5px;line-height:1.5;color:#334155;min-height:70px;">'
        + 'Analizando lo que escribiste en esta sección…</div>',
      botones: [
        { texto: 'Cerrar', clase: 'btn-secundario', valor: '' },
        { texto: ETIQUETA_AGREGAR_NEM_[n] || 'Agregar', clase: 'nem-btn-primario', valor: 'agregar' }
      ],
      capturar: function (fondo, valor) {
        if (valor !== 'agregar') return valor;
        var ta = fondo.querySelector('#iaPasoTexto');
        return { accion: 'agregar', texto: ta ? String(ta.value || '') : '' };
      }
    });

    promesa.then(function (r) {
      if (r && r.accion === 'agregar') _aplicarSugerenciaNEM_(n, r.texto);
    });

    gsRun('asistirPasoPlaneacionNEM', tk, n, _datosPlaneacionParaIA_()).then(function (res) {
      var box = document.getElementById('iaPasoBox');
      if (!box) return;
      if (!res || !res.ok) {
        box.innerHTML = '<p style="color:#b91c1c;margin:0;">'
          + escaparHtml((res && (res.mensaje || res.error)) || 'No se pudo analizar la sección.')
          + '</p>';
        return;
      }
      box.innerHTML =
        '<p style="margin:0 0 8px;color:#475569;">Revisa la propuesta y edítala si quieres. Nada se guarda hasta que pulses el botón.</p>' +
        '<textarea id="iaPasoTexto" style="width:100%;min-height:190px;font-size:12.5px;line-height:1.5;padding:9px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box;">'
          + escaparHtml(res.texto) + '</textarea>';
    }).catch(function (e) {
      var box = document.getElementById('iaPasoBox');
      if (box) box.innerHTML = '<p style="color:#b91c1c;margin:0;">Error: ' + escaparHtml((e && e.message) || e) + '</p>';
    });
  }

  function _aplicarSugerenciaNEM_(n, texto) {
    texto = String(texto || '').trim();
    if (!texto) { toast('No hay sugerencia que agregar.', 'err'); return; }
    var destinoId = DESTINO_SUGERENCIA_NEM_[n] || 'planProposito';
    var destino = document.getElementById(destinoId);
    if (!destino) { toast('No encontré el campo de destino en esta pantalla.', 'err'); return; }
    if (n === 1) {
      var primera = texto.split('\n').map(function (l) { return l.trim(); }).filter(Boolean)[0] || '';
      primera = primera.replace(/^OBSERVACIONES:\s*/i, '').trim();
      if (primera.length > 140) primera = primera.slice(0, 140);
      destino.value = primera;
    } else {
      var actual = String(destino.value || '').trim();
      destino.value = actual ? (actual + '\n\n' + texto) : texto;
    }
    try { destino.focus(); } catch (e) {}
    toast('Sugerencia agregada. Revísala y ajústala antes de guardar.', 'ok');
  }

  function agregarSugerenciaPasoNEM_(paso) {
    var ta = document.getElementById('iaPasoTexto');
    _aplicarSugerenciaNEM_(Number(paso) || 1, ta ? ta.value : '');
    _cerrarModalNEM_();
  }


  /* Sugerencias de título a partir de los contenidos oficiales de la asignatura y grado. */
  function poblarSugerenciasTituloNEM_() {
    var sel = document.getElementById('selTituloSugeridoNEM');
    if (!sel || sel.dataset.listo === '1') return;
    var contenidos = [];
    try {
      if (typeof matrizCurricularActivaNEM_ !== 'undefined' && matrizCurricularActivaNEM_ &&
          Array.isArray(matrizCurricularActivaNEM_.contenidos)) {
        contenidos = matrizCurricularActivaNEM_.contenidos
          .map(function (x) { return String((x && x.contenido) || '').trim(); })
          .filter(Boolean);
      }
    } catch (e) {}
    var html = '<option value="">💡 Sugerencias del programa SEP…</option>';
    var vistos = {};
    contenidos.forEach(function (t) {
      var completo = String(t).trim();
      if (!completo || vistos[completo]) return;
      vistos[completo] = true;
      html += '<option value="' + escaparHtml(completo) + '" title="' + escaparHtml(completo) + '">' + escaparHtml(completo) + '</option>';
    });
    if (contenidos.length === 0) {
      html += '<option value="">Sin catálogo cargado: elige primero la asignatura y el grado</option>';
    }
    sel.innerHTML = html;
    sel.dataset.listo = '1';
  }

  function usarTituloSugeridoNEM_(sel) {
    var v = String((sel && sel.value) || '').trim();
    if (!v) return;
    var inp = document.getElementById('planTitulo');
    if (!inp) return;
    inp.value = v;
    inp.focus();
    toast('Sugerencia aplicada al título. Puedes editarla.', 'ok');
  }

</script>
