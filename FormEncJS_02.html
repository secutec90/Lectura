<script>
/* FormEncJS_02 — salirAdmin, avisoPanel, cargarRespuestas, pintarMenusFiltro, renderMenuDesdeSelect, cerrarMenuFiltros, actualizarBotonesFiltro, esDimensionPregunta */


  function salirAdmin() {
    creds = null;
    RESPUESTAS = null;
    document.getElementById("constructor").classList.add("d-none");
    document.getElementById("loginCard").classList.remove("d-none");
  }

  // Aviso en la línea de estado del panel (no bloquea con alert)
  function avisoPanel(texto) {
    const el = document.getElementById("resumenFiltros");
    if (el) el.textContent = texto;
  }

  function cargarRespuestas() {
    if (!creds) return;
    avisoPanel("Cargando datos…");
    google.script.run
      .withSuccessHandler(crudo => {
        let res = null;
        try { res = (typeof crudo === "string") ? JSON.parse(crudo) : crudo; }
        catch (err) { avisoPanel("La respuesta del servidor no se pudo leer. Recarga la página."); return; }
        if (!res) { avisoPanel("El servidor no devolvió datos. Vuelve a recargar."); return; }
        if (!res.autenticado) { avisoPanel("La sesión no es válida. Vuelve a iniciar sesión."); return; }
        try {
          RESPUESTAS = res;
          sembrarColores(res.filas, res.preguntas);
          pintarMenusFiltro();
          pintarResumenPanel();
          pintarTablaRespuestas();
          aplicarAltura();
        } catch (err) {
          console.error("cargarRespuestas: " + (err && err.stack ? err.stack : err));
          avisoPanel("No se pudieron pintar los datos: " + (err && err.message ? err.message : err));
        }
      })
      .withFailureHandler(err => avisoPanel("Error de conexión: " + err.message))
      .obtenerRespuestasFormularioJSON(creds);
  }

  // GESTIÓN DE FILTROS Y DIMENSIONES
  function pintarMenusFiltro() {
    renderMenuDesdeSelect("ordenGrafica", "menuOrden");
    pintarDimensiones();
    pintarSelectorPregunta();
    refrescarSegmentos();
    pintarFiltrosDinamicos();
    actualizarBotonesFiltro();
  }

  function renderMenuDesdeSelect(idSelect, idMenu) {
    const sel = document.getElementById(idSelect);
    const menu = document.getElementById(idMenu);
    if (!sel || !menu) return;
    menu.innerHTML = "";
    Array.from(sel.options).forEach(op => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "dropdown-item" + (op.value === sel.value ? " active" : "");
      btn.textContent = op.textContent;
      btn.addEventListener("click", () => {
        sel.value = op.value;
        sel.dispatchEvent(new Event("change", { bubbles: true }));
        renderMenuDesdeSelect(idSelect, idMenu);
        actualizarBotonesFiltro();
      });
      li.appendChild(btn);
      menu.appendChild(li);
    });
  }

  // Cierra el menú de filtros al elegir: en móvil tapa la gráfica
  function cerrarMenuFiltros() {
    const btn = document.getElementById("btnFiltrosDinamicos");
    if (!btn || typeof bootstrap === "undefined" || !bootstrap.Dropdown) return;
    const inst = bootstrap.Dropdown.getInstance(btn) || bootstrap.Dropdown.getOrCreateInstance(btn);
    if (inst) inst.hide();
  }

  function actualizarBotonesFiltro() {
    const selOrden = document.getElementById("ordenGrafica");
    const btnOrden = document.getElementById("btn-filtroOrden");
    if (selOrden && btnOrden) {
      const texto = selOrden.options[selOrden.selectedIndex] ? selOrden.options[selOrden.selectedIndex].textContent : selOrden.value;
      btnOrden.title = "Orden: " + texto;
      btnOrden.setAttribute("aria-label", btnOrden.title);
      const activo = selOrden.value !== "none";
      btnOrden.classList.toggle("btn-outline-primary", activo);
      btnOrden.classList.toggle("btn-outline-secondary", !activo);
    }

    // Contador de filtros activos en el botón único
    let filtrosActivos = 0;
    (FILTROS_DINAMICOS || []).forEach(f => {
      const s = document.getElementById("filtro_" + f.id);
      if (s && s.value !== "TODOS") filtrosActivos++;
    });
    const badgeF = document.getElementById("badgeFiltrosDinamicos");
    const btnF = document.getElementById("btnFiltrosDinamicos");
    if (badgeF) {
      badgeF.textContent = String(filtrosActivos);
      badgeF.classList.toggle("d-none", filtrosActivos === 0);
    }
    if (btnF) {
      btnF.classList.toggle("btn-outline-primary", filtrosActivos > 0);
      btnF.classList.toggle("btn-outline-secondary", filtrosActivos === 0);
      btnF.title = filtrosActivos > 0 ? "Filtros por pregunta: " + filtrosActivos + " activo(s)" : "Filtros por pregunta";
      btnF.setAttribute("aria-label", btnF.title);
    }
  }

  // ========================================================
  // Dimensiones de segmentación (jerarquía universal)
  // ========================================================
  const IDS_DIMENSION_LEGADO = ["turno", "grupo"];

  function esDimensionPregunta(p) {
    if (!p) return false;
    if (p.extra && p.extra.esDimension === true) return true;
    return IDS_DIMENSION_LEGADO.indexOf(p.id) !== -1;
  }

  function mapaGruposLegado() {
    const crudo = (RESPUESTAS && RESPUESTAS.config && RESPUESTAS.config.gruposPorTurno) ||
                  (FORM.config && FORM.config.gruposPorTurno) || "{}";
    try {
      const mapa = JSON.parse(crudo);
      return (mapa && typeof mapa === "object") ? mapa : {};
    } catch (e) {
      return {};
    }
  }

  // Lista de dimensiones disponibles: preguntas marcadas + derivadas + origen
  function dimensionesDisponibles() {
    const preguntas = preguntasVisibles();
    const lista = [];
    preguntas.forEach(p => {
      if (!esDimensionPregunta(p)) return;
      const extra = p.extra || {};
      // Compatibilidad: encuestas antiguas no tienen extra.padre en `grupo`
      const padre = extra.padre || (p.id === "grupo" ? "turno" : "");
      lista.push({
        id: p.id,
        etiqueta: p.etiqueta,
        opciones: p.opciones || [],
        padre: padre,
        opcionesPorPadre: extra.opcionesPorPadre || null
      });
    });
    // Grado derivado: solo para encuestas que siguen usando `grupo`
    if (preguntas.some(p => p.id === "grupo") && !lista.some(d => d.id === "grado")) {
      lista.push({ id: "grado", etiqueta: "Grado", opciones: ["1", "2", "3"], padre: "", opcionesPorPadre: null, derivada: true });
    }
    if (!lista.some(d => d.id === "origen")) {
      lista.push({ id: "origen", etiqueta: "Origen", opciones: ["Real", "Simulado"], padre: "", opcionesPorPadre: null, virtual: true });
    }
    return lista;
  }

  // Filtros fijos de la barra, en este orden: Turno, Grado, Grupo
  const ORDEN_BARRA = ["turno", "grado", "grupo"];
  function dimensionesBarra() {
    const todas = dimensionesDisponibles();
    return ORDEN_BARRA.map(id => todas.filter(d => d.id === id)[0]).filter(Boolean);
  }

  // Opciones de una dimensión según el valor del padre
  function opcionesDeDimension(dim, valorPadre) {
    if (!dim) return [];
    if (dim.opcionesPorPadre && valorPadre && dim.opcionesPorPadre[valorPadre]) {
      return dim.opcionesPorPadre[valorPadre].slice();
    }
    if (dim.id === "grupo" && valorPadre) {
      const mapa = mapaGruposLegado();
      if (mapa[valorPadre]) return mapa[valorPadre].slice();
    }
    return (dim.opciones || []).slice();
  }

  // Si el padre cambia, los hijos con valor inválido vuelven a "Todos"
  function ajustarCascada() {
    dimensionesBarra().forEach(d => {
      if (!d.padre) return;
      const valorPadre = FILTROS[d.padre] || "TODOS";
      if (valorPadre === "TODOS") { FILTROS[d.id] = "TODOS"; return; }
      const opciones = opcionesDeDimension(d, valorPadre);
      const actual = FILTROS[d.id];
      if (actual && actual !== "TODOS" && opciones.indexOf(actual) === -1) FILTROS[d.id] = "TODOS";
    });
  }

  const ICONOS_DIMENSION = { turno: "bi-people", grado: "bi-123", grupo: "bi-grid-3x3-gap", origen: "bi-database" };

  // Barra: un botón por dimensión, con su menú de valores
  function pintarDimensiones() {
    const cont = document.getElementById("filtrosDimensiones");
    if (!cont) return;
    cont.innerHTML = "";
    ajustarCascada();

    dimensionesBarra().forEach(d => {
      const valor = FILTROS[d.id] || "TODOS";
      const valorPadre = d.padre ? (FILTROS[d.padre] || "TODOS") : null;
      const bloqueado = !!(d.padre && valorPadre === "TODOS");
      const opciones = bloqueado ? [] : opcionesDeDimension(d, valorPadre);
      const activo = valor !== "TODOS";

      const wrap = document.createElement("div");
      wrap.className = "dropdown";

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn btn-sm " + (activo ? "btn-outline-primary" : "btn-outline-secondary");
      btn.setAttribute("data-bs-toggle", "dropdown");
      btn.setAttribute("aria-expanded", "false");
      const icono = ICONOS_DIMENSION[d.id] || "bi-funnel";
      btn.innerHTML = '<i class="bi ' + icono + '"></i>';
      btn.title = d.etiqueta + ": " + (activo ? valor : "Todos");
      btn.setAttribute("aria-label", btn.title);

      const menu = document.createElement("ul");
      menu.className = "dropdown-menu";

      const liTodos = document.createElement("li");
      const bTodos = document.createElement("button");
      bTodos.type = "button";
      bTodos.className = "dropdown-item" + (valor === "TODOS" ? " active" : "");
      bTodos.textContent = "Todos";
      bTodos.addEventListener("click", () => {
        FILTROS[d.id] = "TODOS";
        pintarMenusFiltro();
        aplicarFiltrosYGraficar();
      });
      liTodos.appendChild(bTodos);
      menu.appendChild(liTodos);

      if (bloqueado) {
        const aviso = document.createElement("li");
        aviso.className = "dropdown-header";
        aviso.textContent = "Elige antes otra dimensión";
        menu.appendChild(aviso);
      } else {
        opciones.forEach(op => {
          const li = document.createElement("li");
          const b = document.createElement("button");
          b.type = "button";
          b.className = "dropdown-item" + (valor === op ? " active" : "");
          b.textContent = op;
          b.addEventListener("click", () => {
            FILTROS[d.id] = op;
            pintarMenusFiltro();
            aplicarFiltrosYGraficar();
          });
          li.appendChild(b);
          menu.appendChild(li);
        });
      }

      wrap.appendChild(btn);
      wrap.appendChild(menu);
      cont.appendChild(wrap);
    });
  }

  // Dimensiones con las que se puede dividir una gráfica apilada
  function opcionesDivision() {
    return dimensionesBarra().map(d => ({ id: d.id, etiqueta: d.etiqueta }));
  }

  // Rol analítico efectivo: usa extra.rol y, si no existe, lo infiere (datos previos a la v48)
  function rolAnalitico(p) {
    const e = (p && p.extra) || {};
    if (e.rol) return e.rol;
    if (e.padre || e.esDimension === true) return "dimension";
    if (p.tipo === "texto" || p.tipo === "parrafo") return "identidad";
    return "metrica";
  }

  // Una pregunta se ofrece para graficar si su rol no es identidad y no está desmarcada
  function esGraficable(p) {
    if (!p) return false;
    if (rolAnalitico(p) === "identidad") return false;
    const g = p.extra && p.extra.graficable;
    return typeof g === "boolean" ? g : true;
  }

  // Preguntas del esquema que el panel puede graficar, en su orden
  function preguntasGraficables() {
    return preguntasVisibles()
      .filter(esGraficable)
      .sort((a, b) => (a.orden || 0) - (b.orden || 0));
  }

  // El título de la tarjeta es el selector: al elegir una pregunta se grafican sus opciones
  function pintarSelectorPregunta() {
    const sel = document.getElementById("dimensionGrafica");
    const menu = document.getElementById("menuPreguntaGrafica");
    if (!sel) return;
    const preguntas = preguntasGraficables();
    const actual = (sel.value && preguntas.some(p => p.id === sel.value)) ? sel.value : (preguntas[0] ? preguntas[0].id : "");
    sel.innerHTML = preguntas.map(p => '<option value="' + p.id + '">' + esc(p.etiqueta) + '</option>').join("");
    if (actual) sel.value = actual;
    if (!menu) return;

    if (!preguntas.length) {
      menu.innerHTML = '<li><div class="px-3 py-2 small text-muted">No hay preguntas graficables. Marca «¿Permitir graficar en el panel?» al editar una pregunta.</div></li>';
      return;
    }

    const item = (p) => {
      const activo = p.id === actual;
      return '<li><button type="button" class="dropdown-item d-flex justify-content-between align-items-center gap-2' + (activo ? ' active' : '') + '" data-pregunta="' + esc(p.id) + '">' +
        '<span class="text-truncate">' + esc(p.etiqueta) + '</span>' +
        (activo ? '<i class="bi bi-check2"></i>' : '') + '</button></li>';
    };
    const dims = preguntas.filter(p => rolAnalitico(p) === "dimension");
    const mets = preguntas.filter(p => rolAnalitico(p) !== "dimension");
    const partes = [];
    if (dims.length) partes.push('<li><h6 class="dropdown-header">Dimensiones (Eje X)</h6></li>' + dims.map(item).join(""));
    if (mets.length) partes.push('<li><h6 class="dropdown-header">Métricas (Eje Y)</h6></li>' + mets.map(item).join(""));
    menu.innerHTML = partes.join('<li><hr class="dropdown-divider"></li>');

    menu.querySelectorAll("button[data-pregunta]").forEach(b => {
      b.addEventListener("click", () => {
        sel.value = b.dataset.pregunta;
        sel.dispatchEvent(new Event("change", { bubbles: true }));
        pintarSelectorPregunta();
        aplicarFiltrosYGraficar();
      });
    });
  }

  // "División": solo se usa en barras apiladas y rayos solares
  function refrescarSegmentos() {
    const selSeg = document.getElementById("segmentoGrafica");
    if (!selSeg) return;
    const prev = selSeg.value;
    const lista = opcionesDivision();
    selSeg.innerHTML = lista.map(o => '<option value="' + o.id + '">' + esc(o.etiqueta) + '</option>').join("");
    if (prev && lista.some(o => o.id === prev)) selSeg.value = prev;
    else if (lista.length) selSeg.value = lista[0].id;
  }

  // Un solo botón "Filtros": el menú contiene los 4 filtros base y una fila por pregunta de opción
  // Menú de preguntas: solo filtros (los base tienen su propio icono en la barra)
  function pintarFiltrosDinamicos() {
    const cont = document.getElementById("filtrosPreguntas");
    if (!cont) return;

    const previos = {};
    (FILTROS_DINAMICOS || []).forEach(f => {
      const s = document.getElementById("filtro_" + f.id);
      if (s) previos[f.id] = s.value;
    });

    cont.innerHTML = "";

    // Las preguntas marcadas como dimensión viven en la barra, no en este menú
    FILTROS_DINAMICOS = preguntasVisibles().filter(p =>
      ["unica", "multiple", "sino", "escala"].includes(p.tipo) &&
      !esDimensionPregunta(p) && p.id !== "grado"
    );

    if (!FILTROS_DINAMICOS.length) {
      cont.innerHTML = '<div class="text-muted small p-2">Este formulario no tiene preguntas de opción.</div>';
      actualizarBotonesFiltro();
      return;
    }

    FILTROS_DINAMICOS.forEach(f => {
      const fila = document.createElement("div");
      fila.className = "filtro-fila";

      const lbl = document.createElement("label");
      lbl.className = "form-label small fw-semibold text-secondary mb-1 flex-grow-1 pregunta-etiqueta";
      lbl.setAttribute("for", "filtro_" + f.id);
      lbl.textContent = f.etiqueta;
      lbl.title = f.etiqueta;

      const sel = document.createElement("select");
      sel.className = "form-select form-select-sm";
      sel.id = "filtro_" + f.id;
      const todas = document.createElement("option");
      todas.value = "TODOS";
      todas.textContent = "Todos (sin filtro)";
      sel.appendChild(todas);
      (f.opciones || []).forEach(o => {
        const op = document.createElement("option");
        op.value = o;
        op.textContent = o;
        sel.appendChild(op);
      });
      if (previos[f.id] && Array.prototype.some.call(sel.options, o => o.value === previos[f.id])) {
        sel.value = previos[f.id];
      }
      sel.addEventListener("change", () => {
        aplicarFiltrosYGraficar();
        cerrarMenuFiltros();
      });

      fila.appendChild(lbl);
      fila.appendChild(sel);
      cont.appendChild(fila);
    });

    actualizarBotonesFiltro();
  }

  function renderMenuAjustes() {
    const menu = document.getElementById("menuAjustesGrafica");
    if (!menu) return;
    refrescarSegmentos();
    const grupos = [
      { titulo: "Tipo de gráfica", icono: "bi-bar-chart", sel: document.getElementById("tipoGrafica") },
      { titulo: "Valores", icono: "bi-123", sel: document.getElementById("valoresGrafica") },
      { titulo: "Base porcentual", icono: "bi-percent", sel: document.getElementById("modoPorcentaje") },
      { titulo: "Etiquetas del eje", icono: "bi-type", sel: document.getElementById("etiquetasGrafica") }
    ];
    menu.innerHTML = grupos.map(g => {
      if (!g.sel) return "";
      const items = Array.from(g.sel.options).map(op => {
        const activo = op.value === g.sel.value;
        return `<li><button type="button" class="dropdown-item d-flex justify-content-between align-items-center ${activo ? "active" : ""}" data-sel="${g.sel.id}" data-val="${op.value}">
          ${esc(op.textContent)} ${activo ? '<i class="bi bi-check2 ms-2"></i>' : ""}
        </button></li>`;
      }).join("");
      return `<li><h6 class="dropdown-header"><i class="bi ${g.icono} me-1"></i>${g.titulo}</h6></li>${items}<li><hr class="dropdown-divider"></li>`;
    }).join("");

    menu.querySelectorAll("button[data-sel]").forEach(b => {
      b.addEventListener("click", () => {
        const s = document.getElementById(b.dataset.sel);
        s.value = b.dataset.val;
        s.dispatchEvent(new Event("change", { bubbles: true }));
        renderMenuAjustes();
      });
    });

    // División: solo aparece en barras apiladas y rayos solares
    const tipoSel = document.getElementById("tipoGrafica");
    const sSel = document.getElementById("segmentoGrafica");
    const requiereDivision = !!(tipoSel && sSel && ["stacked", "stackedVertical"].indexOf(tipoSel.value) !== -1);
    if (requiereDivision) {
      const li = document.createElement("li");
      const cab = document.createElement("h6");
      cab.className = "dropdown-header";
      cab.innerHTML = '<i class="bi bi-pie-chart me-1"></i>División de las barras';
      const cont = document.createElement("div");
      cont.className = "px-2 pb-2";
      const sel = document.createElement("select");
      sel.className = "form-select form-select-sm";
      opcionesDivision().forEach(o => {
        const op = document.createElement("option");
        op.value = o.id;
        op.textContent = o.etiqueta;
        if (o.id === sSel.value) op.selected = true;
        sel.appendChild(op);
      });
      sel.addEventListener("change", () => {
        sSel.value = sel.value;
        sSel.dispatchEvent(new Event("change", { bubbles: true }));
        renderMenuAjustes();
      });
      cont.appendChild(sel);
      li.appendChild(cab);
      li.appendChild(cont);
      menu.appendChild(li);
    }
  }

  function limpiarFiltros() {
    FILTROS = {};
    (FILTROS_DINAMICOS || []).forEach(f => {
      const s = document.getElementById("filtro_" + f.id);
      if (s) s.value = "TODOS";
    });
    pintarMenusFiltro();
    aplicarFiltrosYGraficar();
  }

  function aplicarFiltrosYGraficar() {
    renderMenuAjustes();
    pintarResumenPanel();
    pintarTablaRespuestas();
    actualizarBotonesFiltro();
  }

  function filasFiltradas() {
    const activas = dimensionesBarra().filter(d => FILTROS[d.id] && FILTROS[d.id] !== "TODOS");
    return ((RESPUESTAS && RESPUESTAS.filas) || []).filter(f => {
      for (const d of activas) {
        if (String(valorDe(f, d.id) || "") !== FILTROS[d.id]) return false;
      }
      for (const fld of FILTROS_DINAMICOS) {
        const s = document.getElementById("filtro_" + fld.id);
        if (s && s.value !== "TODOS" && String((f.respuestas || {})[fld.id] || "") !== s.value) return false;
      }
      return true;
    });
  }

  // RENDERIZADO DE GRÁFICAS Y RESUMEN

  // ---- Distribución de las etiquetas del eje de categorías ----
  function modoEtiquetas() {
    const sel = document.getElementById("etiquetasGrafica");
    return (sel && sel.value) || "multilinea";
  }

  function recortarEtiqueta(texto, max) {
    const t = String(texto || "");
    return t.length > max ? t.slice(0, max - 1) + "…" : t;
  }

  // Parte el texto en líneas de hasta max caracteres, sin cortar palabras
  function partirEtiqueta(texto, max) {
    const palabras = String(texto || "").split(/\s+/).filter(Boolean);
    const lineas = [];
    let actual = "";
    palabras.forEach(p => {
      if (!actual) { actual = p; return; }
      if ((actual + " " + p).length <= max) actual += " " + p;
      else { lineas.push(actual); actual = p; }
    });
    if (actual) lineas.push(actual);
    return lineas.length ? lineas : [String(texto || "")];
  }

  function ejeCategoriaConfig(labels, tamano) {
    const modo = modoEtiquetas();
    const cfg = { grid: { display: false }, ticks: { autoSkip: false, font: { size: tamano } } };
    if (modo === "auto") return cfg;
    cfg.ticks.maxRotation = 0;
    cfg.ticks.minRotation = 0;
    cfg.ticks.callback = function (valor, indice) {
      const texto = (this && typeof this.getLabelForValue === "function") ? this.getLabelForValue(valor) : labels[indice];
      return modo === "recortadas" ? recortarEtiqueta(texto, 18) : partirEtiqueta(texto, 16);
    };
    return cfg;
  }

  function escalasCartesianas(labels, tamano, tipo) {
    const cat = ejeCategoriaConfig(labels, tamano);
    const valor = { beginAtZero: true, ticks: { font: { size: tamano } } };
    return ejeCartesiano(tipo) === "y" ? { x: valor, y: cat } : { x: cat, y: valor };
  }

  // Barras horizontales (bar, stacked) usan el eje Y como eje de categorías
  function ejeCartesiano(tipoGrafica) {
    return (tipoGrafica === "bar" || tipoGrafica === "stacked") ? "y" : "x";
  }

  function pintarResumenPanel() {
    chartsResumen.forEach(c => c.destroy());
    chartsResumen = [];
    if (sunburstInstancia) { sunburstInstancia.dispose(); sunburstInstancia = null; }

    const filas = filasFiltradas();
    const totalN = filas.length;
    document.getElementById("badgeGrafica1").textContent = `${totalN} respuestas`;
    document.getElementById("resumenFiltros").textContent = totalN
      ? `Mostrando ${totalN} de ${((RESPUESTAS && RESPUESTAS.filas) || []).length} registros`
      : "Sin respuestas todavía · usa 🛠 → Simular respuestas";

    const barra = dimensionesBarra().map(d => d.id);
    const graficables = preguntasGraficables();
    const dimId = document.getElementById("dimensionGrafica").value
      || (graficables[0] ? graficables[0].id : "")
      || barra[0]
      || "origen";
    const dim = dimensionDe(dimId);

    if (!dim) return;

    document.getElementById("tituloGrafica1").textContent = dim.etiqueta;
    document.getElementById("tituloTotales").textContent = "Totales por " + dim.etiqueta;

    const tipo = document.getElementById("tipoGrafica").value;
    const modoVal = document.getElementById("valoresGrafica").value;
    const modoPct = document.getElementById("modoPorcentaje").value;
    const orden = document.getElementById("ordenGrafica").value;

    // Resumen estadístico
    // Segmentación de la tabla y de la gráfica apilada (la misma)
    const selSegTabla = document.getElementById("segmentoGrafica");
    let segId = selSegTabla ? selSegTabla.value : "turno";
    if (barra.indexOf(segId) === -1) segId = barra[0] || "turno";
    if (segId === dim.id) segId = barra.filter(id => id !== dim.id)[0] || "origen";

    const conteo = {};
    const matriz = {};
    const esMultiple = !!(dim.tipo === "multiple");
    filas.forEach(f => {
      const bruto = valorDe(f, dim.id);
      if (bruto == null || bruto === "") return;
      const valores = esMultiple ? String(bruto).split(";").map(s => s.trim()).filter(Boolean) : [String(bruto)];
      valores.forEach(v => {
        conteo[v] = (conteo[v] || 0) + 1;
        if (!matriz[v]) matriz[v] = {};
        const seg = String(valorDe(f, segId) || "Sin dato");
        matriz[v][seg] = (matriz[v][seg] || 0) + 1;
      });
    });
    // En opción múltiple un registro cuenta varias veces: el 100 % es la suma de conteos
    const sumaConteos = Object.keys(conteo).reduce((a, k) => a + conteo[k], 0);
    const basePct = (esMultiple && sumaConteos > 0) ? sumaConteos : totalN;

    let pares = Object.keys(conteo).map(k => ({
      label: k, cantidad: conteo[k], segmentos: matriz[k] || {}
    }));

    if (orden === "desc") pares.sort((a, b) => b.cantidad - a.cantidad);
    else if (orden === "asc") pares.sort((a, b) => a.cantidad - b.cantidad);

    // Segmentos de la tabla: los mismos que los de la gráfica
    const segDim = dimensionDe(segId);
    const segmentos = [];
    ((segDim && segDim.opciones) || []).forEach(s => {
      if (Object.keys(matriz).some(k => matriz[k][s])) segmentos.push(s);
    });
    Object.keys(matriz).forEach(k => Object.keys(matriz[k]).forEach(s => {
      if (segmentos.indexOf(s) === -1) segmentos.push(s);
    }));

    // Tabla de Totales (una columna por segmento, más Total, % y Acum.)
    const theadFila = document.querySelector("#tablaTotales thead tr");
    if (theadFila) {
      theadFila.innerHTML = '<th>Categoría</th>' +
        segmentos.map(s => '<th class="text-end">' + esc(s) + '</th>').join("") +
        '<th class="text-end">Total</th>' +
        '<th class="text-end">%</th>' +
        '<th class="text-end">Acum.</th>';
    }

    const tbody = document.querySelector("#tablaTotales tbody");
    tbody.innerHTML = "";
    let acum = 0;
    pares.forEach(p => {
      const pct = basePct > 0 ? (p.cantidad / basePct) * 100 : 0;
      acum += pct;
      tbody.innerHTML += `
        <tr>
          <td><span class="d-inline-block rounded-circle me-2" style="width:.55rem;height:.55rem;background:${colorDimension(dim.id, p.label)}"></span>${esc(p.label)}</td>
          ${segmentos.map(s => '<td class="text-end text-muted">' + ((p.segmentos && p.segmentos[s]) || 0) + '</td>').join("")}
          <td class="text-end fw-bold">${p.cantidad}</td>
          <td class="text-end text-muted">${pct.toFixed(1)}%</td>
          <td class="text-end text-muted">${acum.toFixed(1)}%</td>
        </tr>
      `;
    });

    const canvas = document.getElementById("grafica1");
    const contSun = document.getElementById("graficaSunburst");

    if (tipo === "sunburst") {
      canvas.classList.add("d-none");
      contSun.classList.remove("d-none");
      renderSunburstDirecto(filas, dim);
      return;
    }

    canvas.classList.remove("d-none");
    contSun.classList.add("d-none");

    if (typeof Chart === "undefined") {
      avisoPanel("No se pudo cargar Chart.js; revisa la conexión y recarga la página.");
      return;
    }

    const ctx = canvas.getContext("2d");
    const esApilada = tipo === "stacked" || tipo === "stackedVertical";
    const esVert = tipo === "stackedVertical" || tipo === "barVertical";

    if (esApilada) {
      const usarPct = modoVal === "porcentaje";
      const selSeg = document.getElementById("segmentoGrafica");
      let segId = selSeg ? selSeg.value : "turno";
      if (!segId || segId === dim.id) segId = (dim.id === "turno") ? "origen" : "turno";
      const apilada = construirApilada(filas, pares.map(p => p.label), dim.id, segId, usarPct, modoPct, basePct);
      const ejeValor = {
        stacked: true, beginAtZero: true, max: usarPct ? 100 : undefined,
        ticks: { precision: usarPct ? 1 : 0, callback: v => usarPct ? v + "%" : v }
      };
      const ejeCat = Object.assign({ stacked: true }, ejeCategoriaConfig(apilada.labels, tamanoGrafica));
      chartsResumen.push(new Chart(ctx, {
        type: "bar",
        data: { labels: apilada.labels, datasets: apilada.datasets },
        plugins: [pluginValores],
        options: {
          indexAxis: ejeCartesiano(tipo),
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: tamanoGrafica } } } },
          scales: esVert ? { x: ejeCat, y: ejeValor } : { x: ejeValor, y: ejeCat }
        }
      }));
    } else {
      const datos = pares.map(p => modoVal === "porcentaje" && basePct > 0 ? (p.cantidad / basePct * 100) : p.cantidad);
      const colores = pares.map(p => colorDimension(dim.id, p.label));
      chartsResumen.push(new Chart(ctx, {
        type: tipo === "barVertical" ? "bar" : tipo,
        data: {
          labels: pares.map(p => p.label),
          datasets: [{ data: datos, backgroundColor: colores, borderRadius: 5, _pct: modoVal === "porcentaje" }]
        },
        plugins: [pluginValores],
        options: {
          indexAxis: ejeCartesiano(tipo),
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: tipo === "bar" ? { right: 40 } : { top: 20 } },
          plugins: { legend: { display: tipo === "pie" || tipo === "doughnut" } },
          scales: (tipo === "pie" || tipo === "doughnut") ? {} : escalasCartesianas(pares.map(p => p.label), tamanoGrafica, tipo)
        }
      }));
    }
  }</script>
