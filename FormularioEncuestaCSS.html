<style>
    body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .header-banner { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; border-radius: 12px; }
    .subtitulo-escuela { font-size: 1.15rem; font-weight: 300; letter-spacing: 0.5px; opacity: 0.95; }
    .nav-pills .nav-link.active { background-color: #2563eb; }
    .chart-container { position: relative; height: 320px; width: 100%; }
    .table-responsive { max-height: 520px; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { background-color: #dbeafe; }
    .seccion-condicional { background-color: #f1f5f9; border-radius: 8px; border-left: 4px solid #2563eb; }

    #tablaResumen.sin-desglose .col-turno { display: none; }

    /* Estado que no es una de las opciones (p. ej. eje = pregunta) */
    .chip-estado {
      font-size: .72rem;
      line-height: 1.3;
      color: var(--app-muted);
      padding: .15rem 0 .4rem;
    }

    /* Etiqueta de pregunta dentro del menú: máximo dos líneas, texto completo en el tooltip */
    .pregunta-etiqueta {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.25;
      max-height: 2.5em;
    }

    /* Chips de dimensión (eje y división) */
    .chip-dim { font-size: .78rem; line-height: 1.2; border-radius: 999px; }

    /* Texto de ayuda bajo la cabecera de un menú */
    .filtro-ayuda {
      font-size: .7rem;
      line-height: 1.25;
      color: #94a3b8;
      padding: 0 .6rem .35rem;
    }

    /* Menú de preguntas: rejilla de dos columnas para no hacer una lista kilométrica */
    .menu-preguntas { display: grid; grid-template-columns: 1fr 1fr; gap: 0 .5rem; padding: .25rem .6rem .6rem; }
    @media (max-width: 767.98px) {
      #menuFiltrosDinamicos { width: auto !important; min-width: 17.5rem; }
      .menu-preguntas { grid-template-columns: 1fr; }
    }
    /* ============================================================
       SISTEMA DE MENÚS Y CONTROLES  (especificado en SKILL.md)
       Regla: el estado activo tiñe, nunca rellena.
       ============================================================ */
    :root {
      --app-primary: #2563eb;
      --app-primary-dark: #1d4ed8;
      --app-primary-soft: #eff6ff;
      --app-primary-tint: #dbeafe;

      --app-border-strong: #cbd5e1;

      --app-muted: #64748b;
      --app-hover: #f1f5f9;
      --app-radius: 8px;
      --app-radius-lg: 12px;
    }

    /* Botones de barra: fondo blanco, borde suave; hover tenue, activo con tinte */
    .btn-outline-secondary, .btn-outline-primary, .btn-outline-danger {
      --bs-btn-bg: #fff;
      --bs-btn-border-color: var(--app-border);
      --bs-btn-color: #475569;
      --bs-btn-hover-bg: var(--app-hover);
      --bs-btn-hover-border-color: var(--app-border-strong);
      --bs-btn-hover-color: var(--app-text);
      --bs-btn-active-bg: var(--app-primary-soft);
      --bs-btn-active-border-color: #bfdbfe;
      --bs-btn-active-color: var(--app-primary-dark);
      --bs-btn-focus-shadow-rgb: 37, 99, 235;
    }
    .btn-outline-primary {
      --bs-btn-color: var(--app-primary-dark);
      --bs-btn-border-color: #bfdbfe;
      --bs-btn-bg: var(--app-primary-soft);
      --bs-btn-hover-bg: var(--app-primary-tint);
      --bs-btn-hover-border-color: #93c5fd;
      --bs-btn-hover-color: var(--app-primary-dark);
    }
    .btn-outline-danger {
      --bs-btn-color: #b91c1c;
      --bs-btn-hover-bg: #fef2f2;
      --bs-btn-hover-border-color: #fecaca;
      --bs-btn-hover-color: #991b1b;
    }

    /* Menús desplegables */
    .dropdown-menu {

      --bs-dropdown-link-hover-bg: var(--app-hover);
      --bs-dropdown-link-active-bg: var(--app-primary-soft);
      --bs-dropdown-link-active-color: var(--app-primary-dark);
      --bs-dropdown-font-size: .85rem;
      --bs-dropdown-item-padding-x: .6rem;
      --bs-dropdown-item-padding-y: .4rem;
      padding: .4rem;
      max-height: 60vh;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(15, 23, 42, .08);
    }
    .dropdown-menu .dropdown-item { border-radius: var(--app-radius); }
    .dropdown-menu .dropdown-item.active,
    .dropdown-menu .dropdown-item:active {
      background-color: var(--app-primary-soft);
      color: var(--app-primary-dark);
      font-weight: 600;
    }
    .dropdown-menu .dropdown-item.text-danger.active { background-color: #fef2f2; color: #b91c1c; }
    .dropdown-menu .dropdown-header {
      font-size: .7rem;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: 600;
      padding: .5rem .6rem .25rem;
    }
    .dropdown-menu .dropdown-divider { border-color: var(--app-border); opacity: 1; margin: .35rem 0; }

    /* Fila de filtro dentro de un menú */
    .filtro-fila { padding: .1rem .15rem .45rem; }

      font-size: .75rem;
      font-weight: 600;
      color: var(--app-muted);
      margin-bottom: .2rem;
      line-height: 1.25;
    }
    .filtro-fila .form-select {
      font-size: .82rem;
      padding: .25rem 1.75rem .25rem .5rem;
      min-height: 32px;
      border-color: var(--app-border);
      border-radius: var(--app-radius);
      color: var(--app-text);
      background-color: #fff;
    }
    .filtro-fila .form-select:focus {
      border-color: var(--app-primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
    }
    @media print {
      body { background: #fff !important; }
      #btnCabecera, .header-banner, #mainTab, #loginCard, #barraContextual, #controlVistaGraficas, .no-print, .btn { display: none !important; }
      .card { box-shadow: none !important; border: 1px solid #dee2e6 !important; }
      .table-responsive { max-height: none !important; overflow: visible !important; }
      #printHeader { display: block !important; }
      #tablaRespuestas { font-size: 0.75rem; }
    }
  </style>
