<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .header-banner { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; border-radius: 12px; }
    .subtitulo-escuela { font-size: 1.15rem; font-weight: 300; letter-spacing: 0.5px; opacity: 0.95; }
  </style>
</head>
<body class="p-2 p-md-3">
<div class="container-fluid" style="max-width: 820px;">

  <div class="header-banner p-3 mb-3 text-center shadow-sm">
    <h2 class="fw-bold mb-0" id="tituloEscuela">Formulario</h2>
    <div class="subtitulo-escuela mt-1 fw-bold" id="subtituloEscuela"></div>
    <hr class="my-2 opacity-25 w-50 mx-auto">
    <p class="mb-0 fs-6 opacity-90" id="tituloFormulario"></p>
  </div>

  <div class="card p-4 shadow-sm">
    <p class="text-muted small" id="introduccion"></p>

    <form id="formDinamico" onsubmit="enviar(event)">
      <div id="campos"></div>
      <div id="errorForm" class="alert alert-danger py-2 small d-none" role="alert"></div>
      <p class="text-muted small mb-2" id="nota"></p>
      <button type="submit" id="btnEnviar" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
        <i class="bi bi-send-fill"></i> <span id="textoBoton">Enviar</span>
      </button>
    </form>

    <div id="panelExito" class="d-none text-center py-4">
      <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
      <h4 class="fw-bold mt-3 mb-1" id="exitoTitulo">Registro guardado</h4>
      <p class="text-muted mb-3" id="exitoTexto"></p>
      <button type="button" class="btn btn-primary" onclick="otraRespuesta()">
        <i class="bi bi-plus-circle"></i> <span id="textoOtro">Registrar otra respuesta</span>
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let FORM = { config: {}, preguntas: [] };

  document.addEventListener("DOMContentLoaded", cargar);

  function cargar() {
    google.script.run
      .withSuccessHandler(render)
      .withFailureHandler(err => mostrarError("No se pudo cargar el formulario: " + err.message))
      .obtenerFormulario();
  }

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }

  function render(formulario) {
    FORM = formulario || { config: {}, preguntas: [] };
    const c = FORM.config || {};
    document.getElementById("tituloEscuela").textContent = c.escuela || "";
    document.getElementById("subtituloEscuela").textContent = c.subtitulo || "";
    document.getElementById("tituloFormulario").textContent = c.titulo || "";
    document.getElementById("introduccion").textContent = c.introduccion || "";
    document.getElementById("nota").textContent = c.nota || "";
    document.getElementById("textoBoton").textContent = c.boton || "Enviar";
    document.getElementById("exitoTitulo").textContent = c.exitoTitulo || "Registro guardado";
    document.getElementById("textoOtro").textContent = c.otroBoton || "Registrar otra respuesta";

    const cont = document.getElementById("campos");
    cont.innerHTML = "";
    (FORM.preguntas || []).forEach(p => cont.appendChild(crearCampo(p)));
  }

  function crearCampo(p) {
    const wrap = document.createElement("div");
    wrap.className = "mb-3";
    wrap.setAttribute("data-id", p.id);

    const label = document.createElement("label");
    label.className = "form-label fw-semibold";
    label.setAttribute("for", "campo_" + p.id);
    label.textContent = p.etiqueta + (p.obligatoria ? " *" : "");
    wrap.appendChild(label);

    if (p.ayuda) {
      const ayuda = document.createElement("div");
      ayuda.className = "form-text mb-1";
      ayuda.textContent = p.ayuda;
      wrap.appendChild(ayuda);
    }

    const extra = p.extra || {};
    let control;

    if (p.tipo === "parrafo") {
      control = document.createElement("textarea");
      control.className = "form-control";
      control.id = "campo_" + p.id;
      control.rows = 3;
      control.placeholder = p.placeholder || "";
      if (extra.maxLongitud) control.maxLength = Number(extra.maxLongitud);
    } else if (p.tipo === "unica" || p.tipo === "sino") {
      control = document.createElement("select");
      control.className = "form-select";
      control.id = "campo_" + p.id;
      const vacia = document.createElement("option");
      vacia.value = "";
      vacia.disabled = true;
      vacia.selected = true;
      vacia.textContent = "-- Selecciona una opción --";
      control.appendChild(vacia);
      const opciones = p.tipo === "sino" ? ["Sí", "No"] : (p.opciones || []);
      opciones.forEach(o => {
        const op = document.createElement("option");
        op.value = o;
        op.textContent = o;
        control.appendChild(op);
      });
    } else if (p.tipo === "multiple") {
      control = document.createElement("div");
      control.className = "d-flex flex-column gap-1";
      control.id = "campo_" + p.id;
      (p.opciones || []).forEach((o, i) => {
        const id = "campo_" + p.id + "_" + i;
        const div = document.createElement("div");
        div.className = "form-check";
        const input = document.createElement("input");
        input.className = "form-check-input";
        input.type = "checkbox";
        input.id = id;
        input.value = o;
        const lab = document.createElement("label");
        lab.className = "form-check-label";
        lab.setAttribute("for", id);
        lab.textContent = o;
        div.appendChild(input);
        div.appendChild(lab);
        control.appendChild(div);
      });
    } else if (p.tipo === "numero") {
      control = document.createElement("input");
      control.type = "number";
      control.className = "form-control";
      control.id = "campo_" + p.id;
      if (extra.min !== "" && extra.min != null) control.min = extra.min;
      if (extra.max !== "" && extra.max != null) control.max = extra.max;
    } else if (p.tipo === "fecha") {
      control = document.createElement("input");
      control.type = "date";
      control.className = "form-control";
      control.id = "campo_" + p.id;
    } else if (p.tipo === "escala") {
      control = document.createElement("div");
      control.className = "d-flex flex-wrap gap-3 align-items-center";
      control.id = "campo_" + p.id;
      const min = Number(extra.escalaMin || 1);
      const max = Number(extra.escalaMax || 5);
      for (let n = min; n <= max; n++) {
        const div = document.createElement("div");
        div.className = "form-check";
        const input = document.createElement("input");
        input.className = "form-check-input";
        input.type = "radio";
        input.name = "campo_" + p.id;
        input.id = "campo_" + p.id + "_" + n;
        input.value = String(n);
        const lab = document.createElement("label");
        lab.className = "form-check-label";
        lab.setAttribute("for", input.id);
        lab.textContent = String(n);
        div.appendChild(input);
        div.appendChild(lab);
        control.appendChild(div);
      }
    } else {
      control = document.createElement("input");
      control.type = "text";
      control.className = "form-control";
      control.id = "campo_" + p.id;
      control.placeholder = p.placeholder || "";
      if (extra.maxLongitud) control.maxLength = Number(extra.maxLongitud);
    }

    wrap.appendChild(control);
    return wrap;
  }

  function valorDe(p) {
    if (p.tipo === "multiple") {
      const marcados = document.querySelectorAll("#campo_" + p.id + " input:checked");
      return Array.prototype.map.call(marcados, i => i.value);
    }
    if (p.tipo === "escala") {
      const marcado = document.querySelector("#campo_" + p.id + " input:checked");
      return marcado ? marcado.value : "";
    }
    const el = document.getElementById("campo_" + p.id);
    return el ? el.value : "";
  }

  function enviar(e) {
    e.preventDefault();
    const respuestas = {};
    const faltan = [];
    (FORM.preguntas || []).forEach(p => {
      const valor = valorDe(p);
      respuestas[p.id] = valor;
      const vacio = p.tipo === "multiple" ? valor.length === 0 : String(valor).trim() === "";
      if (p.obligatoria && vacio) faltan.push(p.etiqueta);
    });
    if (faltan.length) {
      mostrarError("Falta responder: " + faltan.join(", ") + ".");
      return;
    }
    const btn = document.getElementById("btnEnviar");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Guardando...';

    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-send-fill"></i> ' + (FORM.config.boton || "Enviar");
        if (res && res.exito) {
          const nombre = Object.keys(respuestas).map(k => respuestas[k]).find(v => typeof v === "string" && v.trim() !== "") || "";
          const texto = (FORM.config.exitoTexto || "").replace("{nombre}", nombre);
          document.getElementById("exitoTexto").textContent = texto;
          document.getElementById("formDinamico").classList.add("d-none");
          document.getElementById("panelExito").classList.remove("d-none");
        } else {
          mostrarError((res && res.mensaje) || "No se pudo guardar.");
        }
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-send-fill"></i> ' + (FORM.config.boton || "Enviar");
        mostrarError("Error de conexión: " + err.message);
      })
      .guardarRespuestaFormulario({ respuestas: respuestas });
  }

  function otraRespuesta() {
    document.getElementById("formDinamico").reset();
    document.getElementById("formDinamico").classList.remove("d-none");
    document.getElementById("panelExito").classList.add("d-none");
    document.getElementById("errorForm").classList.add("d-none");
    const primero = document.querySelector("#campos input, #campos select, #campos textarea");
    if (primero) primero.focus();
  }

  function mostrarError(mensaje) {
    const caja = document.getElementById("errorForm");
    caja.textContent = mensaje;
    caja.classList.remove("d-none");
  }
</script>
</body>
</html>
